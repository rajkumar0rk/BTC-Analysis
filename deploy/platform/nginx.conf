# Include in nginx http context. Loopback only. Access via SSH tunnel.
limit_req_zone $binary_remote_addr zone=btc_api:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=btc_conn:1m;
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /opt/btc-platform/web;
    index index.html;
    client_max_body_size 100k;
    client_body_timeout 10s;
    limit_conn btc_conn 20;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /v1/ {
        limit_req zone=btc_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host localhost;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
}
