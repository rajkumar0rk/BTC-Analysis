name: Independent BTC-first OI accumulation breakout
on:
  push:
    branches:
      - research/oi-accumulation-breakout-btcfirst-20261119-1640
    paths:
      - scripts/research_independent_oi_accumulation_20261119.py
      - .github/workflows/independent-oi-accumulation-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - run: python scripts/research_independent_oi_accumulation_20261119.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-oi-accumulation-evidence
          path: analysis/independent_oi_accumulation_20261119/
      - name: Commit evidence to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_oi_accumulation_20261119/
          if ! git diff --cached --quiet; then
            git commit -m "research: record OI accumulation BTC/ETH backtest evidence"
            git push origin HEAD:research/oi-accumulation-breakout-btcfirst-20261119-1640
          fi
