name: Download native Delta India 2024 BTCUSD history
on:
  push:
    branches: [research/reclaim-v5-validation-20261124]
    paths: [.github/workflows/reclaim-2024-download-20261124.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch actual 2024 candles and warmup month
        run: |
          PYTHONPATH=scripts python -u - <<'PY'
          import datetime as dt, pathlib, json, hashlib, time, concurrent.futures
          from collect_delta_institutional_data import http_get,validate_ohlc,write_csv_gzip
          from sync_delta_btcusd_1m import validate_bar
          utc=dt.timezone.utc
          root=pathlib.Path("research-data-2024")
          root.mkdir(exist_ok=True)
          months=[dt.datetime(2023,12,1,tzinfo=utc)]+[dt.datetime(2024,i,1,tzinfo=utc) for i in range(1,13)]
          spec=[("1m","BTCUSD","1m",60),("mark_1m","MARK:BTCUSD","1m",60),("funding_1h","FUNDING:BTCUSD","1h",3600)]
          def nextmonth(d):return dt.datetime(d.year+(d.month==12),d.month%12+1,1,tzinfo=utc)
          def fetch(symbol,res,sec,lo,hi):
              z=http_get("/v2/history/candles",{"symbol":symbol,"resolution":res,"start":lo,"end":hi-1})
              rows=validate_ohlc(z,sec,lo,hi)
              if symbol=="BTCUSD" and res=="1m":
                  for bar in rows.values():validate_bar(bar)
              return rows
          def task(d,sp):
              label,symbol,res,sec=sp
              lo=int(d.timestamp());hi=int(nextmonth(d).timestamp())
              # Monthly hourly probe avoids hundreds of empty requests before venue history begins.
              # For funding the probe itself is the desired native series.
              hourly=fetch(symbol,"1h",3600,lo,hi)
              print("2024_PROBE",json.dumps(dict(month=d.strftime("%Y-%m"),series=label,hourly=len(hourly),earliest=min(hourly) if hourly else None)),flush=True)
              if sec==3600:rows=hourly
              else:
                  rows={}
                  # Do not skip an empty hourly probe without one independent minute probe.
                  begin=max(lo,min(hourly)) if hourly else lo
                  if not hourly:
                      first=fetch(symbol,res,sec,lo,min(hi,lo+1400*sec))
                      if not first:return dict(month=d.strftime("%Y-%m"),series=label,rows=0,expected=(hi-lo)//sec,missing=(hi-lo)//sec,first=None,last=None,probe_empty=True)
                      rows.update(first);begin=lo+1400*sec
                  for a in range(begin,hi,1400*sec):
                      b=min(hi,a+1400*sec);rows.update(fetch(symbol,res,sec,a,b));time.sleep(.2)
              result=dict(month=d.strftime("%Y-%m"),series=label,rows=len(rows),expected=(hi-lo)//sec,missing=(hi-lo)//sec-len(rows),first=min(rows) if rows else None,last=max(rows) if rows else None)
              if rows:
                  p=root/label/(d.strftime("%Y-%m")+".csv.gz");write_csv_gzip(p,rows);result["sha256"]=hashlib.sha256(p.read_bytes()).hexdigest()
              print("2024_PARTITION",json.dumps(result),flush=True)
              return result
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              jobs={pool.submit(task,d,sp):(d,sp) for d in months for sp in spec}
              for job in concurrent.futures.as_completed(jobs):
                  d,sp=jobs[job]
                  try:results.append(job.result())
                  except Exception as e:
                      row=dict(month=d.strftime("%Y-%m"),series=sp[0],error=str(e)[:350]);results.append(row);print("2024_FETCH_ERROR",json.dumps(row),flush=True)
          results.sort(key=lambda x:(x["series"],x["month"]))
          (root/"manifest.json").write_text(json.dumps(dict(source="Delta Exchange India public REST",requested_start="2023-12-01",requested_end_exclusive="2025-01-01",partitions=results),indent=2))
          print("2024_DOWNLOAD_COMPLETE",json.dumps({k:sum(x.get("rows",0) for x in results if x["series"]==k and x["month"].startswith("2024")) for k,*_ in spec}),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-india-btcusd-2024-native
          path: research-data-2024/
          retention-days: 90
          if-no-files-found: error
