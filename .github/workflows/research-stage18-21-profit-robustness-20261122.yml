name: Stage18 21-of-22 Allocation Retune Research
on:
  workflow_dispatch:
  push:
    branches:
      - research/stage18-21-profit-robustness-20261122-v1
    paths:
      - scripts/research_stage18_21_profit_robustness_20261122.py
      - .github/workflows/research-stage18-21-profit-robustness-20261122.yml
permissions:
  contents: read
  actions: read
jobs:
  replay-historical-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas
      - name: Retrieve completed native BTC 1m research source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/don"
          gh run download 44889747997 -n stage18-core-standalone-20261121 -D "$RUNNER_TEMP/core" --repo "$GITHUB_REPOSITORY"
          gh run download 44889747997 -n stage18-donchian-standalone-20261121 -D "$RUNNER_TEMP/don" --repo "$GITHUB_REPOSITORY"
          test -s "$RUNNER_TEMP/core/core_22_months.csv"
          test -s "$RUNNER_TEMP/don/donchian_monthly_mtm.csv"
          test -s analysis/institutional_discovery_stage19_new_1h_patterns/monthly_results.csv
      - name: Reconcile 21-month baseline and test allocation/cost sensitivity
        run: |
          python scripts/research_stage18_21_profit_robustness_20261122.py \
            --core "$RUNNER_TEMP/core/core_22_months.csv" \
            --donchian "$RUNNER_TEMP/don/donchian_monthly_mtm.csv"
      - name: Preserve report and full monthly return ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-21-weight-robustness-20261122
          path: analysis/stage18_21_profit_robustness_20261122/
          if-no-files-found: warn
          retention-days: 30
