name: BTCUSD Step53 robust strategy research
on:
  push:
    branches: [research/btc-step53-robust]
    paths:
      - scripts/research_btc_step53_robust.py
      - .github/workflows/research-btc-step53-robust.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba scikit-learn tabulate
      - run: python -m py_compile scripts/research_btc_step53_robust.py
      - run: python scripts/research_btc_step53_robust.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step53-robust
          path: analysis/btc_step53_robust/
