name: Independent extrema order convex BTC-first
on:
  push:
    branches:
      - research/extrema-order-convex-btcfirst-20261120-0740
    paths:
      - scripts/research_independent_extrema_order_20261120.py
      - .github/workflows/independent-extrema-order-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - run: python scripts/research_independent_extrema_order_20261120.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extrema-order-btc-eth-evidence
          path: analysis/independent_extrema_order_20261120/
