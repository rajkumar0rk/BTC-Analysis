name: Causal EMA20 Supertrend 15m OHLC backtest
on:
  push:
    branches:
      - research/ema-st-causal-15m-20261121
    paths:
      - scripts/replay_ema_st_causal_15m_20261121.py
      - .github/workflows/research-ema-st-causal-15m-20261121.yml
permissions:
  contents: write
concurrency:
  group: research-ema-st-causal-15m-20261121
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.2.3
      - name: Compile and unit test 15m execution model
        run: |
          python -m py_compile scripts/replay_ema_st_causal_15m_20261121.py
          python -c 'import sys; sys.path.insert(0, "scripts"); from replay_ema_st_causal_15m_20261121 import self_test; self_test(); print("15m causal self-test passed")'
      - name: Backtest BTC ETH using genuine Delta 15m aggregates
        run: python scripts/replay_ema_st_causal_15m_20261121.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ema-st-correct-15m-results-20261121
          path: analysis/ema_st_correct_15m_20261121/
          if-no-files-found: warn
      - name: Save 15m results on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema_st_correct_15m_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: 15m OHLC causal BTC ETH results"
            git push origin HEAD:research/ema-st-causal-15m-20261121
          fi
