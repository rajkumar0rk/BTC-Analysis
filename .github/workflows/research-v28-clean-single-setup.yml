name: V28 clean 2024-2025 training and frozen 2026 validation
on:
  push:
    branches: [research/v28-clean-single-setup-2024-2025-20261124]
    paths:
      - scripts/research_v28_clean_single_setup.py
      - .github/workflows/research-v28-clean-single-setup.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v28-clean-single-setup
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load historical training archive only
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- 'data/delta_india/BTCUSD/1m/2025-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2025-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2025-*.csv.gz'
          git reset
          python -m pip install 'numpy<2.3' pandas numba tabulate
      - name: Select single setup on 2024 and 2025 chronological folds only
        run: |
          python -m py_compile scripts/research_v28_clean_single_setup.py
          python -u scripts/research_v28_clean_single_setup.py train
      - name: Commit frozen configuration before validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v28_clean_single_setup
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze V28 selection using only 2024 and 2025 training'
            git push origin HEAD:research/v28-clean-single-setup-2024-2025-20261124
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v28-frozen-training
          path: analysis/v28_clean_single_setup/
          if-no-files-found: error
  validate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v28-clean-single-setup-2024-2025-20261124
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen config then load 2026 validation candles
        run: |
          test -s analysis/v28_clean_single_setup/frozen.json
          git fetch --depth=1 origin main
          git checkout origin/main -- 'data/delta_india/BTCUSD/1m/2025-12.csv.gz' 'data/delta_india/BTCUSD/1m/2026-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2025-12.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2026-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2025-12.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2026-*.csv.gz'
          git reset
          python -m pip install 'numpy<2.3' pandas numba tabulate
      - name: Run one frozen 2026 replay without search
        run: python -u scripts/research_v28_clean_single_setup.py validate
      - name: Publish validation without changing frozen configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code -- analysis/v28_clean_single_setup/frozen.json
          git add analysis/v28_clean_single_setup/validation*
          if ! git diff --cached --quiet; then
            git commit -m 'Report frozen V28 2026 validation without retuning'
            git push origin HEAD:research/v28-clean-single-setup-2024-2025-20261124
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v28-frozen-2026-validation
          path: analysis/v28_clean_single_setup/
          if-no-files-found: error
