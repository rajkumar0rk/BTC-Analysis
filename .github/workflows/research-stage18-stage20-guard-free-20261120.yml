name: BTC Stage18 Stage20 uncapped native entry and exit backtest
on:
  push:
    branches:
      - research/stage18-stage20-guard-free-entries-20261120-v1
    paths:
      - scripts/research_stage18_stage20_guard_free_20261120.py
      - .github/workflows/research-stage18-stage20-guard-free-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-entry-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas numba tabulate
      - name: Download original Stage14 full pre-entry events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stage14-events"
          gh run download 44118024590 -n btc-stage14-monthly-regime-trades -D "$RUNNER_TEMP/stage14-events" --repo "$GITHUB_REPOSITORY"
          test -s "$RUNNER_TEMP/stage14-events/event_states.csv.gz"
      - name: Replay real BTC 1m trades, including trades formerly skipped by loss guard
        env:
          STAGE14_EVENTS: ${{ runner.temp }}/stage14-events/event_states.csv.gz
        run: |
          python -m py_compile scripts/research_stage18_stage20_guard_free_20261120.py
          PYTHONPATH=scripts python scripts/research_stage18_stage20_guard_free_20261120.py
      - name: Preserve all trades, monthly ledgers, costs and qualifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-guard-free-stages18-20-complete
          path: analysis/stage18_stage20_guard_free_20261120/
          if-no-files-found: warn
          retention-days: 30
