name: Backtest BTC Supertrend EMA9/21 5m 15m 1h
on:
  push:
    branches:
      - research/supertrend-ema921-20261122
    paths:
      - scripts/research_supertrend_ema921.py
      - .github/workflows/research-supertrend-ema921.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-supertrend-ema921-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas tabulate
      - name: Enforce novelty review
        run: test -s analysis/supertrend_ema921/NOVELTY_CHECK.md
      - name: Backtest full Delta BTCUSD history
        run: python scripts/research_supertrend_ema921.py
      - name: Publish research report and CSV results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_ema921/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish BTC Supertrend EMA9/21 1m replay results"
            git push origin HEAD:research/supertrend-ema921-20261122
          fi
