name: Independent convex volatility BTC ETH research
on:
  push:
    branches: [research/independent-convex-volatility-20261118-01]
    paths:
      - scripts/research_independent_convex_volatility_20261118_01.py
      - .github/workflows/research-independent-convex-volatility-20261118-01.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independent_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Independent BTC ETH replay
        run: python -u scripts/research_independent_convex_volatility_20261118_01.py
      - uses: actions/upload-artifact@v4
        with:
          name: convex-volatility-btc-eth-20261118
          path: analysis/independent_convex_volatility_20261118_01/
          if-no-files-found: error
      - name: Save reproducible metrics in isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_convex_volatility_20261118_01/
          if ! git diff --cached --quiet; then
            git commit -m "research: record independent convex volatility results"
            git push origin HEAD:research/independent-convex-volatility-20261118-01
          fi
