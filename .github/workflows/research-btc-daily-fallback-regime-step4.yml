name: BTCUSD Step 4 — daily fallback regime and protected exits
on:
  push:
    branches:
      - research/btc-daily-fallback-regime-exit-step4
    paths:
      - scripts/research_btc_daily_fallback_regime_step4.py
      - .github/workflows/research-btc-daily-fallback-regime-step4.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data and replay dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Replay 477 mandatory entries with 8064 regime/exit/cost combinations
        run: python scripts/research_btc_daily_fallback_regime_step4.py
      - name: Publish complete daily monthly and all-grid results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-daily-fallback-regime-step4
          path: analysis/btc_daily_fallback_regime_step4/
          if-no-files-found: warn
