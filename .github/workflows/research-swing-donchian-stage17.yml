name: Research BTC Stage17 4H Daily swing breakout monthly returns
on:
  push:
    branches: [main]
    paths:
      - scripts/research_swing_donchian_stage17.py
      - .github/workflows/research-swing-donchian-stage17.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage17-swing-breakout
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Run distinct multi-day swing breakout research
        run: python scripts/research_swing_donchian_stage17.py
      - name: Preserve detailed trade evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage17-swing-breakout-ledger
          path: analysis/institutional_discovery_stage17_swing_breakout/trade_ledger.csv.gz
          retention-days: 30
          if-no-files-found: error
      - name: Commit monthly NAV and full results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage17_swing_breakout/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage17_swing_breakout/quality.json
          git add analysis/institutional_discovery_stage17_swing_breakout/model_comparison.csv
          git add analysis/institutional_discovery_stage17_swing_breakout/monthly_mark_to_market.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage17 4H/Daily swing monthly performance"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
