name: Research BTC 30m trend 1m swing range with timezone
on:
  push:
    branches: [main]
    paths:
      - scripts/research_mtf_swing_range_long.py
      - .github/workflows/research-mtf-swing-range-long.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-swing-range-long
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Test 30m bullish regimes and 1m swing range entries
        run: python scripts/research_mtf_swing_range_long.py
      - name: Commit research outcomes, including failures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/mtf_swing_range_long
          if ! git diff --cached --quiet; then
            git commit -m "research: results of 30m bullish 1m swing range timezone experiment"
            git pull --rebase origin main
            git push
          fi
