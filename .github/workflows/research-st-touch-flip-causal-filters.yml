name: BTC 15m Touch Flip 2025-trained causal trend filters vs 2026
on:
  push:
    branches:
      - research/st-touch-flip-causal-regime-filters-20261122
    paths:
      - scripts/research_st_touch_flip_causal_regime_filters.py
      - .github/workflows/research-st-touch-flip-causal-filters.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Run causal entry filters 2025 training and 2026 validation
        run: python -u scripts/research_st_touch_flip_causal_regime_filters.py
      - name: Archive all candidate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-causal-filters-train-2025-eval-2026
          path: analysis/st_touch_flip_causal_regime_filters_20261122/
          if-no-files-found: warn
      - name: Commit successful research report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_touch_flip_causal_regime_filters_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: compare 2025 fit vs 2026 evaluation of causal filters"
            git push origin HEAD:research/st-touch-flip-causal-regime-filters-20261122
          fi
