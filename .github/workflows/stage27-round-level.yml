name: Stage27 independent BTC round-level backtest
on:
  push:
    branches: [research/independent-stage27-round-level]
    paths:
      - scripts/research_stage27_round_level.py
      - .github/workflows/stage27-round-level.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-stage27-round-level
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: pip install numpy pandas tabulate
      - name: Independent raw candle 22-month replay
        run: python scripts/research_stage27_round_level.py
      - name: Commit isolated audit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_stage27_round_level/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive independent Stage27 monthly audit and trade ledger"
            git push origin HEAD:research/independent-stage27-round-level
          fi
