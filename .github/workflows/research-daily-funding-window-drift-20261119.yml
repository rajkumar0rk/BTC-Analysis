name: Independent Daily Funding Window Drift
on:
  push:
    branches: [research/daily-funding-window-drift-20261119]
    paths:
      - scripts/research_daily_funding_window_drift_20261119.py
      - .github/workflows/research-daily-funding-window-drift-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas
      - name: Backtest BTC ETH 2025 2026
        run: python -u scripts/research_daily_funding_window_drift_20261119.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-daily-funding-window-drift
          path: analysis/daily_funding_window_drift_20261119/
          if-no-files-found: error
      - name: Archive reproducible results on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_funding_window_drift_20261119/summary.csv
          git add analysis/daily_funding_window_drift_20261119/selected.csv
          git add analysis/daily_funding_window_drift_20261119/selected_monthly.csv
          git add analysis/daily_funding_window_drift_20261119/quality.json
          git add analysis/daily_funding_window_drift_20261119/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive daily funding-window drift test"
            git fetch origin research/daily-funding-window-drift-20261119
            git rebase origin/research/daily-funding-window-drift-20261119
            git push origin HEAD:research/daily-funding-window-drift-20261119
          fi