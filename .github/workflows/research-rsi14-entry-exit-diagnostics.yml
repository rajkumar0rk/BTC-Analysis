name: BTC RSI14 two-year robust research
on:
  push:
    branches: ['research/rsi14-two-year-entry-exit-diagnostics']
    paths:
      - 'scripts/research_rsi14_entry_exit_diagnostics.py'
      - '.github/workflows/research-rsi14-entry-exit-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_rsi14_entry_exit_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: rsi14-entry-exit-diagnostics-full
          path: |
            scratch/rsi14_entry_exit_diagnostics/results.csv
            scratch/rsi14_entry_exit_diagnostics/all_results.json.gz
          if-no-files-found: error
