name: BTC ST EMA20 large percent 1 2 5 profit lock backtests
on:
  push:
    branches:
      - research/st-ema20-large-percent-profit-locks-20261122
    paths:
      - scripts/backtest_st_ema20_large_percent_locks.py
      - .github/workflows/research-st-ema20-large-percent-profit-locks.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-large-percent-profit-locks-20261122
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy pandas
        run: python -m pip install numpy pandas
      - name: Validate replay engine
        run: python -m py_compile scripts/backtest_st_ema20_large_percent_locks.py
      - name: Run 144 historical 1m simulated profit lock replays
        run: python scripts/backtest_st_ema20_large_percent_locks.py
      - name: Upload complete trade and monthly backtests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-ema20-large-percent-locks-144
          path: analysis/st_ema20_large_percent_locks_1h/
          if-no-files-found: warn
      - name: Commit audit files on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_large_percent_locks_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist large percent 1 2 5 profit-lock tests"
            git pull --rebase origin research/st-ema20-large-percent-profit-locks-20261122
            git push origin HEAD:research/st-ema20-large-percent-profit-locks-20261122
          fi
