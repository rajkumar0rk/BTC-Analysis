name: Capture current Delta India L2 book and trade snapshots
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-delta-institutional-live.yml
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: delta-institutional-data-writes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture actual live exchange snapshots
        run: python scripts/collect_delta_institutional_data.py snapshot
      - name: Commit only actual observations, never reconstructed tick history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/delta_india/BTCUSD/institutional/live_snapshots
          if ! git diff --cached --quiet; then
            git commit -m "data: live Delta book and recent-trade snapshot"
            git pull --rebase origin main
            git push
          fi
