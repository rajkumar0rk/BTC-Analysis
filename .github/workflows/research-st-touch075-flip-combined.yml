name: BTC 15M line touch 0p75 1p5 plus bullish flip 3p0 0p5 portfolio
on:
  push:
    branches:
      - research/st-075pct-touch-plus-lowvol-flip-20261122
    paths:
      - scripts/research_st_touch075_flip_lowvol_combination.py
      - .github/workflows/research-st-touch075-flip-combined.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas, numpy and tabulate
        run: python -m pip install numpy pandas tabulate
      - name: Backtest 0.75% Touch and 3% Flip with 1 live position
        run: python -u scripts/research_st_touch075_flip_lowvol_combination.py
      - name: Preserve full trade and monthly audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-touch-075-flip-3-percent-2025-2026
          path: analysis/st_075pct_touch_plus_lowvol_flip_20261122/
          if-no-files-found: warn
      - name: Publish validated report to separate research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_075pct_touch_plus_lowvol_flip_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: audited 2025 and 2026 0.75% touch plus 3% flip combined"
            git push origin HEAD:research/st-075pct-touch-plus-lowvol-flip-20261122
          fi
