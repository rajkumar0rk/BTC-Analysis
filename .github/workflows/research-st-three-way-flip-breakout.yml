name: BTC 15m touch vs flip vs flip confirmed breakout win analysis
on:
  push:
    branches:
      - research/st-second-green-flip-breakout-comparison-20261122
    paths:
      - scripts/research_st_three_way_flip_breakout.py
      - .github/workflows/research-st-three-way-flip-breakout.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  three-way:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Backtest three entry methods and confirm old result parity
        run: python -u scripts/research_st_three_way_flip_breakout.py
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-15m-touch-flip-breakout-wins
          path: analysis/st_touch_flip_breakout_three_way_20261122/
          if-no-files-found: warn
      - name: Publish research reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_touch_flip_breakout_three_way_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: compare highest wins three ST entry variants"
            git push origin HEAD:research/st-second-green-flip-breakout-comparison-20261122
          fi
