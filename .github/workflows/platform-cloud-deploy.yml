name: Deploy private Cloudflare Studio
on:
  workflow_run:
    workflows: ['Platform final release verification']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate config only or apply migration and deploy (virtual paper only)'
        required: true
        type: choice
        default: validate
        options: [validate, deploy]
permissions:
  contents: read
concurrency:
  group: private-cloud-production
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Check verified release against main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ && "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$current" != "$VERIFIED_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded release: intentionally skipped; no cloud writes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: preflight
    if: needs.preflight.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloudflare-production
    env:
      WRANGLER_SEND_METRICS: 'false'
      CF_WORKER: btc-analysis
      CF_ORIGIN: ${{ vars.CF_ORIGIN }}
      CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check current release before build
        id: before_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ && "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$current" != "$VERIFIED_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded release: remaining steps intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.before_build.outputs.current == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.before_build.outputs.current == 'true'
        with:
          node-version: '22'
      - name: Validate operator configuration before building
        if: steps.before_build.outputs.current == 'true'
        run: |
          python - <<'PY'
          import os,re,uuid
          origin=os.environ.get("CF_ORIGIN","")
          if not re.fullmatch(r"https://btc-analysis\.[a-z0-9-]+\.workers\.dev",origin):
              raise SystemExit("Set environment variable CF_ORIGIN to the exact worker HTTPS origin")
          try:
              db=uuid.UUID(os.environ.get("CF_DATABASE_ID",""))
          except ValueError:
              raise SystemExit("Set environment variable CF_DATABASE_ID to a dedicated D1 database UUID")
          if str(db) in ("00000000-0000-4000-8000-000000000001","12345678-1234-4234-8234-123456789012"):
              raise SystemExit("Test database IDs prohibited")
          PY
      - run: python scripts/prepare_browser_python.py
        if: steps.before_build.outputs.current == 'true'
      - working-directory: apps/web
        if: steps.before_build.outputs.current == 'true'
        run: npm ci --no-audit --no-fund && npm run build -- --mode private
      - name: Generate private deployment config (virtual paper enabled)
        if: steps.before_build.outputs.current == 'true'
        run: python scripts/prepare_cloud_release.py --worker "$CF_WORKER" --origin "$CF_ORIGIN" --database-id "$CF_DATABASE_ID" --enable-paper --release-sha "$VERIFIED_SHA"
      - name: Bundle and validate without cloud writes
        if: steps.before_build.outputs.current == 'true'
        working-directory: apps/cloud
        run: npx --yes wrangler@4.157.0 deploy --config wrangler.release.toml --dry-run --outdir "$RUNNER_TEMP/private-bundle"
      - name: Check current release before cloud writes
        id: before_writes
        if: steps.before_build.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ && "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$current" != "$VERIFIED_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded release: remaining steps intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify operator credentials and auth digest map
        if: steps.before_writes.outputs.current == 'true' && (github.event_name == 'workflow_run' || inputs.operation == 'deploy')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_HASHES_JSON: ${{ secrets.AUTH_HASHES_JSON }}
        working-directory: apps/cloud
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,json
          if not re.fullmatch(r"[0-9a-fA-F]{32}",os.environ.get("CLOUDFLARE_ACCOUNT_ID","")) or not os.environ.get("CLOUDFLARE_API_TOKEN"):
              raise SystemExit("Missing Cloudflare account ID or API token")
          try:
              a=json.loads(os.environ.get("AUTH_HASHES_JSON",""))
              assert isinstance(a,dict) and 1<=len(a)<=8
              assert all(re.fullmatch(r"[A-Za-z0-9_-]{1,64}",k) and isinstance(v,str) and re.fullmatch(r"[0-9a-f]{64}",v) for k,v in a.items())
              assert len(set(a.values()))==len(a)
          except (ValueError,TypeError,AssertionError):
              raise SystemExit("AUTH_HASHES_JSON must be a valid owner-to-SHA256 digest map")
          PY
          python ../../scripts/cloud_deploy_retry.py info
      - name: Apply dedicated database migration and deploy private Studio
        if: steps.before_writes.outputs.current == 'true' && (github.event_name == 'workflow_run' || inputs.operation == 'deploy')
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_HASHES_JSON: ${{ secrets.AUTH_HASHES_JSON }}
        working-directory: apps/cloud
        run: |
          set -euo pipefail
          python ../../scripts/cloud_deploy_retry.py migrate
          python ../../scripts/cloud_deploy_retry.py deploy
          python ../../scripts/cloud_deploy_retry.py secret
      - name: Verify deployed public shell and unauthenticated API denial
        if: steps.before_writes.outputs.current == 'true' && (github.event_name == 'workflow_run' || inputs.operation == 'deploy')
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "$CF_ORIGIN/health" | python -c 'import json,sys,os;d=json.load(sys.stdin);assert d["status"]=="ok" and d["service"]=="btc-analysis-cloud" and d.get("release_sha")==os.environ["VERIFIED_SHA"]'; then break; fi
            sleep 3
          done
          curl -fsS --max-time 15 "$CF_ORIGIN/health" | python -c 'import json,sys,os;d=json.load(sys.stdin);assert d["status"]=="ok" and d["service"]=="btc-analysis-cloud" and d.get("release_sha")==os.environ["VERIFIED_SHA"]'
          curl -fsS --max-time 15 "$CF_ORIGIN/" -o "$RUNNER_TEMP/private-index.html"
          grep -q 'Strategy Studio' "$RUNNER_TEMP/private-index.html"
          status="$(curl -sS --max-time 15 -o "$RUNNER_TEMP/unauth.json" -w '%{http_code}' "$CF_ORIGIN/v1/cloud/capabilities")"
          test "$status" = 401
          python -c 'import json,sys;assert json.load(open(sys.argv[1]))["error"]=="invalid_credentials"' "$RUNNER_TEMP/unauth.json"
          printf '### Private Studio deployed (virtual paper enabled; no sessions auto-started)\n%s\n\nAuthenticated data roundtrip and actual quota measurements still require operator verification.\n' "$CF_ORIGIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Extended production security and optional authenticated read check
        if: steps.before_writes.outputs.current == 'true' && (github.event_name == 'workflow_run' || inputs.operation == 'deploy')
        env:
          CF_MONITOR_TOKEN: ${{ secrets.CF_MONITOR_TOKEN }}
        run: python scripts/cloud_health_check.py >> "$GITHUB_STEP_SUMMARY"
