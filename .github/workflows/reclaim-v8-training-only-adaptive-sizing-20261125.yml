name: V8 training-only adaptive whole-lot sizing
on:
  push:
    branches: [research/reclaim-v5-validation-20261124]
    paths: [.github/workflows/reclaim-v8-training-only-adaptive-sizing-20261125.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify embedded Python syntax
        run: |
          python3 - <<'CHECK'
          import pathlib,textwrap
          p=pathlib.Path(".github/workflows/reclaim-v8-training-only-adaptive-sizing-20261125.yml")
          s=p.read_text().split("PYTHONPATH=scripts python -u - <<'PY'\n",1)[1].split("\n          PY\n",1)[0]
          compile(textwrap.dedent(s),str(p),"exec")
          print("PYTHON_SYNTAX_OK")
          CHECK
      - name: Restore prior native archive for year-end UTC bridge only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45363730365 --repo rajkumar0rk/BTC-Analysis --name delta-india-btcusd-2024-native --dir research-data-2024
      - name: Pin recovered 2024 archive with 11 complete IST months
        run: |
          git fetch --depth=1 origin bb9998f72c12673c2104e6e04ffcbffae66205f9
          git checkout FETCH_HEAD -- data/delta_india/BTCUSD/2024_verified_archive
      - name: Retrieve immutable original candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45366169753 --repo rajkumar0rk/BTC-Analysis --name reclaim-2025-2026-profit-refinement --dir frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas numba
      - name: Test whole-lot sizing with 200 USD research capital
        run: |
          PYTHONPATH=scripts python -u - <<'PY'
          import json,pathlib,itertools
          import numpy as np,pandas as pd
          from numba import njit
          from research_st_ema20_initial_sl_grid_20261122 import eng
          from research_st_ema20_reclaim_loss_months_20261122 import indicator_features
          import hashlib
          raw_candidate=pathlib.Path("frozen-v8/candidate.json").read_bytes()
          original=json.loads(raw_candidate)
          assert len(original["rules"])==57
          assert hashlib.sha256(raw_candidate).hexdigest()=="28fdb61028220a1bd2fa0ee1354ac125c934230849b804d35afec6e44d1b94c9"
          print("RULE_REMOVAL_IDENTITY",json.dumps(dict(original_rules=57,original_overlay=bool(original["overlay"]),pruning=True,wallet_overlay=False,source_run=45366169753)),flush=True)
          e=eng();e.smoke_test()
          root=pathlib.Path("data/delta_india/BTCUSD")
          out=pathlib.Path("analysis/reclaim_v8_training_only_adaptive_sizing");out.mkdir(parents=True,exist_ok=True)
          IST="Asia/Kolkata"
          def ist(s):return pd.Timestamp(s,tz=IST).tz_convert("UTC")
          def read_frame(p,cols):
              x=pd.read_csv(p,usecols=["time"]+cols);t=x.pop("time")
              x.index=pd.to_datetime(t,unit="s",utc=True) if pd.api.types.is_numeric_dtype(t) else pd.to_datetime(t,utc=True)
              assert not x.index.has_duplicates and np.isfinite(x[cols].to_numpy(float)).all(),str(p)
              return x.sort_index()
          def load(folder,years,cols):
              parts=[read_frame(p,cols) for p in sorted(pathlib.Path(folder).glob("20??-??.csv.gz")) if p.name[:4] in years]
              assert parts,str(folder)
              x=pd.concat(parts).sort_index();assert not x.index.has_duplicates
              return x
          arch=root/"2024_verified_archive"
          manifest=json.loads((arch/"manifest.json").read_text())
          assert manifest["synthetic_rows"]==0
          months=[f"2024-{i:02}" for i in range(2,13)]
          def recovered(label,oldlabel,newfolder,cols,step):
              parts=[]
              for month in months:
                  items=[x for x in manifest["months"] if x["series"]==label and x["month"]==month]
                  assert len(items)==1 and items[0]["missing"]==0 and items[0]["expected"]==items[0]["observed"],(label,month)
                  item=items[0];p=arch/label/(month+".csv.gz")
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==item["sha256"],str(p)
                  x=read_frame(p,cols);assert len(x)==item["expected"],str(p)
                  parts.append(x)
              z=pd.concat(parts).sort_index()
              assert not z.index.has_duplicates
              # The native 2024 repaired files are IST-partitioned. The older UTC archive
              # supplies only the 5.5-hour bridge belonging to 1 Jan 2025 IST.
              bridge_start=ist("2025-01-01")
              if step==3600:bridge_start=bridge_start.floor("h")
              bridge_end=pd.Timestamp("2025-01-01",tz="UTC")
              old=load("research-data-2024/"+oldlabel,["2024"],cols)
              bridge=old.loc[(old.index>=bridge_start)&(old.index<bridge_end)&(~old.index.isin(z.index))]
              z=pd.concat([z,bridge,load(newfolder,["2025"],cols)]).sort_index()
              assert not z.index.has_duplicates,label
              start=ist("2024-02-01") if step==60 else ist("2024-02-01").ceil("h")
              end=ist("2026-01-01")
              expected=pd.date_range(start,end-pd.Timedelta(seconds=1),freq="min" if step==60 else "h")
              actual=z.loc[(z.index>=start)&(z.index<end)].index
              assert actual.equals(expected),(label,len(actual),len(expected),str(expected.difference(actual)[:10]))
              print("VERIFIED_SERIES",label,len(actual),"missing",len(expected.difference(actual)),flush=True)
              return z.loc[z.index<end]
          cols=["open","high","low","close","volume"]
          m=recovered("trade_1m","1m",root/"1m",cols,60)
          mark=recovered("mark_1m","mark_1m",root/"institutional/history/mark_1m",["open","low","high"],60)
          fund=recovered("funding_1h","funding_1h",root/"institutional/history/funding_1h",["close"],3600).close
          assert m.index.max()<ist("2026-01-01") and mark.index.max()<ist("2026-01-01") and fund.index.max()<ist("2026-01-01")
          print("TRAINING_ONLY_DATA_OK",flush=True)
          assert (m.low<=m[["open","close"]].min(axis=1)).all() and (m.high>=m[["open","close"]].max(axis=1)).all()
          print("VERIFIED_ARCHIVE",json.dumps(dict(commit="bb9998f72c12673c2104e6e04ffcbffae66205f9",months=months,synthetic_rows=0,calendar="Asia/Kolkata")),flush=True)
          # Separate each contiguous segment. Seven days of indicator warmup, never bridge data gaps.
          segments={}
          variants=[("first_breakout",0.),("eligible_breakout",0.),("combined_breakout",0.),("touch_breakout",0.),("reclaim15",0.),("reclaim30",0.),("valid2",0.),("valid3",0.),("valid4",0.),("early",.5),("early",.75),("early",1.)]
          all_variants=list(dict.fromkeys(variants))
          by_entry={v:{} for v in all_variants}
          def lower_reclaims(q,h,minutes):
              lowbar=q.resample(f"{minutes}min").agg(dict(open="first",high="max",low="min",close="last",volume="sum"))
              assert q.close.resample(f"{minutes}min").count().eq(minutes).all()
              lowbar=e.features(lowbar)
              op=q.open.to_numpy(float);hi=q.high.to_numpy(float);lo=q.low.to_numpy(float)
              hs=h.side.to_numpy()
              hc=np.cumsum(np.r_[True,hs[1:]!=hs[:-1]])
              out=[];prev_cycle=-1;seen=False
              for i in range(20,len(lowbar)-1):
                  start=(i+1)*minutes
                  # Only the H1 candle completed by the lower signal close is available.
                  hour=start//60-1
                  if hour<0:continue
                  side=int(hs[hour]);cycle=int(hc[hour])
                  if cycle!=prev_cycle:
                      prev_cycle=cycle;seen=False
                  if side==0:continue
                  row=lowbar.iloc[i]
                  delta=side*(row.close-row.ema)
                  if delta<0:seen=True;continue
                  if delta<=0 or not seen:continue
                  seen=False
                  trigger=float(row.high+.5 if side==1 else row.low-.5)
                  hits=np.flatnonzero(hi[start:start+minutes]>=trigger if side==1 else lo[start:start+minutes]<=trigger)
                  if not len(hits):continue
                  j=start+int(hits[0])
                  mid=max(op[j],trigger) if side==1 else min(op[j],trigger)
                  assert h.index[hour]+pd.Timedelta(hours=1)<=lowbar.index[i]+pd.Timedelta(minutes=minutes)<=q.index[j]
                  out.append(dict(entry_j=j,entry=mid+side*e.SLIP,side=side,cycle=cycle,signal=str(lowbar.index[i]),hour_signal=str(h.index[hour]),kind="lower_reclaim",lower_trigger=trigger,lower_body=float(side*(row.close-row.open)/row.atr) if row.atr>0 else np.nan,lower_close=float(row.close)))
              return out
          def entry_events(q,h,variant):
              mode,buffer=variant
              if mode in ["reclaim15","reclaim30"]:return lower_reclaims(q,h,int(mode[-2:]))
              if variant==variants[0]:return e.entry_candidates(q,h,"reclaim")
              events=e.setups(h,"combined" if mode=="combined_breakout" else "touch" if mode=="touch_breakout" else "reclaim")
              op=q.open.to_numpy(float);hi=q.high.to_numpy(float);lo=q.low.to_numpy(float);cl=q.close.to_numpy(float)
              used=set();out=[]
              for hour,ev in sorted(events.items()):
                  if hour>=len(h) or (mode.startswith("first") and ev["cycle"] in used):continue
                  side=ev["side"];j0=hour*60;trigger=ev["trigger"]+side*buffer*float(h.atr.iloc[hour-1]) if mode!="early" else float(h.close.iloc[hour-1])+buffer*(ev["trigger"]-float(h.close.iloc[hour-1]))
                  expiry=min(j0+60,len(q))
                  if mode.startswith("valid"):
                      hours=int(mode[-1])
                      expiry=min(j0+hours*60,len(q))
                      # Cancel only at a completed hourly close or newer reclaim signal.
                      for hh in range(hour+1,min(hour+hours,len(h))):
                          prev=h.iloc[hh-1]
                          if int(prev.side)!=side or side*(prev.close-prev.ema)<=0 or hh in events:
                              expiry=hh*60;break
                  if mode=="early":
                      # Completed 5-minute close reaches a fixed fraction of the original signal wick.
                      # No entry on the confirmation bar; next minute open only.
                      found=False
                      for jj in range(j0+4,expiry-1,5):
                          if side*(cl[jj]-trigger)>=0:
                              j=jj+1;mid=op[j];found=True;break
                      if not found:continue
                  elif mode.endswith("open"):
                      j=j0;mid=op[j]
                  else:
                      hits=np.flatnonzero(hi[j0:expiry]>=trigger if side==1 else lo[j0:expiry]<=trigger)
                      if not len(hits):continue
                      j=j0+int(hits[0]);mid=max(op[j],trigger) if side==1 else min(op[j],trigger)
                  out.append(dict(entry_j=j,entry=mid+side*e.SLIP,side=side,cycle=ev["cycle"],signal=ev["signal"],kind=ev["kind"],expiry=expiry,first_expiry=j0+60,lower_trigger=trigger))
                  used.add(ev["cycle"])
              return out
          feature_names=["volume_ratio","atr_pct","atr_expansion","ema_slope_pct","ema_gap_pct","supertrend_gap_pct","dir_rsi14","adx14","hourly_body_atr","hourly_range_atr","signal_hour_ist","signal_weekday_ist","supertrend_age_hours","side","h4ema20","h4ema50","ema50gap","signal_atr","signal_trigger","directional_body_atr","signal_close","is_touch","entry_expiry","first_expiry","h4_reclaim_event","h4_alignment_event","h4_cross_event"]
          month_coverage={}
          raw_coverage={}
          coverage=[]
          for yr in [2024,2025]:
              start=ist("2024-02-01") if yr==2024 else ist(str(yr)+"-01-01");end=ist(str(yr+1)+"-01-01")
              raw=m.loc[(m.index>=max(ist("2024-02-01"),start-pd.Timedelta(days=7)))&(m.index<end)]
              score_index=raw.index[(raw.index>=start)&(raw.index<end)]
              assert score_index.equals(pd.date_range(start,end-pd.Timedelta(minutes=1),freq="min")),yr
              raw_coverage[yr]=np.bincount(score_index.tz_convert(IST).month-1,minlength=12)
              grp=raw.index.to_series().diff().ne(pd.Timedelta(minutes=1)).cumsum()
              segments[yr]=[]; used=0; month_coverage[yr]=np.zeros(12,dtype=int)
              for v in all_variants:by_entry[v][yr]=[]
              for _,q in raw.groupby(grp):
                  a=q.index.min().ceil("h");b=(q.index.max()+pd.Timedelta(minutes=1)).floor("h")
                  q=q.loc[(q.index>=a)&(q.index<b)]
                  if len(q)<8*24*60:continue
                  eligible=max(start,q.index.min()+pd.Timedelta(days=7))
                  if eligible>=q.index.max():continue
                  assert q.close.resample("1h").count().eq(60).all()
                  h=e.features(q.resample("1h").agg(dict(open="first",high="max",low="min",close="last",volume="sum")))
                  h=indicator_features(h)
                  # Higher-timeframe features only from bars completed at the signal close.
                  h4=q.resample("4h").agg(dict(open="first",high="max",low="min",close="last",volume="sum"))
                  h4=h4.loc[q.close.resample("4h").count().eq(240)]
                  for n in [20,50]:
                      ema=h4.close.ewm(span=n,adjust=False,min_periods=n).mean()
                      z=pd.Series(ema.to_numpy(),index=h4.index+pd.Timedelta(hours=4))
                      v=z.reindex(h.index+pd.Timedelta(hours=1),method="ffill").to_numpy()
                      h["h4ema"+str(n)]=100*h.side*(h.close-v)/h.close
                  # Event timestamps in segment-local minute coordinates. All H4 bars must be complete.
                  h4e20=h4.close.ewm(span=20,adjust=False,min_periods=20).mean()
                  h4e50=h4.close.ewm(span=50,adjust=False,min_periods=50).mean()
                  h4done=h4.index+pd.Timedelta(hours=4)
                  event_minute=np.asarray((h4done-q.index[0]).total_seconds()/60,dtype=float)
                  for direction in [1,-1]:
                      aligned=direction*(h4e20-h4e50)>0
                      reclaim=(direction*(h4.close-h4e20)>0)&aligned
                      both=(direction*(h4.close-h4e20)>0)&(direction*(h4.close-h4e50)>0)
                      for label,state in [("reclaim",reclaim),("alignment",both),("cross",aligned)]:
                          # Do not manufacture a transition at the beginning of indicator warmup.
                          valid=h4e50.notna() if label!="alignment" else h4e50.notna()
                          event=state&~state.shift(1,fill_value=False)&valid&valid.shift(1,fill_value=False)
                          stamp=pd.Series(np.where(event,event_minute,-1.),index=h4done)
                          stamp=stamp.cummax()
                          mapped=stamp.reindex(h.index+pd.Timedelta(hours=1),method="ffill").fillna(-1).to_numpy()
                          # A prior event remains eligible only while its H4 state is still aligned.
                          now=state.set_axis(h4done).reindex(h.index+pd.Timedelta(hours=1),method="ffill").fillna(False).to_numpy()
                          h["h4_"+label+"_"+str(direction)]=np.where(now,mapped,-1.)
                  h["ema50gap"]=100*h.side*(h.close-h.close.ewm(span=50,adjust=False,min_periods=50).mean())/h.close
                  idx=q.index
                  rates=fund.reindex(idx.floor("h")-pd.Timedelta(hours=1)).to_numpy(float)
                  mk=mark.reindex(idx)
                  weight=np.where(idx<pd.Timestamp("2025-09-08T16:00:00Z"),1/480,np.where((idx.minute==0)&(idx.hour%8==0),1.,0.))
                  flow=np.where(weight==0,0.,rates*mk.open.to_numpy()*weight*.001/100)
                  missing=~np.isfinite(flow)
                  def prefix(x):return np.r_[0.,np.cumsum(x)]
                  month=idx.tz_convert(IST).month.to_numpy(np.int64)-1
                  n=int((idx>=eligible).sum());used+=n
                  month_coverage[yr]+=np.bincount(month[idx>=eligible],minlength=12)
                  coverage.append(dict(year=yr,start=str(eligible),end=str(idx[-1]),used_minutes=n,signals_by_variant={str(v):len(entry_events(q,h,v)) for v in variants}))
                  for variant in all_variants:
                      events=entry_events(q,h,variant)
                      j=[];s=[];mid=[];ends=[];features=[];cycles=[]
                      hs=h.side.to_numpy()
                      for v in events:
                          k=int(v["entry_j"])
                          if q.index[k]<eligible or pd.Timestamp(v["signal"])<eligible:continue
                          sd=int(v["side"]);f=np.flatnonzero(hs[k//60:]!=sd)
                          endj=min((k//60+int(f[0])+1)*60,len(q)) if len(f) else len(q)
                          j.append(k);s.append(sd);mid.append(float(v["entry"])-sd*e.SLIP);ends.append(endj);cycles.append(v["cycle"])
                          row=h.loc[pd.Timestamp(v.get("hour_signal",v["signal"]))]
                          features.append([float(row[x]) for x in feature_names[:-10]]+[float(row.atr),float(v.get("lower_trigger",row.high+.5 if sd==1 else row.low-.5)),float(v.get("lower_body",sd*(row.close-row.open)/row.atr if row.atr>0 else np.nan)),float(v.get("lower_close",row.close)),float(v.get("kind","reclaim")=="touch"),float(v.get("expiry",(k//60+1)*60)),float(v.get("first_expiry",(k//60+1)*60))]+[float(row["h4_"+label+"_"+str(sd)]) for label in ["reclaim","alignment","cross"]])
                      by_entry[variant][yr].append((*(q[k].to_numpy(float) for k in ["open","high","low","close"]),np.array(j,np.int64),np.array(s,np.int64),np.array(mid,float),np.array(ends,np.int64),month,prefix(np.where(missing,0.,np.maximum(flow,0.))),prefix(np.where(missing,0.,np.maximum(-flow,0.))),prefix(missing),mk.low.to_numpy(float),mk.high.to_numpy(float),np.array(cycles,np.int64),np.asarray(features,float).reshape(-1,len(feature_names))))
              print("COVERAGE",yr,used,int((end-start).total_seconds()/60),"raw_months",raw_coverage[yr].tolist(),"usable_months",month_coverage[yr].tolist(),flush=True)
          segments=by_entry[variants[0]]
          (out/"coverage.json").write_text(json.dumps(coverage,indent=2))
          @njit
          def replay(o,h,l,c,j,sd,mid,end,sl,tp,path,slip,ladder,protect,atr,activation,distance,fee,lock_activation,lock_r,fail_minutes,fail_progress,fail_adverse,fade_activation,fade_fraction,funding_prefix,signal_close,structure_minutes,structure_buffer,gradual_start,fail_window,ramp_start,ramp_end,step_delay,pct_trigger,pct_capture):
              entry=mid+sd*slip;stop=entry*(1-sd*sl/100);target=entry*(1+sd*tp/100)
              lo=entry;hi=entry;best=entry
              trail_enabled=activation>0 and distance>0 and np.isfinite(atr) and atr>0
              protect_trigger=entry*(1+sd*protect/100);protect_stop=entry*(1+sd*.2/100)
              risk_distance=entry*sl/100
              initial_stop=stop
              # Exact fee break-even fill plus expected exit slip and optional fraction of initial risk.
              # Funding and gap exits can still cause a net loss.
              lock_stop=(entry*(1+sd*fee)+sd*lock_r*risk_distance)/(1-sd*fee)+sd*slip
              lock_trigger=entry+sd*max(lock_activation*risk_distance,sd*(lock_stop-entry)+1.)
              for k in range(j,end):
                  # Discrete price-percentage ladder, independent of initial stop distance.
                  # Use full completed minute closes after entry, then activate at next open.
                  if pct_trigger>0 and k>=j+2:
                      advance=100.*sd*(c[k-1]-entry)/entry
                      if advance>=pct_trigger:
                          rung=np.floor(advance/pct_trigger)*pct_trigger
                          accrued=(funding_prefix[k]-funding_prefix[j])/.001
                          desired=entry*rung*pct_capture/100.
                          candidate=(entry*(1+sd*fee)+sd*(accrued+desired))/(1-sd*fee)+sd*slip
                          if sd*(c[k-1]-candidate)>=.5 and sd*(candidate-stop)>0:stop=candidate
                  # Stepped protection: evaluate only fully completed post-fill minute closes.
                  # Preserve original TP and ratchet only in favorable direction.
                  if step_delay>0 and k>=j+2 and risk_distance>0:
                      progress=sd*(c[k-1]-entry)/risk_distance
                      level=-1.
                      if progress>=.5*step_delay:level=-.75
                      if progress>=1.*step_delay:level=-.25
                      if progress>=1.5*step_delay:level=0.
                      if progress>=2.*step_delay:level=.5
                      if progress>=3.*step_delay:level=1.5
                      if progress>=4.*step_delay:level=2.5
                      if level>-1.:
                          if level<0:
                              candidate=entry+sd*level*risk_distance
                          else:
                              accrued=(funding_prefix[k]-funding_prefix[j])/.001
                              candidate=(entry*(1+sd*fee)+sd*(accrued+level*risk_distance))/(1-sd*fee)+sd*slip
                          candidate=min(candidate,c[k-1]-.5) if sd==1 else max(candidate,c[k-1]+.5)
                          if sd*(candidate-stop)>0:stop=candidate
                  # Completed 5m close, after the partial entry bar. Monotone risk reduction.
                  # No future high/low or intrabar reordering; active from this next open.
                  if ramp_end>ramp_start>0 and k%5==0 and k-j>=6 and risk_distance>0:
                      progress=sd*(c[k-1]-entry)/risk_distance
                      if progress>=ramp_start:
                          fraction=min(1.,max(0.,(progress-ramp_start)/(ramp_end-ramp_start)))
                          accrued=(funding_prefix[k]-funding_prefix[j])/.001
                          cost_stop=(entry*(1+sd*fee)+sd*accrued)/(1-sd*fee)+sd*slip
                          candidate=initial_stop+fraction*(cost_stop-initial_stop)
                          # A protective stop must be on the adverse side of last close.
                          candidate=min(candidate,c[k-1]-.5) if sd==1 else max(candidate,c[k-1]+.5)
                          if sd*(candidate-stop)>0:stop=candidate
                  # At the next open after N complete one-minute bars (excluding partial fill bar).
                  # The existing intrabar stops and targets have priority in all previous bars.
                  if fail_minutes>0 and j+fail_minutes+1<=k<=j+fail_minutes+1+fail_window:
                      if sd*(best-entry)<fail_progress*risk_distance and sd*(c[k-1]-entry)<=-fail_adverse*risk_distance:
                          return k,o[k]-sd*slip,min(lo,o[k]),max(hi,o[k]),0,2
                  # Check only at aligned completed 15m closes, excluding partial entry bar.
                  # Profit fade is an exit at the next open, not a guaranteed positive fill.
                  if fade_activation>0 and k%15==0 and k-j>=16 and atr>0:
                      advance=sd*(best-entry)
                      gain=sd*(c[k-1]-entry)
                      estimated_fill=c[k-1]-sd*slip
                      estimated_net=.001*(sd*(estimated_fill-entry)-fee*(entry+estimated_fill))-(funding_prefix[k]-funding_prefix[j])
                      if advance>=fade_activation*atr and advance<activation*atr and gain<=(1.-fade_fraction)*advance and estimated_net>0:
                          return k,o[k]-sd*slip,min(lo,o[k]),max(hi,o[k]),0,3
                  # Tighten only after a completed aligned bar closes through the frozen reclaim close.
                  # Do not tighten trades which already showed 1R favorable progress or are currently favorable.
                  # The stop becomes active at this next open; the normal gap-stop logic remains in force.
                  if structure_minutes>0 and k%structure_minutes==0 and k-j>=structure_minutes+1 and atr>0:
                      prev=c[k-1]
                      if sd*(prev-signal_close)<0 and sd*(prev-entry)<0 and sd*(best-entry)<risk_distance:
                          candidate=prev-sd*structure_buffer*atr
                          if sd*(candidate-stop)>0:stop=candidate
