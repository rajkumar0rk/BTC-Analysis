name: Research 15M First-Touch Risk and Profit Protection
on:
  push:
    branches: [research/st-firsttouch-15m-risk-protection-20261123]
    paths:
      - scripts/research_st_firsttouch_15m_risk_protection_20261123.py
      - .github/workflows/research-st-firsttouch-15m-risk-protection.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firsttouch-15m-risk-protection
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install numpy pandas tabulate
      - name: Replay 22 months BTC and ETH 15M first-touch variants
        shell: bash
        run: |
          mkdir -p analysis/st_firsttouch_15m_risk_protection_20261123
          set -o pipefail
          python -u scripts/research_st_firsttouch_15m_risk_protection_20261123.py 2>&1 | tee analysis/st_firsttouch_15m_risk_protection_20261123/execution.log
      - name: Upload reports or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-15m-st-firsttouch-risk-protection
          path: analysis/st_firsttouch_15m_risk_protection_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive to research branch only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_firsttouch_15m_risk_protection_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive risk-protection 15m replay"
            git push origin HEAD:research/st-firsttouch-15m-risk-protection-20261123
          fi
