              nxt=max(candidates,key=lambda r:r["score"])
              front=tuple(nxt["ids"]);path.append(nxt)
              print("PRUNE_STEP",json.dumps(dict(count=len(front),ids=[i+1 for i in front],score=nxt["score"])),flush=True)
          # Choose only candidates satisfying all four training folds; favor smallest rule chain
