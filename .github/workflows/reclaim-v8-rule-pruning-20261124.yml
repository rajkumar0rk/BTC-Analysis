name: Frozen V8 supported rule pruning 2024 2025 validation 2026
on:
  push:
    branches: [research/reclaim-v5-validation-20261124]
    paths: [.github/workflows/reclaim-v8-rule-pruning-20261124.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore native 2024 data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45363730365 --repo rajkumar0rk/BTC-Analysis --name delta-india-btcusd-2024-native --dir research-data-2024
      - name: Retrieve immutable original candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45366169753 --repo rajkumar0rk/BTC-Analysis --name reclaim-2025-2026-profit-refinement --dir frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas numba
      - name: Prune low support and unstable original rules before 2026 replay
        run: |
          PYTHONPATH=scripts python -u - <<'PY'
          import json,pathlib,itertools
          import numpy as np,pandas as pd
          from numba import njit
          from research_st_ema20_initial_sl_grid_20261122 import eng
          from research_st_ema20_reclaim_loss_months_20261122 import indicator_features
          import hashlib
          raw_candidate=pathlib.Path("frozen-v8/candidate.json").read_bytes()
          original=json.loads(raw_candidate)
          assert len(original["rules"])==57
          assert hashlib.sha256(raw_candidate).hexdigest()=="28fdb61028220a1bd2fa0ee1354ac125c934230849b804d35afec6e44d1b94c9"
          print("RULE_REMOVAL_IDENTITY",json.dumps(dict(original_rules=57,original_overlay=bool(original["overlay"]),pruning=True,wallet_overlay=False,source_run=45366169753)),flush=True)
          e=eng();e.smoke_test()
          root=pathlib.Path("data/delta_india/BTCUSD")
          out=pathlib.Path("analysis/reclaim_v8_rule_pruning_2024_2025");out.mkdir(parents=True,exist_ok=True)
          def load(folder,years,cols):
              frames=[]
              for p in sorted(pathlib.Path(folder).glob("20??-??.csv.gz")):
                  if p.name[:4] not in years:continue
                  x=pd.read_csv(p,usecols=["time"]+cols);x.index=pd.to_datetime(x.pop("time"),unit="s",utc=True);frames.append(x)
              if not frames:raise RuntimeError(str(folder))
              x=pd.concat(frames).sort_index()
              assert not x.index.has_duplicates
              return x
          cols=["open","high","low","close","volume"]
          m=pd.concat([load("research-data-2024/1m",["2023","2024"],cols),load(root/"1m",["2025","2026"],cols)]).sort_index()
          assert not m.index.has_duplicates and np.isfinite(m[cols]).all().all()
          assert (m.low<=m[["open","close"]].min(axis=1)).all() and (m.high>=m[["open","close"]].max(axis=1)).all()
          def joined(label,cols):
              return pd.concat([load("research-data-2024/"+label,["2023","2024"],cols),load(root/"institutional/history"/label,["2025","2026"],cols)]).sort_index()
          fund=joined("funding_1h",["close"]).close
          mark=joined("mark_1m",["open","low","high"])
          # Separate each contiguous segment. Seven days of indicator warmup, never bridge data gaps.
          segments={}
          feature_names=["volume_ratio","atr_pct","atr_expansion","ema_slope_pct","ema_gap_pct","supertrend_gap_pct","dir_rsi14","adx14","hourly_body_atr","hourly_range_atr","signal_hour_ist","signal_weekday_ist","supertrend_age_hours","side"]
          month_coverage={}
          coverage=[]
          for yr in [2024,2025,2026]:
              start=pd.Timestamp(str(yr)+"-01-01",tz="UTC");end=pd.Timestamp(str(yr+1)+"-01-01",tz="UTC")
              if yr==2026:end=pd.Timestamp("2026-11-01",tz="UTC")
              raw=m.loc[(m.index>=start-pd.Timedelta(days=7))&(m.index<end)]
              grp=raw.index.to_series().diff().ne(pd.Timedelta(minutes=1)).cumsum()
              segments[yr]=[]; used=0; month_coverage[yr]=np.zeros(12,dtype=int)
              for _,q in raw.groupby(grp):
                  a=q.index.min().ceil("h");b=(q.index.max()+pd.Timedelta(minutes=1)).floor("h")
                  q=q.loc[(q.index>=a)&(q.index<b)]
                  if len(q)<8*24*60:continue
                  eligible=max(start,q.index.min()+pd.Timedelta(days=7))
                  if eligible>=q.index.max():continue
                  assert q.close.resample("1h").count().eq(60).all()
                  h=e.features(q.resample("1h").agg(dict(open="first",high="max",low="min",close="last",volume="sum")))
                  h=indicator_features(h)
                  # Higher-timeframe features only from bars completed at the signal close.
                  h4=q.resample("4h").agg(dict(open="first",high="max",low="min",close="last",volume="sum"))
                  h4=h4.loc[q.close.resample("4h").count().eq(240)]
                  for n in [20,50]:
                      ema=h4.close.ewm(span=n,adjust=False,min_periods=n).mean()
                      z=pd.Series(ema.to_numpy(),index=h4.index+pd.Timedelta(hours=4))
                      v=z.reindex(h.index+pd.Timedelta(hours=1),method="ffill").to_numpy()
                      h["h4ema"+str(n)]=100*h.side*(h.close-v)/h.close
                  h["ema50gap"]=100*h.side*(h.close-h.close.ewm(span=50,adjust=False,min_periods=50).mean())/h.close
                  events=e.entry_candidates(q,h,"reclaim")
                  j=[];s=[];mid=[];ends=[];features=[];cycles=[]
                  hs=h.side.to_numpy()
                  for v in events:
                      k=int(v["entry_j"])
                      if q.index[k]<eligible or pd.Timestamp(v["signal"])<eligible:continue
                      sd=int(v["side"]);f=np.flatnonzero(hs[k//60:]!=sd)
                      endj=min((k//60+int(f[0])+1)*60,len(q)) if len(f) else len(q)
                      j.append(k);s.append(sd);mid.append(float(v["entry"])-sd*e.SLIP);ends.append(endj);cycles.append(v["cycle"])
                      row=h.loc[pd.Timestamp(v["signal"])]
                      features.append([float(row[x]) for x in feature_names])
                  idx=q.index
                  rates=fund.reindex(idx.floor("h")-pd.Timedelta(hours=1)).to_numpy(float)
                  mk=mark.reindex(idx)
                  weight=np.where(idx<pd.Timestamp("2025-09-08T16:00:00Z"),1/480,np.where((idx.minute==0)&(idx.hour%8==0),1.,0.))
                  flow=np.where(weight==0,0.,rates*mk.open.to_numpy()*weight*.001/100)
                  missing=~np.isfinite(flow)
                  def prefix(x):return np.r_[0.,np.cumsum(x)]
                  month=idx.month.to_numpy(np.int64)-1
                  n=int((idx>=eligible).sum());used+=n
                  month_coverage[yr]+=np.bincount(month[idx>=eligible],minlength=12)
                  coverage.append(dict(year=yr,start=str(eligible),end=str(idx[-1]),used_minutes=n,signals=len(j)))
                  segments[yr].append((*(q[k].to_numpy(float) for k in ["open","high","low","close"]),np.array(j,np.int64),np.array(s,np.int64),np.array(mid,float),np.array(ends,np.int64),month,prefix(np.where(missing,0.,np.maximum(flow,0.))),prefix(np.where(missing,0.,np.maximum(-flow,0.))),prefix(missing),mk.low.to_numpy(float),mk.high.to_numpy(float),np.array(cycles,np.int64),np.asarray(features,float).reshape(-1,len(feature_names))))
              print("COVERAGE",yr,used,int((end-start).total_seconds()/60),flush=True)
          (out/"coverage.json").write_text(json.dumps(coverage,indent=2))
          @njit
          def replay(o,h,l,c,j,sd,mid,end,sl,tp,path,slip,ladder):
              entry=mid+sd*slip;stop=entry*(1-sd*sl/100);target=entry*(1+sd*tp/100)
              lo=entry;hi=entry
              for k in range(j,end):
                  nodes=(o[k],h[k],l[k],c[k]) if path==0 else (o[k],l[k],h[k],c[k])
                  active=k!=j or sd*(nodes[0]-mid)>=0
                  if active:
                      lo=min(lo,nodes[0]);hi=max(hi,nodes[0])
                      if sd*(nodes[0]-stop)<0:return k,nodes[0]-sd*slip,lo,hi,0
                      if tp>0 and sd*(nodes[0]-target)>=0:return k,nodes[0]-sd*slip,lo,hi,0
                  for z in range(3):
                      a,b=nodes[z],nodes[z+1]
                      if not active:
                          if sd*(b-a)<=0 or sd*(b-mid)<0:continue
                          a=mid;active=True
                      lo=min(lo,a);hi=max(hi,a)
                      if sd*(b-a)>0:
                          if tp>0 and sd*(a-target)<=0 and sd*(b-target)>=0:
                              lo=min(lo,target);hi=max(hi,target)
                              return k,target-sd*slip,lo,hi,0
                          for rung in ladder:
                              v=entry*(1+sd*rung/100)
                              if sd*(a-v)<0 and sd*(b-v)>=0 and sd*(v-stop)>0:stop=v
                      elif sd*(b-stop)<=0:
                          x=a if sd*(a-stop)<0 else stop
                          lo=min(lo,x);hi=max(hi,x)
                          return k,x-sd*slip,lo,hi,0
                      lo=min(lo,b);hi=max(hi,b)
              if end<len(o):return end,o[end]-sd*slip,min(lo,o[end]),max(hi,o[end]),0
              return end-1,c[end-1]-sd*slip,min(lo,c[end-1]),max(hi,c[end-1]),1
          @njit
          def batch(o,h,l,c,j,sd,mid,ends,month,fl,fs,fmissing,ml,mh,cycles,stops,targets,path,slip,fee,cash,peak,ladder):
              mon=np.zeros(12);counts=np.zeros(12);wins=0;losses=0;flat=0;dd=0.;skips=0;overlaps=0;boundary=0;missing=0;markmissing=0;funding=0.;fees=0.;marginrisk=0;active=-1;last_cycle=-1
              for i in range(len(j)):
                  if targets[i]==0:continue
                  k=j[i];side=sd[i];entry=mid[i]+side*slip
                  if cycles[i]==last_cycle:continue
                  if k<=active:overlaps+=1;continue
                  if entry*.001*(1+fee)>cash:skips+=1;continue
                  last_cycle=cycles[i]
                  local_sl=stops[i];local_tp=targets[i]
                  x,fill,low,high,bd=replay(o,h,l,c,k,side,mid[i],ends[i],local_sl,local_tp,path,slip,ladder)
                  active=x;boundary+=bd
                  fp=fl if side==1 else fs
                  debit=fp[x+1]-fp[k];funding+=debit;missing+=fmissing[x+1]-fmissing[k]
                  f=.001*fee*(entry+fill);fees+=f
                  net=.001*side*(fill-entry)-f-debit
                  # Conservative floating DD bound: allow favorable peak before adverse low/high.
                  good=high if side==1 else low;bad=low if side==1 else high
                  peak=max(peak,cash+.001*side*(good-entry)-.001*fee*(entry+good))
                  loweq=cash+.001*side*(bad-entry)-.001*fee*(entry+bad)-debit-.001*slip
                  dd=max(dd,100*(peak-loweq)/peak)
                  ma=ml[k:x+1] if side==1 else mh[k:x+1]
                  if not np.isfinite(ma).all():markmissing+=1
                  else:
                      adverse=np.min(ma)*.995 if side==1 else np.max(ma)*1.005
                      equity=cash+.001*side*(adverse-entry)-f-debit
                      if equity<=.001*adverse*(.0025+fee+.0025*.5*1.18):marginrisk+=1
                  cash+=net;peak=max(peak,cash);dd=max(dd,100*(peak-cash)/peak)
                  mon[month[x]]+=net;counts[month[x]]+=1
                  if net>0:wins+=1
                  elif net<0:losses+=1
                  else:flat+=1
              return mon,counts,wins,losses,flat,dd,skips,overlaps,boundary,missing,markmissing,funding,fees,marginrisk,cash,peak
          # All original rules use ordered override/new_only/selected_only semantics.
          rules=original["rules"]
          allowed=set(feature_names)-{"signal_hour_ist","signal_weekday_ist","side"}
          def atoms(rule):
              return [tuple(x.split()) for x in rule["gate"].split(" AND ") if x!="ALL"]
          for rule in rules:
              assert rule["mode"] in ["override","new_only","selected_only"]
              assert all(k in feature_names and op in [">=","<=","=="] for k,op,v in atoms(rule)),rule
          # No date, weekday, time or wallet conditions. Never invent or refit thresholds.
          legal=tuple(i for i,r in enumerate(rules) if all(k in allowed for k,op,v in atoms(r)))
          def masks(f,shift=0.):
              result=[]
              for rule in rules:
                  hit=np.ones(len(f),bool)
                  for k,op,v in atoms(rule):
                      x=f[:,feature_names.index(k)]*(1 if k in {"side","signal_hour_ist","signal_weekday_ist"} else 1+shift);v=float(v)
                      hit &= np.isfinite(x)&((x>=v) if op==">=" else (x<=v) if op=="<=" else (x==v))
                  result.append(hit)
              return result
          def policy(f,ids,shift=0.,scale=1.,slscale=1.,pre=None):
              target=np.zeros(len(f));stop=np.zeros(len(f))
              hits=masks(f,shift) if pre is None else pre
              for i in ids:
                  r=rules[i];hit=hits[i].copy()
                  if r["mode"]=="new_only":hit &= target==0
                  elif r["mode"]=="selected_only":hit &= target!=0
                  target[hit]=float(r["target"]);stop[hit]=float(r["stop_cap_pct"])
              target=np.where(target>0,target*scale,target)
              stop=np.minimum(stop*slscale,2.*slscale)
              return stop,target
          # Freeze support threshold before any performance ranking: each retained rule must
          # change the final decision for at least 3 opportunities in EACH training year.
          def support(ids,i):
              count=[]
              for yr in [2024,2025]:
                  n=0
                  for seg in segments[yr]:
                      f=seg[-1];hit=masks(f);s,t=policy(f,ids,pre=hit);ss,tt=policy(f,tuple(j for j in ids if j!=i),pre=hit)
                      n+=int(((t!=tt)|((t!=0)&(s!=ss))).sum())
                  count.append(n)
              return count
          def supported(ids):
              # Remove weakest effective rule and recalculate because ordering interactions matter.
              ids=tuple(ids)
              while ids:
                  counts={i:support(ids,i) for i in ids}
                  weak=[i for i in ids if min(counts[i])<3]
                  if not weak:return ids,counts
                  i=min(weak,key=lambda j:(min(counts[j]),sum(counts[j]),-j))
                  ids=tuple(j for j in ids if j!=i)
              return ids,{}
          scenarios=[(p,slip,fee,shift,scale,slscale) for p in [0,1] for slip,fee,shift,scale,slscale in [(5.,.00059,0.,1.,1.),(25.,.000885,0.,1.,1.),(25.,.000885,-.05,.9,.9),(25.,.000885,.05,1.1,1.1)]]
          # Precompute only training masks initially; holdout never used for ranking.
          cache={}
          def evaluate(yr,ids,sc,baseline=False):
              path,slip,fee,shift,scale,slscale=sc
              mon=np.zeros(12);counts=np.zeros(12);cash=100.;peak=100.;dd=0.;v=np.zeros(10);risk=0
              for si,seg in enumerate(segments[yr]):
                  f=seg[-1]
                  if baseline:s=np.full(len(f),2.*slscale);t=np.full(len(f),-1.)
                  else:
                      key=(yr,si,shift)
                      if key not in cache:cache[key]=masks(f,shift)
                      s,t=policy(f,ids,shift,scale,slscale,cache[key])
                  r=batch(*seg[:-1],s,t,path,slip,fee,cash,peak,np.asarray([2.,3.,5.]))
                  mon+=r[0];counts+=r[1];dd=max(dd,r[5]);cash,peak=r[-2:]
                  v+=np.array([*r[2:5],*r[6:13]]);risk+=r[13]
              nmonths=10 if yr==2026 else 12;mon=mon[:nmonths];counts=counts[:nmonths]
              return dict(year=yr,path=path,slip=slip,fee=fee,feature_shift=shift,tp_scale=scale,sl_scale=slscale,net=float(mon.sum()),monthly=mon.tolist(),monthly_trades=counts.tolist(),trades=int(counts.sum()),wins=int(v[0]),losses=int(v[1]),dd=dd,skips=int(v[3]),overlaps=int(v[4]),boundary=int(v[5]),missing=int(v[6]+v[7]),funding=float(v[8]),fees=float(v[9]),risk=risk)
          def stats(rows,yr):
              mon=np.array([x["monthly"] for x in rows]);base=mon[[x["slip"]==5 for x in rows]]
              return dict(base=min(x["net"] for x in rows if x["slip"]==5),stress=min(x["net"] for x in rows),base_months=int((base.min(axis=0)>0).sum()),stress_months=int((mon.min(axis=0)>0).sum()),halfyear=[float(mon[:,i:i+6].sum(axis=1).min()) for i in range(0,mon.shape[1],6)],dd=max(x["dd"] for x in rows),min_trades=min(x["trades"] for x in rows),max_skips=max(x["skips"] for x in rows),risk=max(x["risk"] for x in rows),missing=max(x["missing"] for x in rows),overlap=max(x["overlaps"] for x in rows),boundary=max(x["boundary"] for x in rows),monthly_floor=mon.min(axis=0).tolist())
          memo={}
          def inspect(ids):
              ids=tuple(ids)
              if ids in memo:return memo[ids]
              a,b=[stats([evaluate(yr,ids,sc) for sc in scenarios],yr) for yr in [2024,2025]]
              folds=a["halfyear"]+b["halfyear"]
              valid=min(a["min_trades"],b["min_trades"])>=20 and max(a["risk"],b["risk"],a["missing"],b["missing"],a["overlap"],b["overlap"])==0
              both=min(a["stress"],b["stress"])>0
              # $0.20 complexity penalty per rule to discourage fragile additional conditions.
              score=(int(valid),int(both),sum(x>0 for x in folds),min(folds)-.20*len(ids),min(a["stress"],b["stress"])-.20*len(ids),-max(a["dd"],b["dd"]),-len(ids))
              row=dict(ids=ids,y2024=a,y2025=b,score=score,valid=valid,both=both,positive_folds=sum(x>0 for x in folds))
              memo[ids]=row;return row
          print("PRUNE_RULES",json.dumps([dict(id=i+1,**r) for i,r in enumerate(rules)]),flush=True)
          print("PRUNE_COVERAGE",json.dumps({k:v.tolist() for k,v in month_coverage.items()}),flush=True)
          initial,counts=supported(legal)
          print("PRUNE_SUPPORT",json.dumps(dict(calendar_removed=[i+1 for i in range(len(rules)) if i not in legal],support_removed=[i+1 for i in legal if i not in initial],remaining=[i+1 for i in initial],counts={i+1:v for i,v in counts.items()})),flush=True)
          # Backward elimination only, no threshold tuning, no new rules.
          front=initial;path=[inspect(front)]
