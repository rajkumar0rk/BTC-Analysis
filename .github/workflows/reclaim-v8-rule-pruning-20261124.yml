          else:chosen=max(path,key=lambda r:r["score"])
          ids=tuple(chosen["ids"]);_,counts=supported(ids)
          candidate=dict(name="V8 pruned research candidate",source_run=45366169753,source_sha256=hashlib.sha256(raw_candidate).hexdigest(),rules=[rules[i] for i in ids],original_rule_ids=[i+1 for i in ids],overlay=None,training_years=[2024,2025],validation_year=2026,minimum_effective_rule_support_per_year=3,rule_support={i+1:v for i,v in counts.items()},training_pass=bool(acceptable),deployment_approved=False,calendar_timezone="UTC",quantity_btc=.001,initial_wallet_usd=100,signal_timeframe="1h",execution_timeframe="1m",supertrend=[10,3],ema=20,profit_lock_percent=[2,3,5])
          (out/"candidate.json").write_text(json.dumps(candidate,indent=2))
          (out/"pruning_path.json").write_text(json.dumps(path,indent=2))
          print("PRUNE_SELECTED",json.dumps(dict(candidate=candidate,training=chosen,tested_subsets=len(memo))),flush=True)
          # Same-engine full original chain without overlay and unconditional baseline are diagnostics.
          # Freeze selected rule IDs first; evaluate 2026 only after this point.
          reports=[]
