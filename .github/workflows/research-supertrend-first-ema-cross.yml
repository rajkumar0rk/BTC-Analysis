name: Backtest BTC Supertrend FIRST then EMA9/21 crossover
on:
  push:
    branches:
      - research/supertrend-first-ema-cross-20261122
    paths:
      - scripts/research_supertrend_first_ema_cross.py
      - .github/workflows/research-supertrend-first-ema-cross.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-supertrend-first-ema-cross-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas numba tabulate
      - name: Confirm causal novelty gate
        run: test -s analysis/supertrend_first_ema_cross/NOVELTY_CHECK.md
      - name: Run strict signal tests and authentic 1m replay
        run: python scripts/research_supertrend_first_ema_cross.py
      - name: Save full results in isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_first_ema_cross/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish strict Supertrend-first EMA crossover replay"
            git push origin HEAD:research/supertrend-first-ema-cross-20261122
          fi
