name: BTC V7 2025 structural trend research
on:
  push:
    branches: [main]
    paths:
      - scripts/v7_2025_trend_discovery.py
      - .github/workflows/research-v7-2025.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-v7-2025-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install pandas numpy
      - name: Discover 2025 structural trends only
        run: python scripts/v7_2025_trend_discovery.py --data-dir data/delta_india/BTCUSD/1m --output-dir analysis/v7_2025
      - name: Save report as downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-v7-2025-trend-discovery
          path: |
            analysis/v7_2025/V7_RESEARCH_REPORT.md
            analysis/v7_2025/v7_event_summary.json
            analysis/v7_2025/v7_event_ledger.csv
          if-no-files-found: error
      - name: Commit research outputs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/v7_2025/
          if ! git diff --cached --quiet; then
            git commit -m "research(v7): persist 2025 structure trend results"
            git pull --rebase origin main
            git push
          fi
