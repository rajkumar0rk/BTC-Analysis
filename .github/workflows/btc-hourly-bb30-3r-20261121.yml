name: BTC 1H Bollinger30 3R Real-1m Backtest
on:
  push:
    branches:
      - research/btc-1h-bb30-3r-20261121
    paths:
      - scripts/research_hourly_bollinger_30_3r.py
      - .github/workflows/btc-hourly-bb30-3r-20261121.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-hourly-bb30-3r-20261121
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy tabulate
      - name: 1H Bollinger signal 1m execution no parameter fitting
        run: python scripts/research_hourly_bollinger_30_3r.py
      - name: Commit reproducible results to research branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/hourly_bollinger_30_3r/
          if ! git diff --cached --quiet; then
            git commit -m "research: 1H BB30 3R full 1m backtest results"
            git push
          fi
