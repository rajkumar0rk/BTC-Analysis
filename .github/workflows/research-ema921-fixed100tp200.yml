name: Backtest EMA 1H 15M 5M fixed 100 stop 200 TP
on:
  push:
    branches:
      - research/ema921-fixed100tp200-20261122
    paths:
      - scripts/research_ema921_fixed100tp200.py
      - .github/workflows/research-ema921-fixed100tp200.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema921-100sl200tp-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy tabulate
      - name: Check novelty pre-registration
        run: test -s analysis/ema921_fixed100_200/NOVELTY_CHECK.md
      - name: Execute full data 1m replay
        run: python scripts/research_ema921_fixed100tp200.py
      - name: Persist all results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema921_fixed100_200/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish EMA 100SL/200TP 1m replay"
            git push origin HEAD:research/ema921-fixed100tp200-20261122
          fi
