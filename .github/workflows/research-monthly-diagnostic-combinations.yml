name: BTC monthly diagnostic combinations
on:
  push:
    branches: ['research/monthly-diagnostic-combinations']
    paths:
      - 'scripts/research_monthly_diagnostic_combinations.py'
      - '.github/workflows/research-monthly-diagnostic-combinations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_monthly_diagnostic_combinations.py
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-diagnostic-combinations-full
          path: |
            scratch/monthly_diagnostic_combinations/results.csv
            scratch/monthly_diagnostic_combinations/all_results.json.gz
          if-no-files-found: error
