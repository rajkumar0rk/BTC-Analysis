name: BTCUSD Daily Opportunity Map Step 1 — fixed hour price paths
on:
  push:
    branches:
      - research/btc-daily-opportunity-map-step1
    paths:
      - scripts/research_btc_daily_opportunity_step1.py
      - .github/workflows/research-btc-daily-opportunity-step1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Count full IST weekday range and net price opportunities
        run: python scripts/research_btc_daily_opportunity_step1.py
      - name: Archive hourly opportunity and daily range tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-daily-opportunity-map-step1
          path: analysis/btc_daily_opportunity_step1/
          if-no-files-found: warn
