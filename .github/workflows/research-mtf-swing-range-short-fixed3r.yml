name: Research BTC 30m downtrend 1m swing range SHORT fixed 3R
on:
  push:
    branches: [main]
    paths:
      - scripts/research_mtf_swing_range_short_fixed3r.py
      - .github/workflows/research-mtf-swing-range-short-fixed3r.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-swing-range-short-fixed3r
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Replay SHORT with fixed 3R pairs and session comparison
        run: python scripts/research_mtf_swing_range_short_fixed3r.py
      - name: Save complete SHORT research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/mtf_swing_range_short_fixed3r
          if ! git diff --cached --quiet; then
            git commit -m "research: save short fixed 3R BTC session comparison"
            git pull --rebase origin main
            git push
          fi
