name: Backtest forward-guarded BTCUSD fixed $10 margin
on:
  push:
    branches: ['feature/vps-ema-st-demo-live-app']
    paths:
      - 'scripts/replay_btc_ema_st_fixed_10_margin_guarded.py'
      - '.github/workflows/backtest-vps-guarded-btc.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backtest-vps-guarded-btc
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas
      - name: Run conservative guard differential on verified minute history
        run: python scripts/replay_btc_ema_st_fixed_10_margin_guarded.py
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: vps-guarded-btc-100-usd-portfolio
          if-no-files-found: error
          retention-days: 30
          path: |
            analysis/btc_ema_st_fixed_10_margin_guarded_20261119/*.json
            analysis/btc_ema_st_fixed_10_margin_guarded_20261119/*.csv
            analysis/btc_ema_st_fixed_10_margin_guarded_20261119/*.csv.gz
      - name: Commit research results without merging main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_ema_st_fixed_10_margin_guarded_20261119
          if ! git diff --cached --quiet; then
            git commit -m "research: record guarded 100 USD wallet 10 USD isolated 100x replay"
            git push origin HEAD:feature/vps-ema-st-demo-live-app
          fi
