name: BTC 15M RSI14 fixed SL TP grid research
on:
  push:
    branches: ['research/rsi14-fixed-sl-tp-2025']
    paths:
      - 'scripts/research_rsi14_fixed_sl_tp_2025.py'
      - '.github/workflows/research-rsi14-fixed-sl-tp-2025.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/research_rsi14_fixed_sl_tp_2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-analysis-backtest-v1
          path: scratch/rsi14_fixed/backtest.json
          if-no-files-found: error
      - name: Request dashboard publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-backtest-data.yml --ref main -f source_run_id="$GITHUB_RUN_ID" -f source_attempt="$GITHUB_RUN_ATTEMPT"
