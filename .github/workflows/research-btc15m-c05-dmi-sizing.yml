name: BTCUSD C05 DMI directional sizing training and frozen validation
on:
  push:
    branches: [research/btc15m-c05-dmi-sizing-20261124]
    paths:
      - scripts/research_btc15m_c05_dmi_sizing.py
      - .github/workflows/research-btc15m-c05-dmi-sizing.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/checkout@v4
        with:
          ref: edcf60fa0a229108d09772dc6cbe04eb15476291
          path: _repaired
          sparse-checkout: data/delta_india/BTCUSD/2024_verified_archive
          persist-credentials: false
      - run: python scripts/research_btc15m_c05_dmi_sizing.py train
      - uses: actions/upload-artifact@v4
        with:
          name: c05-dmi-sizing-train-shard-${{ matrix.shard }}
          path: analysis/btc15m_c05_dmi_sizing_20261124/shard_${{ matrix.shard }}/
          if-no-files-found: error
  freeze:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c05-dmi-sizing-train-shard-*
          path: _shards
      - run: |
          mkdir -p analysis/btc15m_c05_dmi_sizing_20261124
          for i in {0..5}; do
            cp -r "_shards/c05-dmi-sizing-train-shard-$i" "analysis/btc15m_c05_dmi_sizing_20261124/shard_$i"
          done
          python scripts/research_btc15m_c05_dmi_sizing.py freeze
      - uses: actions/upload-artifact@v4
        with:
          name: c05-dmi-sizing-frozen-selection
          path: |
            analysis/btc15m_c05_dmi_sizing_20261124/FROZEN.json
            analysis/btc15m_c05_dmi_sizing_20261124/training.csv
            analysis/btc15m_c05_dmi_sizing_20261124/training_ranked.csv
            analysis/btc15m_c05_dmi_sizing_20261124/training_monthly.csv
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_c05_dmi_sizing_20261124/{FROZEN.json,training.csv,training_ranked.csv,training_monthly.csv}
          git commit -m "research: freeze core-only training selection before validation"
          git push origin HEAD:research/btc15m-c05-dmi-sizing-20261124
  validate:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/checkout@v4
        with:
          ref: edcf60fa0a229108d09772dc6cbe04eb15476291
          path: _repaired
          sparse-checkout: data/delta_india/BTCUSD/2024_verified_archive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c05-dmi-sizing-frozen-selection
          path: analysis/btc15m_c05_dmi_sizing_20261124/
      - run: python scripts/research_btc15m_c05_dmi_sizing.py validate
      - uses: actions/upload-artifact@v4
        with:
          name: c05-dmi-sizing-frozen-validation-results
          path: analysis/btc15m_c05_dmi_sizing_20261124/
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_c05_dmi_sizing_20261124/
          git commit -m "research: report frozen core-only validation"
          git pull --rebase origin research/btc15m-c05-dmi-sizing-20261124
          git push origin HEAD:research/btc15m-c05-dmi-sizing-20261124
