name: Independent BTC ETH clustered extreme arrivals sequential drift-change research
on:
  push:
    branches:
      - research/independent-extreme-cluster-relaxation-20261119-v1
    paths:
      - scripts/independent_extreme_cluster_relaxation_v1.py
      - .github/workflows/independent-extreme-cluster-relaxation-v1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-extreme-cluster-relaxation-v1
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-extreme-cluster-relaxation-20261119-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical analysis dependencies
        run: pip install numpy pandas numba tabulate
      - name: Run the same clustered extreme arrivals rules on BTCUSD and ETHUSD original 1m
        run: python scripts/independent_extreme_cluster_relaxation_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-extreme-cluster-relaxation-v1
          path: analysis/independent_extreme_cluster_relaxation_v1/
          retention-days: 45
      - name: Archive audit results on isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/independent_extreme_cluster_relaxation_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'research: archive native BTC ETH clustered extreme arrivals monthly results'
            git fetch origin research/independent-extreme-cluster-relaxation-20261119-v1
            git rebase origin/research/independent-extreme-cluster-relaxation-20261119-v1
            git push origin HEAD:research/independent-extreme-cluster-relaxation-20261119-v1
          fi
