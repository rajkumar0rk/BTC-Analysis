name: Current-week 98-combination BTC/ETH trailing STOP POINTS grid
on:
  push:
    branches:
      - research/weekly-trailing-stop-grid-nov16-21-2026-v2
    paths:
      - scripts/week_trailing_stop_grid_nov16_21_2026.py
      - .github/workflows/research-week-stop-points-grid-20261121.yml

permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research requirements
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 numba==0.61.2
      - name: Validate optimizer
        run: python -m py_compile scripts/week_trailing_stop_grid_nov16_21_2026.py
      - name: Fetch latest market candles and run 98x2x2 week tests
        run: python scripts/week_trailing_stop_grid_nov16_21_2026.py
      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-nov16-btc-eth-trailing-stop-point-parameter-grid
          path: analysis/weekly_stop_points_grid_20261121/
          if-no-files-found: warn
      - name: Save research results on branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/weekly_stop_points_grid_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: current-week BTC ETH varied activation and trailing stop point results"
            git push origin HEAD:research/weekly-trailing-stop-grid-nov16-21-2026-v2
          fi
