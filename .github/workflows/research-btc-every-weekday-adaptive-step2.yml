name: BTCUSD mandatory every-weekday adaptive entry Step 2
on:
  push:
    branches:
      - research/btc-mandatory-daily-adaptive-entry-step2
    paths:
      - scripts/research_btc_every_weekday_adaptive_step2.py
      - .github/workflows/research-btc-every-weekday-adaptive-step2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Run deterministic adaptive entry study with one BTC trade EVERY weekday
        run: python scripts/research_btc_every_weekday_adaptive_step2.py
      - name: Archive every model and selected daily / monthly / neighbor outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-mandatory-daily-adaptive-step2
          path: analysis/btc_every_weekday_adaptive_step2/
          if-no-files-found: warn
