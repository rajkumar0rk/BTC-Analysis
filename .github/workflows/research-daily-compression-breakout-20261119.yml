name: Independent daily volatility-compression breakout
on:
  push:
    branches: [research/daily-compression-breakout-20261119]
    paths:
      - scripts/research_daily_compression_breakout_20261119.py
      - .github/workflows/research-daily-compression-breakout-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -u scripts/research_daily_compression_breakout_20261119.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-compression-breakout-20261119
          path: analysis/daily_compression_breakout_20261119/
          if-no-files-found: error
      - name: Archive selected evidence on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_compression_breakout_20261119/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive independent compression breakout results"
            git push origin HEAD:research/daily-compression-breakout-20261119
          fi
