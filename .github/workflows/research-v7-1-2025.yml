name: Research BTC V7.1 2025 breakout retest
on:
  push:
    branches: [main]
    paths:
      - scripts/research_v7_1_retest_2025.py
      - .github/workflows/research-v7-1-2025.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-v7-1-2025
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Run 2025 V7.1 comparison
        run: python scripts/research_v7_1_retest_2025.py
      - name: Save downloadable report and ledgers
        uses: actions/upload-artifact@v4
        with:
          name: BTC-V7-1-2025-results
          path: analysis/v7_1_2025/
          if-no-files-found: error
      - name: Commit research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add analysis/v7_1_2025/
          if ! git diff --cached --quiet; then
            git commit -m "research(v7.1): persist 2025 retest comparison"
            git pull --rebase origin main
            git push
          fi
