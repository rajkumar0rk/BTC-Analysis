name: 15m first-touch 300 TP 100 SL BTC ETH
on:
  push:
    branches: [research/15m-first-touch-tp300-sl100-20261121]
    paths:
      - scripts/first_hit_15m_tp300_sl100_20261121.py
      - .github/workflows/first-hit-15m-tp300-sl100-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Replay 15m strategy with actual 1m first touch
        run: python scripts/first_hit_15m_tp300_sl100_20261121.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-touch-15m-300tp-100sl
          path: analysis/first_hit_15m_tp300_sl100_20261121/
