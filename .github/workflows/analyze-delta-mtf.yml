name: Analyze Delta BTCUSD 1m 5m 15m
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_delta_mtf_institutional.py'
      - '.github/workflows/analyze-delta-mtf.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: delta-mtf-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Run reproducible discovery and holdout tests
        run: python scripts/analyze_delta_mtf_institutional.py
      - name: Commit report and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/delta_1m_5m_15m
          if ! git diff --cached --quiet; then
            git commit -m "research: Delta BTCUSD 1m 5m 15m empirical tests"
            git push
          fi
