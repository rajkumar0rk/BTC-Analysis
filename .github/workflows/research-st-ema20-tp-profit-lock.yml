name: BTC 1H EMA20 ST fixed TP with profit protection
on:
  push:
    branches:
      - research/st-ema20-tp-profit-protection-20261122
    paths:
      - scripts/backtest_supertrend_ema20_fixed_tp_profit_lock_1h.py
      - .github/workflows/research-st-ema20-tp-profit-lock.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-ema20-st-tp-profit-lock-20261122
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Verify syntax and deterministic stop-first unit checks
        run: python -m py_compile scripts/backtest_supertrend_ema20_fixed_tp_profit_lock_1h.py
      - name: Run BTCUSD 1M OHLC replay with 18 target-protection combinations
        run: python scripts/backtest_supertrend_ema20_fixed_tp_profit_lock_1h.py
      - name: Upload trade logs summary and monthly outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema20-st-fixed-tp-profit-protection
          path: analysis/ema20_st_fixed_tp_protection_1h/
          if-no-files-found: warn
      - name: Commit results on independent research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_st_fixed_tp_protection_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist fixed TP profit protection sweep"
            git pull --rebase origin research/st-ema20-tp-profit-protection-20261122
            git push origin HEAD:research/st-ema20-tp-profit-protection-20261122
          fi
