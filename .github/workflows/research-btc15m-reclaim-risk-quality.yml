name: BTCUSD 15M Reclaim Entry Quality and ATR Risk Study
on:
  push:
    branches: [research/btc15m-reclaim-atr-entry-quality-20261123]
    paths:
      - scripts/research_btc15m_reclaim_risk_quality_20261123.py
      - .github/workflows/research-btc15m-reclaim-risk-quality.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc15m-reclaim-risk-quality
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: BTCUSD 15M only 22 month backtest
        shell: bash
        run: |
          mkdir -p analysis/btc15m_reclaim_risk_quality_20261123
          set -o pipefail
          python -u scripts/research_btc15m_reclaim_risk_quality_20261123.py 2>&1 | tee analysis/btc15m_reclaim_risk_quality_20261123/execution.log
      - name: Upload artifacts even on errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusd-15m-reclaim-risk-quality-20261123
          path: analysis/btc15m_reclaim_risk_quality_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive to research branch only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_reclaim_risk_quality_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 15m BTC reclaim entry-quality experiment"
            git push origin HEAD:research/btc15m-reclaim-atr-entry-quality-20261123
          fi
