name: 1H BTC ETH TP600 SL300 first touch
on:
  push:
    branches:
      - research/one-hour-first-touch-600-300
    paths:
      - scripts/research_1h_first_touch_600_300.py
      - .github/workflows/research-1h-first-touch-600-300.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Replay 1-minute candle first touches
        run: python scripts/research_1h_first_touch_600_300.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-touch-600-300
          path: analysis/one_hour_first_touch_600_300/
