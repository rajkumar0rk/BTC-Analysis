name: BTC EMA20 Reclaim Volume Volatility Filter Grid
on:
  push:
    branches:
      - research/st-ema20-reclaim-volume-volatility-grid-20261122
    paths:
      - scripts/backtest_st_ema20_reclaim_volume_volatility_grid.py
      - .github/workflows/research-st-ema20-reclaim-vol-atr.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-ema20-reclaim-vol-atr-grid-20261122
  cancel-in-progress: false
jobs:
  test-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install pandas numpy
      - name: Validate analysis syntax
        run: python -m py_compile scripts/backtest_st_ema20_reclaim_volume_volatility_grid.py
      - name: Test completed-1H volume ATR and ATR expansion gates on RECLAIM
        run: python scripts/backtest_st_ema20_reclaim_volume_volatility_grid.py
      - name: Upload Reclaim grid results and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-reclaim-volume-volatility-filter-grid
          path: analysis/st_ema20_reclaim_volume_volatility_grid_1h/
          if-no-files-found: warn
      - name: Commit research results to branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_reclaim_volume_volatility_grid_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist Reclaim volume ATR filter outcomes"
            git pull --rebase origin research/st-ema20-reclaim-volume-volatility-grid-20261122
            git push origin HEAD:research/st-ema20-reclaim-volume-volatility-grid-20261122
          fi
