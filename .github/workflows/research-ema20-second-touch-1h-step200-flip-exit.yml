name: BTC ETH 1H EMA second touch step200 lock plus confirmed Supertrend flip
on:
  push:
    branches: [research/ema20-second-touch-1h-step200-supertrend-flip-exit-20261121]
    paths:
      - scripts/research_ema20_second_touch_1h_step200_flip_exit_paths.py
      - .github/workflows/research-ema20-second-touch-1h-step200-flip-exit.yml
      - analysis/ema20_second_touch_1h_step200_flip_exit_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-step200-profitlock-1h-supertrend-flip-exit
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy and pandas
        run: python -m pip install numpy pandas
      - name: Replay two 1m path hypotheses plus causally confirmed hourly Supertrend reversal exits
        shell: bash
        run: |
          mkdir -p analysis/ema20_second_touch_1h_step200_flip_exit_20261121/
          set -o pipefail
          python -u scripts/research_ema20_second_touch_1h_step200_flip_exit_paths.py 2>&1 | tee analysis/ema20_second_touch_1h_step200_flip_exit_20261121/execution.log
      - name: Upload report or failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-1h-step200-lock-confirmed-supertrend-flip
          path: analysis/ema20_second_touch_1h_step200_flip_exit_20261121/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit evidence solely to research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_1h_step200_flip_exit_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BTC ETH Supertrend flip exits with 200-point step lock"
            git push origin HEAD:research/ema20-second-touch-1h-step200-supertrend-flip-exit-20261121
          fi
