name: V8 chronological zero-rule selection and confirmation
on:
  push:
    branches: [research/reclaim-v5-validation-20261124]
    paths: [.github/workflows/reclaim-v8-verified-chronological-20261124.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify embedded Python syntax
        run: |
          python3 - <<'CHECK'
          import pathlib,textwrap
          p=pathlib.Path(".github/workflows/reclaim-v8-verified-chronological-20261124.yml")
          s=p.read_text().split("PYTHONPATH=scripts python -u - <<'PY'\n",1)[1].split("\n          PY\n",1)[0]
          compile(textwrap.dedent(s),str(p),"exec")
          print("PYTHON_SYNTAX_OK")
          CHECK
      - name: Restore prior native archive for year-end UTC bridge only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45363730365 --repo rajkumar0rk/BTC-Analysis --name delta-india-btcusd-2024-native --dir research-data-2024
      - name: Pin recovered 2024 archive with 11 complete IST months
        run: |
          git fetch --depth=1 origin bb9998f72c12673c2104e6e04ffcbffae66205f9
          git checkout FETCH_HEAD -- data/delta_india/BTCUSD/2024_verified_archive
      - name: Retrieve immutable original candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45366169753 --repo rajkumar0rk/BTC-Analysis --name reclaim-2025-2026-profit-refinement --dir frozen-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas numba
      - name: Select clean reclaim risk on 2024 only and confirm on 2025
        run: |
          PYTHONPATH=scripts python -u - <<'PY'
          import json,pathlib,itertools
          import numpy as np,pandas as pd
          from numba import njit
          from research_st_ema20_initial_sl_grid_20261122 import eng
          from research_st_ema20_reclaim_loss_months_20261122 import indicator_features
          import hashlib
          raw_candidate=pathlib.Path("frozen-v8/candidate.json").read_bytes()
          original=json.loads(raw_candidate)
          assert len(original["rules"])==57
          assert hashlib.sha256(raw_candidate).hexdigest()=="28fdb61028220a1bd2fa0ee1354ac125c934230849b804d35afec6e44d1b94c9"
          print("RULE_REMOVAL_IDENTITY",json.dumps(dict(original_rules=57,original_overlay=bool(original["overlay"]),pruning=True,wallet_overlay=False,source_run=45366169753)),flush=True)
          e=eng();e.smoke_test()
          root=pathlib.Path("data/delta_india/BTCUSD")
          out=pathlib.Path("analysis/reclaim_v8_verified_chronological");out.mkdir(parents=True,exist_ok=True)
          IST="Asia/Kolkata"
          def ist(s):return pd.Timestamp(s,tz=IST).tz_convert("UTC")
          def read_frame(p,cols):
              x=pd.read_csv(p,usecols=["time"]+cols);t=x.pop("time")
              x.index=pd.to_datetime(t,unit="s",utc=True) if pd.api.types.is_numeric_dtype(t) else pd.to_datetime(t,utc=True)
              assert not x.index.has_duplicates and np.isfinite(x[cols].to_numpy(float)).all(),str(p)
              return x.sort_index()
          def load(folder,years,cols):
              parts=[read_frame(p,cols) for p in sorted(pathlib.Path(folder).glob("20??-??.csv.gz")) if p.name[:4] in years]
              assert parts,str(folder)
              x=pd.concat(parts).sort_index();assert not x.index.has_duplicates
              return x
          arch=root/"2024_verified_archive"
          manifest=json.loads((arch/"manifest.json").read_text())
          assert manifest["synthetic_rows"]==0
          months=[f"2024-{i:02}" for i in range(2,13)]
          def recovered(label,oldlabel,newfolder,cols,step):
              parts=[]
              for month in months:
                  items=[x for x in manifest["months"] if x["series"]==label and x["month"]==month]
                  assert len(items)==1 and items[0]["missing"]==0 and items[0]["expected"]==items[0]["observed"],(label,month)
                  item=items[0];p=arch/label/(month+".csv.gz")
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==item["sha256"],str(p)
                  x=read_frame(p,cols);assert len(x)==item["expected"],str(p)
                  parts.append(x)
              z=pd.concat(parts).sort_index()
              assert not z.index.has_duplicates
              # The native 2024 repaired files are IST-partitioned. The older UTC archive
              # supplies only the 5.5-hour bridge belonging to 1 Jan 2025 IST.
              bridge_start=ist("2025-01-01")
              if step==3600:bridge_start=bridge_start.floor("h")
              bridge_end=pd.Timestamp("2025-01-01",tz="UTC")
              old=load("research-data-2024/"+oldlabel,["2024"],cols)
              bridge=old.loc[(old.index>=bridge_start)&(old.index<bridge_end)&(~old.index.isin(z.index))]
              z=pd.concat([z,bridge,load(newfolder,["2025","2026"],cols)]).sort_index()
              assert not z.index.has_duplicates,label
              start=ist("2024-02-01") if step==60 else ist("2024-02-01").ceil("h")
              end=ist("2026-11-01")
              expected=pd.date_range(start,end-pd.Timedelta(seconds=1),freq="min" if step==60 else "h")
              actual=z.loc[(z.index>=start)&(z.index<end)].index
              assert actual.equals(expected),(label,len(actual),len(expected),str(expected.difference(actual)[:10]))
              print("VERIFIED_SERIES",label,len(actual),"missing",len(expected.difference(actual)),flush=True)
              return z
          cols=["open","high","low","close","volume"]
          m=recovered("trade_1m","1m",root/"1m",cols,60)
          mark=recovered("mark_1m","mark_1m",root/"institutional/history/mark_1m",["open","low","high"],60)
          fund=recovered("funding_1h","funding_1h",root/"institutional/history/funding_1h",["close"],3600).close
          assert (m.low<=m[["open","close"]].min(axis=1)).all() and (m.high>=m[["open","close"]].max(axis=1)).all()
          print("VERIFIED_ARCHIVE",json.dumps(dict(commit="bb9998f72c12673c2104e6e04ffcbffae66205f9",months=months,synthetic_rows=0,calendar="Asia/Kolkata")),flush=True)
          # Separate each contiguous segment. Seven days of indicator warmup, never bridge data gaps.
          segments={}
          variants=[("first_breakout",0.),("eligible_breakout",0.),("eligible_open",0.)]
          all_variants=list(dict.fromkeys(variants+[(v[0],v[1]*k) for v in variants if v[1]>0 for k in [.8,1.2]]))
          by_entry={v:{} for v in all_variants}
          def entry_events(q,h,variant):
              mode,buffer=variant
              if variant==variants[0]:return e.entry_candidates(q,h,"reclaim")
              events=e.setups(h,"reclaim")
              op=q.open.to_numpy(float);hi=q.high.to_numpy(float);lo=q.low.to_numpy(float)
              used=set();out=[]
              for hour,ev in sorted(events.items()):
                  if hour>=len(h) or (mode.startswith("first") and ev["cycle"] in used):continue
                  side=ev["side"];j0=hour*60;trigger=ev["trigger"]+side*buffer*float(h.atr.iloc[hour-1])
                  if mode.endswith("open"):
                      j=j0;mid=op[j]
                  else:
                      hits=np.flatnonzero(hi[j0:j0+60]>=trigger if side==1 else lo[j0:j0+60]<=trigger)
                      if not len(hits):continue
                      j=j0+int(hits[0]);mid=max(op[j],trigger) if side==1 else min(op[j],trigger)
                  out.append(dict(entry_j=j,entry=mid+side*e.SLIP,side=side,cycle=ev["cycle"],signal=ev["signal"]))
                  used.add(ev["cycle"])
              return out
          feature_names=["volume_ratio","atr_pct","atr_expansion","ema_slope_pct","ema_gap_pct","supertrend_gap_pct","dir_rsi14","adx14","hourly_body_atr","hourly_range_atr","signal_hour_ist","signal_weekday_ist","supertrend_age_hours","side","h4ema20","h4ema50","ema50gap"]
          month_coverage={}
          raw_coverage={}
          coverage=[]
          for yr in [2024,2025,2026]:
              start=ist("2024-02-01") if yr==2024 else ist(str(yr)+"-01-01");end=ist(str(yr+1)+"-01-01")
              if yr==2026:end=ist("2026-11-01")
              raw=m.loc[(m.index>=max(ist("2024-02-01"),start-pd.Timedelta(days=7)))&(m.index<end)]
              score_index=raw.index[(raw.index>=start)&(raw.index<end)]
              assert score_index.equals(pd.date_range(start,end-pd.Timedelta(minutes=1),freq="min")),yr
              raw_coverage[yr]=np.bincount(score_index.tz_convert(IST).month-1,minlength=12)
              grp=raw.index.to_series().diff().ne(pd.Timedelta(minutes=1)).cumsum()
              segments[yr]=[]; used=0; month_coverage[yr]=np.zeros(12,dtype=int)
              for v in all_variants:by_entry[v][yr]=[]
              for _,q in raw.groupby(grp):
                  a=q.index.min().ceil("h");b=(q.index.max()+pd.Timedelta(minutes=1)).floor("h")
                  q=q.loc[(q.index>=a)&(q.index<b)]
                  if len(q)<8*24*60:continue
                  eligible=max(start,q.index.min()+pd.Timedelta(days=7))
                  if eligible>=q.index.max():continue
                  assert q.close.resample("1h").count().eq(60).all()
                  h=e.features(q.resample("1h").agg(dict(open="first",high="max",low="min",close="last",volume="sum")))
                  h=indicator_features(h)
                  # Higher-timeframe features only from bars completed at the signal close.
                  h4=q.resample("4h").agg(dict(open="first",high="max",low="min",close="last",volume="sum"))
                  h4=h4.loc[q.close.resample("4h").count().eq(240)]
