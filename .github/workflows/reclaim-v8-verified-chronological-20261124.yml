              expected=np.array([pd.Period(f"{yr}-{i:02d}").days_in_month*1440 for i in range(1,n+1)])
              complete[yr]=raw_coverage[yr][:n]==expected
              assert int(complete[yr].sum())==(11 if yr==2024 else n)
          def summarize(rows,yr):
              s=stats(rows,yr)
              mon=np.array([x["monthly"] for x in rows]);b=mon[[x["slip"]==5 for x in rows]];ok=complete[yr]
              s.update(complete_months=int(ok.sum()),complete_base_months=int(((b.min(axis=0)>0)&ok).sum()),complete_stress_months=int(((mon.min(axis=0)>0)&ok).sum()),base_min_trades=min(x["trades"] for x in rows if x["slip"]==5),base_dd=max(x["dd"] for x in rows if x["slip"]==5),worst_month=float(mon[:,ok].min()))
              return s
          # Select once on 2024; do not rank any challenger using 2025 or 2026.
          # Eight coarse, symmetric, zero-rule candidates, plus original benchmark.
          configs=[base]+[(v,s,t,True) for v in variants[:2] for s in [1.,2.] for t in [1.5,2.]]
          memo={}
          def assess(yr,cfg):
              key=(yr,cfg)
              if key not in memo:
                  rows=[evaluate(yr,ids,sc,cfg) for sc in scenarios]
                  memo[key]=(summarize(rows,yr),rows)
              return memo[key][0]
          def safe(s,yr):
              return s["min_trades"]>=20 and s["base_min_trades"]>=.7*(52 if yr==2024 else 38) and max(s["risk"],s["missing"],s["boundary"])==0
          def train_score(s):
              return (safe(s,2024),s["stress"]>0,sum(x>0 for x in s["halfyear"]),s["complete_stress_months"],s["complete_base_months"],min(s["halfyear"]),s["stress"],-s["dd"])
          base24=assess(2024,base)
          train=[dict(config=cfg,summary=assess(2024,cfg)) for cfg in configs[1:]]
          chosen=max(train,key=lambda r:train_score(r["summary"]))
          cfg=chosen["config"]
          s24=chosen["summary"]
          # Sensitivity checks use ONLY 2024; no re-selection after seeing 2025.
          v,s,t,g=cfg
          neighbors=[(v,s*k,t,g) for k in [.8,1.2]]+[(v,s,t*k,g) for k in [.8,1.2]]
          near=[assess(2024,x) for x in neighbors]
          stability=all(safe(x,2024) and x["stress"]>0 and min(x["halfyear"])>0 and x["complete_base_months"]>=base24["complete_base_months"] and x["complete_stress_months"]>=base24["complete_stress_months"] for x in near)
          frozen=dict(config=cfg,selection_period="2024-02 through 2024-12",confirm_period="2025-01 through 2025-12",final_validation_period="2026-01 through 2026-10",adaptive_rules=0,initial_wallet_usd=100,quantity_btc=.001,entry_mode=v[0],atr_stop=s,reward_risk=t,h4_ema20=True,neighbor_stability=stability,previously_examined_periods=True)
          (out/"frozen_2024.json").write_text(json.dumps(frozen,indent=2))
          print("CHRONO_OPT_FROZEN",json.dumps(dict(candidate=frozen,training=s24,baseline=base24,training_rank=train,neighbors=near)),flush=True)
          # Exactly one selected challenger is scored on 2025, never the other candidates.
          s25=assess(2025,cfg);base25=assess(2025,base)
          pass24=safe(s24,2024) and s24["stress"]>0 and min(s24["halfyear"])>0 and stability
          pass25=safe(s25,2025) and s25["stress"]>0 and min(s25["halfyear"])>0 and s25["complete_base_months"]>=base25["complete_base_months"] and s25["complete_stress_months"]>=base25["complete_stress_months"]
          improved=s24["complete_base_months"]>=base24["complete_base_months"] and s24["complete_base_months"]+s25["complete_base_months"]>base24["complete_base_months"]+base25["complete_base_months"]
          accepted=bool(pass24 and pass25 and improved)
          candidate=dict(frozen,training_pass=bool(pass24),confirmation_pass=bool(pass25),monthly_improvement=bool(improved),deployment_approved=False,research_incumbent_unchanged=not accepted)
          (out/"candidate.json").write_text(json.dumps(candidate,indent=2))
          print("CHRONO_OPT_CONFIRM",json.dumps(dict(candidate=candidate,challenger=s25,baseline=base25,accepted=accepted)),flush=True)
          reports=[]
          for label,conf,years in [("baseline",base,[2024,2025,2026]),("frozen_challenger",cfg,[2024,2025,2026] if accepted else [2024,2025])]:
