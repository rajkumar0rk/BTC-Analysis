                          endj=min((k//60+int(f[0])+1)*60,len(q)) if len(f) else len(q)
                          j.append(k);s.append(sd);mid.append(float(v["entry"])-sd*e.SLIP);ends.append(endj);cycles.append(v["cycle"])
                          row=h.loc[pd.Timestamp(v["signal"])]
                          features.append([float(row[x]) for x in feature_names])
                      by_entry[variant][yr].append((*(q[k].to_numpy(float) for k in ["open","high","low","close"]),np.array(j,np.int64),np.array(s,np.int64),np.array(mid,float),np.array(ends,np.int64),month,prefix(np.where(missing,0.,np.maximum(flow,0.))),prefix(np.where(missing,0.,np.maximum(-flow,0.))),prefix(missing),mk.low.to_numpy(float),mk.high.to_numpy(float),np.array(cycles,np.int64),np.asarray(features,float).reshape(-1,len(feature_names))))
              print("COVERAGE",yr,used,int((end-start).total_seconds()/60),"raw_months",raw_coverage[yr].tolist(),"usable_months",month_coverage[yr].tolist(),flush=True)
          segments=by_entry[variants[0]]
          (out/"coverage.json").write_text(json.dumps(coverage,indent=2))
          @njit
          def replay(o,h,l,c,j,sd,mid,end,sl,tp,path,slip,ladder,protect):
              entry=mid+sd*slip;stop=entry*(1-sd*sl/100);target=entry*(1+sd*tp/100)
              lo=entry;hi=entry
              protect_trigger=entry*(1+sd*protect/100);protect_stop=entry*(1+sd*.2/100)
              for k in range(j,end):
                  nodes=(o[k],h[k],l[k],c[k]) if path==0 else (o[k],l[k],h[k],c[k])
                  active=k!=j or sd*(nodes[0]-mid)>=0
                  if active:
                      lo=min(lo,nodes[0]);hi=max(hi,nodes[0])
                      if sd*(nodes[0]-stop)<0:return k,nodes[0]-sd*slip,lo,hi,0
                      if tp>0 and sd*(nodes[0]-target)>=0:return k,nodes[0]-sd*slip,lo,hi,0
                      if protect>0 and sd*(nodes[0]-protect_trigger)>=0 and sd*(protect_stop-stop)>0:stop=protect_stop
                  for z in range(3):
                      a,b=nodes[z],nodes[z+1]
                      if not active:
                          if sd*(b-a)<=0 or sd*(b-mid)<0:continue
                          a=mid;active=True
                      lo=min(lo,a);hi=max(hi,a)
                      if sd*(b-a)>0:
                          if tp>0 and sd*(a-target)<=0 and sd*(b-target)>=0:
                              lo=min(lo,target);hi=max(hi,target)
                              return k,target-sd*slip,lo,hi,0
                          for rung in ladder:
                              v=entry*(1+sd*rung/100)
                              if sd*(a-v)<0 and sd*(b-v)>=0 and sd*(v-stop)>0:stop=v
                          if protect>0 and sd*(b-protect_trigger)>=0 and sd*(protect_stop-stop)>0:stop=protect_stop
                      elif sd*(b-stop)<=0:
                          x=a if sd*(a-stop)<0 else stop
                          lo=min(lo,x);hi=max(hi,x)
