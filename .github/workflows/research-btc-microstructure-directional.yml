name: Test causal BTC OI mark and funding direction improvements
on:
  push:
    branches: [research/btc-microstructure-directional-20261121]
    paths:
      - scripts/research_btc_microstructure_directional_20261121.py
      - analysis/btc_microstructure_directional_20261121/NOVELTY_CHECK.md
      - .github/workflows/research-btc-microstructure-directional.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-microstructure-directional-20261121
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluation dependencies
        run: python -m pip install numpy pandas scikit-learn tabulate
      - name: Validate historical OI mark funding hourly availability and forecast
        run: python scripts/research_btc_microstructure_directional_20261121.py
      - name: Preserve historical prediction and trade evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-microstructure-directional-20261121
          path: analysis/btc_microstructure_directional_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Save results only in research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_microstructure_directional_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: record OI mark funding directional model diagnostics"
            git push origin HEAD:research/btc-microstructure-directional-20261121
          fi
