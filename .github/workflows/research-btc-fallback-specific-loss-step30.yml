name: BTCUSD Step30 - January 2025 Fallback Specific Loss-Memory Recovery
on:
  push:
    branches:
      - research/btc-fallback-drawdown-regime-step30
    paths:
      - scripts/research_btc_fallback_specific_loss_step30.py
      - .github/workflows/research-btc-fallback-specific-loss-step30.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and research dependencies
        run: python -m pip install numpy pandas numba scikit-learn tabulate
      - name: Check syntax before execution
        run: python -m py_compile scripts/research_btc_fallback_specific_loss_step30.py
      - name: Run 1200 prior fallback memory models and all 477 BTC trading days
        run: python scripts/research_btc_fallback_specific_loss_step30.py
      - name: Archive full Jan2025 and 22-month normal/Scalper fee comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step30-fallback-loss-memory-477-weekdays
          path: analysis/btc_fallback_specific_loss_step30/
          if-no-files-found: warn
