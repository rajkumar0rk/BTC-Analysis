name: Audit Demo testnet signals against production Nov 20 IST
on:
  push:
    branches:
      - research/compare-demo-testnet-signals-20261120
    paths:
      - scripts/audit_demo_testnet_signals_20261120.py
      - .github/workflows/audit-demo-testnet-signals-20261120.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.2.3
      - run: python scripts/audit_demo_testnet_signals_20261120.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-demo-vs-production-signals-nov20-ist
          path: analysis/demo_testnet_signal_audit_20261120/
      - name: Commit signal audit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/demo_testnet_signal_audit_20261120/
          git commit -m "audit: Demo testnet vs production 15m and 1h signals Nov20"
          git push origin HEAD:research/compare-demo-testnet-signals-20261120
