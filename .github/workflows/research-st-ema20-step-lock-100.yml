name: BTC EMA20 Supertrend 100 point stepped profit lock
on:
  push:
    branches:
      - research/st-ema20-100pt-step-lock-20261122
    paths:
      - scripts/backtest_supertrend_ema20_100pt_step_lock.py
      - .github/workflows/research-st-ema20-step-lock-100.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-step-lock-100
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install pandas numpy
      - name: Validate source
        run: python -m py_compile scripts/backtest_supertrend_ema20_100pt_step_lock.py
      - name: Run BTCUSD 1 minute stepped profit protection 18 scenario replay
        run: python scripts/backtest_supertrend_ema20_100pt_step_lock.py
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-ema20-100pt-stepped-profit-lock
          path: analysis/st_ema20_step_lock_100_1h/
          if-no-files-found: warn
      - name: Commit completed backtest reports to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_step_lock_100_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: save 100pt stepped profit lock findings"
            git pull --rebase origin research/st-ema20-100pt-step-lock-20261122
            git push origin HEAD:research/st-ema20-100pt-step-lock-20261122
          fi
