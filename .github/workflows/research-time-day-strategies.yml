name: BTCUSD time and weekday strategy discovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/research_time_day_strategies.py'
      - '.github/workflows/research-time-day-strategies.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-time-day-research
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Scan time and weekday trading rules
        run: python scripts/research_time_day_strategies.py
      - name: Commit research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/time_day_strategy_research
          if ! git diff --cached --quiet; then
            git commit -m "research: evaluate time and weekday BTCUSD strategies"
            git push
          fi
