name: Research 15m EMA20 reclaim drawdown without sacrificing return
on:
  push:
    branches:
      - research/ema20-reclaim-dd-20261123
    paths:
      - scripts/research_ema20_reclaim_dd_20261123.py
      - .github/workflows/research-ema20-reclaim-dd.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Reconstruct baseline and search drawdown controls
        run: python scripts/research_ema20_reclaim_dd_20261123.py
      - name: Publish independent research evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ema20-reclaim-dd-22months
          path: analysis/ema20_reclaim_dd_20261123/
          retention-days: 30
      - name: Save compact report into research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_reclaim_dd_20261123/RESEARCH_REPORT.md analysis/ema20_reclaim_dd_20261123/qualified_lower_dd_same_profit.csv analysis/ema20_reclaim_dd_20261123/best_return_candidates.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: report tested 15m reclaim drawdown variants"
            git push origin HEAD:research/ema20-reclaim-dd-20261123
          fi
