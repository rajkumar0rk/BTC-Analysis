name: BTCUSD Step11 — online structural fallback, all 477 weekdays
on:
  push:
    branches:
      - research/btc-daily-online-structure-ensemble-step11
    paths:
      - scripts/research_btc_daily_online_structure_step11.py
      - .github/workflows/research-btc-daily-online-structure-step11.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Run 36 causal shadow-learning fallback policies with exactly 477 entries
        run: python scripts/research_btc_daily_online_structure_step11.py
      - name: Archive 2025-selected full daily, monthly and comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step11-online-structure-477-weekdays
          path: analysis/btc_daily_online_structure_step11/
          if-no-files-found: warn
