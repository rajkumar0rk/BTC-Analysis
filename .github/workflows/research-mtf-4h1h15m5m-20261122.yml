name: MTF 4H Trend 1H Confirmation 15M Pullback 5M Entry Backtest
on:
  push:
    branches:
      - research/mtf-4h1h15m5m-20261122
    paths:
      - scripts/research_mtf_4h1h15m5m_20261122.py
      - .github/workflows/research-mtf-4h1h15m5m-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixed-mtf-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install pandas numpy
      - name: Compile strategy backtester
        run: python -m py_compile scripts/research_mtf_4h1h15m5m_20261122.py
      - name: Run BTC and ETH exact fixed-parameter studies
        run: python scripts/research_mtf_4h1h15m5m_20261122.py --assets BTCUSD ETHUSD
      - name: Upload complete trade ledgers and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtf-4h1h15m5m-btc-eth-22months
          path: analysis/mtf_4h1h15m5m_20261122/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist summary and monthly results on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/mtf_4h1h15m5m_20261122/summary.csv
          git add analysis/mtf_4h1h15m5m_20261122/monthly_UTC.csv
          git add analysis/mtf_4h1h15m5m_20261122/quality_and_results.json
          if ! git diff --cached --quiet; then
            git commit -m "research: persist BTC ETH MTF backtest results"
            git push origin HEAD:research/mtf-4h1h15m5m-20261122
          fi
