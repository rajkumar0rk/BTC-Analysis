name: BTCUSD 1H Supertrend EMA20 touch-reclaim 1m replay
on:
  push:
    branches:
      - research/ema20-supertrend-1h-touch-reclaim-1m-20261122
    paths:
      - scripts/backtest_supertrend_ema20_1h.py
      - .github/workflows/research-st-ema20-touch-reclaim-1m.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-touch-reclaim-1m
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Validate Python syntax
        run: python -m py_compile scripts/backtest_supertrend_ema20_1h.py
      - name: Replay 1H signals using BTCUSD minute archives
        run: python scripts/backtest_supertrend_ema20_1h.py
      - name: Upload full trade/monthly/quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema20-supertrend-1h-touch-reclaim-1m
          path: analysis/ema20_supertrend_1h_touch_reclaim_1m/
          if-no-files-found: warn
      - name: Commit results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_supertrend_1h_touch_reclaim_1m/
          if ! git diff --cached --quiet; then
            git commit -m "research: save BTC 1H EMA20 touch/reclaim 1m replay results"
            git pull --rebase origin research/ema20-supertrend-1h-touch-reclaim-1m-20261122
            git push origin HEAD:research/ema20-supertrend-1h-touch-reclaim-1m-20261122
          fi
