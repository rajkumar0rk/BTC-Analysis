name: Stage18 BTCUSD 70-30 Portfolio Research Implementation
on:
  push:
    branches:
      - research/stage18-70-30-portfolio-implementation-20261121-v1
    paths:
      - scripts/research_stage18_70_30_portfolio_20261121.py
      - tests/test_stage18_70_30_portfolio_20261121.py
      - config/strategies/stage18_btc_70core_30donchian_research.json
      - .github/workflows/research-stage18-70-30-portfolio-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-stage18-70-30:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Validate implementation does not allow live orders
        run: |
          python -m py_compile scripts/research_stage18_70_30_portfolio_20261121.py
          PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_stage18_70_30_portfolio_20261121.py' -v
      - name: Download original confirmed pre-entry Stage14 candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stage14-events"
          gh run download 44118024590 -n btc-stage14-monthly-regime-trades -D "$RUNNER_TEMP/stage14-events" --repo "$GITHUB_REPOSITORY"
          test -s "$RUNNER_TEMP/stage14-events/event_states.csv.gz"
      - name: Reproduce 70/30 and original 75/25 from BTC native 1m signals and stops
        env:
          STAGE14_EVENTS: ${{ runner.temp }}/stage14-events/event_states.csv.gz
        run: |
          PYTHONPATH=scripts python scripts/research_stage18_70_30_portfolio_20261121.py
      - name: Publish auditable CSV and 1m trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-btc-70core-30donchian-portfolio-implementation
          path: analysis/stage18_btc_70core_30donchian_implementation/
          if-no-files-found: warn
          retention-days: 30
