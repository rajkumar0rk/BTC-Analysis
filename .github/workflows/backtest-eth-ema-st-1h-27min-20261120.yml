name: Backtest ETHUSD 1h EMA20 Supertrend screenshot settings
on:
  push:
    branches: [research/eth-ema-st-1h-27min-20261120]
    paths:
      - scripts/backtest_eth_ema_st_1h_27min_20261120.py
      - .github/workflows/backtest-eth-ema-st-1h-27min-20261120.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eth-ema-st-1h-27min-20261120
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backtest dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Syntax check
        run: python -m py_compile scripts/backtest_eth_ema_st_1h_27min_20261120.py
      - name: SHA256-verify ETHUSD 1m data and run 22-month replay
        run: python scripts/backtest_eth_ema_st_1h_27min_20261120.py
      - name: Summarize ETH backtest
        if: success()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('analysis/eth_tv_ema_st_1h_27min_20261120/summary.json').read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## ETHUSD EMA20/ST 1h, 27-minute Scalper Offer (modeled)\n\n")
              f.write("| Trailing setup | Fee model | Trades | Net USD per 0.01 ETH lot | PF | Profitable months |\n|---|---|---:|---:|---:|---:|\n")
              for mode,name in [("fixed_100_50","Fixed 100/50 ETH points"),("eth_scaled_trailing","Price-percentage scaled")]:
                  for fee,stats in d[mode]["scenarios"].items():
                      f.write(f"| {name} | {fee} | {stats['trades']} | {stats['net_profit_usd']:+.4f} | {stats['profit_factor']} | {stats['profitable_months']}/22 |\n")
              f.write("\n**Research only.** Fees/GST modeled. 27-minute actual eligibility not verified; timing inside 1-hour OHLC unknown. No funding, spread or margin liquidations.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eth-ema-st-1h-27min-backtest
          path: |
            analysis/eth_tv_ema_st_1h_27min_20261120/*.csv
            analysis/eth_tv_ema_st_1h_27min_20261120/*.csv.gz
            analysis/eth_tv_ema_st_1h_27min_20261120/*.json
            analysis/eth_tv_ema_st_1h_27min_20261120/*.md
          if-no-files-found: error
      - name: Commit ETH research to independent branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/eth_tv_ema_st_1h_27min_20261120/
          if ! git diff --cached --quiet; then
            git commit -m "research: save ETHUSD 22-month EMA20 ST 1h replay"
            git push origin HEAD:research/eth-ema-st-1h-27min-20261120
          fi
