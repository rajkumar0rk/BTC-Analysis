name: BTCUSD 15m core-only comparison 2024 and 2025-2026
on:
  push:
    branches: [research/btc15m-clean-core-2024-2026-20261124]
    paths:
      - scripts/research_btc15m_clean_core_2024_2026.py
      - .github/workflows/research-btc15m-clean-core-2024-2026.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: x180-2024-data-*
          path: _validation_data
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45374768673
      - run: python scripts/research_btc15m_clean_core_2024_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc15m-clean-core-results
          path: analysis/btc15m_clean_core_2024_2026/
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_clean_core_2024_2026/
          if ! git diff --cached --quiet; then
            git commit -m "research: report core-only replay"
            git push origin HEAD:research/btc15m-clean-core-2024-2026-20261124
          fi
