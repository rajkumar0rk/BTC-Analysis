name: EMA9/21 1m BTCUSD higher-timeframe regime audit
on:
  push:
    branches:
      - research/ema9-21-daily-1m
    paths:
      - scripts/research_ema9_21_htf_regime.py
      - .github/workflows/research-ema9-21-htf-regime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Replay 12 pre-registered hourly regime variants
        run: python scripts/research_ema9_21_htf_regime.py
      - name: Archive trial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema9-21-daily-htf-regime
          path: analysis/ema9_21_htf_regime/
          if-no-files-found: warn
