name: Independent BTC ETH spectral phase 22-month audit
on:
  push:
    branches: [research/independent-spectral-phase-20261119-v1]
    paths:
      - scripts/independent_spectral_phase_20261119_v1.py
      - .github/workflows/independent-spectral-phase-20261119-v1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-spectral-phase-20261119-v1
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-spectral-phase-20261119-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Verify original BTC+ETH 1m partition SHA256 and replay spectral signals
        run: python scripts/independent_spectral_phase_20261119_v1.py
      - name: Archive full BTC+ETH ledgers and 22-month audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-eth-spectral-phase-audit
          path: analysis/independent_spectral_phase_20261119_v1/
          retention-days: 60
          if-no-files-found: warn
      - name: Commit results ONLY to this isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_spectral_phase_20261119_v1/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive FFT phase BTC ETH native 1m 22-month ledgers"
            git fetch origin research/independent-spectral-phase-20261119-v1
            git rebase origin/research/independent-spectral-phase-20261119-v1
            git push origin HEAD:research/independent-spectral-phase-20261119-v1
          fi
