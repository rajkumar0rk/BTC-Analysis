name: Backtest BTC 1H EMA20 ST fixed TP 200 500 1000
on:
  push:
    branches:
      - research/st-ema20-fixed-tp-200-500-1000-20261122
    paths:
      - scripts/backtest_supertrend_ema20_fixed_tp_1h.py
      - .github/workflows/research-st-ema20-tp-200-500-1000-1h.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-fixed-tp-sweep-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas and numpy
        run: python -m pip install pandas numpy
      - name: Validate syntax
        run: python -m py_compile scripts/backtest_supertrend_ema20_fixed_tp_1h.py
      - name: Replay 9 fixed-target BTCUSD strategies on real 1m archive
        run: python scripts/backtest_supertrend_ema20_fixed_tp_1h.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema20-fixed-tp-200-500-1000-1h-results
          path: analysis/ema20_st_fixed_tp_sweep_1h/
          if-no-files-found: warn
      - name: Commit results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_st_fixed_tp_sweep_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: results for EMA20 fixed 200 500 1000 point targets"
            git pull --rebase origin research/st-ema20-fixed-tp-200-500-1000-20261122
            git push origin HEAD:research/st-ema20-fixed-tp-200-500-1000-20261122
          fi
