name: BTCUSD simple strategy train 2024-25 validate 2026
on:
  push:
    branches: [research/btc15m-simple-train-2024-2025-validate-2026]
    paths:
      - scripts/research_btc15m_simple_train_validate.py
      - .github/workflows/research-btc15m-simple-train-validate.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: x180-2024-data-*
          path: _validation_data
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45374768673
      - run: python scripts/research_btc15m_simple_train_validate.py train
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-training-selection
          path: analysis/btc15m_simple_train_2024_2025/
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_simple_train_2024_2025/
          if ! git diff --cached --quiet; then
            git commit -m "research: freeze training-only selection before 2026 replay"
            git push origin HEAD:research/btc15m-simple-train-2024-2025-validate-2026
          fi
  validate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: x180-2024-data-*
          path: _validation_data
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45374768673
      - uses: actions/download-artifact@v4
        with:
          name: frozen-training-selection
          path: analysis/btc15m_simple_train_2024_2025/
      - run: python scripts/research_btc15m_simple_train_validate.py validate
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-validation-results
          path: analysis/btc15m_simple_train_2024_2025/
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_simple_train_2024_2025/
          git commit -m "research: report frozen 2026 validation"
          git pull --rebase origin research/btc15m-simple-train-2024-2025-validate-2026
          git push origin HEAD:research/btc15m-simple-train-2024-2025-validate-2026
