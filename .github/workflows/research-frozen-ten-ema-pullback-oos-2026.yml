name: BTC frozen ten EMA pullback validation 2026
on:
  push:
    branches: ['research/frozen-ten-ema-pullback-oos-2026-jan-oct']
    paths:
      - 'scripts/research_frozen_ten_ema_pullback_oos_2026.py'
      - '.github/workflows/research-frozen-ten-ema-pullback-oos-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_frozen_ten_ema_pullback_oos_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: ema-pullback-profit-protection-results
          path: scratch/frozen_ten_ema_pullback_oos_2026/
          if-no-files-found: error
