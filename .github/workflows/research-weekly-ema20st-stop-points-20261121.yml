name: Current IST week BTC/ETH EMA ST trailing stops replay
on:
  push:
    branches:
      - research/weekly-ema20st-trailing-stops-nov16-21-2026
    paths:
      - scripts/week_nov16_2026_ema20st_stop_points.py
      - .github/workflows/research-weekly-ema20st-stop-points-20261121.yml

permissions:
  contents: write

jobs:
  weekly-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research libraries
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 numba==0.61.2
      - name: Validate current-week replay code
        run: python -m py_compile scripts/week_nov16_2026_ema20st_stop_points.py
      - name: Fetch missing public market minutes and backtest current IST week
        run: python scripts/week_nov16_2026_ema20st_stop_points.py
      - name: Upload weekly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-week-BTC-ETH-point-stops-20261116
          path: analysis/weekly_nov16_21_2026_stop_points/
          if-no-files-found: warn
      - name: Save weekly result only on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/weekly_nov16_21_2026_stop_points/
          if ! git diff --cached --quiet; then
            git commit -m "research: current IST week BTC ETH 1m trailing stop reports"
            git push origin HEAD:research/weekly-ema20st-trailing-stops-nov16-21-2026
          fi
