name: 1H EMA20 second touch TP-only without stop
on:
  push:
    branches: [research/ema20-second-touch-1h-no-sl-20261121]
    paths:
      - scripts/research_ema20_second_touch_1h_no_sl.py
      - .github/workflows/research-ema20-second-touch-1h-no-sl.yml
      - analysis/ema20_second_touch_1h_no_sl_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-second-touch-1h-no-sl
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas
      - name: Replay full BTC and ETH 1-minute history
        run: python scripts/research_ema20_second_touch_1h_no_sl.py
      - name: Upload trade ledger, month-end floating equity and summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ema20-1h-second-touch-tp-only-btc-eth
          path: analysis/ema20_second_touch_1h_no_sl_20261121/
          retention-days: 30
          if-no-files-found: error
      - name: Commit results to independent research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_1h_no_sl_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save BTC and ETH 1H no-SL floating PnL results"
            git push origin HEAD:research/ema20-second-touch-1h-no-sl-20261121
          fi
