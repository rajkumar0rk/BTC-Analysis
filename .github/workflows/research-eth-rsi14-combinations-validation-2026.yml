name: ETH RSI14 selected grid validation 2026
on:
  push:
    branches: ['research/eth-rsi14-combinations-validation-2026']
    paths:
      - 'scripts/research_eth_rsi14_combinations_validation.py'
      - '.github/workflows/research-eth-rsi14-combinations-validation-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_eth_rsi14_combinations_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-rsi14-combinations-validation-2026-full
          path: |
            scratch/eth_rsi14_combinations_validation/results.csv
            scratch/eth_rsi14_combinations_validation/all_results.json.gz
          if-no-files-found: error
