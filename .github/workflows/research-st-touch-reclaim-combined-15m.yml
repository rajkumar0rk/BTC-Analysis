name: Backtest BTCUSD ONLY 15M Touch vs Reclaim vs Combined
on:
  push:
    branches: [research/st-touch-reclaim-btc-only-15m-20261123]
    paths:
      - scripts/research_st_touch_reclaim_combined_15m_20261123.py
      - .github/workflows/research-st-touch-reclaim-combined-15m.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-only-touch-reclaim-combined-15m
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research packages
        run: python -m pip install numpy pandas tabulate
      - name: Replay 15M entries on 1M candles
        shell: bash
        run: |
          mkdir -p analysis/st_touch_reclaim_btc_only_15m_20261123
          set -o pipefail
          python -u scripts/research_st_touch_reclaim_combined_15m_20261123.py 2>&1 | tee analysis/st_touch_reclaim_btc_only_15m_20261123/execution.log
      - name: Upload report or failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusd-only-15m-touch-reclaim-combined-20261123
          path: analysis/st_touch_reclaim_btc_only_15m_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive only on research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_touch_reclaim_btc_only_15m_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 15m touch/reclaim/combined backtest"
            git push origin HEAD:research/st-touch-reclaim-btc-only-15m-20261123
          fi
