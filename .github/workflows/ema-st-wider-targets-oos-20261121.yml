name: EMA ST Wider 3R Fixed TP SL Fee Aware Audit
on:
  push:
    branches: [research/ema-st-wider-targets-oos-20261121]
    paths:
      - scripts/ema_st_wider_targets_oos_20261121.py
      - .github/workflows/ema-st-wider-targets-oos-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Replay wider 3R fixed targets and stops
        run: python scripts/ema_st_wider_targets_oos_20261121.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ema-st-wider-3R-btc-eth
          path: analysis/ema_st_wider_3r_targets_oos_20261121/
