name: BTC 1H ST EMA20 failed entry exit research
on:
  push:
    branches:
      - research/st-ema20-failed-entry-exits-20261122
    paths:
      - scripts/backtest_st_ema20_failed_entry_exits.py
      - .github/workflows/research-st-ema20-failed-entry-exits.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-failed-entry-exits-20261122
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas and numpy
        run: python -m pip install pandas numpy
      - name: Validate Python sources
        run: |
          python -m py_compile scripts/backtest_st_ema20_variable_profit_ladders.py
          python -m py_compile scripts/backtest_st_ema20_failed_entry_exits.py
      - name: Full 1m historical replay; assert exact baseline parity before alternatives
        run: python scripts/backtest_st_ema20_failed_entry_exits.py
      - name: Upload audit files and monthly comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-ema20-failed-entry-exits
          path: analysis/st_ema20_failed_entry_exits_1h/
          if-no-files-found: warn
      - name: Commit verified reports on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_failed_entry_exits_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: results of failed EMA20 entry stop and invalidation tests"
            git pull --rebase origin research/st-ema20-failed-entry-exits-20261122
            git push origin HEAD:research/st-ema20-failed-entry-exits-20261122
          fi
