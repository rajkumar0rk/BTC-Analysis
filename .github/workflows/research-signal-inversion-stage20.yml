name: Research BTC Stage20 causal signal inversion and monthly net target
on:
  push:
    branches: [main]
    paths:
      - scripts/research_signal_inversion_stage20.py
      - .github/workflows/research-signal-inversion-stage20.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage20-signal-inversion
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Run Stage20 after-cost reversal and confirmation study
        run: python scripts/research_signal_inversion_stage20.py
      - name: Preserve trade-by-trade evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage20-signal-inversion-trades
          path: analysis/institutional_discovery_stage20_inverse_direction/full_trade_ledger.csv.gz
          retention-days: 30
          if-no-files-found: error
      - name: Commit all monthly performance and quality reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage20_inverse_direction/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage20_inverse_direction/quality.json
          git add analysis/institutional_discovery_stage20_inverse_direction/account_models.csv
          git add analysis/institutional_discovery_stage20_inverse_direction/monthly_results.csv
          git add analysis/institutional_discovery_stage20_inverse_direction/signal_counts.csv
          git add analysis/institutional_discovery_stage20_inverse_direction/selected_monthly.csv
          git add analysis/institutional_discovery_stage20_inverse_direction/2025_ranked_standard.csv
          git add analysis/institutional_discovery_stage20_inverse_direction/2025_ranked_offer_hypothetical.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage20 causal inversion and monthly BTC net return tests"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
