name: BTC ETH full22 1H volume and volatility ATR profit filters
on:
  push:
    branches:
      - research/20261121-volume-volatility-1h-atr-exits
    paths:
      - scripts/volume_volatility_entry_filter_full22_20261121.py
      - .github/workflows/volume-volatility-22month-atr-exits.yml

permissions:
  contents: write

concurrency:
  group: research-1h-volume-atr-filter-20261121
  cancel-in-progress: false

jobs:
  filter-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned libraries
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 numba==0.61.2
      - name: Compile and validate baseline causality
        run: |
          python -m py_compile scripts/volume_volatility_entry_filter_full22_20261121.py
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from volume_volatility_entry_filter_full22_20261121 import unit_tests
          unit_tests()
          print("HOURLY_PROFIT_EXIT_UNIT_TESTS_PASS")
          PY
      - name: Run full 22-month BTC ETH volume and volatility grid
        run: python scripts/volume_volatility_entry_filter_full22_20261121.py
      - name: Upload full monthly grid and trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-volume-volatility-22month-entry-filters
          path: analysis/volume_volatility_atr_entry_full22_20261121/
          if-no-files-found: warn
      - name: Save research only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/volume_volatility_atr_entry_full22_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: full22 volume volatility filter monthly scores BTC ETH"
            git push origin HEAD:research/20261121-volume-volatility-1h-atr-exits
          fi
