name: 15m RSI adaptive profit lock activation and fraction sweep
on:
  push:
    branches: [research/mtf-color-replay-20261127]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated reference replay using project indicators and archive
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import csv,gzip,json,math,hashlib
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from decimal import Decimal as D
          from itertools import zip_longest
          from collections import defaultdict,deque
          from btc_analysis.contracts import Candle,Timeframe,Instrument,AssetClass
          from btc_analysis.indicators import IndicatorBook,spec
          from zoneinfo import ZoneInfo
          root=Path("data/delta_india/BTCUSD")
          manifest=json.loads((root/"1m/manifest.json").read_text())
          ins=Instrument("delta_india","BTCUSD",AssetClass.CRYPTO_PERPETUAL,"USD","USD",D("0.5"),D("1"),D("0.001"))
          m=Timeframe(900)
          params={"period":10,"multiplier":"3"}
          book=IndicatorBook((spec("supertrend.direction",m,**params),spec("ema.value",m,period=20),spec("supertrend.line",m,**params),spec("atr.value",m,period=14),spec("rsi.value",m,period=14)))
          ist=ZoneInfo("Asia/Kolkata")
          def rows(path):
              with gzip.open(path,"rt") as f:
                  for r in csv.DictReader(f):
                      yield int(r["time"]),tuple(float(r[k]) for k in ("open","high","low","close"))+(float(r["volume"] or 0),)
          def color(v):
              o,hi,lo,c=v[:4]
              return (o,lo,hi,c) if c>o or (c==o and o-lo<=hi-o) else (o,hi,lo,c)
          def crossing(a,b,level,side):
              if side*(a-level)>=0:return 0.
              if side*(b-level)<0:return None
              return (level-a)/(b-a)
          def dt(t):return datetime.fromtimestamp(t,timezone.utc)
          class State:
              def __init__(self,variant,activation=1.,fractions=(.25,.5,.75)):
                  self.variant=variant;self.activation=activation;self.fractions=fractions;self.risk=0.;self.mfe=0.;self.lock=None;self.armed=False
                  self.line=None;self.exit_pending=None;self.invalid_line=0;self.distances=[]
                  self.cash=100.;self.peak=100.;self.dd=0.;self.pos=None;self.pending=0;self.used=False
                  self.trades=[];self.month={};self.fees=0.;self.zero=0;self.points=0.;self.opens=0
              def sample(self,price):
                  eq=self.cash+(self.pos[0]*(price-self.pos[2])*self.pos[1] if self.pos else 0.)
                  self.peak=max(self.peak,eq);self.dd=max(self.dd,(self.peak-eq)/self.peak*100)
                  return eq
              def execute(self,t,v,mark,a,b,month):
                  if self.exit_pending:
                      reason=self.exit_pending;self.exit_pending=None
                      if self.pos:self.close(t,v[0],reason)
                  if self.pending:
                      side=self.pending;self.pending=0
                      entry=v[0];distance=side*(entry-self.line)
                      q=math.floor(self.cash/(entry*1.00059)/.001)*.001
                      if distance<=0:self.invalid_line+=1
                      elif q<=0:self.zero+=1
                      else:
                          fee=entry*q*.00059;self.cash-=fee;self.fees+=fee
                          self.pos=(side,q,entry,t,fee,entry+side*2*distance if self.variant=='FixedTP' else None)
                          self.risk=distance;self.mfe=0.;self.lock=None;self.armed=False
                          self.distances.append(distance);self.used=True;self.opens+=1
                  self.sample(b[0])
                  if self.pos:
                      side,q,entry,opened,entry_fee,target=self.pos
                      self.mfe=max(self.mfe,side*(b[0]-entry))
                      for j in range(3):
                          tp=crossing(a[j],a[j+1],target,side) if target is not None else None
                          sl=crossing(b[j],b[j+1],self.lock,-side) if self.lock is not None else None
                          if tp is None and sl is None:
                              self.sample(b[j+1]);self.mfe=max(self.mfe,side*(b[j+1]-entry));continue
                          if sl is not None and (tp is None or sl<=tp):
                              self.sample(b[j]+sl*(b[j+1]-b[j]))
                              self.close(t+60,a[j]+sl*(a[j+1]-a[j]),"lock");break
                          self.sample(b[j]+tp*(b[j+1]-b[j]))
                          self.close(t+60,target,"target");break
                  eq=self.sample(mark[3])
                  self.month[month]=eq
              def protect(self,rsi,close_price):
                  if not self.pos or self.variant=="FixedTP" or rsi is None or self.exit_pending:return
                  side,q,entry,opened,entry_fee,target=self.pos
                  strength=float(rsi) if side==1 else 100-float(rsi)
                  # Conservative profit eligibility includes both taker fees, irrespective of waiver.
                  net=side*(close_price-entry)*q-entry_fee-close_price*q*.00059
                  if self.variant=="RSI50Exit":
                      if strength<=50 and net>0:self.exit_pending="rsi"
                  elif self.variant=="RSI60to55":
                      if strength>=60:self.armed=True
                      if self.armed and strength<=55 and net>0:self.exit_pending="rsi"
                  elif self.variant.startswith("Lock"):
                      fee_be=(side*entry+entry_fee/q)/(side-.00059)
                      fee_points=side*(fee_be-entry)+.5
                      if self.mfe>=max(self.activation*self.risk,fee_points):
                          fraction=self.fractions[0] if strength>=60 else self.fractions[1] if strength>50 else self.fractions[2]
                          floor=entry+side*max(fee_points,fraction*self.mfe)
                          if self.lock is None or side*(floor-self.lock)>0:self.lock=floor
              def close(self,when,exit_price,reason):
                  side,q,entry,opened,entry_fee,target=self.pos
                  fee=0. if when-opened<=1800 else exit_price*q*.00059
                  gross=side*(exit_price-entry)*q
                  self.cash+=gross-fee;self.fees+=fee;self.points+=side*(exit_price-entry)
                  self.trades.append((gross-entry_fee-fee,reason));self.pos=None;self.sample(exit_price)
              def result(self):
                  final=list(self.month.values())[-1];prev=100.;monthly={}
                  for k,v in self.month.items():
                      monthly[k]=round(v-prev,8);prev=v
                  wins=sum(p>0 for p,_ in self.trades);g=sum(max(p,0) for p,_ in self.trades);loss=-sum(min(p,0) for p,_ in self.trades)
                  return dict(final_equity=final,net=final-100,trades=len(self.trades),entries=self.opens,wins=wins,win_rate=100*wins/len(self.trades) if self.trades else None,profit_factor=g/loss if loss else None,max_drawdown_pct=self.dd,fees_gst=self.fees,profitable_months=sum(x>0 for x in monthly.values()),monthly=monthly,zero_qty_signals=self.zero,closed_points=self.points,open_position=self.pos,stop_exits=sum(s=='flip' for _,s in self.trades),target_exits=sum(s=='target' for _,s in self.trades),rsi_exits=sum(s=='rsi' for _,s in self.trades),lock_exits=sum(s=='lock' for _,s in self.trades),protection_losses=sum(p<=0 and s in ('rsi','lock') for p,s in self.trades),invalid_line=self.invalid_line,mean_initial_distance=sum(self.distances)/len(self.distances) if self.distances else None)
          profiles={"Loose":(.10,.25,.50),"Original":(.25,.50,.75),"Tight":(.40,.60,.80),"VeryTight":(.50,.75,.90)}
          settings={"FixedTP":(1.,profiles["Original"])}
          settings.update({f"Lock {a:g}R {p}":(a,f) for a in (1.,1.5,2.,2.5,3.) for p,f in profiles.items()})
          variants=tuple(settings)
          states={f"{mode} {variant}":State(variant,*settings[variant]) for mode in ("Touch","Reclaim") for variant in variants}
          by_mode={mode:[(variant,states[f"{mode} {variant}"]) for variant in variants] for mode in ("Touch","Reclaim")}
          audit={"reclaim_flip_signals_blocked":0,"reclaim_touch_only_signals_blocked":0,"rsi_blocked_touch":0,"rsi_blocked_reclaim":0}
          volumes=deque(maxlen=20);atrs=deque(maxlen=20);filter_pass=False;filter_stats={"15m_ready":0,"volume_pass":0,"atr_pass":0,"both_pass":0}
          groups={900:[]};alignment=0;ema=None;prev_min=None;prev15=None;count=0;last=None;start=dt(1735689600);end=int(datetime(2026,11,1,tzinfo=ist).timestamp())
          def val(name,tf,p):
              v=book.get(name,tf,p)
              return v[-1] if v else None
          for p in manifest["partitions"]:
              if p["file"]>"2026-10.csv.gz":break
              trade=root/"1m"/p["file"];mark=root/"institutional/history/mark_1m"/p["file"]
              assert hashlib.sha256(trade.read_bytes()).hexdigest()==p["sha256_gzip"]
              for a,b in zip_longest(rows(trade),rows(mark)):
                  assert a is not None and b is not None and a[0]==b[0],(a,b)
                  t,v=a;_,mv=b
                  if t>=end:break
                  assert last is None or t==last+60
                  last=t;count+=1
                  month=dt(t).astimezone(ist).strftime("%Y-%m");a_path=color(v);b_path=color(mv)
                  for s in states.values():
                      if s.pending or s.pos:s.execute(t,v,mv,a_path,b_path,month)
                      else:s.month[month]=s.cash
                  old_side=alignment;old_ema=ema;completed15=None
                  for seconds,group in groups.items():
                      group.append(v)
                      if len(group)!=seconds//60:continue
                      o,hi,lo,c,vol=group[0][0],max(x[1] for x in group),min(x[2] for x in group),group[-1][3],sum(x[4] for x in group)
                      candle=Candle(ins,Timeframe(seconds),dt(t+60-seconds),dt(t+60),*(D(str(x)) for x in (o,hi,lo,c,vol)))
                      book.update(candle);group.clear()
                      if seconds==900:completed15=(o,hi,lo,c,vol)
                  if completed15:
                      volume=D(str(completed15[4]));atr=val("atr.value",m,{"period":14})
                      filter_pass=False
                      if len(volumes)==20 and len(atrs)==20 and atr is not None:
                          vp=volume>=D("1.5")*sum(volumes)/20
                          ap=atr>=sum(atrs)/20
                          filter_pass=vp and ap
                          filter_stats["15m_ready"]+=1;filter_stats["volume_pass"]+=int(vp);filter_stats["atr_pass"]+=int(ap);filter_stats["both_pass"]+=int(filter_pass)
                      volumes.append(volume)
                      if atr is not None:atrs.append(atr)
                  st15=val("supertrend.direction",m,params)
                  st_line=val("supertrend.line",m,params)
                  if completed15 and st15 in (-1,1):
                      for s in states.values():
                          if s.pos and int(st15)==-s.pos[0]:s.exit_pending='flip'
                  alignment=int(st15) if st15 in (-1,1) else 0
                  em=val("ema.value",m,{"period":20});ema=float(em) if em is not None else None
                  rsi=val("rsi.value",m,{"period":14});rsi_pass=rsi is not None and alignment*(rsi-D(50))>0
                  if completed15:
                      for s in states.values():s.protect(rsi,completed15[3])
                  if alignment!=old_side:
                      for s in states.values():s.used=False
                  if count>=6000 and alignment and dt(t+60).astimezone(ist).weekday()<5:
                      if alignment==old_side and old_ema is not None and prev_min is not None and alignment*(prev_min[3]-old_ema)>0 and alignment*(v[0]-old_ema)>=0 and v[2]<=old_ema<=v[1]:
                          for variant,s in by_mode["Touch"]:
                              if not (filter_pass and not s.pos and not s.used and st_line is not None):continue
                              if not rsi_pass:
                                  audit["rsi_blocked_touch"]+=1;continue
                              s.pending=alignment;s.line=float(st_line)
                      if completed15 and prev15 and old_ema is not None and alignment*(prev15[3]-old_ema)>0 and completed15[2]<=old_ema<=completed15[1] and alignment*(completed15[3]-old_ema)>0:
                          crossed=completed15[2]<old_ema if alignment==1 else completed15[1]>old_ema
                          for variant,s in by_mode["Reclaim"]:
                              if not (filter_pass and not s.pos and not s.used and st_line is not None):continue
                              if alignment!=old_side:
                                  audit["reclaim_flip_signals_blocked"]+=1;continue
                              if not crossed:
                                  audit["reclaim_touch_only_signals_blocked"]+=1;continue
                              assert alignment==old_side and crossed
                              if not rsi_pass:
                                  audit["rsi_blocked_reclaim"]+=1;continue
                              s.pending=alignment;s.line=float(st_line)
                  if completed15:prev15=completed15
                  prev_min=v
              print("Processed",p["file"],count,flush=True)
          assert last==end-60
          assert states["Touch FixedTP"].opens==237 and states["Reclaim FixedTP"].opens==178
          assert abs(states["Touch FixedTP"].result()["net"]+20.307398916258293)<1e-8
          assert abs(states["Reclaim FixedTP"].result()["net"]+10.5028769396652)<1e-8
          assert all(s.result()["target_exits"]==0 for s in states.values() if s.variant!="FixedTP")
          assert abs(states["Touch Lock 1R Original"].result()["net"]+20.00619295910211)<1e-8
          assert abs(states["Reclaim Lock 1R Original"].result()["net"]+6.79249422433675)<1e-8
          results={"range":"2025-01-01 UTC to 2026-11-01 00:00 IST exclusive; first 6000 minutes warmup","bars":count,"filter_stats":filter_stats,"entry_audit":audit,"settings":settings,"execution":"15m Supertrend only (no 1h condition); strict Reclaim requires previous and current ST directions equal, strict cross beyond frozen pre-signal EMA20 and close back; strict Touch no flip entry; all variants require latest completed 15m RSI14 >50 for buy and <50 for sell; one entry per 15m Supertrend cycle; Color paired trade and mark paths; 15m completed Supertrend flip exit at next 1m open; FixedTP control 2R; 20 adaptive lock settings per entry mode, no fixed TP, activation 1/1.5/2/2.5/3R mark MFE and fee breakeven; lock fractions by profile for directional RSI >=60/>50/<=50; updates only at completed 15m close, never loosens, mark trigger and interpolated trade fill; 1x, 100% target exposure, .001 BTC quantity step, entry cost reserve; taker fee both sides 0.05% + GST 18%, exit waiver <=30min, zero additional slippage, actual funding excluded; filtered entries use latest completed 15m volume >= 1.5x prior 20 mean and ATR14 >= prior 20 ATR14 mean","results":{k:s.result() for k,s in states.items()}}
          # Compact output permits all results to be retrieved without truncation.
          print("SWEEP_META "+json.dumps({k:v for k,v in results.items() if k!="results"}))
          for k,v in results["results"].items():
              print("SWEEP_ROW "+json.dumps({"name":k,**{x:y for x,y in v.items() if x!="monthly"},"flat_months":sum(x==0 for x in v["monthly"].values())},separators=(",",":"))) 
          for mode in ("Touch","Reclaim"):
              best=max((k for k in results["results"] if k.startswith(mode+" Lock")),key=lambda k:results["results"][k]["net"])
              print("BEST_MONTHLY "+json.dumps({"name":best,"monthly":results["results"][best]["monthly"]},separators=(",",":")))
          Path("mtf-color-results.json").write_text(json.dumps(results,indent=2))
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rsi-adaptive-lock-grid-results
          path: mtf-color-results.json
