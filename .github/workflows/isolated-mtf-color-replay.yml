          for name,state in states.items():
              trades=[]
              for t in state.ledger:
                  row=dict(t)
                  row["net_points"]=row.pop("net_usd")
                  row["trigger_utc"]=row["signal_context"]["signal_utc"]
                  trades.append(row)
              variants.append(dict(key=hashlib.sha256(name.encode()).hexdigest()[:24],name=name,parameters={"activation_r":state.activation,"first_activation_r":state.first_activation,"breakeven_activation":"intraminute_trade_price_fee_gst_plus_0.5_point","protection_trigger":"trade_price","protection_delay_candles":0,"protection_delay_minutes":0,"entry_mode":"same_supertrend_cycle_true_reclaim","year":2025,"minimum_signal_body_ratio_exclusive":0.1,"fractions":list(state.fractions),"variant":name},summary=state.result(),trades=trades,events=state.events))
          export_bundle("backtest-export/backtest.json",family="reclaim-color-progressive",symbol="BTCUSD",unit="account USD",start_utc=start.isoformat(),end_utc=dt(end).isoformat(),execution_timeframe_minutes=1,signal_timeframe_minutes=m.seconds//60,costs=results["execution"],variants=variants,recorder=recorder,data_provenance={"trade_manifest_sha256":hashlib.sha256((root/"1m/manifest.json").read_bytes()).hexdigest(),"input_bars":count,"execution":"1m Color paired trade and mark paths","range":results["range"]})
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reclaim-progressive-multi-results
          path: reclaim-progressive-multi/
      - uses: actions/upload-artifact@v4
        with:
          name: btc-analysis-backtest-v1
          path: backtest-export/backtest.json
          if-no-files-found: error

  request-publication:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch trusted main publisher for this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-backtest-data.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_run_id="$GITHUB_RUN_ID" -f source_attempt="$GITHUB_RUN_ATTEMPT"
