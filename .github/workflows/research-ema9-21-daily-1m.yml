name: Backtest BTCUSD EMA9/21 1m daily quality trade
on:
  push:
    branches:
      - research/ema9-21-daily-1m
    paths:
      - scripts/research_ema9_21_daily_quality_1m.py
      - .github/workflows/research-ema9-21-daily-1m.yml
      - analysis/ema9_21_daily_quality_1m/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Replay complete 2025 through October 2026 plus November exit tail
        run: python scripts/research_ema9_21_daily_quality_1m.py
      - name: Publish detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusd-ema9-21-daily-quality-1m
          path: analysis/ema9_21_daily_quality_1m/
          if-no-files-found: warn
