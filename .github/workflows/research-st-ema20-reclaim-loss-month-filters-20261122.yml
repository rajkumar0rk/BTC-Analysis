name: BTC EMA20 Reclaim losing months causal filter research
on:
  push:
    branches:
      - research/st-ema20-reclaim-loss-month-filters-20261122-v1
    paths:
      - scripts/research_st_ema20_reclaim_loss_months_20261122.py
      - .github/workflows/research-st-ema20-reclaim-loss-month-filters-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-ema20-reclaim-loss-month-causal-filters
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Validate syntax
        run: python -m py_compile scripts/research_st_ema20_reclaim_loss_months_20261122.py
      - name: Run all losing-month audit, causal filter grid and 2026 diagnostic
        run: python scripts/research_st_ema20_reclaim_loss_months_20261122.py
      - name: Upload auditable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-reclaim-loss-months-causal-grid
          path: analysis/st_ema20_reclaim_loss_months_20261122/
          if-no-files-found: warn
      - name: Commit verified research results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+rajkumar0rk@users.noreply.github.com"
          git add analysis/st_ema20_reclaim_loss_months_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: save Reclaim losing-month audit and causal-filter grid"
            git pull --rebase origin research/st-ema20-reclaim-loss-month-filters-20261122-v1
            git push origin HEAD:research/st-ema20-reclaim-loss-month-filters-20261122-v1
          fi
