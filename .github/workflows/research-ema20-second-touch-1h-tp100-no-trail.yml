name: BTC ETH 1H EMA20 second touch TP100 no trail one per Supertrend
on:
  push:
    branches: [research/ema20-second-touch-1h-tp100-no-trail-20261121]
    paths:
      - scripts/research_ema20_second_touch_1h_tp100_no_trail.py
      - .github/workflows/research-ema20-second-touch-1h-tp100-no-trail.yml
      - analysis/ema20_second_touch_1h_tp100_no_trail_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-1h-second-touch-tp100-no-trail
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas
      - name: Run 1H BTC and ETH fixed TP100 no-trail research
        shell: bash
        run: |
          mkdir -p analysis/ema20_second_touch_1h_tp100_no_trail_20261121/
          set -o pipefail
          python -u scripts/research_ema20_second_touch_1h_tp100_no_trail.py 2>&1 | tee analysis/ema20_second_touch_1h_tp100_no_trail_20261121/execution.log
      - name: Archive research outputs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-1h-second-touch-tp100-no-trail
          path: analysis/ema20_second_touch_1h_tp100_no_trail_20261121/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit reports to research branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_1h_tp100_no_trail_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save 1h fixed TP100 no-trail BTC ETH results"
            git push origin HEAD:research/ema20-second-touch-1h-tp100-no-trail-20261121
          fi
