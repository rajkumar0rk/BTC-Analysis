name: Diagnose BTCUSD direction separately from range prediction
on:
  push:
    branches: [research/btc-directional-predictor-diagnosis-20261121]
    paths:
      - scripts/research_btc_directional_diagnosis_20261121.py
      - analysis/btc_directional_diagnosis_20261121/NOVELTY_CHECK.md
      - .github/workflows/research-btc-directional-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-directional-diagnosis-20261121
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluation dependencies
        run: python -m pip install numpy pandas scikit-learn tabulate
      - name: Run causal monthly binary direction and move magnitude evaluation
        run: python scripts/research_btc_directional_diagnosis_20261121.py
      - name: Archive all outputs
        uses: actions/upload-artifact@v4
        with:
          name: btc-directional-diagnosis-20261121
          path: analysis/btc_directional_diagnosis_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Commit full evidence to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_directional_diagnosis_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: store BTC directional forecast diagnostic evidence"
            git push origin HEAD:research/btc-directional-predictor-diagnosis-20261121
          fi
