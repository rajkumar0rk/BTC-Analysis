name: BTC RSI14 reversal confirmation 2024-2025
on:
  push:
    branches: ['research/rsi14-reversal-confirmation-2024-2025']
    paths:
      - 'scripts/research_rsi14_reversal_confirmation_2024_2025.py'
      - '.github/workflows/research-rsi14-reversal-confirmation-2024-2025.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_rsi14_reversal_confirmation_2024_2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: rsi14-reversal-confirmation-full
          path: |
            scratch/rsi14_reversal_confirmation/all_results.csv
            scratch/rsi14_reversal_confirmation/all_ledgers.json.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: btc-analysis-backtest-v1
          path: scratch/rsi14_reversal_confirmation/backtest.json
          if-no-files-found: error
      - name: Request dashboard publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-backtest-data.yml --ref main -f source_run_id="$GITHUB_RUN_ID" -f source_attempt="$GITHUB_RUN_ATTEMPT"
