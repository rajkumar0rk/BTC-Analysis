name: BTC Supertrend 15m 12 RR combinations with profit protections
on:
  push:
    branches:
      - research/supertrend-15m-12-rr-20261122
    paths:
      - scripts/research_supertrend_15m_12_rr.py
      - .github/workflows/research-supertrend-15m-12-rr.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supertrend-15m-12-rr-replay
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backtest dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Reconcile stop ordering and backtest all 5040 variants
        run: python -u scripts/research_supertrend_15m_12_rr.py
      - name: Preserve reports and detailed trade ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrend-15m-12-rr-protection-5040
          path: analysis/supertrend_15m_12_rr_20261122/
          if-no-files-found: warn
      - name: Publish research results to dedicated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_15m_12_rr_20261122
          if ! git diff --cached --quiet; then
            git commit -m "research: store 12 RR × protection full-history results"
            git push origin HEAD:research/supertrend-15m-12-rr-20261122
          fi
