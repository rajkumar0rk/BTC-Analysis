name: Breakout Range Wavelet Daily Historical Replay
on:
  push:
    branches:
      - research/breakout-range-source-audit-20261121
    paths:
      - 'scripts/breakout_range_wavelet_daily_replay.py'
      - 'scripts/breakout_range_dual_thrust_causal_20261124.py'
      - '.github/workflows/breakout-range-wavelet-daily.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas PyWavelets
      - name: Replay source-pinned Wavelet-2B and TwoB on authentic BTC minute archive
        run: python scripts/breakout_range_wavelet_daily_replay.py
      - name: Replay causal NY Dual Thrust adaptation on authentic BTC minute archive
        run: python scripts/breakout_range_dual_thrust_causal_20261124.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakout-range-wavelet-and-dual-thrust-evidence
          path: |
            analysis/breakout_range_wavelet_daily/
            analysis/breakout_range_dual_thrust_causal_20261124/
