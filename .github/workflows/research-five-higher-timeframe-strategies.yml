name: BTC five higher timeframe strategy baselines
on:
  push:
    branches: ['research/five-higher-timeframe-strategies']
    paths:
      - 'scripts/research_five_higher_timeframe_strategies.py'
      - '.github/workflows/research-five-higher-timeframe-strategies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_five_higher_timeframe_strategies.py
      - uses: actions/upload-artifact@v4
        with:
          name: five-higher-timeframe-strategies-full
          path: |
            scratch/five_higher_timeframe_strategies/results.csv
            scratch/five_higher_timeframe_strategies/all_results.json.gz
          if-no-files-found: error
