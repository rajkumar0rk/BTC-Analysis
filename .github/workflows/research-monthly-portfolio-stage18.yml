name: Research BTC Stage18 monthly diversified portfolio
on:
  push:
    branches: [main]
    paths:
      - scripts/research_monthly_portfolio_stage18.py
      - .github/workflows/research-monthly-portfolio-stage18.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: btc-stage18-monthly-diversification
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis libraries
        run: python -m pip install numpy pandas tabulate
      - name: Download original Stage15 complete trades
        uses: actions/download-artifact@v4
        with:
          name: btc-stage15-july-protection-trade-ledger
          run-id: 44120459865
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: stage15_artifact
      - name: Analyze consistent monthly profits using independent strategy portfolios
        run: python scripts/research_monthly_portfolio_stage18.py --stage15-ledger stage15_artifact/variant_trade_ledger.csv.gz
      - name: Save month-level evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage18_monthly_dual_strategy/
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage18 monthly profitable portfolio study"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
