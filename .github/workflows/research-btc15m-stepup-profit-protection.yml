name: BTCUSD 15M Step-up Profit Protection Grid
on:
  push:
    branches: [research/btc15m-stepup-profit-protection-20261123]
    paths:
      - scripts/research_btc15m_stepup_profit_protection_20261123.py
      - .github/workflows/research-btc15m-stepup-profit-protection.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc15m-stepup-profit-protection
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research packages
        run: python -m pip install numpy pandas tabulate
      - name: Test BTCUSD 15M profit lock and step increment values
        shell: bash
        run: |
          mkdir -p analysis/btc15m_stepup_profit_protection_20261123
          set -o pipefail
          python -u scripts/research_btc15m_stepup_profit_protection_20261123.py 2>&1 | tee analysis/btc15m_stepup_profit_protection_20261123/execution.log
      - name: Upload results including error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-stepup-profit-protection-20261123
          path: analysis/btc15m_stepup_profit_protection_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive to research branch only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_stepup_profit_protection_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BTC15m step-up profit protection 22-month backtest"
            git push origin HEAD:research/btc15m-stepup-profit-protection-20261123
          fi
