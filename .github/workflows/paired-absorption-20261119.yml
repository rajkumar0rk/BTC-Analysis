name: Paired BTC ETH absorption research 20261119
on:
  push:
    branches:
      - research/paired-absorption-20261119
    paths:
      - research/paired_absorption_20261119/**
      - .github/workflows/paired-absorption-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Run native paired one-minute replay
        run: python research/paired_absorption_20261119/research.py
      - name: Preserve original ledgers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paired-absorption-20261119
          path: analysis/paired_absorption_20261119/
          retention-days: 90
          if-no-files-found: error
      - name: Commit research outputs to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/paired_absorption_20261119/
          if ! git diff --cached --quiet; then
            git commit -m "research: save paired absorption ledgers and 22-month metrics"
            git push origin HEAD:research/paired-absorption-20261119
          fi
