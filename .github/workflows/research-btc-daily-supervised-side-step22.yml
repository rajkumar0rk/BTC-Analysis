name: BTCUSD Step22 - Supervised Daily Side, 477 Weekday Trades
on:
  push:
    branches:
      - research/btc-daily-supervised-side-step22
    paths:
      - scripts/research_btc_daily_supervised_side_step22.py
      - .github/workflows/research-btc-daily-supervised-side-step22.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data and model dependencies
        run: python -m pip install numpy pandas numba scikit-learn tabulate
      - name: Verify 108 walk-forward supervised BTC side models, frozen exits and 477 weekday trades
        run: python scripts/research_btc_daily_supervised_side_step22.py
      - name: Archive 2025-selected 477-trade and 22-month ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step22-walkforward-supervised-477-trades
          path: analysis/btc_daily_supervised_side_step22/
          if-no-files-found: warn
