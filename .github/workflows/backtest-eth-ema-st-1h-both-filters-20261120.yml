name: ETHUSD 1h EMA ST with ATR and volume minimum filters
on:
  push:
    branches: [research/eth-ema-st-1h-volume-volatility-20261120]
    paths:
      - scripts/backtest_eth_ema_st_1h_both_min_filters_20261120.py
      - .github/workflows/backtest-eth-ema-st-1h-both-filters-20261120.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eth-ema-st-1h-both-filters
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Compile research script
        run: python -m py_compile scripts/backtest_eth_ema_st_1h_both_min_filters_20261120.py
      - name: Backtest ETHUSD 1h with min ATR x1 and volume x1.5
        run: python scripts/backtest_eth_ema_st_1h_both_min_filters_20261120.py
      - name: Report final metrics
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('analysis/eth_ema_st_1h_min_vol_filters_20261120/summary.json').read_text())
          m=d["completed_trades"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## ETHUSD 1h EMA20/Supertrend, volume & ATR minimum filters ON\n\n")
              f.write("| Trades | Net USD | Profit factor | Win rate | Positive months | Negative months |\n|---:|---:|---:|---:|---:|---:|\n")
              f.write(f"| {m['trades']} | {m['net_profit_usd']:+.4f} | {m['profit_factor']} | {m['win_rate_pct']}% | {m['profitable_months']}/22 | {m['negative_months']}/22 |\n\n")
              f.write("Original fixed 100/50 ETH-point trailing, 1h entry and stop monitoring. 27m offer eligibility conservatively treated as unverified.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eth-ema-st-1h-volume-volatility-results
          path: |
            analysis/eth_ema_st_1h_min_vol_filters_20261120/*.json
            analysis/eth_ema_st_1h_min_vol_filters_20261120/*.csv
            analysis/eth_ema_st_1h_min_vol_filters_20261120/*.csv.gz
            analysis/eth_ema_st_1h_min_vol_filters_20261120/*.md
          if-no-files-found: error
      - name: Save reproducible report on isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/eth_ema_st_1h_min_vol_filters_20261120/
          if ! git diff --cached --quiet; then
            git commit -m "research: ETH 1h minimum volatility volume filter backtest results"
            git push origin HEAD:research/eth-ema-st-1h-volume-volatility-20261120
          fi
