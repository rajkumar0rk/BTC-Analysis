name: BTCUSD 15M Reclaim 3 pct SL 9 pct TP Monthly Results
on:
  push:
    branches: [research/btc15m-reclaim-sl3-tp9-monthly-20261123]
    paths:
      - scripts/research_btc15m_reclaim_sl3_tp9_monthly_20261123.py
      - .github/workflows/research-btc15m-reclaim-sl3-tp9-monthly.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Verify all 22 monthly results and prior +97.5183 percent parity
        shell: bash
        run: |
          mkdir -p analysis/btc15m_reclaim_sl3_tp9_monthly_20261123
          set -o pipefail
          python -u scripts/research_btc15m_reclaim_sl3_tp9_monthly_20261123.py 2>&1 | tee analysis/btc15m_reclaim_sl3_tp9_monthly_20261123/execution.log
      - name: Upload monthly reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-reclaim-sl3-tp9-monthly
          path: analysis/btc15m_reclaim_sl3_tp9_monthly_20261123/
          retention-days: 30
      - name: Archive to dedicated monthly research branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_reclaim_sl3_tp9_monthly_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive verified Reclaim 3 pct SL 9 pct TP monthly results"
            git push origin HEAD:research/btc15m-reclaim-sl3-tp9-monthly-20261123
          fi
