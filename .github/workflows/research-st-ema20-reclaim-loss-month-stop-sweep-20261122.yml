name: BTC EMA20 Reclaim losing-month initial SL robustness
on:
  push:
    branches:
      - research/st-ema20-reclaim-loss-month-filters-20261122-v1
    paths:
      - scripts/research_st_ema20_reclaim_loss_month_stop_sweep_20261122.py
      - .github/workflows/research-st-ema20-reclaim-loss-month-stop-sweep-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-ema20-reclaim-loss-month-stop-sweep-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Validate syntax
        run: python -m py_compile scripts/research_st_ema20_reclaim_loss_month_stop_sweep_20261122.py
      - name: Replay initial stops against filtered Reclaim entries
        run: python scripts/research_st_ema20_reclaim_loss_month_stop_sweep_20261122.py
      - name: Upload full audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-reclaim-loss-month-stop-sweep
          path: analysis/st_ema20_reclaim_loss_month_stop_sweep_20261122/
          if-no-files-found: warn
      - name: Commit audit to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+rajkumar0rk@users.noreply.github.com"
          git add analysis/st_ema20_reclaim_loss_month_stop_sweep_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: save Reclaim entry-SL robustness and loss months"
            git pull --rebase origin research/st-ema20-reclaim-loss-month-filters-20261122-v1
            git push origin HEAD:research/st-ema20-reclaim-loss-month-filters-20261122-v1
          fi
