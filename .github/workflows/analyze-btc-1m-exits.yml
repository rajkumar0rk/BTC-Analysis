name: Analyze BTCUSD 1m exit strategies
on:
  push:
    branches: [main]
    paths:
      - scripts/analyze_1m_exit_methods.py
      - .github/workflows/analyze-btc-1m-exits.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-1m-exit-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Replay genuine 1m exits
        run: python scripts/analyze_1m_exit_methods.py
      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/delta_1m_exit_research
          if ! git diff --cached --quiet; then
            git commit -m "research: compare native 1m exit methods"
            git push
          fi
