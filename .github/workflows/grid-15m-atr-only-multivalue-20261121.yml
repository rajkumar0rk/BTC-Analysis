name: Grid ATR-only BTC 15m entry 1m trailing initial activation multipliers
on:
  push:
    branches:
      - research/grid-15m-atr-only-activation-multipliers-20261121
    paths:
      - scripts/grid_15m_atr_only_init_trail_activation_20261121.py
      - .github/workflows/grid-15m-atr-only-multivalue-20261121.yml

permissions:
  contents: write

concurrency:
  group: grid-15m-atr-only-multivalue-20261121
  cancel-in-progress: false

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned replay dependencies
        run: python -m pip install numpy==2.2.3 pandas==2.2.3 numba==0.61.2
      - name: Run 512 parameter triples and 2048 model scores with regression
        run: |
          python -m py_compile scripts/grid_15m_atr_only_init_trail_activation_20261121.py
          python scripts/grid_15m_atr_only_init_trail_activation_20261121.py
      - name: Archive all scenario rankings monthly results and weekly trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grid-btc-15m-atr-only-multiple-values
          path: analysis/grid_15m_atr_only_initial_trailing_activation_20261121/
          if-no-files-found: warn
      - name: Commit research only not historical market archives
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/grid_15m_atr_only_initial_trailing_activation_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: 15m ATR-only multiplier and activation grid 22mo and week"
            git push origin HEAD:research/grid-15m-atr-only-activation-multipliers-20261121
          fi
