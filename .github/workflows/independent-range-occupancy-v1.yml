name: Independent hourly range occupancy BTC first
on:
  push:
    branches: [research/independent-range-occupancy-20261120-v1]
    paths:
      - scripts/independent_range_occupancy_v1.py
      - .github/workflows/independent-range-occupancy-v1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-range-occupancy-v1
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-range-occupancy-20261120-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba tabulate
      - name: BTC 2025 discovery and frozen BTC ETH audit
        run: python scripts/independent_range_occupancy_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-range-occupancy-v1
          path: analysis/independent_range_occupancy_v1/
          retention-days: 45
      - name: Commit isolated results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/independent_range_occupancy_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'research: archive range occupancy paired audit'
            git fetch origin research/independent-range-occupancy-20261120-v1
            git rebase origin/research/independent-range-occupancy-20261120-v1
            git push origin HEAD:research/independent-range-occupancy-20261120-v1
          fi
