name: Independent trend acceleration asymmetric BTC ETH research
on:
  push:
    branches: [research/convex-trend-acceleration-20261119]
    paths:
      - scripts/research_convex_trend_acceleration_20261119.py
      - .github/workflows/research-convex-acceleration-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-convex-acceleration-20261119
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas numba tabulate
      - name: Backtest BTC and ETH
        run: python -u scripts/research_convex_trend_acceleration_20261119.py
      - name: Archive trade and monthly evidence
        uses: actions/upload-artifact@v4
        with:
          name: independent-convex-acceleration-20261119
          path: analysis/convex_trend_acceleration_20261119/
          if-no-files-found: error
      - name: Commit summary only to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/convex_trend_acceleration_20261119/model_comparison.csv
          git add analysis/convex_trend_acceleration_20261119/qualifying_models.csv
          git add analysis/convex_trend_acceleration_20261119/promising_exploratory_models.csv
          git add analysis/convex_trend_acceleration_20261119/candidate_concentration.csv
          git add analysis/convex_trend_acceleration_20261119/candidate_monthly_pf.csv
          git add analysis/convex_trend_acceleration_20261119/quality.json
          git add analysis/convex_trend_acceleration_20261119/RESEARCH_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: independent acceleration backtest results"
            git push origin HEAD:research/convex-trend-acceleration-20261119
          fi
