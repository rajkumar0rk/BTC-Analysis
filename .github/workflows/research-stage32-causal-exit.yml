name: Stage32 BTC Mean Reversion and Range causal exit optimization
on:
  push:
    branches:
      - research/stage32-mr-range-exit-management-20261121
    paths:
      - scripts/research_stage32_causal_exit_20261121.py
      - .github/workflows/research-stage32-causal-exit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-exit-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy numba
      - name: Validate research syntax
        run: python -m py_compile scripts/research_stage32_causal_exit_20261121.py
      - name: Replay 1m causal breakeven, trailing and fixed or mean take-profit
        run: PYTHONUNBUFFERED=1 PYTHONPATH=scripts python scripts/research_stage32_causal_exit_20261121.py
      - name: Preserve every after-cost candidate, monthly series and trade audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage32-causal-mr-range-exit-comparison
          path: analysis/stage32_mr_range_dynamic_exit_20261121/
          if-no-files-found: warn
          retention-days: 30
