name: Research intraday institutional BTC spread
on:
  push:
    branches: [main]
    paths:
      - scripts/research_intraday_spread.py
      - .github/workflows/research-intraday-spread.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-intraday-spread
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Download genuine spot minute candles and replay spread trades
        run: python scripts/research_intraday_spread.py
      - name: Commit findings, including negative and zero-trade results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_intraday_spread
          if ! git diff --cached --quiet; then
            git commit -m "research: save intraday spread execution study"
            git pull --rebase origin main
            git push
          fi
