name: Platform web CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/web/**', 'scripts/prepare_browser_python.py','scripts/stage_repository_history.py','data/delta_india/*/1m/**','data/delta_india/*/institutional/history/**','data/delta_india/*/institutional/history_manifest.json','data/delta_india/BTCUSD/2024_verified_archive/**','data/delta_india/2024_recovery_candidates/**','scripts/validate_recovered_2024.py','scripts/recover_delta_2024.py', 'src/btc_analysis/**', 'pyproject.toml', 'requirements/platform-linux.lock', '.github/workflows/platform-web.yml']
  pull_request:
    paths: ['apps/web/**', 'scripts/prepare_browser_python.py','scripts/stage_repository_history.py','data/delta_india/*/1m/**','data/delta_india/*/institutional/history/**','data/delta_india/*/institutional/history_manifest.json','data/delta_india/BTCUSD/2024_verified_archive/**','data/delta_india/2024_recovery_candidates/**','scripts/validate_recovered_2024.py','scripts/recover_delta_2024.py', 'src/btc_analysis/**', 'pyproject.toml', 'requirements/platform-linux.lock', '.github/workflows/platform-web.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements/platform-linux.lock && python -m pip install --no-deps '.[data,api]' && python -m pip check
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Stage pinned browser Python runtime
        run: python scripts/prepare_browser_python.py && python scripts/browser_parity_fixture.py
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npx playwright install chromium --with-deps
      - name: Import actual archive and exercise historical worker
        run: |
          python -m btc_analysis.data.cli --symbol BTCUSD --store "$RUNNER_TEMP/history"
          PLATFORM_TEST_REAL_HISTORY="$RUNNER_TEMP/history" python -m unittest discover -s tests/platform -p test_historical_runner.py -v
      - name: Real API worker and browser integration
        run: |
          set -euo pipefail
          export BTC_PLATFORM_DB="$RUNNER_TEMP/platform-web.sqlite"
          export BTC_PLATFORM_HISTORY="$RUNNER_TEMP/history"
          export PLATFORM_TEST_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$PLATFORM_TEST_TOKEN"
          export BTC_PLATFORM_TOKENS_JSON="$(python -c 'import json,os; print(json.dumps({"browser":os.environ["PLATFORM_TEST_TOKEN"]}))')"
          uvicorn btc_analysis.service.api:app_from_env --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 & api=$!
          env -u BTC_PLATFORM_TOKENS_JSON -u PLATFORM_TEST_TOKEN python -m btc_analysis.service.worker --db "$BTC_PLATFORM_DB" > "$RUNNER_TEMP/worker.log" 2>&1 & worker=$!
          (cd apps/web && npm run preview) > "$RUNNER_TEMP/web.log" 2>&1 & web=$!
          trap 'kill "$api" "$worker" "$web" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          cd apps/web
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: platform-web
          path: apps/web/dist/
          if-no-files-found: error
