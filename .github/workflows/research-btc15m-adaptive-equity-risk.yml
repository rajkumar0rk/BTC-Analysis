name: BTCUSD 15M Adaptive Equity Drawdown - Verified Reclaim Engine
on:
  push:
    branches: [research/btc15m-adaptive-equity-risk-20261123]
    paths:
      - scripts/research_btc15m_adaptive_equity_risk_20261123.py
      - .github/workflows/research-btc15m-adaptive-equity-risk.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: btc15m-adaptive-equity-risk
  cancel-in-progress: false
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      SHARD_COUNT: '8'
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas tabulate
      - run: python scripts/research_btc15m_adaptive_equity_risk_20261123.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc15m-risk-shard-${{ matrix.shard }}
          path: analysis/btc15m_adaptive_equity_risk_20261123/shard_${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: research
    runs-on: ubuntu-latest
    env:
      SHARD_COUNT: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas tabulate
      - name: Restore shard outputs
        uses: actions/download-artifact@v4
        with:
          pattern: btc15m-risk-shard-*
          merge-multiple: false
          path: _shards
      - name: Assemble source reports
        run: |
          mkdir -p analysis/btc15m_adaptive_equity_risk_20261123
          for i in 0 1 2 3 4 5 6 7; do
            mkdir -p analysis/btc15m_adaptive_equity_risk_20261123/shard_$i
            cp _shards/btc15m-risk-shard-$i/* analysis/btc15m_adaptive_equity_risk_20261123/shard_$i/
          done
          python scripts/research_btc15m_adaptive_equity_risk_20261123.py aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: btc15m-adaptive-equity-risk-full
          path: analysis/btc15m_adaptive_equity_risk_20261123/
          if-no-files-found: error
          retention-days: 30
      - name: Save compact reports to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_adaptive_equity_risk_20261123/RESEARCH_REPORT.md analysis/btc15m_adaptive_equity_risk_20261123/ranked.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: 22-month adaptive equity drawdown sweep"
            git push origin HEAD:research/btc15m-adaptive-equity-risk-20261123
          fi
