name: BTC 48h causal monthly profit lock — 22 of 22 research
on:
  push:
    branches:
      - research/btc-monthly-profit-lock-20261120
    paths:
      - scripts/research_btc_48h_causal_month_profit_lock_20261120.py
      - .github/workflows/research-btc-48h-month-profit-lock-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-months-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical backtest dependencies
        run: pip install numpy pandas numba
      - name: Replay unchanged 48h strategy and 15 monthly lock variations on BTC 1m
        run: |
          python -m py_compile scripts/research_btc_48h_causal_month_profit_lock_20261120.py
          PYTHONPATH=scripts python scripts/research_btc_48h_causal_month_profit_lock_20261120.py
      - name: Preserve month-by-month actual trade results and guard decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-48h-22monthly-profit-lock-evidence
          path: analysis/btc_48h_month_profit_lock_20261120/
          if-no-files-found: warn
          retention-days: 30
