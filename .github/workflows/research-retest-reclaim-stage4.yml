name: Research BTC Stage 4 retest and reclaim after expansion
on:
  push:
    branches: [main]
    paths:
      - scripts/research_retest_reclaim_stage4.py
      - .github/workflows/research-retest-reclaim-stage4.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-retest-reclaim-stage4
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Run causal retest/reclaim study on Delta India archive
        run: python scripts/research_retest_reclaim_stage4.py
      - name: Commit all findings, successful or unsuccessful
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage4
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage 4 retest/reclaim results"
            git pull --rebase origin main
            git push
          fi
