name: ETHUSD Stage26 fixed-strategy cross-market backtest
on:
  push:
    branches: [research/eth-stage26-crossmarket]
    paths:
      - scripts/test_eth_stage26_crossmarket.py
      - .github/workflows/eth-stage26-crossmarket.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eth_stage26:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eth-stage26-crossmarket
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Replay BTC-selected Stage26 on original ETHUSD 1m
        run: python scripts/test_eth_stage26_crossmarket.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETH-stage26-crossmarket-audit
          path: analysis/independent_eth_stage26_crossmarket
      - name: Save ETH-only results to independent branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_eth_stage26_crossmarket
          if ! git diff --cached --quiet; then
            git commit -m "research(ETH): archive Stage26 cross-market original-rule replay"
            git push origin HEAD:research/eth-stage26-crossmarket
          fi
