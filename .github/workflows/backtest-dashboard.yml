name: Backtest dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dashboard/index.html', 'dashboard/app.js', 'dashboard/style.css', 'scripts/dashboard_smoke.cjs', '.github/workflows/backtest-dashboard.yml']
  pull_request:
    paths: ['dashboard/index.html', 'dashboard/app.js', 'dashboard/style.css', 'scripts/dashboard_smoke.cjs', '.github/workflows/backtest-dashboard.yml']
permissions:
  contents: read
concurrency:
  group: backtest-dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: node --check dashboard/app.js
      - run: node --check scripts/dashboard_smoke.cjs
      - name: Verify published data is ready (initial bootstrap)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/dashboard-data/latest.json?bootstrap=$GITHUB_RUN_ID-$attempt" | python -c 'import json,sys; assert json.load(sys.stdin)["data_schema"]==2'; then exit 0; fi
            sleep 10
          done
          echo "::error::No published dashboard data snapshot; run Publish backtest data"
          exit 1
      - name: Browser smoke test against actual public GitHub Raw snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          npm install --prefix /tmp/dashboard-smoke playwright@1.51.1
          /tmp/dashboard-smoke/node_modules/.bin/playwright install chromium --with-deps
          DASHBOARD_SMOKE_REMOTE=1 NODE_PATH=/tmp/dashboard-smoke/node_modules node scripts/dashboard_smoke.cjs
      - name: Package UI only
        run: |
          mkdir -p dashboard-site
          cp dashboard/index.html dashboard/app.js dashboard/style.css dashboard-site/
          test "$(find dashboard-site -type f | wc -l)" -eq 3
          du -sh dashboard-site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dashboard-site/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
