name: Research BTC 30m trend 1m swing range fixed 3R exits
on:
  push:
    branches: [main]
    paths:
      - scripts/research_mtf_swing_range_fixed3r.py
      - .github/workflows/research-mtf-swing-range-fixed3r.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-swing-range-fixed3r
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Test user fixed exit pairs 100-300 200-600 300-900 400-1200
        run: python scripts/research_mtf_swing_range_fixed3r.py
      - name: Commit fixed exit outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/mtf_swing_range_fixed3r
          if ! git diff --cached --quiet; then
            git commit -m "research: save fixed 3R exit timezone comparison"
            git pull --rebase origin main
            git push
          fi
