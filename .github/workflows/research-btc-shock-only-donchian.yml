name: Research BTC Donchian shock-only independent replay
on:
  push:
    branches: [research/btc-shock-only-donchian-20261121]
    paths:
      - scripts/research_btc_shock_only_donchian_20261121.py
      - .github/workflows/research-btc-shock-only-donchian.yml
      - analysis/btc_shock_only_donchian_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-shock-only-donchian-20261121
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install pandas numpy tabulate
      - name: Run frozen shock-only Donchian, assert parity and account reconciliation
        run: python scripts/research_btc_shock_only_donchian_20261121.py
      - name: Preserve full experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-donchian-shock-only-22-month-20261121
          path: analysis/btc_shock_only_donchian_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Commit report, monthly results, both trade ledgers to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_shock_only_donchian_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save shock-only Donchian full replay and comparison"
            git push origin HEAD:research/btc-shock-only-donchian-20261121
          fi
