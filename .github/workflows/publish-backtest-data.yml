name: Publish backtest data
# Publication checkpoints: collect completed versioned research bundles, including strict Reclaim run 45993024689.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows:
      - ETHUSD native ATR price-action strategy research
      - BTCUSD daily 200–500 point feasibility
      - Research BTC Stage24 two-hour failed auction 22 months
      - Prune verified duplicate research branches
      - Reclaim single and multi candle without volume volatility filters
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'data/delta_india/BTCUSD/1m/**'
      - 'data/delta_india/ETHUSD/1m/**'
      - 'scripts/dashboard_indicator_history.py'
      - 'scripts/test_dashboard_indicator_history.py'
      - 'src/btc_analysis/indicators.py'
      - 'src/btc_analysis/contracts.py'
      - 'scripts/export_dashboard.py'
      - 'scripts/backtest_bundle.py'
      - 'scripts/publish_backtest_bundles.py'
      - 'scripts/test_publish_backtest_bundles.py'
      - 'scripts/dashboard_archive.py'
      - 'scripts/curate_dashboard.py'
      - 'scripts/import_supertrend_dashboard.py'
      - 'dashboard/supertrend-sources.json'
      - 'dashboard/frozen-strategies.json'
      - 'scripts/verify_dashboard_export.py'
      - 'scripts/publish_dashboard_data.sh'
      - '.github/workflows/publish-backtest-data.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: dashboard-data-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.2.6
      - run: python scripts/test_dashboard_indicator_history.py
      - run: python scripts/test_dashboard_archive.py
      - run: python scripts/test_publish_backtest_bundles.py
      - run: python scripts/test_curate_dashboard.py
      - name: Publish verified data only, never deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_dashboard_data.sh
