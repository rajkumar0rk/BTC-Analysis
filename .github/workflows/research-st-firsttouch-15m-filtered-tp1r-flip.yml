name: BTC ETH first EMA20 touch 15M filtered 1R ST flip backtest
on:
  push:
    branches: [research/st-firsttouch-15m-filtered-tp1r-flip-20261122]
    paths:
      - scripts/research_st_firsttouch_15m_filtered_tp1r_flip_20261122.py
      - .github/workflows/research-st-firsttouch-15m-filtered-tp1r-flip.yml
      - analysis/st_firsttouch_15m_filtered_tp1r_20261122/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: st-firsttouch-15m-volatr-1r-20261122
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libraries
        run: python -m pip install numpy pandas
      - name: Test BTC and ETH 15M 1R and confirmed ST flip over 22 months
        shell: bash
        run: |
          mkdir -p analysis/st_firsttouch_15m_filtered_tp1r_20261122/
          set -o pipefail
          python -u scripts/research_st_firsttouch_15m_filtered_tp1r_flip_20261122.py 2>&1 | tee analysis/st_firsttouch_15m_filtered_tp1r_20261122/execution.log
      - name: Upload result or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-firsttouch-15m-1r-filtered-btc-eth
          path: analysis/st_firsttouch_15m_filtered_tp1r_20261122/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit research evidence only to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_firsttouch_15m_filtered_tp1r_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 15m filtered first-touch TP1R results"
            git push origin HEAD:research/st-firsttouch-15m-filtered-tp1r-flip-20261122
          fi
