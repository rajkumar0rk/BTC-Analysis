name: BTC 15m Supertrend first touch reach 500 and 1000
on:
  push:
    branches:
      - research/supertrend-15m-filters-20261122
    paths:
      - scripts/research_supertrend_15m_500_1000.py
      - .github/workflows/research-supertrend-15m-500-1000.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Count 500 1000 first passage with 200 parity audit
        run: python scripts/research_supertrend_15m_500_1000.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrend-15m-reach-500-1000
          path: analysis/supertrend_15m_touch_500_1000_20261122/
          if-no-files-found: warn
      - name: Commit complete reports on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_15m_touch_500_1000_20261122
          if ! git diff --cached --quiet; then
            git commit -m "research: store Supertrend 500 1000 first-passage counts"
            git push origin HEAD:research/supertrend-15m-filters-20261122
          fi
