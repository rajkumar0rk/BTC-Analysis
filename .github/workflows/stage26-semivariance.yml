name: Stage26 BTC semivariance independent backtest
on:
  push:
    branches: [research/independent-stage26-semivariance]
    paths:
      - scripts/research_stage26_semivariance.py
      - .github/workflows/stage26-semivariance.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage26-semivariance
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-stage26-semivariance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas tabulate
      - name: Run isolated semivariance experiment
        run: python scripts/research_stage26_semivariance.py
      - name: Commit reproducible results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_stage26_semivariance
          if ! git diff --cached --quiet; then
            git commit -m "research(stage26): record semivariance results and audit"
            git push origin HEAD:research/independent-stage26-semivariance
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage26-semivariance-research
          path: analysis/independent_stage26_semivariance/
