name: Research BTC anytime directional volume and volatility patterns
on:
  push:
    branches: [main]
    paths:
      - scripts/research_anytime_volume_volatility_patterns.py
      - .github/workflows/research-anytime-participation-patterns.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage8-anytime-patterns
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research packages
        run: python -m pip install pandas numpy numba tabulate
      - name: Study completed BTC 5m directional participation events
        run: python scripts/research_anytime_volume_volatility_patterns.py
      - name: Store detailed historical events and trades
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage8-anytime-pattern-trades
          path: |
            analysis/institutional_discovery_stage8_dynamic_patterns/events.csv.gz
            analysis/institutional_discovery_stage8_dynamic_patterns/trade_ledger.csv.gz
          retention-days: 30
          if-no-files-found: error
      - name: Commit compact reproducible results, with concurrent-update retries
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage8_dynamic_patterns/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage8_dynamic_patterns/pattern_probabilities.csv
          git add analysis/institutional_discovery_stage8_dynamic_patterns/strategy_results.csv
          git add analysis/institutional_discovery_stage8_dynamic_patterns/chronological_stability.csv
          git add analysis/institutional_discovery_stage8_dynamic_patterns/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage 8 event-driven pattern outcomes"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent main update, retry $attempt"
              sleep 3
            done
            exit 1
          fi
