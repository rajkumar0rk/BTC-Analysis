name: BTC 15m Supertrend line touch five target backtest
on:
  push:
    branches:
      - research/supertrend-15m-touch-20261122
    paths:
      - scripts/research_supertrend_15m_line_touch.py
      - .github/workflows/research-supertrend-15m-line-touch.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight research dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Replay 15m Supertrend support touches on real Delta BTCUSD 1m archive
        run: python scripts/research_supertrend_15m_line_touch.py
      - name: Upload full reproducible backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrend-15m-line-touch-results
          path: |
            analysis/supertrend_15m_touch_20261122/
          if-no-files-found: warn
      - name: Preserve successful result files in research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_15m_touch_20261122
          if ! git diff --cached --quiet; then
            git commit -m "research: store full Delta BTCUSD 15m Supertrend TP backtest results"
            git push origin HEAD:research/supertrend-15m-touch-20261122
          fi
