name: BTC Stage27 independent mean reversion and range-trading research
on:
  push:
    branches:
      - research/stage27-meanreversion-range-v1-20261121
    paths:
      - scripts/research_stage27_meanreversion_range_20261121.py
      - .github/workflows/research-stage27-meanreversion-range.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mean-reversion-and-range:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed research libraries
        run: python -m pip install pandas numpy numba tabulate
      - name: Download verified Core and 4H historic baseline components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stage18-70-30 /tmp/stage26
          gh run download 44890734790 -n stage18-btc-70core-30donchian-portfolio-implementation -D /tmp/stage18-70-30 --repo "$GITHUB_REPOSITORY"
          gh run download 44908493237 -n btc-stage26-aftercost-swing-hourly-20261121 -D /tmp/stage26 --repo "$GITHUB_REPOSITORY"
          test -s /tmp/stage18-70-30/scenario_monthly_22.csv
          test -s /tmp/stage26/4h_donchian_2025selected_monthly.csv
      - name: Compile research code
        run: python -m py_compile scripts/research_stage27_meanreversion_range_20261121.py
      - name: Independently backtest mean reversion and range on BTC 1m
        run: PYTHONUNBUFFERED=1 PYTHONPATH=scripts python scripts/research_stage27_meanreversion_range_20261121.py
      - name: Preserve complete candidate and monthly return evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage27-meanreversion-range-replay-results
          path: analysis/stage27_mean_reversion_range_20261121/
          if-no-files-found: warn
          retention-days: 30
