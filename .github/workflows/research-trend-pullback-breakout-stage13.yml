name: Research BTC Stage13 4H trend 1H pullback 15M breakout
on:
  push:
    branches: [main]
    paths:
      - scripts/research_trend_pullback_breakout_stage13.py
      - .github/workflows/research-trend-pullback-breakout-stage13.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage13-trend-pullback
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Execute Stage13 multi-timeframe strategy research
        run: python scripts/research_trend_pullback_breakout_stage13.py
      - name: Preserve full evidence as artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage13-trend-pullback-trades
          path: |
            analysis/institutional_discovery_stage13_4h_1h_15m/events.csv.gz
            analysis/institutional_discovery_stage13_4h_1h_15m/trades.csv.gz
          retention-days: 30
          if-no-files-found: error
      - name: Commit summary and monthly results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage13_4h_1h_15m/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage13_4h_1h_15m/strategy_summary.csv
          git add analysis/institutional_discovery_stage13_4h_1h_15m/monthly_IST.csv
          git add analysis/institutional_discovery_stage13_4h_1h_15m/monthly_consistency.csv
          git add analysis/institutional_discovery_stage13_4h_1h_15m/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "research: store Stage13 multi-timeframe monthly performance"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
