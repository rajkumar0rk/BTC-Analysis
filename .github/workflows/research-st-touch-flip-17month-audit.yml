name: BTC 15m verified 17month Touch Flip portfolio candidate audit
on:
  push:
    branches:
      - research/st-touch-flip-causal-regime-filters-20261122
    paths:
      - scripts/research_st_touch_flip_17month_candidate_audit.py
      - .github/workflows/research-st-touch-flip-17month-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas numpy and tabulate
        run: python -m pip install numpy pandas tabulate
      - name: Independently replay top 17month candidates and verify monthly splits
        run: python -u scripts/research_st_touch_flip_17month_candidate_audit.py
      - name: Archive month and trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-17-positive-months-candidate-audit
          path: analysis/st_touch_flip_17month_candidate_audit_20261122/
          if-no-files-found: warn
      - name: Commit results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_touch_flip_17month_candidate_audit_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: audited 17-month candidates trade by trade"
            git push origin HEAD:research/st-touch-flip-causal-regime-filters-20261122
          fi
