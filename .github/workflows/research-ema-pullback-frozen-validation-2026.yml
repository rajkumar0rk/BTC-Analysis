name: BTC EMA pullback frozen validation 2026
on:
  push:
    branches: ['research/ema-pullback-frozen-validation-2026']
    paths:
      - 'scripts/research_ema_pullback_frozen_validation_2026.py'
      - '.github/workflows/research-ema-pullback-frozen-validation-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_ema_pullback_frozen_validation_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: ema-pullback-frozen-validation-results
          path: scratch/ema_pullback_frozen_validation_2026/
          if-no-files-found: error
