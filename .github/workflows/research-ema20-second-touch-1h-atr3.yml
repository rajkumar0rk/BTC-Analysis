name: BTC ETH 1H second EMA20 touch 3x ATR14 trail
on:
  push:
    branches: [research/ema20-second-touch-1h-atr3-20261121]
    paths:
      - scripts/research_ema20_second_touch_1h_atr3.py
      - .github/workflows/research-ema20-second-touch-1h-atr3.yml
      - analysis/ema20_second_touch_1h_atr3_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-1h-second-touch-one-per-supertrend-atr3
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install numpy pandas
      - name: Backtest 3x ATR14 BTC and ETH with 1m fills
        shell: bash
        run: |
          mkdir -p analysis/ema20_second_touch_1h_atr3_20261121
          set -o pipefail
          python -u scripts/research_ema20_second_touch_1h_atr3.py 2>&1 | tee analysis/ema20_second_touch_1h_atr3_20261121/execution.log
      - name: Preserve evidence, success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-1h-second-ema20-atr3
          path: analysis/ema20_second_touch_1h_atr3_20261121/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit reports on research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_1h_atr3_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save 3x ATR14 1H second-touch results"
            git push origin HEAD:research/ema20-second-touch-1h-atr3-20261121
          fi
