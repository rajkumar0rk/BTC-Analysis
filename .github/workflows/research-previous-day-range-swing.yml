name: Research BTC prior day range and daily swings
on:
  push:
    branches: [main]
    paths:
      - scripts/research_previous_day_range_swing.py
      - .github/workflows/research-previous-day-range-swing.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-previous-day-range-swing
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Replay actual BTC historical range and swing strategies
        run: python scripts/research_previous_day_range_swing.py
      - name: Persist research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/previous_day_range_swing
          if ! git diff --cached --quiet; then
            git commit -m "research: save previous-day RH RL SH SL BTC findings"
            git pull --rebase origin main
            git push
          fi
