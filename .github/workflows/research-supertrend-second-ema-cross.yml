name: Backtest BTC Supertrend SECOND EMA9/21 crossover
on:
  push:
    branches:
      - research/supertrend-second-ema-cross-20261122
    paths:
      - scripts/research_supertrend_second_ema_cross.py
      - .github/workflows/research-supertrend-second-ema-cross.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-supertrend-second-ema-cross-20261122
  cancel-in-progress: false
jobs:
  second_crossover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research requirements
        run: python -m pip install --disable-pip-version-check numpy pandas numba tabulate
      - name: Enforce pre-registered strict second-crossover test
        run: test -s analysis/supertrend_second_ema_cross/NOVELTY_CHECK.md
      - name: Run second-crossover unit tests and all authentic historical replays
        run: python scripts/research_supertrend_second_ema_cross.py
      - name: Commit results on isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_second_ema_cross/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish second EMA crossover backtest and trades"
            git push origin HEAD:research/supertrend-second-ema-cross-20261122
          fi
