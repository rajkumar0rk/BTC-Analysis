name: BTCUSD $100/$10/100x liquidation-aware replay
on:
  push:
    branches:
      - research/stage18-21-profit-robustness-20261122-v1
    paths:
      - scripts/research_stage18_100x_liquidation_20261122.py
      - .github/workflows/research-stage18-100x-liq-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: stage18-100x-liquidation-research
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backtest dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy numba tabulate
      - name: Download previously verified core and Donchian 1m trade ledgers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/don"
          gh run download 44889747997 -n stage18-core-standalone-20261121 -D "$RUNNER_TEMP/core" --repo "$GITHUB_REPOSITORY"
          gh run download 44889747997 -n stage18-donchian-standalone-20261121 -D "$RUNNER_TEMP/don" --repo "$GITHUB_REPOSITORY"
          test -s "$RUNNER_TEMP/core/core_all_trades.csv.gz"
          test -s "$RUNNER_TEMP/don/donchian_real_1m_trade_ledgers.csv.gz"
          test -s "data/delta_india/BTCUSD/institutional/history/mark_1m/2026-10.csv.gz"
          test -s "data/delta_india/BTCUSD/1m/2026-10.csv.gz"
      - name: Validate and run every minute of 22-month BTCUSD simulation
        run: |
          python -m py_compile scripts/research_stage18_100x_liquidation_20261122.py
          python scripts/research_stage18_100x_liquidation_20261122.py \
            --core "$RUNNER_TEMP/core/core_all_trades.csv.gz" \
            --donchian "$RUNNER_TEMP/don/donchian_real_1m_trade_ledgers.csv.gz"
      - name: Upload all monthly, daily, trade and liquidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-100x-liquidation-evidence-20261122
          path: analysis/stage18_100x_liquidation_20261122/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit completed standalone research reports on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/stage18_100x_liquidation_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive complete $100 100x BTCUSD liquidation replay outputs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
