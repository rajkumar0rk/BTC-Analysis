name: 1H EMA20 second touch one trade per Supertrend no SL
on:
  push:
    branches:
      - research/ema20-second-touch-1h-one-trade-per-st-20261121
    paths:
      - scripts/research_ema20_second_touch_1h_one_trade_per_st.py
      - .github/workflows/research-ema20-second-touch-1h-one-trade-per-st.yml
      - analysis/ema20_second_touch_1h_one_trade_per_st_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-second-touch-1h-one-trade-per-st
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas
      - name: Run BTC/ETH 1H one-trade-per-trend no-SL backtest
        shell: bash
        run: |
          mkdir -p analysis/ema20_second_touch_1h_one_trade_per_st_20261121/
          set -o pipefail
          python -u scripts/research_ema20_second_touch_1h_one_trade_per_st.py 2>&1 | tee analysis/ema20_second_touch_1h_one_trade_per_st_20261121/execution.log
      - name: Upload outputs and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema20-1h-one-trade-per-supertrend-no-sl-btc-eth
          path: analysis/ema20_second_touch_1h_one_trade_per_st_20261121/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit reports only to research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_1h_one_trade_per_st_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 1h one-per-Supertrend cycle BTC/ETH outcomes"
            git push origin HEAD:research/ema20-second-touch-1h-one-trade-per-st-20261121
          fi
