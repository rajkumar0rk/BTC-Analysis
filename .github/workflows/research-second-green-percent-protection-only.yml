name: BTC second green percent profit protection only NO ST exit
on:
  push:
    branches:
      - research/second-green-percent-protection-only-20261122
    paths:
      - scripts/research_second_green_pct_protection_only.py
      - .github/workflows/research-second-green-percent-protection-only.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: green-only-percentage-locks-20261122
  cancel-in-progress: false
jobs:
  percent-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Replay percentage locks with NO ST closing exit and no SL or TP
        run: python -u scripts/research_second_green_pct_protection_only.py
      - name: Save outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-green-percentage-protection-only-no-supertrend-exit
          path: analysis/second_green_percent_protection_only_20261122/
          if-no-files-found: warn
      - name: Commit to independent research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/second_green_percent_protection_only_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: only percentage profit protections, no ST TP SL exits"
            git push origin HEAD:research/second-green-percent-protection-only-20261122
          fi
