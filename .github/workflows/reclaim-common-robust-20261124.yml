name: Reclaim common robust 2024 2025 frozen 2026
on:
  push:
    branches: [research/reclaim-v5-validation-20261124]
    paths: [.github/workflows/reclaim-common-robust-20261124.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore native 2024 data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45363730365 --repo rajkumar0rk/BTC-Analysis --name delta-india-btcusd-2024-native --dir research-data-2024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas numba
      - name: Small coarse grid and parameter stability then frozen 2026
        run: |
          PYTHONPATH=scripts python -u - <<'PY'
          import json,pathlib,itertools
          import numpy as np,pandas as pd
          from numba import njit
          from research_st_ema20_initial_sl_grid_20261122 import eng
          from research_st_ema20_reclaim_loss_months_20261122 import indicator_features
          e=eng();e.smoke_test()
          root=pathlib.Path("data/delta_india/BTCUSD")
          out=pathlib.Path("analysis/reclaim_common_robust_2024_2025");out.mkdir(parents=True,exist_ok=True)
          def load(folder,years,cols):
              frames=[]
              for p in sorted(pathlib.Path(folder).glob("20??-??.csv.gz")):
                  if p.name[:4] not in years:continue
                  x=pd.read_csv(p,usecols=["time"]+cols);x.index=pd.to_datetime(x.pop("time"),unit="s",utc=True);frames.append(x)
              if not frames:raise RuntimeError(str(folder))
              x=pd.concat(frames).sort_index()
              assert not x.index.has_duplicates
              return x
          cols=["open","high","low","close","volume"]
          m=pd.concat([load("research-data-2024/1m",["2023","2024"],cols),load(root/"1m",["2025","2026"],cols)]).sort_index()
          assert not m.index.has_duplicates and np.isfinite(m[cols]).all().all()
          assert (m.low<=m[["open","close"]].min(axis=1)).all() and (m.high>=m[["open","close"]].max(axis=1)).all()
          def joined(label,cols):
              return pd.concat([load("research-data-2024/"+label,["2023","2024"],cols),load(root/"institutional/history"/label,["2025","2026"],cols)]).sort_index()
          fund=joined("funding_1h",["close"]).close
          mark=joined("mark_1m",["open","low","high"])
          # Separate each contiguous segment. Seven days of indicator warmup, never bridge data gaps.
          segments={}
          month_coverage={}
          coverage=[]
          for yr in [2024,2025,2026]:
              start=pd.Timestamp(str(yr)+"-01-01",tz="UTC");end=pd.Timestamp(str(yr+1)+"-01-01",tz="UTC")
              if yr==2026:end=pd.Timestamp("2026-11-01",tz="UTC")
              raw=m.loc[(m.index>=start-pd.Timedelta(days=7))&(m.index<end)]
              grp=raw.index.to_series().diff().ne(pd.Timedelta(minutes=1)).cumsum()
              segments[yr]=[]; used=0; month_coverage[yr]=np.zeros(12,dtype=int)
              for _,q in raw.groupby(grp):
                  a=q.index.min().ceil("h");b=(q.index.max()+pd.Timedelta(minutes=1)).floor("h")
                  q=q.loc[(q.index>=a)&(q.index<b)]
                  if len(q)<8*24*60:continue
                  eligible=max(start,q.index.min()+pd.Timedelta(days=7))
                  if eligible>=q.index.max():continue
                  assert q.close.resample("1h").count().eq(60).all()
                  h=e.features(q.resample("1h").agg(dict(open="first",high="max",low="min",close="last",volume="sum")))
                  h=indicator_features(h)
                  # Higher-timeframe features only from bars completed at the signal close.
                  h4=q.resample("4h").agg(dict(open="first",high="max",low="min",close="last",volume="sum"))
                  h4=h4.loc[q.close.resample("4h").count().eq(240)]
                  for n in [20,50]:
                      ema=h4.close.ewm(span=n,adjust=False,min_periods=n).mean()
                      z=pd.Series(ema.to_numpy(),index=h4.index+pd.Timedelta(hours=4))
                      v=z.reindex(h.index+pd.Timedelta(hours=1),method="ffill").to_numpy()
                      h["h4ema"+str(n)]=100*h.side*(h.close-v)/h.close
                  h["ema50gap"]=100*h.side*(h.close-h.close.ewm(span=50,adjust=False,min_periods=50).mean())/h.close
                  events=[]
                  o,hi,lo=(q[x].to_numpy(float) for x in ["open","high","low"])
                  for hour,ev in sorted(e.setups(h,"reclaim").items()):
                      if hour>=len(h):continue
                      sd=ev["side"];trigger=ev["trigger"]
                      for k in range(hour*60,min((hour+1)*60,len(q))):
                          if (hi[k]>=trigger if sd==1 else lo[k]<=trigger):
                              mid=max(o[k],trigger) if sd==1 else min(o[k],trigger)
                              events.append(dict(entry_j=k,entry=mid+sd*e.SLIP,side=sd,cycle=ev["cycle"],signal=ev["signal"]))
                              break
                  j=[];s=[];mid=[];ends=[];features=[];cycles=[]
                  hs=h.side.to_numpy()
                  for v in events:
                      k=int(v["entry_j"])
                      if q.index[k]<eligible or pd.Timestamp(v["signal"])<eligible:continue
                      sd=int(v["side"]);f=np.flatnonzero(hs[k//60:]!=sd)
                      endj=min((k//60+int(f[0])+1)*60,len(q)) if len(f) else len(q)
                      j.append(k);s.append(sd);mid.append(float(v["entry"])-sd*e.SLIP);ends.append(endj);cycles.append(v["cycle"])
                      row=h.loc[pd.Timestamp(v["signal"])]
                      features.append([float(row[x]) for x in ["volume_ratio","atr_pct","adx14","ema_slope_pct","dir_rsi14","h4ema20","h4ema50","ema50gap","supertrend_age_hours","atr_expansion"]])
                  idx=q.index
                  rates=fund.reindex(idx.floor("h")-pd.Timedelta(hours=1)).to_numpy(float)
                  mk=mark.reindex(idx)
                  weight=np.where(idx<pd.Timestamp("2025-09-08T16:00:00Z"),1/480,np.where((idx.minute==0)&(idx.hour%8==0),1.,0.))
                  flow=np.where(weight==0,0.,rates*mk.open.to_numpy()*weight*.001/100)
                  missing=~np.isfinite(flow)
                  def prefix(x):return np.r_[0.,np.cumsum(x)]
                  month=idx.month.to_numpy(np.int64)-1
                  n=int((idx>=eligible).sum());used+=n
                  month_coverage[yr]+=np.bincount(month[idx>=eligible],minlength=12)
                  coverage.append(dict(year=yr,start=str(eligible),end=str(idx[-1]),used_minutes=n,signals=len(j)))
                  segments[yr].append((*(q[k].to_numpy(float) for k in ["open","high","low","close"]),np.array(j,np.int64),np.array(s,np.int64),np.array(mid,float),np.array(ends,np.int64),month,prefix(np.where(missing,0.,np.maximum(flow,0.))),prefix(np.where(missing,0.,np.maximum(-flow,0.))),prefix(missing),mk.low.to_numpy(float),mk.high.to_numpy(float),np.array(cycles,np.int64),np.asarray(features,float).reshape(-1,10)))
              print("COVERAGE",yr,used,int((end-start).total_seconds()/60),flush=True)
          (out/"coverage.json").write_text(json.dumps(coverage,indent=2))
          @njit
          def replay(o,h,l,c,j,sd,mid,end,sl,tp,path,slip,ladder):
              entry=mid+sd*slip;stop=entry*(1-sd*sl/100);target=entry*(1+sd*tp/100)
              lo=entry;hi=entry
              for k in range(j,end):
                  nodes=(o[k],h[k],l[k],c[k]) if path==0 else (o[k],l[k],h[k],c[k])
                  active=k!=j or sd*(nodes[0]-mid)>=0
                  if active:
                      lo=min(lo,nodes[0]);hi=max(hi,nodes[0])
                      if sd*(nodes[0]-stop)<0:return k,nodes[0]-sd*slip,lo,hi,0
                      if tp>0 and sd*(nodes[0]-target)>=0:return k,nodes[0]-sd*slip,lo,hi,0
                  for z in range(3):
                      a,b=nodes[z],nodes[z+1]
                      if not active:
                          if sd*(b-a)<=0 or sd*(b-mid)<0:continue
                          a=mid;active=True
                      lo=min(lo,a);hi=max(hi,a)
                      if sd*(b-a)>0:
                          if tp>0 and sd*(a-target)<=0 and sd*(b-target)>=0:
                              lo=min(lo,target);hi=max(hi,target)
                              return k,target-sd*slip,lo,hi,0
                          for rung in ladder:
                              v=entry*(1+sd*rung/100)
                              if sd*(a-v)<0 and sd*(b-v)>=0 and sd*(v-stop)>0:stop=v
                      elif sd*(b-stop)<=0:
                          x=a if sd*(a-stop)<0 else stop
                          lo=min(lo,x);hi=max(hi,x)
                          return k,x-sd*slip,lo,hi,0
                      lo=min(lo,b);hi=max(hi,b)
              if end<len(o):return end,o[end]-sd*slip,min(lo,o[end]),max(hi,o[end]),0
              return end-1,c[end-1]-sd*slip,min(lo,c[end-1]),max(hi,c[end-1]),1
          @njit
          def batch(o,h,l,c,j,sd,mid,ends,month,fl,fs,fmissing,ml,mh,cycles,atr,mode,sl,tp,path,slip,fee,cash,peak,ladder):
              mon=np.zeros(12);counts=np.zeros(12);wins=0;losses=0;flat=0;dd=0.;skips=0;overlaps=0;boundary=0;missing=0;markmissing=0;funding=0.;fees=0.;marginrisk=0;active=-1;last_cycle=-1
              for i in range(len(j)):
                  k=j[i];side=sd[i];entry=mid[i]+side*slip
                  if cycles[i]==last_cycle:continue
                  if k<=active:overlaps+=1;continue
                  if entry*.001*(1+fee)>cash:skips+=1;continue
                  last_cycle=cycles[i]
                  local_sl=sl*atr[i] if mode==1 else sl
                  local_tp=tp*atr[i] if mode==1 and tp>0 else tp
                  x,fill,low,high,bd=replay(o,h,l,c,k,side,mid[i],ends[i],local_sl,local_tp,path,slip,ladder)
                  active=x;boundary+=bd
                  fp=fl if side==1 else fs
                  debit=fp[x+1]-fp[k];funding+=debit;missing+=fmissing[x+1]-fmissing[k]
                  f=.001*fee*(entry+fill);fees+=f
                  net=.001*side*(fill-entry)-f-debit
                  # Conservative floating DD bound: allow favorable peak before adverse low/high.
                  good=high if side==1 else low;bad=low if side==1 else high
                  peak=max(peak,cash+.001*side*(good-entry)-.001*fee*(entry+good))
                  loweq=cash+.001*side*(bad-entry)-.001*fee*(entry+bad)-debit-.001*slip
                  dd=max(dd,100*(peak-loweq)/peak)
                  ma=ml[k:x+1] if side==1 else mh[k:x+1]
                  if not np.isfinite(ma).all():markmissing+=1
                  else:
                      adverse=np.min(ma)*.995 if side==1 else np.max(ma)*1.005
                      equity=cash+.001*side*(adverse-entry)-f-debit
                      if equity<=.001*adverse*(.0025+fee+.0025*.5*1.18):marginrisk+=1
                  cash+=net;peak=max(peak,cash);dd=max(dd,100*(peak-cash)/peak)
                  mon[month[x]]+=net;counts[month[x]]+=1
                  if net>0:wins+=1
                  elif net<0:losses+=1
                  else:flat+=1
              return mon,counts,wins,losses,flat,dd,skips,overlaps,boundary,missing,markmissing,funding,fees,marginrisk,cash,peak
          def evaluate(yr,mode,sl,tp,gates,path,slip,fee,ladder):
              mon=np.zeros(12);counts=np.zeros(12);cash=100.;peak=100.;dd=0.;v=np.zeros(10);marginrisk=0
              for seg in segments[yr]:
                  f=seg[-1];mask=np.ones(len(f),bool)
                  for col,op,threshold in gates:
                      mask &= np.isfinite(f[:,col]) & ((f[:,col]>=threshold) if op==">=" else (f[:,col]<=threshold))
                  if mode==1:mask &= np.isfinite(f[:,1]) & (f[:,1]>0)
                  args=list(seg[:-1]);args[4:8]=[x[mask] for x in args[4:8]];args[-1]=args[-1][mask]
                  r=batch(*args,f[mask,1],mode,sl,tp,path,slip,fee,cash,peak,np.asarray(ladder,float))
                  mon+=r[0];counts+=r[1];dd=max(dd,r[5]);cash,peak=r[-2:]
                  v+=np.array([*r[2:5],*r[6:13]]);marginrisk+=r[13]
                  # marginrisk separately
              nmonths=10 if yr==2026 else 12
              mon=mon[:nmonths];counts=counts[:nmonths]
              return dict(year=yr,mode=mode,sl=sl,tp=tp,gates=gates,path=path,slip=slip,fee=fee,net=float(mon.sum()),positive_months=int((mon>0).sum()),negative_months=int((mon<0).sum()),flat_months=int((mon==0).sum()),trades=int(counts.sum()),wins=int(v[0]),losses=int(v[1]),breakeven=int(v[2]),dd_bound=dd,wallet_skips=int(v[3]),overlaps=int(v[4]),boundary_exits=int(v[5]),missing_funding_minutes=int(v[6]),trades_missing_mark=int(v[7]),funding_debit=float(v[8]),fees=float(v[9]),marginrisk=marginrisk,monthly=mon.tolist(),monthly_trades=counts.astype(int).tolist())
          # Predeclared small grid; no search on calendar or 2026. Select stable neighborhoods, not isolated peaks.
          scenarios=[(p,slip,fee) for p in [0,1] for slip,fee in [(5.,.00059),(25.,.000885)]]
          for yr,cov in month_coverage.items():print("ROBUST_COVERAGE",yr,cov.tolist(),flush=True)
          # Full coverage only for fold acceptance; incomplete months still contribute to annual P&L.
          full={}
          for yr in [2024,2025]:
              expected=np.array([pd.Period(f"{yr}-{i:02d}").days_in_month*1440 for i in range(1,13)])
              full[yr]=month_coverage[yr]>=.95*expected
          # Keep a single optional volume/ADX/4h trend gate. Round thresholds and exit multipliers.
          gate_choices=[(),((0,">=",.75),),((0,">=",1.),),((0,">=",1.25),),((0,">=",1.5),),((2,">=",20.),),((2,">=",25.),),((5,">=",0.),),((6,">=",0.),)]
          exit_choices=[(0,s,t) for s in [.5,1.,1.5,2.] for t in [1.,2.,3.,-1.]]
          exit_choices += [(1,s,t) for s in [1.,1.5,2.,3.] for t in [1.5,2.,3.,-1.]]
          ladders=[(2.,3.,5.),(.5,1.,2.,3.,5.)]
          def cases(yr,config):
              mode,sl,tp,g,ladder=config
              return [evaluate(yr,mode,sl,tp,g,*sc,ladder) for sc in scenarios]
          def stats(rows,yr):
              mon=np.array([x["monthly"] for x in rows]);base=mon[[x["slip"]==5 for x in rows]]
              fold=[float(mon[:,i:i+6].sum(axis=1).min()) for i in range(0,mon.shape[1],6)]
              mask=full.get(yr,np.ones(mon.shape[1],bool))
              # Require positive results in both chronological half-years, across paths/costs.
              return dict(base=min(x["net"] for x in rows if x["slip"]==5),stress=min(x["net"] for x in rows),base_months=int((base.min(axis=0)>0).sum()),stress_months=int((mon.min(axis=0)>0).sum()),complete_profitable=int(((mon.min(axis=0)>0)&mask).sum()),complete_months=int(mask.sum()),halfyear=fold,dd=max(x["dd_bound"] for x in rows),trades=min(x["trades"] for x in rows),skips=max(x["wallet_skips"] for x in rows),risk=max(x["marginrisk"] for x in rows),missing=max(x["missing_funding_minutes"]+x["trades_missing_mark"] for x in rows),overlap=max(x["overlaps"] for x in rows),monthly_floor=mon.min(axis=0).tolist())
          def inspect(config):
              a,b=[stats(cases(yr,config),yr) for yr in [2024,2025]]
              valid=min(a["trades"],b["trades"])>=25 and max(a["risk"],b["risk"],a["missing"],b["missing"],a["overlap"],b["overlap"])==0
              folds=a["halfyear"]+b["halfyear"]
              return dict(config=config,y2024=a,y2025=b,valid=valid,positive_folds=sum(v>0 for v in folds),worst_fold=min(folds),worst_year=min(a["stress"],b["stress"]),dd=max(a["dd"],b["dd"]),both=min(a["stress"],b["stress"])>0)
          rank=[]
          for mode,sl,tp in exit_choices:
              for g in gate_choices:
                  for lad in ladders:
                      config=(mode,sl,tp,g,lad)
                      rank.append(inspect(config))
          # Rank by cross-period performance and downside, not by maximizing historical monthly count.
          rank.sort(key=lambda x:(x["valid"],x["both"],x["positive_folds"],x["worst_fold"],x["worst_year"],-x["dd"],-len(x["config"][3])),reverse=True)
          print("ROBUST_COARSE",len(rank),flush=True)
          # Test all eligible coarse configurations using nearby +/-20% exits and +/-10% gate threshold.
          # A plateau must have robust nearby settings, not merely a perfect point.
          for row in rank:
              if not row["valid"] or not row["both"] or row["positive_folds"]<4:continue
              mode,sl,tp,g,lad=row["config"]
              neighbors=[(mode,sl*k,tp,g,lad) for k in [.8,1.2]]
              if tp>0:neighbors += [(mode,sl,tp*k,g,lad) for k in [.8,1.2]]
              if g and g[0][2]>0:
                  col,op,val=g[0]
                  neighbors += [(mode,sl,tp,((col,op,val*k),),lad) for k in [.9,1.1]]
              nearby=[inspect(x) for x in neighbors]
              pass_count=sum(x["valid"] and x["both"] and x["positive_folds"]==4 for x in nearby)
              row["neighbor_count"]=len(nearby);row["neighbor_pass"]=pass_count
              row["neighbor_worst_fold"]=min([row["worst_fold"]]+[x["worst_fold"] for x in nearby])
              row["neighbor_worst_year"]=min([row["worst_year"]]+[x["worst_year"] for x in nearby])
              row["plateau"]=pass_count==len(nearby)
          eligible=[r for r in rank if r.get("plateau")]
          # If nothing passes, report no validated candidate; show best provisional model as diagnostic only.
          chosen=max(eligible,key=lambda r:(r["neighbor_worst_fold"],r["neighbor_worst_year"],-r["dd"],-len(r["config"][3]))) if eligible else rank[0]
          print("ROBUST_SELECTED",json.dumps(dict(passing_plateaus=len(eligible),chosen=chosen)),flush=True)
          (out/"rank.json").write_text(json.dumps(rank,indent=2))
          (out/"selected.json").write_text(json.dumps(chosen,indent=2))
          # Exactly one frozen model evaluated on 2026 after selection, never retuned on it.
          reports=[]
          for yr in [2024,2025,2026]:
              rows=cases(yr,chosen["config"])
              report=dict(year=yr,config=chosen["config"],summary=stats(rows,yr),rows=rows)
              reports.append(report);print("ROBUST_RESULT",json.dumps(report),flush=True)
          (out/"results.json").write_text(json.dumps(reports,indent=2))
          print("ROBUST_COMPLETE",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reclaim-common-robust-2024-2025
          path: analysis/reclaim_common_robust_2024_2025/
