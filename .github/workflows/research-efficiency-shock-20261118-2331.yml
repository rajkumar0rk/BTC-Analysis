name: Independent efficiency shock asymmetric BTC ETH research
on:
  push:
    branches: [research/efficiency-shock-trend-20261118-2331]
    paths:
      - scripts/research_efficiency_shock_trend_20261118_2331.py
      - .github/workflows/research-efficiency-shock-20261118-2331.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-efficiency-shock-20261118-2331
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas numba tabulate
      - name: Replay independent BTC ETH research
        run: python -u scripts/research_efficiency_shock_trend_20261118_2331.py
      - name: Upload complete result evidence
        uses: actions/upload-artifact@v4
        with:
          name: independent-efficiency-shock-20261118-2331
          path: analysis/efficiency_shock_trend_20261118_2331/
          if-no-files-found: error
          retention-days: 30
      - name: Commit compact results isolated branch ONLY
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/efficiency_shock_trend_20261118_2331/model_comparison.csv
          git add analysis/efficiency_shock_trend_20261118_2331/qualifying_models.csv
          git add analysis/efficiency_shock_trend_20261118_2331/promising_exploratory_models.csv
          git add analysis/efficiency_shock_trend_20261118_2331/candidate_concentration.csv
          git add analysis/efficiency_shock_trend_20261118_2331/candidate_monthly_pf.csv
          git add analysis/efficiency_shock_trend_20261118_2331/candidate_trade_ledger.csv
          git add analysis/efficiency_shock_trend_20261118_2331/quality.json
          git add analysis/efficiency_shock_trend_20261118_2331/RESEARCH_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: store independent asymmetric strategy test summary"
            git push origin HEAD:research/efficiency-shock-trend-20261118-2331
          fi
