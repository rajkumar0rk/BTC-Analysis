name: BTC VWAP independent research
on:
  push:
    branches: ['research/vwap-independent-2024-2025']
    paths:
      - 'scripts/research_vwap_independent.py'
      - '.github/workflows/research-vwap-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_vwap_independent.py
      - uses: actions/upload-artifact@v4
        with:
          name: vwap-independent-full
          path: |
            scratch/vwap_independent/results.csv
            scratch/vwap_independent/all_results.json.gz
          if-no-files-found: error
