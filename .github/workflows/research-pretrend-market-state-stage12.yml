name: Research BTC Stage 12 pre-move state and structural entries
on:
  push:
    branches: [main]
    paths:
      - scripts/research_pretrend_market_state_stage12.py
      - .github/workflows/research-pretrend-market-state-stage12.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage12-pretrend-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Run 1H 4H pre-move conditions with 5M structural entries
        run: python scripts/research_pretrend_market_state_stage12.py
      - name: Preserve detailed trade and state snapshots
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage12-pretrend-trades
          path: |
            analysis/institutional_discovery_stage12_pretrend/trade_ledger.csv.gz
            analysis/institutional_discovery_stage12_pretrend/pre_event_feature_snapshots.csv.gz
          if-no-files-found: error
          retention-days: 30
      - name: Persist complete results to GitHub
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage12_pretrend/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage12_pretrend/strategy_results.csv
          git add analysis/institutional_discovery_stage12_pretrend/chronological_consistency.csv
          git add analysis/institutional_discovery_stage12_pretrend/environment_vs_baseline.csv
          git add analysis/institutional_discovery_stage12_pretrend/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage12 MTF market-state findings"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
