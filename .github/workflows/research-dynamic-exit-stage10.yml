name: Research BTC Stage 10 adaptive larger targets
on:
  push:
    branches: [main]
    paths:
      - scripts/research_dynamic_exit_stage10.py
      - .github/workflows/research-dynamic-exit-stage10.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage10-dynamic-exit
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Replay 200-1200 targets and trailing profit exits
        run: python scripts/research_dynamic_exit_stage10.py
      - name: Save complete trade ledger as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage10-dynamic-target-trades
          path: analysis/institutional_discovery_stage10_dynamic_exits/trade_ledger.csv.gz
          if-no-files-found: error
          retention-days: 30
      - name: Commit numerical reports, successful or unprofitable
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage10_dynamic_exits/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage10_dynamic_exits/exit_comparison.csv
          git add analysis/institutional_discovery_stage10_dynamic_exits/chronological_consistency.csv
          git add analysis/institutional_discovery_stage10_dynamic_exits/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage 10 enlarged profit target results"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
