name: BTCUSD 15M Count Favorable 0.118% Before Original Exit
on:
  push:
    branches: [research/btc15m-first-0118-mfe-before-exit-20261123]
    paths:
      - scripts/research_btc15m_first_0118_mfe_20261123.py
      - .github/workflows/research-btc15m-first-0118-mfe.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-15m-first-0118-mfe
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Count favorable 0.118% before original exit
        shell: bash
        run: |
          mkdir -p analysis/btc15m_first_0118_favorable_before_exit_20261123
          set -o pipefail
          python -u scripts/research_btc15m_first_0118_mfe_20261123.py 2>&1 | tee analysis/btc15m_first_0118_favorable_before_exit_20261123/execution.log
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-0118-before-exit-count
          path: analysis/btc15m_first_0118_favorable_before_exit_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive research branch only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_first_0118_favorable_before_exit_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive +0.118pct before-exit trade count"
            git push origin HEAD:research/btc15m-first-0118-mfe-before-exit-20261123
          fi
