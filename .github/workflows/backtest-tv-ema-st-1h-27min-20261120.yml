name: BTCUSD EMA20 Supertrend 1h 27min offer replay
on:
  push:
    branches: [research/btc-ema-st-1h-27min-20261120]
    paths:
      - scripts/backtest_tv_ema_st_1h_27min_20261120.py
      - .github/workflows/backtest-tv-ema-st-1h-27min-20261120.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-ema-st-1h-27min-20261120
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Verify code syntax
        run: python -m py_compile scripts/backtest_tv_ema_st_1h_27min_20261120.py
      - name: SHA256-verify historical BTC 1m and run 1h screenshot replay
        run: python scripts/backtest_tv_ema_st_1h_27min_20261120.py
      - name: Report results in action summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('analysis/btc_tv_ema_st_1h_27min_20261120/summary.json')
          d=json.loads(p.read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## BTCUSD 1h EMA/ST, 27-minute offer, 0.001 BTC\n\n")
              out.write("| Cost scenario | Trades | Net USD | PF | Months positive | Eligible |\n|---|---:|---:|---:|---:|---:|\n")
              for k,v in d['scenarios'].items():
                  out.write(f"| {k} | {v['trades']} | {v['net_profit_usd']:+.2f} | {v['profit_factor']} | {v['profitable_months']}/22 | {v['scalp_eligible']} |\n")
              out.write("\nBased on 1h OHLC inferred intrabar path; **not** TradingView identical or exchange fills. 27m qualification uses conservative hour-end exit timestamps.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: btc-ema-st-1h-27min-replay
          path: |
            analysis/btc_tv_ema_st_1h_27min_20261120/*.csv
            analysis/btc_tv_ema_st_1h_27min_20261120/*.json
            analysis/btc_tv_ema_st_1h_27min_20261120/*.md
            analysis/btc_tv_ema_st_1h_27min_20261120/*.csv.gz
          if-no-files-found: error
      - name: Commit research results to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_tv_ema_st_1h_27min_20261120/
          if ! git diff --cached --quiet; then
            git commit -m "research: save 22-month BTC 1h 27m screenshot backtest"
            git push origin HEAD:research/btc-ema-st-1h-27min-20261120
          fi
