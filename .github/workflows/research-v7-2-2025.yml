name: Research BTC V7.2 2025 daily 4H trend
on:
  push:
    branches: [main]
    paths:
      - scripts/research_v7_2_daily_4h_2025.py
      - .github/workflows/research-v7-2-2025.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-v7-2-2025
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install numpy pandas
      - name: Compare BTC 2025 daily and 4H trend variants
        run: python scripts/research_v7_2_daily_4h_2025.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: BTC-V7-2-2025-results
          path: analysis/v7_2_2025/
          if-no-files-found: error
      - name: Commit report and trade ledgers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/v7_2_2025/
          if ! git diff --cached --quiet; then
            git commit -m "research(v7.2): persist 2025 daily 4h trend results"
            git pull --rebase origin main
            git push
          fi
