name: BTCUSD Step 5 — causal regime and exit selection every weekday
on:
  push:
    branches:
      - research/btc-daily-causal-regime-step5
    paths:
      - scripts/research_btc_daily_causal_regime_step5.py
      - .github/workflows/research-btc-daily-regime-step5.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Recheck 477 mandatory weekday trades with 26400 regime rules
        run: python scripts/research_btc_daily_causal_regime_step5.py
      - name: Publish daily monthly and all-variant results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-daily-causal-regime-step5
          path: analysis/btc_daily_causal_regime_step5/
          if-no-files-found: warn
