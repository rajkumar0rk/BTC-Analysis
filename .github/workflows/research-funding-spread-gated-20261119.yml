name: Institutional funding spread break-even study BTC ETH
on:
  push:
    branches: [research/institutional-funding-spread-gated-20261119]
    paths:
      - scripts/research_funding_spread_gated_20261119.py
      - .github/workflows/research-funding-spread-gated-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install numpy pandas
      - name: Reproduce causal BTC ETH funding-spread research
        run: python -u scripts/research_funding_spread_gated_20261119.py
      - name: Upload full source-compatible evidence
        uses: actions/upload-artifact@v4
        with:
          name: institutional-funding-spread-study
          path: analysis/institutional_funding_spread_20261119/
          if-no-files-found: error
      - name: Preserve compact results on separate research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_funding_spread_20261119/summary.csv
          git add analysis/institutional_funding_spread_20261119/monthly.csv
          git add analysis/institutional_funding_spread_20261119/quality.json
          git add analysis/institutional_funding_spread_20261119/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive institutional funding spread feasibility results"
            git push origin HEAD:research/institutional-funding-spread-gated-20261119
          fi