name: BTCUSD fixed-hour target-first study — Step 2
on:
  push:
    branches:
      - research/btc-daily-opportunity-map-step1
    paths:
      - scripts/research_btc_daily_target_first_step2.py
      - .github/workflows/research-btc-daily-target-first-step2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Replay fixed-clock long short target stop first on every weekday
        run: python scripts/research_btc_daily_target_first_step2.py
      - name: Publish outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-daily-target-first-step2
          path: analysis/btc_daily_target_first_step2/
          if-no-files-found: warn
