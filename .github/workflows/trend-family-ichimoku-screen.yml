name: Trend family Ichimoku BTC2025 first screen
on:
  push:
    branches:
      - research/trend-following-family-20261121
    paths:
      - .github/workflows/trend-family-ichimoku-screen.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'tabulate==0.9.0'
      - name: Execute actual historical BTC2025 Ichimoku first screen
        run: python scripts/trend_family_ichimoku_first_screen.py
      - name: Archive all actual output including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-family-ichimoku-btc2025-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: analysis/trend_following_family_20261121/ichimoku_screen/
