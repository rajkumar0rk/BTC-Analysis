name: BTC ETH 1H EMA second touch TP1000 no lock ST flip exit
on:
  push:
    branches: [research/ema20-second-touch-1h-tp1000-stflip-20261121]
    paths:
      - scripts/research_ema20_second_touch_1h_tp1000_stflip_paths.py
      - .github/workflows/research-ema20-second-touch-1h-tp1000-stflip.yml
      - analysis/ema20_second_touch_1h_tp1000_stflip_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-second-touch-1h-tp1000-stflip
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical libraries
        run: python -m pip install numpy pandas
      - name: Backtest exact 1H second-touch fixed TP 1000 plus confirmed Supertrend flip
        shell: bash
        run: |
          mkdir -p analysis/ema20_second_touch_1h_tp1000_stflip_20261121
          set -o pipefail
          python -u scripts/research_ema20_second_touch_1h_tp1000_stflip_paths.py 2>&1 | tee analysis/ema20_second_touch_1h_tp1000_stflip_20261121/execution.log
      - name: Upload outputs or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-ema-1h-tp1000-stflip
          path: analysis/ema20_second_touch_1h_tp1000_stflip_20261121/
          retention-days: 30
          if-no-files-found: warn
      - name: Save outputs to research branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_1h_tp1000_stflip_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive TP1000 no profit-lock Supertrend-flip results"
            git push origin HEAD:research/ema20-second-touch-1h-tp1000-stflip-20261121
          fi
