name: BTC ETH hypothetical cross-margin 100x $100 wallet backtest
on:
  push:
    branches: ['research/btc-eth-cross-100x-20261120']
    paths:
      - 'scripts/replay_btc_eth_cross_margin_100x.py'
      - '.github/workflows/replay-btc-eth-cross-100x.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-eth-cross-100x
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas
      - name: Syntax check and run both BTC and ETH
        run: |
          python -m py_compile scripts/replay_btc_eth_cross_margin_100x.py
          python scripts/replay_btc_eth_cross_margin_100x.py > /tmp/cross_btc_eth_run.log
          grep 'CROSS_MARGIN_HYPOTHETICAL_REPLAY_SUCCESS' /tmp/cross_btc_eth_run.log
          grep '^RESULT' /tmp/cross_btc_eth_run.log
          grep '^MONTHS' /tmp/cross_btc_eth_run.log
      - name: Verify cross arithmetic and realistic research labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('analysis/btc_eth_cross_margin_100x_20261120/summary.json')
          d=json.loads(p.read_text())
          assert d['settings']['hypothetical_only_cross_not_confirmed_for_INR_settled_BTCUSD_ETHUSD']
          for a in ('BTC','ETH'):
              for k,v in d[a].items():
                  if not isinstance(v,dict) or not k.startswith(('history_','recent10k_')):continue
                  assert v['initial_wallet_usd']==100
                  assert v['closed_trades']>0
                  assert 0<=v['max_closed_equity_drawdown_pct']<=100
                  assert 0<=v['max_intrabar_equity_drawdown_pct']<=100
                  assert v['ending_wallet_usd']>=0
                  assert v['max_intrabar_equity_drawdown_pct']+1e-5>=v['max_closed_equity_drawdown_pct']-.1
                  assert v['completed_months']==22 if k.startswith('history_') else v['completed_months']<=3
          print('Cross scenario mathematical assumptions and both assets validated')
          PY
      - name: Upload reproducible research scenario outputs
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-hypothetical-cross-margin-drawdowns
          retention-days: 30
          if-no-files-found: error
          path: |
            analysis/btc_eth_cross_margin_100x_20261120/*.json
            analysis/btc_eth_cross_margin_100x_20261120/*.csv
            analysis/btc_eth_cross_margin_100x_20261120/*.csv.gz
      - name: Save results only to cross research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_eth_cross_margin_100x_20261120
          if ! git diff --cached --quiet; then
            git commit -m "research: save hypothetical cross BTC ETH monthly returns, trade log and drawdowns"
            git pull --rebase origin research/btc-eth-cross-100x-20261120
            git push origin HEAD:research/btc-eth-cross-100x-20261120
          fi
