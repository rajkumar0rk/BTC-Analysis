name: ETH fixed 0.20 USD preliquidation replay comparison
on:
  push:
    branches: ['research/eth-preliq-fixed-020-20261120']
    paths:
      - 'scripts/replay_eth_ema_st_preliq_fixed_0p20.py'
      - '.github/workflows/backtest-eth-preliq-fixed-020.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eth-preliq-fixed-020-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas
      - name: Compile and run fixed-0.20 ETH replay on verified 1m data
        run: |
          python -m py_compile scripts/replay_eth_ema_st_preliq_fixed_0p20.py
          python scripts/replay_eth_ema_st_preliq_fixed_0p20.py > /tmp/eth_preliq_020_replay.log
          tail -35 /tmp/eth_preliq_020_replay.log
      - name: Compare with previous BTC-relative ETH buffer
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          base=Path('analysis/eth_ema_st_preliq_one_point_20261120')
          out=Path('analysis/eth_ema_st_preliq_fixed_0p20_20261120')
          a=json.loads((base/'summary.json').read_text())
          b=json.loads((out/'summary.json').read_text())
          assert b['settings']['fixed_eth_buffer_usd']==0.20
          report={'instrument':'ETHUSD','change':'fixed ETH $0.20 preliq buffer instead of entry-relative BTC 1 point / $80000 reference',
                  'historical_replay_limits':b['disclaimer'],'source':b['source'],
                  'scenarios':{}}
          for scenario in ('all_history_original_offer_threshold','all_history_original_nooffer_threshold',
                           'all_history_original_offer_bankruptcy','all_history_original_nooffer_bankruptcy'):
              old=a[scenario];new=b[scenario]
              keys=('starting_portfolio_usd','ending_portfolio_usd','net_profit_usd','total_return_pct',
                    'completed_trades','wins','losses','win_rate_pct','net_profit_factor','assumed_liquidations',
                    'max_closed_equity_drawdown_pct','completed_months','profitable_completed_months',
                    'losing_completed_months','flat_completed_months','fees_entry_usd','fees_exit_usd',
                    'gst_usd','liq_penalties_usd')
              oldm=pd.read_csv(base/(scenario+'_monthly.csv'))
              newm=pd.read_csv(out/(scenario+'_monthly.csv'))
              assert oldm.month_ist.equals(newm.month_ist)
              comparison=oldm[['month_ist','complete_month','net_profit_usd','monthly_return_pct']].rename(
                         columns={'net_profit_usd':'previous_net_usd','monthly_return_pct':'previous_return_pct'})
              comparison['fixed_020_net_usd']=newm.net_profit_usd
              comparison['fixed_020_return_pct']=newm.monthly_return_pct
              comparison['net_change_usd']= (newm.net_profit_usd-oldm.net_profit_usd).round(4)
              comparison['return_change_pp']= (newm.monthly_return_pct-oldm.monthly_return_pct).round(2)
              comparison.to_csv(out/(scenario+'_comparison_monthly.csv'),index=False)
              report['scenarios'][scenario]={'previous':{k:old.get(k) for k in keys},
                                            'fixed_020':{k:new.get(k) for k in keys}}
          (out/'comparison.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload reproducible result artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eth-preliq-fixed-020-backtest
          retention-days: 30
          if-no-files-found: error
          path: |
            analysis/eth_ema_st_preliq_fixed_0p20_20261120/*.json
            analysis/eth_ema_st_preliq_fixed_0p20_20261120/*.csv
            analysis/eth_ema_st_preliq_fixed_0p20_20261120/*.csv.gz
      - name: Preserve results on research branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/eth_ema_st_preliq_fixed_0p20_20261120/
          if ! git diff --cached --quiet; then
            git commit -m "research(eth): store fixed 0.20 preliquidation 22-month replay results"
            git push origin HEAD:research/eth-preliq-fixed-020-20261120
          fi
