name: 15M EMA20 second touch TP-only no stop-loss
on:
  push:
    branches:
      - research/ema20-second-touch-no-sl-20261121
    paths:
      - scripts/research_ema20_second_touch_no_sl.py
      - .github/workflows/research-ema20-second-touch-no-sl.yml
      - analysis/ema20_second_touch_no_sl_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-second-touch-no-sl-run
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install numpy pandas
      - name: Backtest BTC ETH TP-only with month-end floating PnL
        run: python scripts/research_ema20_second_touch_no_sl.py
      - name: Upload ledger and month-end floating PnL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ema20-15m-second-touch-no-sl-btc-eth
          path: analysis/ema20_second_touch_no_sl_20261121/
          retention-days: 30
          if-no-files-found: error
      - name: Commit report on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_no_sl_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive no-SL 15m BTC ETH floating-equity and TP outcomes"
            git push origin HEAD:research/ema20-second-touch-no-sl-20261121
          fi
