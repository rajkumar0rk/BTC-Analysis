name: BTC momentum consolidation simplification
on:
  push:
    branches: ['research/momentum-continuation-simplification']
    paths:
      - 'scripts/research_momentum_continuation_simplification.py'
      - '.github/workflows/research-momentum-continuation-simplification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_momentum_continuation_simplification.py
      - uses: actions/upload-artifact@v4
        with:
          name: momentum-continuation-simplification-full
          path: |
            scratch/momentum_continuation_simplification/results.csv
            scratch/momentum_continuation_simplification/all_results.json.gz
          if-no-files-found: error
