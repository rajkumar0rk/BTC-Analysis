name: BTC EMA20 ST percentage direct profit lock grid
on:
  push:
    branches:
      - research/st-ema20-percent-direct-lock-grid-20261122
    paths:
      - scripts/backtest_st_ema20_percent_direct_profit_locks.py
      - .github/workflows/research-st-ema20-percent-direct-lock-grid.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-percent-direct-lock-grid
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required dependencies
        run: python -m pip install numpy pandas
      - name: Validate Python
        run: python -m py_compile scripts/backtest_st_ema20_percent_direct_profit_locks.py
      - name: Replay 156 percent-based stop-lock historical scenarios
        run: python scripts/backtest_st_ema20_percent_direct_profit_locks.py
      - name: Upload full reports for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-ema20-percent-lock-grid-156
          path: analysis/st_ema20_percent_direct_lock_grid_1h/
          if-no-files-found: warn
      - name: Commit verified results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_percent_direct_lock_grid_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist percent stop lock grid backtests"
            git pull --rebase origin research/st-ema20-percent-direct-lock-grid-20261122
            git push origin HEAD:research/st-ema20-percent-direct-lock-grid-20261122
          fi
