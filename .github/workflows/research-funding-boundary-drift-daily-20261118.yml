name: Independent Funding Boundary Drift Daily Net
on:
  push:
    branches: [research/daily-funding-boundary-drift-20261118]
    paths:
      - scripts/research_funding_boundary_drift_daily_20261118.py
      - .github/workflows/research-funding-boundary-drift-daily-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python -u scripts/research_funding_boundary_drift_daily_20261118.py
      - uses: actions/upload-artifact@v4
        with:
          name: funding-boundary-daily-20261118
          path: analysis/funding_boundary_drift_daily_20261118/
          if-no-files-found: error
      - name: Commit independent evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/funding_boundary_drift_daily_20261118/
          if ! git diff --cached --quiet; then
            git commit -m "research: funding boundary daily net event study"
            git push origin HEAD:research/daily-funding-boundary-drift-20261118
          fi