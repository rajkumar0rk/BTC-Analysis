name: BTCUSD Step61 confirmed gross edge non-regression
on:
  push:
    branches: [research/btc-step61-gross-edge]
    paths:
      - scripts/step56_baseline.py
      - scripts/research_btc_step61_gross_edge.py
      - .github/workflows/research-btc-step61-gross-edge.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba scikit-learn tabulate
      - run: python -m py_compile scripts/step56_baseline.py scripts/research_btc_step61_gross_edge.py
      - run: python scripts/research_btc_step61_gross_edge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step61-gross-edge
          path: analysis/btc_step61_gross_edge/
