name: BTCUSD 15M Relative Volume Reclaim Robustness
on:
  push:
    branches: [research/btc15m-volume-reclaim-robustness-20261123]
    paths:
      - scripts/research_btc15m_volume_reclaim_robustness_20261123.py
      - .github/workflows/research-btc15m-volume-reclaim-robustness.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc15m-reclaim-volume-robustness
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Backtest BTCUSD only 15m signal 1m fills
        shell: bash
        run: |
          mkdir -p analysis/btc15m_volume_reclaim_robustness_20261123
          set -o pipefail
          python -u scripts/research_btc15m_volume_reclaim_robustness_20261123.py 2>&1 | tee analysis/btc15m_volume_reclaim_robustness_20261123/execution.log
      - name: Upload study artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusd15m-volume-reclaim-robustness-20261123
          path: analysis/btc15m_volume_reclaim_robustness_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive only on research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_volume_reclaim_robustness_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BTC 15m volume reclaim robustness comparison"
            git push origin HEAD:research/btc15m-volume-reclaim-robustness-20261123
          fi
