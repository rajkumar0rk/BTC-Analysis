name: Audit BTC regime selector hardening with 1M account replay
on:
  push:
    branches:
      - research/btc-regime-selector-hardening-20261121
    paths:
      - scripts/research_btc_selector_hardening_20261121.py
      - analysis/btc_selector_hardening_20261121/NOVELTY_CHECK.md
      - .github/workflows/research-btc-selector-hardening.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-selector-hardening-20261121
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Run strict past-only selector, baselines and costs
        run: python scripts/research_btc_selector_hardening_20261121.py
      - name: Preserve reproducible evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-regime-selector-hardening-20261121
          path: analysis/btc_selector_hardening_20261121/
          if-no-files-found: error
          retention-days: 90
      - name: Commit audit outputs to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_selector_hardening_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save strict selector and execution stress evidence"
            git push origin HEAD:research/btc-regime-selector-hardening-20261121
          fi
