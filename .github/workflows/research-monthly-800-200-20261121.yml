name: Monthly BTC ETH activation800 trailing STOP POINTS200
on:
  push:
    branches:
      - research/monthly-trailing-stop-800-200-20261121
    paths:
      - scripts/monthly_800_200_ema20st_stop_points_20261121.py
      - .github/workflows/research-monthly-800-200-20261121.yml

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 numba==0.61.2
      - name: Run 800/200 monthly 1m mark/traded backtest
        run: |
          python -m py_compile scripts/monthly_800_200_ema20st_stop_points_20261121.py
          python scripts/monthly_800_200_ema20st_stop_points_20261121.py
      - name: Upload monthly and trade reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-800-200-trailing-stop-monthly
          path: analysis/monthly_800_200_20261121/
          if-no-files-found: warn
      - name: Save reports on isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/monthly_800_200_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: BTC ETH 800/200 monthly trailing stop points ledgers"
            git push origin HEAD:research/monthly-trailing-stop-800-200-20261121
          fi
