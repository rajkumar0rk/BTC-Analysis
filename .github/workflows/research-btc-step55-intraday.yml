name: BTCUSD Step55 confirmed intraday research
on:
  push:
    branches: [research/btc-step55-intraday]
    paths:
      - scripts/research_btc_step55_intraday.py
      - .github/workflows/research-btc-step55-intraday.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba scikit-learn tabulate
      - run: python -m py_compile scripts/research_btc_step55_intraday.py
      - run: python scripts/research_btc_step55_intraday.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step55-intraday
          path: analysis/btc_step55_intraday/
