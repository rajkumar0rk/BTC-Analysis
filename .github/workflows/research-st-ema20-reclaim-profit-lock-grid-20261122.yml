name: BTC EMA20 Reclaim 2pct SL variable profit lock grid
on:
  push:
    branches:
      - research/st-ema20-initial-stop-grid-20261122-v1
    paths:
      - scripts/backtest_st_ema20_reclaim_profit_lock_grid_20261122.py
      - .github/workflows/research-st-ema20-reclaim-profit-lock-grid-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-ema20-reclaim-2pct-profit-lock-grid-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Check syntax
        run: python -m py_compile scripts/backtest_st_ema20_reclaim_profit_lock_grid_20261122.py
      - name: Run Reclaim profit-lock grid against BTCUSD 1m archive
        run: python scripts/backtest_st_ema20_reclaim_profit_lock_grid_20261122.py
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-reclaim-profit-lock-grid-2pct-sl
          path: analysis/st_ema20_reclaim_profit_lock_grid_20261122/
          if-no-files-found: warn
      - name: Commit verified research results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_reclaim_profit_lock_grid_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: save EMA20 Reclaim 2pct SL profit-lock grid"
            git pull --rebase origin research/st-ema20-initial-stop-grid-20261122-v1
            git push origin HEAD:research/st-ema20-initial-stop-grid-20261122-v1
          fi
