name: Verify user Pine ATR Only BTC 15m entry 1m native trail backtest
on:
  push:
    branches:
      - research/pine-parity-15m-atr-only-native1000-20261121
    paths:
      - scripts/backtest_pine_atr_only_15m_source_20261121.py
      - .github/workflows/pine-atronly-15m-1m-source-20261121.yml

permissions:
  contents: write

concurrency:
  group: pine-atr-only-15m-source-20261121
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested historical replay requirements
        run: python -m pip install numpy==2.2.3 pandas==2.2.3 numba==0.61.2
      - name: Run source-aware ATR Only 15m entry 1m chart backtest
        run: |
          python -m py_compile scripts/backtest_pine_atr_only_15m_source_20261121.py
          python scripts/backtest_pine_atr_only_15m_source_20261121.py
      - name: Upload trade ledgers and monthly / current-week summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-pine-atr-only-15m-1m-chart-20261121
          path: analysis/pine_atr_only_15m_1m_source_20261121/
          if-no-files-found: warn
      - name: Commit research reports only; never refreshed historical prices
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/pine_atr_only_15m_1m_source_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: 22mo and week source-aware 15m ATR Only Pine replay"
            git push origin HEAD:research/pine-parity-15m-atr-only-native1000-20261121
          fi
