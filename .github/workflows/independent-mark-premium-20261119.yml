name: Independent mark premium falsification 20261119
on:
  push:
    branches:
      - research/mark-trade-dislocation-20261119-0823
    paths:
      - '.github/workflows/independent-mark-premium-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python scripts/independent_mark_premium_20261119.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-mark-premium-results
          path: analysis/independent_mark_premium_20261119/
