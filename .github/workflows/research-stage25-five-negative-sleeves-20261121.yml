name: BTC Stage25 optimize five historical negative-return strategies
on:
  push:
    branches:
      - research/stage25-optimize-five-negative-sleeves-20261121-v1
    paths:
      - scripts/research_stage25_optimize_five_negative_sleeves_20261121.py
      - .github/workflows/research-stage25-five-negative-sleeves-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-independent-1m-strategy-optimizations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research prerequisites
        run: python -m pip install pandas numpy numba tabulate
      - name: Compile-check experiment
        run: python -m py_compile scripts/research_stage25_optimize_five_negative_sleeves_20261121.py
      - name: Run 2025-only optimizations against complete 1m BTCUSD OHLC
        run: |
          PYTHONUNBUFFERED=1 PYTHONPATH=scripts python scripts/research_stage25_optimize_five_negative_sleeves_20261121.py
      - name: Preserve baseline-parity and 2026 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage25-all-five-standalone-optimization
          path: analysis/stage25_optimize_five_negative_sleeves_20261121/
          retention-days: 30
          if-no-files-found: warn
