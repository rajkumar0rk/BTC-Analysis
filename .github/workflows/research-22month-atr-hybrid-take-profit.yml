name: 22-month BTC ETH ATR hybrid profit exit A B C D
on:
  push:
    branches:
      - research/22month-hybrid-hourly-atr-profit-20261121
    paths:
      - scripts/atr_hybrid_1h_close_vs_1m_full22_20261121.py
      - .github/workflows/research-22month-atr-hybrid-take-profit.yml

permissions:
  contents: write

concurrency:
  group: 22month-atr-hybrid-profit-20261121
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 numba==0.61.2
      - name: Compile and run causal exit tests
        run: |
          python -m py_compile scripts/atr_hybrid_1h_close_vs_1m_full22_20261121.py
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from atr_hybrid_1h_close_vs_1m_full22_20261121 import unit_tests
          unit_tests()
          print("CAUSAL_HOURLY_TRAIL_TESTS_PASS")
          PY
      - name: Run 22 complete months, BTC and ETH, 4 variants 2 exit modes 2 trigger sources
        run: python scripts/atr_hybrid_1h_close_vs_1m_full22_20261121.py
      - name: Upload full A-D ATR variant results and trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-full22-atr-hybrid-hourly-take-profit
          path: analysis/atr_take_profit_1h_close_vs_1m_full22_20261121/
          if-no-files-found: warn
      - name: Commit research reports only to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/atr_take_profit_1h_close_vs_1m_full22_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: 22-month BTC ETH ATR hybrid take-profit comparison A-D"
            git push origin HEAD:research/22month-hybrid-hourly-atr-profit-20261121
          fi
