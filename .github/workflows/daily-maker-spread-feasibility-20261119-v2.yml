name: Daily institutional maker spread feasibility (isolated)
on:
  push:
    branches:
      - research/daily-maker-spread-feasibility-20261119-v2
    paths:
      - scripts/research_daily_maker_spread_feasibility_20261119_v2.py
      - .github/workflows/daily-maker-spread-feasibility-20261119-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quote-upper-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit real Delta India L2 quote snapshots without invented fills
        run: python scripts/research_daily_maker_spread_feasibility_20261119_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-spread-feasibility
          path: analysis/daily_maker_spread_feasibility_20261119_v2/
      - name: Commit diagnostics only to isolated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_maker_spread_feasibility_20261119_v2
          if ! git diff --cached --quiet; then
            git commit -m "research: preserve BTC maker spread quote audit"
            git push origin HEAD:research/daily-maker-spread-feasibility-20261119-v2
          fi
