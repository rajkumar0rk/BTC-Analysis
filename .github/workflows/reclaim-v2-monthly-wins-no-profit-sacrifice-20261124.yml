name: Reclaim V2 - higher profitable months no profit sacrifice
on:
  push:
    branches:
      - research/reclaim-v2-monthly-wins-no-profit-sacrifice-20261124
    paths:
      - scripts/research_reclaim_v2_monthly_wins_preserve_net_20261124.py
      - .github/workflows/reclaim-v2-monthly-wins-no-profit-sacrifice-20261124.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-reclaim-v2-no-profit-sacrifice-20261124
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Validate syntax
        run: python -m py_compile scripts/research_reclaim_v2_monthly_wins_preserve_net_20261124.py
      - name: Replay Reclaim V2 and preserve original monthly profits
        run: python scripts/research_reclaim_v2_monthly_wins_preserve_net_20261124.py
      - name: Upload research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-reclaim-v2-preserve-net-audit
          path: analysis/reclaim_v2_preserve_monthly_profit_20261124/
          if-no-files-found: warn
      - name: Commit reproducible research (branch only)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/reclaim_v2_preserve_monthly_profit_20261124/
          if ! git diff --cached --quiet; then
            git commit -m "research: save Reclaim V2 monthly win candidates and strict profitability audit"
            git pull --rebase origin research/reclaim-v2-monthly-wins-no-profit-sacrifice-20261124
            git push origin HEAD:research/reclaim-v2-monthly-wins-no-profit-sacrifice-20261124
          fi
