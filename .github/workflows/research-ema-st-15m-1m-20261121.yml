name: Research EMA20 Supertrend 15m signals and 1m execution
on:
  push:
    branches:
      - research/ema-st-15m-1m-20261121
    paths:
      - scripts/replay_ema_st_15m_entries_1m_exits_20261121.py
      - .github/workflows/research-ema-st-15m-1m-20261121.yml
permissions:
  contents: write
concurrency:
  group: research-ema-st-15m-1m-20261121
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific packages
        run: python -m pip install pandas==2.2.3 numpy==2.2.3
      - name: Validate source compiles
        run: python -m py_compile scripts/replay_ema_st_15m_entries_1m_exits_20261121.py
      - name: Replay verified BTC and ETH 1-minute historical candles
        run: python scripts/replay_ema_st_15m_entries_1m_exits_20261121.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-st-15m-signals-1m-exits-20261121
          path: analysis/ema_st_15m_1m_20261121/
          if-no-files-found: warn
      - name: Commit completed research only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema_st_15m_1m_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: record 1m-execution BTC ETH monthly results"
            git push origin HEAD:research/ema-st-15m-1m-20261121
          fi
