name: Independent daily-net VWAP reversion BTC ETH
on:
  push:
    branches: [research/daily-net-vwap-reversion-20261118]
    paths:
      - scripts/research_daily_net_vwap_reversion_20261118.py
      - .github/workflows/research-daily-net-vwap-reversion-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas
      - name: Execute independent daily-profit BTC ETH backtest
        run: python -u scripts/research_daily_net_vwap_reversion_20261118.py
      - name: Upload complete evidence
        uses: actions/upload-artifact@v4
        with:
          name: daily-net-vwap-20261118
          path: analysis/daily_net_vwap_reversion_20261118/
          if-no-files-found: error
      - name: Save summary on isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_net_vwap_reversion_20261118/summary.csv
          git add analysis/daily_net_vwap_reversion_20261118/selected.csv
          git add analysis/daily_net_vwap_reversion_20261118/selected_monthly.csv
          git add analysis/daily_net_vwap_reversion_20261118/quality.json
          git add analysis/daily_net_vwap_reversion_20261118/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive daily profit VWAP mean-reversion results"
            git push origin HEAD:research/daily-net-vwap-reversion-20261118
          fi