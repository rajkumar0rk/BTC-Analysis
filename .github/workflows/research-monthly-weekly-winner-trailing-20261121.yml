name: Monthly 22-month report for this week's best trailing-stop settings
on:
  push:
    branches:
      - research/monthly-weekly-winner-stop-points-20261121
    paths:
      - scripts/monthly_weekly_winners_ema20st_stop_points_20261121.py
      - .github/workflows/research-monthly-weekly-winner-trailing-20261121.yml
permissions:
  contents: write
jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research requirements
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 numba==0.61.2
      - name: Validate and run monthly replay
        run: |
          python -m py_compile scripts/monthly_weekly_winners_ema20st_stop_points_20261121.py
          python scripts/monthly_weekly_winners_ema20st_stop_points_20261121.py
      - name: Upload monthly reports and trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-btc-eth-weekly-winner-trailing-stops
          path: analysis/monthly_weekly_winners_20261121/
          if-no-files-found: warn
      - name: Save completed monthly reports on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/monthly_weekly_winners_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: monthly BTC ETH trailing stop winners and baselines"
            git push origin HEAD:research/monthly-weekly-winner-stop-points-20261121
          fi
