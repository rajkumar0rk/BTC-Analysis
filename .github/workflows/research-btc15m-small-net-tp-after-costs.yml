name: BTCUSD 15M Small Net Take Profit After Costs
on:
  push:
    branches: [research/btc15m-small-net-tp-after-costs-20261123]
    paths:
      - scripts/research_btc15m_small_net_tp_20261123.py
      - .github/workflows/research-btc15m-small-net-tp-after-costs.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc15m-small-net-tp-after-costs
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: BTCUSD only 15m entries and 1m net TP after trading costs
        shell: bash
        run: |
          mkdir -p analysis/btc15m_small_net_tp_after_costs_20261123
          set -o pipefail
          python -u scripts/research_btc15m_small_net_tp_20261123.py 2>&1 | tee analysis/btc15m_small_net_tp_after_costs_20261123/execution.log
      - name: Upload backtest or error artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-small-net-profit-after-fees-gst
          path: analysis/btc15m_small_net_tp_after_costs_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive only to research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_small_net_tp_after_costs_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BTC 15m small net TP backtest"
            git push origin HEAD:research/btc15m-small-net-tp-after-costs-20261123
          fi
