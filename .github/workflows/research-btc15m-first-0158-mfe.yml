name: BTCUSD 15M Count Favorable 0.158% Before Original Exit
on:
  push:
    branches: [research/btc15m-first-0158-mfe-before-exit-20261123]
    paths:
      - scripts/research_btc15m_first_0158_mfe_20261123.py
      - .github/workflows/research-btc15m-first-0158-mfe.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-15m-first-0158-mfe
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Analyze favorable 0.158 percent touches before original exits
        shell: bash
        run: |
          mkdir -p analysis/btc15m_first_0158_favorable_before_exit_20261123
          set -o pipefail
          python -u scripts/research_btc15m_first_0158_mfe_20261123.py 2>&1 | tee analysis/btc15m_first_0158_favorable_before_exit_20261123/execution.log
      - name: Upload results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-15m-0158-before-exit
          path: analysis/btc15m_first_0158_favorable_before_exit_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive only to the research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_first_0158_favorable_before_exit_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BTC 15m +0.158 percent before-exit count"
            git push origin HEAD:research/btc15m-first-0158-mfe-before-exit-20261123
          fi
