name: BTCUSD Step 4 — broad risk reward grid 11016
on:
  push:
    branches:
      - research/btc-daily-opportunity-map-step1
    paths:
      - scripts/research_btc_daily_rr_grid_step4.py
      - .github/workflows/research-btc-daily-rr-grid-step4.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Run broad BTC risk reward optimization with no +0.2pct fixed target
        run: python scripts/research_btc_daily_rr_grid_step4.py
      - name: Upload all historical trial and daily and monthly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-daily-rr-grid-step4
          path: analysis/btc_daily_rr_grid_step4/
          if-no-files-found: warn
