name: BTC 15m preserve every profitable month - reduce losses
on:
  push:
    branches:
      - research/st-preserve-positive-month-pnl-20261122
    paths:
      - scripts/research_st_preserve_all_profitable_month_pnl.py
      - .github/workflows/research-st-preserve-positive-months.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Enforce hard winning-month preservation on causal entry gates
        run: python -u scripts/research_st_preserve_all_profitable_month_pnl.py
      - name: Archive research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC_ST_month_protection_results
          path: analysis/st_preserve_all_positive_month_pnl_20261122/
          if-no-files-found: warn
      - name: Commit successful audit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_preserve_all_positive_month_pnl_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: hard constraint preserve positive months and reduce losing"
            git push origin HEAD:research/st-preserve-positive-month-pnl-20261122
          fi
