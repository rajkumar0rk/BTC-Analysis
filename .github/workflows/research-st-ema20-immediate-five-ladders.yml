name: BTC 1H ST EMA20 immediate five profit-lock ladders
on:
  push:
    branches:
      - research/st-ema20-immediate-five-lock-ladders-20261122
    paths:
      - scripts/backtest_st_ema20_immediate_five_ladders.py
      - .github/workflows/research-st-ema20-immediate-five-ladders.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-immediate-five-ladders
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas numpy
        run: python -m pip install pandas numpy
      - name: Verify source syntax
        run: python -m py_compile scripts/backtest_st_ema20_immediate_five_ladders.py
      - name: Replay two intraminute price paths for five exact profit ladders
        run: python scripts/backtest_st_ema20_immediate_five_ladders.py
      - name: Upload 30 backtests and their trade/monthly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-ema20-five-immediate-profit-locks
          path: analysis/st_ema20_immediate_five_ladders_1h/
          if-no-files-found: warn
      - name: Save validated findings to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_immediate_five_ladders_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist same-minute direct-lock five ladder results"
            git pull --rebase origin research/st-ema20-immediate-five-lock-ladders-20261122
            git push origin HEAD:research/st-ema20-immediate-five-lock-ladders-20261122
          fi
