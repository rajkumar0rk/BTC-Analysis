name: BTC RSI14 reversal diagnostics 2024-2025
on:
  push:
    branches: ['research/rsi14-reversal-diagnostics-2024-2025']
    paths:
      - 'scripts/research_rsi14_reversal_diagnostics_2024_2025.py'
      - '.github/workflows/research-rsi14-reversal-diagnostics-2024-2025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_rsi14_reversal_diagnostics_2024_2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: rsi14-reversal-diagnostics
          path: scratch/rsi14_reversal_diagnostics/
          if-no-files-found: error
