name: Stage28 independent BTC impact shock research
on:
  push:
    branches: [research/independent-stage28-impact-shock]
    paths:
      - scripts/research_stage28_impact_shock.py
      - .github/workflows/research-stage28-impact-shock.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-btc-stage28
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-stage28-impact-shock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Verify original raw archive and run independent Stage28
        run: python scripts/research_stage28_impact_shock.py
      - name: Commit isolated reproducible results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_stage28_impact_shock/
          if ! git diff --cached --quiet; then
            git commit -m "research: record Stage28 independent after-cost 22-month backtest"
            git push origin HEAD:research/independent-stage28-impact-shock
          fi
