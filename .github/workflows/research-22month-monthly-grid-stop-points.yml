name: Full 22-month monthly grid BTC ETH trailing STOP POINTS
on:
  push:
    branches:
      - research/22month-all-param-monthly-scoreboard-20261121
    paths:
      - scripts/monthly_grid_all_trailing_stop_points_20261121.py
      - .github/workflows/research-22month-monthly-grid-stop-points.yml

permissions:
  contents: write

concurrency:
  group: research-22month-all-param-monthly-grid
  cancel-in-progress: false

jobs:
  full-months:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.3 numba==0.61.2
      - name: Verify and replay 22 complete months for all combinations
        run: |
          python -m py_compile scripts/monthly_grid_all_trailing_stop_points_20261121.py
          python scripts/monthly_grid_all_trailing_stop_points_20261121.py
      - name: Upload full monthly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-all-98-settings-22-complete-months
          path: analysis/22month_all_stop_points_grid_20261121/
          if-no-files-found: warn
      - name: Persist research results on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/22month_all_stop_points_grid_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: all 98 trailing stop point settings month by month BTC ETH"
            git push origin HEAD:research/22month-all-param-monthly-scoreboard-20261121
          fi
