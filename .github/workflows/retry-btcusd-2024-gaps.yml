name: BTCUSD 2024 missing data automatic retry
on:
  push:
    branches: [research/btcusd-2024-gap-retry-20261124]
    paths:
      - scripts/retry_btcusd_2024_gaps.py
      - .github/workflows/retry-btcusd-2024-gaps.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btcusd-2024-gap-retry
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/btcusd-2024-gap-retry-20261124
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - name: Automatic retry rounds with durable checkpoints
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m py_compile scripts/retry_btcusd_2024_gaps.py
          for i in $(seq 1 8); do
            if python -c 'import json; assert json.load(open("data/delta_india/BTCUSD/2024_verified_archive/manifest.json"))["totals"]["trade_1m"]["missing"]==0' 2>/dev/null; then
              echo "100% coverage reached"; break
            fi
            python -u scripts/retry_btcusd_2024_gaps.py
            git add data/delta_india/BTCUSD/2024_verified_archive analysis/btcusd_2024_gap_retry
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint native BTCUSD gap retry round"
              git push origin HEAD:research/btcusd-2024-gap-retry-20261124
            fi
            if python -c 'import json; s=json.load(open("analysis/btcusd_2024_gap_retry/state.json")); assert s["complete"] or s["no_progress"]>=4' 2>/dev/null; then
              echo "Complete or four consecutive zero-progress rounds; stop this run"; break
            fi
            if [ "$i" -lt 8 ]; then sleep 45; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btcusd-2024-retry-state
          path: analysis/btcusd_2024_gap_retry/
