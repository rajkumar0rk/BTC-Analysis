name: BTC Stage18 22-month positive feasibility
on:
  push:
    branches:
      - research/stage18-22-positive-month-feasibility-20261121-v1
    paths:
      - scripts/research_stage18_22positive_feasibility_20261121.py
      - .github/workflows/research-stage18-22positive-feasibility-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-fixed-2-and-3-sleeve-allocations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Retrieve independently replayed BTC 1m strategy monthly series
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stage18-core /tmp/stage18-donchian
          gh run download 44889747997 -n stage18-core-standalone-20261121 -D /tmp/stage18-core --repo "$GITHUB_REPOSITORY"
          gh run download 44889747997 -n stage18-donchian-standalone-20261121 -D /tmp/stage18-donchian --repo "$GITHUB_REPOSITORY"
          test -s /tmp/stage18-core/core_22_months.csv
          test -s /tmp/stage18-donchian/donchian_monthly_mtm.csv
          test -s analysis/institutional_discovery_stage19_new_1h_patterns/monthly_results.csv
      - name: Analyze fixed allocations and 2025-only ranking
        run: |
          python -m py_compile scripts/research_stage18_22positive_feasibility_20261121.py
          python scripts/research_stage18_22positive_feasibility_20261121.py
      - name: Save full methodology summary and monthly checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage18-22months-feasibility-20261121
          path: analysis/stage18_22positive_feasibility_20261121/
          if-no-files-found: warn
          retention-days: 30
