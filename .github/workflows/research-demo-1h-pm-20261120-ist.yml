name: Demo testnet 1h EMA20 ST 100-50 PM backtest 20 Nov IST
on:
  push:
    branches:
      - research/demo-1h-pm-20261120-ist
    paths:
      - scripts/backtest_demo_1h_pm_20261120_ist.py
      - .github/workflows/research-demo-1h-pm-20261120-ist.yml
permissions:
  contents: write
concurrency:
  group: demo-1h-pm-20261120-ist
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.3
      - name: Compile and validate rule-unit tests
        run: |
          python -m py_compile scripts/backtest_demo_1h_pm_20261120_ist.py
          python -c 'import sys; sys.path.insert(0,"scripts"); from backtest_demo_1h_pm_20261120_ist import test; test(); print("1H PM unit tests passed")'
      - name: Fetch authentic Demo TESTNET 1h and MARK 1m candles and simulate
        run: python scripts/backtest_demo_1h_pm_20261120_ist.py
      - name: Upload actual source candles, scenarios, and ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-1h-pm-nov20-ist-results
          path: analysis/demo_1h_pm_nov20_ist_2026/
          if-no-files-found: warn
      - name: Save outputs on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/demo_1h_pm_nov20_ist_2026/
          if ! git diff --cached --quiet; then
            git commit -m "research: Demo testnet 1h 100-50 PM 20 Nov IST replay results"
            git push origin HEAD:research/demo-1h-pm-20261120-ist
          fi
