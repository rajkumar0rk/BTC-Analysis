name: BTC independent big move MTF 2024-2025
on:
  push:
    branches: ['research/independent-big-move-mtf-2024-2025']
    paths:
      - 'scripts/research_independent_big_move_mtf_2024_2025.py'
      - '.github/workflows/research-independent-big-move-mtf-2024-2025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_independent_big_move_mtf_2024_2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-big-move-mtf-results
          path: scratch/independent_big_move_mtf/
          if-no-files-found: error
