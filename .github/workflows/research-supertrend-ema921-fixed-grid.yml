name: BTC Supertrend EMA9/21 fixed SL TP grid
on:
  push:
    branches:
      - research/supertrend-ema921-fixed-grid-20261122
    paths:
      - scripts/research_supertrend_ema921_fixed_grid.py
      - .github/workflows/research-supertrend-ema921-fixed-grid.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-supertrend-ema921-fixed-grid-20261122
  cancel-in-progress: false
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas numba tabulate
      - name: Enforce pre-registered robustness check
        run: test -s analysis/supertrend_ema921_fixed_grid/NOVELTY_CHECK.md
      - name: Run full 1-minute 162-case fixed TP SL grid
        run: python scripts/research_supertrend_ema921_fixed_grid.py
      - name: Persist complete results on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_ema921_fixed_grid/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish Supertrend EMA9/21 SL TP sweep"
            git push origin HEAD:research/supertrend-ema921-fixed-grid-20261122
          fi
