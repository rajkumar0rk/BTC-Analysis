name: Independent BTC ETH matched 22-month net profit factor audit
on:
  push:
    branches: [research/independent-btc-eth-pf-audit-v1]
    paths:
      - scripts/research_btc_eth_profit_factor_pairs.py
      - .github/workflows/independent-btc-eth-pf-audit-v1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-btc-eth-profit-factor-v1
  cancel-in-progress: false
jobs:
  paired_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-btc-eth-pf-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Run exactly matched 205 BTCUSD ETHUSD strategies and audit net profit factor
        run: python scripts/research_btc_eth_profit_factor_pairs.py
      - name: Upload exact monthly and account-trade ledgers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-eth-matched-net-pf-v1
          path: analysis/btc_eth_profit_factor_pairs_20261118/
          if-no-files-found: warn
          retention-days: 45
      - name: Commit verified results to independent research branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/btc_eth_profit_factor_pairs_20261118/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive matched BTC ETH 22 month after-cost profit factor audit"
            for retry in 1 2 3; do
              git fetch origin research/independent-btc-eth-pf-audit-v1
              git rebase origin/research/independent-btc-eth-pf-audit-v1
              if git push origin HEAD:research/independent-btc-eth-pf-audit-v1; then exit 0; fi
            done
            exit 1
          fi
