name: BTCUSD daily 200–500 point feasibility
on:
  push:
    branches: [main]
    paths:
      - scripts/research_daily_200_500_points.py
      - .github/workflows/research-daily-points.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-daily-point-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Analyze complete BTCUSD minute history
        run: python scripts/research_daily_200_500_points.py
      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/delta_points_200_500
          if ! git diff --cached --quiet; then
            git commit -m "research: quantify daily BTCUSD 200–500 point opportunity"
            git push
          fi
