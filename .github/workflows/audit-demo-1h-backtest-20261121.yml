name: Audit and correct Demo 1h backtest fill semantics Nov20 IST
on:
  push:
    branches:
      - research/audit-demo-1h-backtest-20261121
    paths:
      - scripts/backtest_demo_1h_pm_20261120_ist.py
      - scripts/audit_demo_1h_pm_20261120_ist.py
      - .github/workflows/audit-demo-1h-backtest-20261121.yml
permissions:
  contents: write
concurrency:
  group: audit-demo-1h-backtest-20261121
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.2.3
      - name: Compile and test independent fill variants
        run: |
          python -m py_compile scripts/backtest_demo_1h_pm_20261120_ist.py scripts/audit_demo_1h_pm_20261120_ist.py
          python -c 'import sys;sys.path.insert(0,"scripts");from backtest_demo_1h_pm_20261120_ist import test;test();print("baseline unit tests PASS")'
      - name: Run corrected fill sensitivities on Delta Demo testnet
        run: python scripts/backtest_demo_1h_pm_20261120_ist.py
      - name: Audit indicators, timing and mark-vs-traded fill prices
        run: python scripts/audit_demo_1h_pm_20261120_ist.py
      - name: Upload diagnostic and trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-1h-mark-trigger-vs-traded-fill-audit
          path: analysis/demo_1h_pm_nov20_ist_2026/
          if-no-files-found: warn
      - name: Commit audit reports to separate branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/demo_1h_pm_nov20_ist_2026/
          if ! git diff --cached --quiet; then
            git commit -m "research: 1h Demo stop-fill execution audit and sensitivity results"
            git push origin HEAD:research/audit-demo-1h-backtest-20261121
          fi
