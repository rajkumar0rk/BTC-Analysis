name: Reclaim V2 independent minute replay of monthly winners
on:
  push:
    branches:
      - research/reclaim-v2-monthly-wins-no-profit-sacrifice-20261124
    paths:
      - scripts/research_reclaim_v2_validate_shortlist_20261124.py
      - .github/workflows/reclaim-v2-shortlist-minute-replay-20261124.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-reclaim-v2-20261124-minute-shortlist
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas tabulate
      - name: Validate syntax
        run: python -m py_compile scripts/research_reclaim_v2_validate_shortlist_20261124.py
      - name: Validate source BTC 1m archive and replay all Reclaim V2 shortlist fills
        run: python scripts/research_reclaim_v2_validate_shortlist_20261124.py
      - name: Upload exact replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-reclaim-v2-independent-minute-replay
          path: analysis/reclaim_v2_shortlist_validation_20261124/
          if-no-files-found: warn
      - name: Commit verified research to branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/reclaim_v2_shortlist_validation_20261124/
          if ! git diff --cached --quiet; then
            git commit -m "research: save independent Reclaim V2 minute replay and month-by-month net preservation"
            git pull --rebase origin research/reclaim-v2-monthly-wins-no-profit-sacrifice-20261124
            git push origin HEAD:research/reclaim-v2-monthly-wins-no-profit-sacrifice-20261124
          fi
