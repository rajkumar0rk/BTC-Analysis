name: Research BTC 200pt time day volume volatility
on:
  push:
    branches: [main]
    paths:
      - scripts/research_time_day_volume_200.py
      - .github/workflows/research-time-day-volume-200.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage7-time-day-volume
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install pandas numpy numba tabulate
      - name: Analyze every 1m candle across time, weekday, volume, volatility
        run: python scripts/research_time_day_volume_200.py
      - name: Retain large full trade ledger as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-200pt-time-volume-trade-ledger
          path: analysis/institutional_discovery_stage7_time_volume/trade_ledger.csv.gz
          retention-days: 30
          if-no-files-found: error
      - name: Commit compact research tables with retries for concurrent archive updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage7_time_volume/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage7_time_volume/all_time_day_volume_volatility_rates.csv
          git add analysis/institutional_discovery_stage7_time_volume/selected_filters_2025_only.csv
          git add analysis/institutional_discovery_stage7_time_volume/trade_summary.csv
          git add analysis/institutional_discovery_stage7_time_volume/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "research: persist Stage 7 IST time/day/volume results"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent main branch update, retry $attempt"
              sleep 3
            done
            exit 1
          fi
