name: BTC ETH 1H EMA20 first touch filtered TP1R + flip exit
on:
  push:
    branches: [research/st-firsttouch-1h-filtered-tp1r-flip-20261122]
    paths:
      - scripts/research_st_firsttouch_1h_filtered_tp1r_flip_20261122.py
      - .github/workflows/research-st-firsttouch-1h-filtered-tp1r-flip.yml
      - analysis/st_firsttouch_1h_filtered_tp1r_20261122/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firsttouch-1h-filtered-tp1r-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas
      - name: Backtest two 1-minute price path assumptions over 22 months BTC ETH
        shell: bash
        run: |
          mkdir -p analysis/st_firsttouch_1h_filtered_tp1r_20261122
          set -o pipefail
          python -u scripts/research_st_firsttouch_1h_filtered_tp1r_flip_20261122.py 2>&1 | tee analysis/st_firsttouch_1h_filtered_tp1r_20261122/execution.log
      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-first-touch-1h-tp1r-volume-atr14
          path: analysis/st_firsttouch_1h_filtered_tp1r_20261122/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive evidence on research branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_firsttouch_1h_filtered_tp1r_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: save filtered 1H TP1R backtest outputs"
            git push origin HEAD:research/st-firsttouch-1h-filtered-tp1r-flip-20261122
          fi
