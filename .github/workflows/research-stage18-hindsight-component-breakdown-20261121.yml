name: Stage18 22of22 Historical Component Standalone Attribution
on:
  push:
    branches:
      - research/stage18-independent-september-hedge-20261121-v1
    paths:
      - scripts/research_stage18_hindsight_component_breakdown_20261121.py
      - .github/workflows/research-stage18-hindsight-component-breakdown-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  component-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Download original verified 70/30 BTC 1-minute monthly replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stage18-70-30
          gh run download 44890734790 -n stage18-btc-70core-30donchian-portfolio-implementation -D /tmp/stage18-70-30 --repo "$GITHUB_REPOSITORY"
          test -s /tmp/stage18-70-30/scenario_monthly_22.csv
      - name: Audit all ten strategy sleeves and their monthly weighted contributions
        run: |
          python -m py_compile scripts/research_stage18_hindsight_component_breakdown_20261121.py
          python scripts/research_stage18_hindsight_component_breakdown_20261121.py
      - name: Preserve auditable component return and portfolio reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-22of22-standalone-component-report
          path: analysis/stage18_hindsight_22of22_standalone_components_20261121/
          if-no-files-found: warn
          retention-days: 30
