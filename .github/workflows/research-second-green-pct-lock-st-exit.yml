name: BTCUSD true losing trades ST exit with percent protection
on:
  push:
    branches:
      - research/second-green-profit-lock-st-close-20261122
    paths:
      - scripts/research_second_green_pct_lock_original_st_exit.py
      - .github/workflows/research-second-green-pct-lock-st-exit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  percent-profit-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install numpy pandas tabulate
      - name: Run original ST exit with percent protection only
        run: python -u scripts/research_second_green_pct_lock_original_st_exit.py
      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: true-loss-count-btc-15m-pct-profit-lock-unchanged-st-exit
          path: analysis/second_green_pct_profit_only_st_exit_20261122/
          if-no-files-found: warn
      - name: Publish only to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/second_green_pct_profit_only_st_exit_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: verified losses with unchanged ST closing exit and percent locks"
            git push origin HEAD:research/second-green-profit-lock-st-close-20261122
          fi
