name: ETH RSI14 native ATR research
on:
  push:
    branches: ['research/eth-rsi14-native-risk']
    paths:
      - 'scripts/research_eth_rsi14_native.py'
      - '.github/workflows/research-eth-rsi14-native-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_eth_rsi14_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: eth-rsi14-native-risk-full
          path: |
            scratch/eth_rsi14_native/results.csv
            scratch/eth_rsi14_native/all_results.json.gz
          if-no-files-found: error
