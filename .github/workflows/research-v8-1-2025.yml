name: Research BTC V8.1 2025 Exit Comparisons
on:
  push:
    branches: [main]
    paths:
      - scripts/research_v8_1_2025_exits.py
      - .github/workflows/research-v8-1-2025.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-v8-1-exits
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Test V8.1 exit policies on 2025 1m BTC data
        run: python scripts/research_v8_1_2025_exits.py
      - name: Upload V8.1 results
        uses: actions/upload-artifact@v4
        with:
          name: BTC-V8-1-2025-exit-comparison
          path: analysis/v8_1_2025_exits/
          if-no-files-found: error
      - name: Persist V8.1 research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/v8_1_2025_exits/
          if ! git diff --cached --quiet; then
            git commit -m "research(v8.1): save 2025 modeled exit comparisons"
            git pull --rebase origin main
            git push
          fi
