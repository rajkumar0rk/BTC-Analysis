name: Research BTC ETH Touch-Close vs EMA20 Reclaim 15M
on:
  push:
    branches: [research/st-firsttouch-reclaim-15m-20261123]
    paths:
      - scripts/research_st_firsttouch_reclaim_15m_20261123.py
      - .github/workflows/research-st-firsttouch-reclaim-15m.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firsttouch-reclaim-15m-20261123
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Run BTC and ETH 15m touch close vs reclaim
        shell: bash
        run: |
          mkdir -p analysis/st_firsttouch_reclaim_15m_20261123
          set -o pipefail
          python -u scripts/research_st_firsttouch_reclaim_15m_20261123.py 2>&1 | tee analysis/st_firsttouch_reclaim_15m_20261123/execution.log
      - name: Upload reports or failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-15m-touchclose-reclaim-20261123
          path: analysis/st_firsttouch_reclaim_15m_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive outputs on research branch only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_firsttouch_reclaim_15m_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive touch-close vs EMA reclaim replay"
            git push origin HEAD:research/st-firsttouch-reclaim-15m-20261123
          fi
