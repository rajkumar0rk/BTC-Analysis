name: BTC ST Touch Flip exit profit lock trail timecap experiments
on:
  push:
    branches:
      - research/st-touch-flip-exit-protection-20261122
    paths:
      - scripts/research_st_touch_flip_exit_protection.py
      - .github/workflows/research-st-touch-flip-exit-protection.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Backtest 1m causal SL TP profit locks trailing exit
        run: python -u scripts/research_st_touch_flip_exit_protection.py
      - name: Archive all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-touch-flip-exit-profit-protection-2025-2026
          path: analysis/st_touch_flip_exit_protection_20261122/
          if-no-files-found: warn
      - name: Publish verified research results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_touch_flip_exit_protection_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: 1min verified ST portfolio exit and profit protection grid"
            git push origin HEAD:research/st-touch-flip-exit-protection-20261122
          fi
