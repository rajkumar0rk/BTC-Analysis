name: Independent daily efficiency regime 20261119
on:
  push:
    branches: [research/daily-efficiency-regime-20261119]
    paths:
      - scripts/research_daily_efficiency_regime_20261119.py
      - .github/workflows/research-daily-efficiency-regime-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python -u scripts/research_daily_efficiency_regime_20261119.py
      - uses: actions/upload-artifact@v4
        with:
          name: efficiency-regime-results
          path: analysis/daily_efficiency_regime_20261119/
          if-no-files-found: error
      - name: Commit reports only to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/daily_efficiency_regime_20261119/
          if ! git diff --cached --quiet; then
            git commit -m 'research: archive daily efficiency regime results'
            git push origin HEAD:research/daily-efficiency-regime-20261119
          fi
