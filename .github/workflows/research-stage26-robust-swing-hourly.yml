name: Stage26 robust BTC 4H Donchian and 1H EMA live-cost stress research
on:
  push:
    branches:
      - research/stage26-robust-swing-hourly-20261121-v1
    paths:
      - scripts/research_stage26_robust_swing_hourly_20261121.py
      - .github/workflows/research-stage26-robust-swing-hourly.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  robust-1m-after-cost-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core analytics
        run: python -m pip install pandas numpy numba tabulate
      - name: Retrieve frozen core-Donchian baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stage18-70-30
          gh run download 44890734790 -n stage18-btc-70core-30donchian-portfolio-implementation -D /tmp/stage18-70-30 --repo "$GITHUB_REPOSITORY"
          test -s /tmp/stage18-70-30/scenario_monthly_22.csv
      - name: Compile research script
        run: python -m py_compile scripts/research_stage26_robust_swing_hourly_20261121.py
      - name: Replay 4H swing and 1H EMA with full adverse 5bps and 2025-only selection
        run: PYTHONUNBUFFERED=1 PYTHONPATH=scripts python scripts/research_stage26_robust_swing_hourly_20261121.py
      - name: Preserve independent monthly results and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage26-aftercost-swing-hourly-20261121
          path: analysis/stage26_robust_swing_hourly_20261121/
          if-no-files-found: warn
          retention-days: 30
