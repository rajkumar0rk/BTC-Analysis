name: Backtest BTCUSD EMA/ST screenshot settings
on:
  push:
    branches: ['research/btc-ema-st-screenshot-20261119']
    paths:
      - '.github/workflows/replay-btc-ema-st-screenshot.yml'
      - 'scripts/replay_btc_ema_st_screenshot.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: replay-btc-ema-st-screenshot-20261119
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: python -m pip install numpy pandas
      - name: Run screenshot-parameter backtest with dataset SHA256 checks
        run: python scripts/replay_btc_ema_st_screenshot.py
      - name: Save trade ledger and monthly reports as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema-st-screenshot-20261119
          retention-days: 30
          if-no-files-found: error
          path: |
            analysis/btc_ema_st_screenshot_20261119/summary.json
            analysis/btc_ema_st_screenshot_20261119/*_monthly.csv
            analysis/btc_ema_st_screenshot_20261119/*_trades.csv.gz
      - name: Commit reproducible result files to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_ema_st_screenshot_20261119/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive screenshot BTC EMA/ST 15m trade ledger and monthly net PnL"
            git push origin HEAD:research/btc-ema-st-screenshot-20261119
          fi
