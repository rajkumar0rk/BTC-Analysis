name: BTC ST V2 causal loss-regime supplement
on:
  push:
    branches:
      - research/st-v2-causal-loss-regime-addon-20261124
    paths:
      - scripts/research_st_v2_loss_regime_addon.py
      - .github/workflows/research-st-v2-loss-regime-addon.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas tabulate
      - name: Replay causal loss-regime entries
        run: python -u scripts/research_st_v2_loss_regime_addon.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st-v2-causal-loss-regime-results
          path: analysis/st_v2_causal_loss_regime_addon_20261124/
          if-no-files-found: warn
      - name: Publish verified results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_v2_causal_loss_regime_addon_20261124/
          if ! git diff --cached --quiet; then
            git commit -m "research: causal realized-loss regime add-on results"
            git push origin HEAD:research/st-v2-causal-loss-regime-addon-20261124
          fi
