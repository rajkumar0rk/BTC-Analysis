name: BTCUSD 2024 missing candle repair
on:
  push:
    branches: [research/btcusd-2024-gap-repair-20261124]
    paths:
      - scripts/repair_btcusd_2024_gaps.py
      - .github/workflows/repair-btcusd-2024-gaps.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - name: Recover prior 2024 raw candle artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: rajkumar0rk/BTC-Analysis
          run-id: 45374768673
          pattern: x180-2024-data-2024-*
          path: _existing_2024
          merge-multiple: true
      - name: Verify hashes and fetch only missing timestamps
        run: python -u scripts/repair_btcusd_2024_gaps.py
      - name: Publish reusable archive and coverage manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/delta_india/BTCUSD/2024_ist_gap_repair analysis/btcusd_2024_gap_repair
          git commit -m 'Archive verified 2024 BTCUSD candles and gap recovery results'
          git push origin HEAD:research/btcusd-2024-gap-repair-20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btcusd-2024-repaired-archive
          path: |
            data/delta_india/BTCUSD/2024_ist_gap_repair/
            analysis/btcusd_2024_gap_repair/
