name: BTCUSD Step12 - Monthly Recovery One Trade Every Weekday
on:
  push:
    branches:
      - research/btc-daily-monthly-recovery-step12
    paths:
      - scripts/research_btc_daily_monthly_recovery_step12.py
      - .github/workflows/research-btc-daily-monthly-recovery-step12.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data and numerical dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Check 120 month-to-date recovery variations and unchanged Step11
        run: python scripts/research_btc_daily_monthly_recovery_step12.py
      - name: Publish full 477 weekday daily trade and 22-month reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step12-monthly-recovery-477-trades
          path: analysis/btc_daily_monthly_recovery_step12/
          if-no-files-found: warn
