name: BTC ETH monthly shock reversion audit
on:
  workflow_dispatch:
  push:
    branches: [research/btc-eth-monthly-shock-reversion-20261118]
    paths:
      - scripts/research_btc_eth_monthly_shock_reversion.py
      - .github/workflows/research-btc-eth-monthly-shock-reversion.yml
permissions:
  contents: write
concurrency:
  group: btc-eth-monthly-shock-20261118
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas numba tabulate
      - run: python scripts/research_btc_eth_monthly_shock_reversion.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-eth-shock-reversion-monthly-ledgers
          path: analysis/btc_eth_monthly_shock_reversion_20261118/
          retention-days: 30
      - name: Archive research only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_eth_monthly_shock_reversion_20261118/
          git commit -m "research: archive paired shock reversion monthly results"
          git push origin HEAD:research/btc-eth-monthly-shock-reversion-20261118
