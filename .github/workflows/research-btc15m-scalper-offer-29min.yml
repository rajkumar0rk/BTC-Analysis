name: BTCUSD 15M Small TP 29min Scalper Offer Cost Comparison
on:
  push:
    branches: [research/btc15m-29min-scalper-offer-20261123]
    paths:
      - scripts/research_btc15m_scalper_29min_20261123.py
      - .github/workflows/research-btc15m-scalper-offer-29min.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc15m-scalper-offer-29min
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research packages
        run: python -m pip install numpy pandas tabulate
      - name: Backtest BTC 15M small take-profit full and waived closing fee
        shell: bash
        run: |
          mkdir -p analysis/btc15m_29min_scalper_offer_20261123
          set -o pipefail
          python -u scripts/research_btc15m_scalper_29min_20261123.py 2>&1 | tee analysis/btc15m_29min_scalper_offer_20261123/execution.log
      - name: Upload results or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-29min-scalper-fee-waiver-sensitivity
          path: analysis/btc15m_29min_scalper_offer_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive on research branch only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_29min_scalper_offer_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BTC 15m 29min scalper cost test"
            git push origin HEAD:research/btc15m-29min-scalper-offer-20261123
          fi
