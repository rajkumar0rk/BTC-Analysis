name: BTC 15m why 2026 failed trade postmortem
on:
  push:
    branches:
      - research/st-2026-failure-root-causes-20261122
    paths:
      - scripts/research_st_2026_failure_postmortem.py
      - .github/workflows/research-st-2026-failure-postmortem.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Audit 2025 versus 2026 trade outcome, exit reason, market regime
        run: python -u scripts/research_st_2026_failure_postmortem.py
      - name: Archive audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-supertrend-2026-loss-postmortem
          path: analysis/st_three_best_2026_failure_postmortem_20261122/
          if-no-files-found: warn
      - name: Publish audit to research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_three_best_2026_failure_postmortem_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: verified 2026 combined ST portfolio loss attribution"
            git push origin HEAD:research/st-2026-failure-root-causes-20261122
          fi
