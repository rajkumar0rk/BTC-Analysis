name: BTC 1x ML First Touch 200TP 100SL 2025-2026
on:
  push:
    branches:
      - research/ml-first-touch-200tp100sl-1x-20261121
    paths:
      - scripts/research_ml_first_touch_200_100_1x_20261121.py
      - .github/workflows/research-ml-first-touch-200-100-1x-20261121.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install one-shot numerical training dependencies
        run: python -m pip install numpy pandas numba scikit-learn tabulate
      - name: Validate python syntax before research
        run: python -m py_compile scripts/research_ml_first_touch_200_100_1x_20261121.py
      - name: Train 2025 H1; calibrate 2025 H2; check 2026 without refitting
        run: python scripts/research_ml_first_touch_200_100_1x_20261121.py
      - name: Save day and trade level calibration and 2026 ledgers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-ml-first-touch-1x-ledgers
          path: |
            analysis/btc_ml_first_touch_200_100_1x_20261121/*ledger.csv
          retention-days: 30
      - name: Publish honest monthly and probability-gate results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_ml_first_touch_200_100_1x_20261121/summary.json
          git add analysis/btc_ml_first_touch_200_100_1x_20261121/RESEARCH_REPORT.md
          git add analysis/btc_ml_first_touch_200_100_1x_20261121/all_probability_gates.csv
          git add analysis/btc_ml_first_touch_200_100_1x_20261121/leader_monthly.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: report 1x BTC first-touch supervised probability and unchanged 2026 checks"
            git push origin HEAD:research/ml-first-touch-200tp100sl-1x-20261121
          fi
