name: BTCUSD 15M Late Lock Fine Sweep - Preserve Positive Months
on:
  push:
    branches: [research/btc15m-reclaim-loss-month-fine-trigger-20261123]
    paths:
      - scripts/research_btc15m_loss_month_fine_triggers_20261123.py
      - .github/workflows/research-btc15m-loss-month-fine-triggers.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Simulate delayed protection and preserve all existing winning months
        shell: bash
        run: |
          mkdir -p analysis/btc15m_loss_month_fine_triggers_20261123
          set -o pipefail
          python -u scripts/research_btc15m_loss_month_fine_triggers_20261123.py 2>&1 | tee analysis/btc15m_loss_month_fine_triggers_20261123/execution.log
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-loss-month-fine-triggers
          path: analysis/btc15m_loss_month_fine_triggers_20261123/
          retention-days: 30
      - name: Archive to isolated research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_loss_month_fine_triggers_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive finely tested BTC15m late protective locks"
            git pull --rebase origin research/btc15m-reclaim-loss-month-fine-trigger-20261123
            git push origin HEAD:research/btc15m-reclaim-loss-month-fine-trigger-20261123
          fi
