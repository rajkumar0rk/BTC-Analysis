name: Sync Delta India BTCUSD 1m candles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-delta-btcusd-1m.yml'
      - 'scripts/sync_delta_btcusd_1m.py'
  workflow_dispatch:
    inputs:
      start:
        description: "First UTC date (YYYY-MM-DD)"
        required: false
        default: "2025-01-01"
      through:
        description: "Last UTC date inclusive (blank = yesterday UTC)"
        required: false
        default: ""
  schedule:
    - cron: "30 2 * * *"
permissions:
  contents: write
concurrency:
  group: delta-btcusd-1m
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate candles
        env:
          START: ${{ inputs.start || '2025-01-01' }}
          THROUGH: ${{ inputs.through || '' }}
        run: |
          if [ -n "$THROUGH" ]; then
            python scripts/sync_delta_btcusd_1m.py --start "$START" --through "$THROUGH"
          else
            python scripts/sync_delta_btcusd_1m.py --start "$START"
          fi
      - name: Commit downloaded candles and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/delta_india/BTCUSD/1m
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "data: sync Delta India BTCUSD 1m candles"
            git push
          fi
