name: Stage31 frozen MR Range independent BTC 1m audit
on:
  push:
    branches:
      - research/stage31-frozen-mr-range-audit-20261121
    paths:
      - scripts/research_stage31_frozen_mr_range_audit_20261121.py
      - .github/workflows/research-stage31-frozen-mr-range-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas numba
      - name: Compile frozen research
        run: python -m py_compile scripts/research_stage31_frozen_mr_range_audit_20261121.py
      - name: Audit frozen strategies and November BTC 1m replay
        run: PYTHONUNBUFFERED=1 PYTHONPATH=scripts python scripts/research_stage31_frozen_mr_range_audit_20261121.py
      - name: Upload exact 1m trade and monthly PnL audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage31-frozen-meanreversion-range-trade-audit
          path: analysis/stage31_frozen_mr_range_20261121/
          if-no-files-found: warn
          retention-days: 30
