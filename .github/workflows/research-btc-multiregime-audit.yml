name: Audit BTC 1H multi-regime and past-only strategy selector
on:
  push:
    branches:
      - research/btc-multiregime-audit-20261121
    paths:
      - scripts/research_btc_multiregime_audit_20261121.py
      - analysis/btc_multiregime_audit_20261121/NOVELTY_CHECK.md
      - .github/workflows/research-btc-multiregime-audit.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-multiregime-audit-20261121
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric analysis dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Validate regime history, select from past only and replay single account
        run: python scripts/research_btc_multiregime_audit_20261121.py
      - name: Preserve all audit reports and trade evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-multiregime-causality-audit-20261121
          path: analysis/btc_multiregime_audit_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Commit completed evidence on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_multiregime_audit_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save market-regime and causal selector audit evidence"
            git push origin HEAD:research/btc-multiregime-audit-20261121
          fi
