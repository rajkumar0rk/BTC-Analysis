name: BTC common 2024 and 2025 optimization
on:
  push:
    branches: [research/btc-common-2024-2025]
    paths:
      - scripts/research_btc_common_2024_2025.py
      - .github/workflows/research-btc-common-2024-2025.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clean-core-2024
          run-id: 45374511488
          github-token: ${{ github.token }}
          path: prior2024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba scikit-learn tabulate
      - run: python -m py_compile scripts/research_btc_common_2024_2025.py
      - run: python scripts/research_btc_common_2024_2025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: common-2024-2025
          path: analysis/btc_common_2024_2025/
