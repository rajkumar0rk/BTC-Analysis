name: EMA ST 15m vs 1h Identical Settings Capped Stops
on:
  push:
    branches: [research/ema-st-15m-1h-parity-cap1pct-20261121]
    paths:
      - scripts/ema_st_parity_15m_1h_20261121.py
      - .github/workflows/ema-st-parity-15m-1h-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy numba
      - name: Replay identical entry exit rules on 15m and 1h
        run: python scripts/ema_st_parity_15m_1h_20261121.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ema-st-15m-1h-parity-1pct
          path: analysis/ema_st_parity_15m_1h_1pct_20261121/
