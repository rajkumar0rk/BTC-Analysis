name: BTCUSD Step29 - Correct January 2025 Losing Month Recovery, 477 Weekdays
on:
  push:
    branches:
      - research/btc-january2025-loss-recovery-step29
    paths:
      - scripts/research_btc_january2025_loss_recovery_step29.py
      - .github/workflows/research-btc-january2025-loss-recovery-step29.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and backtest dependencies
        run: python -m pip install numpy pandas numba scikit-learn tabulate
      - name: Check Python syntax
        run: python -m py_compile scripts/research_btc_january2025_loss_recovery_step29.py
      - name: Backtest 1200 month-loss recovery combinations targeted to Jan2025 on full 477-day BTC calendar
        run: python scripts/research_btc_january2025_loss_recovery_step29.py
      - name: Archive all daily and monthly audit and standard/scalper fee comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step29-Jan2025-loss-recovery-477-full-weekdays
          path: analysis/btc_january2025_loss_recovery_step29/
          if-no-files-found: warn
