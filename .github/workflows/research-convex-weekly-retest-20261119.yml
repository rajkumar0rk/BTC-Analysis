name: Independent weekly breakout retest asymmetry BTC ETH
on:
  push:
    branches: [research/convex-weekly-range-retest-20261119]
    paths:
      - scripts/research_convex_weekly_retest_20261119.py
      - .github/workflows/research-convex-weekly-retest-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-convex-weekly-retest-20261119
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas numba tabulate
      - name: Run BTC ETH independent backtests
        run: python -u scripts/research_convex_weekly_retest_20261119.py
      - uses: actions/upload-artifact@v4
        with:
          name: convex-weekly-retest-20261119
          path: analysis/convex_weekly_range_retest_20261119/
          if-no-files-found: error
          retention-days: 30
      - name: Commit compact results only on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/convex_weekly_range_retest_20261119/all_models.csv
          git add analysis/convex_weekly_range_retest_20261119/strict_qualifiers.csv
          git add analysis/convex_weekly_range_retest_20261119/quality.json
          git add analysis/convex_weekly_range_retest_20261119/RESEARCH_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: store independent weekly breakout results"
            git push origin HEAD:research/convex-weekly-range-retest-20261119
          fi
