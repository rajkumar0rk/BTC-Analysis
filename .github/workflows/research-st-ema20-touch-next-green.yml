name: BTC 1H EMA20 Touch next green confirmation comparison
on:
  push:
    branches:
      - research/st-ema20-touch-next-green-confirm-20261122
    paths:
      - scripts/backtest_st_ema20_touch_next_green.py
      - .github/workflows/research-st-ema20-touch-next-green.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-touch-next-green-20261122
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas numpy
        run: python -m pip install numpy pandas
      - name: Compile and verify
        run: python -m py_compile scripts/backtest_st_ema20_touch_next_green.py
      - name: Backtest next 1H green and symmetric short red confirmation
        run: python scripts/backtest_st_ema20_touch_next_green.py
      - name: Upload reports and trade ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-1h-ema20-touch-green-confirm-research
          path: analysis/st_ema20_touch_next_green_1h/
          if-no-files-found: warn
      - name: Commit results on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_touch_next_green_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist touch green-confirmed backtest results"
            git pull --rebase origin research/st-ema20-touch-next-green-confirm-20261122
            git push origin HEAD:research/st-ema20-touch-next-green-confirm-20261122
          fi
