name: Trend family KAMA BTC2025 original baseline
on:
  push:
    branches: [research/trend-following-family-20261121]
    paths:
      - scripts/trend_family_kama_2025.py
      - .github/workflows/trend-family-kama-btc2025.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-btc2025-kama:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'tabulate==0.9.0'
      - name: Real Delta India BTCUSD minute replay and account reconciliation
        run: python scripts/trend_family_kama_2025.py
      - name: Preserve real artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-kama-btc2025-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: analysis/trend_following_family_20261121/kama_btc2025/
