name: BTCUSD 2024 gap recovery v3
on:
  push:
    branches: [research/btcusd-2024-gap-repair-v3-20261124]
    paths:
      - scripts/repair_btcusd_2024_gaps_v3.py
      - .github/workflows/repair-btcusd-2024-gaps-v3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - name: Retry only remaining native data gaps
        run: |
          python -m py_compile scripts/repair_btcusd_2024_gaps_v3.py
          python -u scripts/repair_btcusd_2024_gaps_v3.py
      - name: Publish verified archive and recovery audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/delta_india/BTCUSD/2024_verified_archive analysis/btcusd_2024_gap_repair_v3
          git commit -m 'Record third targeted 2024 gap recovery and remaining intervals'
          git push origin HEAD:research/btcusd-2024-gap-repair-v3-20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btcusd-2024-gap-recovery-v3
          path: analysis/btcusd_2024_gap_repair_v3/
