name: BTCUSD Step 6 — causal online direction, 477 weekday trades
on:
  push:
    branches:
      - research/btc-daily-online-direction-step6
    paths:
      - scripts/research_btc_daily_online_direction_step6.py
      - .github/workflows/research-btc-daily-online-direction-step6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Test strictly prior-day online direction and clock selection
        run: python scripts/research_btc_daily_online_direction_step6.py
      - name: Upload full 1152 models, daily trades and 22 monthly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step6-online-direction-477-trades
          path: analysis/btc_daily_online_direction_step6/
          if-no-files-found: warn
