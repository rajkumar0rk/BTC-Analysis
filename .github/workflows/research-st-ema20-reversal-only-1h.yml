name: Research BTC 1H ST EMA20 reversal-only exit
on:
  push:
    branches:
      - research/st-ema20-reversal-only-20261122
    paths:
      - scripts/backtest_supertrend_ema20_reversal_only_1h.py
      - .github/workflows/research-st-ema20-reversal-only-1h.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-ema20-st-reversal-only-20261122
  cancel-in-progress: false
jobs:
  run_reversal_only_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Validate syntax
        run: python -m py_compile scripts/backtest_supertrend_ema20_reversal_only_1h.py
      - name: Backtest against historical Delta India 1m BTCUSD
        run: python scripts/backtest_supertrend_ema20_reversal_only_1h.py
      - name: Upload results for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema20-st-reversal-only-1h-results
          path: analysis/ema20_st_reversal_only_1h/
          if-no-files-found: warn
      - name: Commit verified reports to independent research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_st_reversal_only_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: save EMA20 ST reversal-only replay"
            git pull --rebase origin research/st-ema20-reversal-only-20261122
            git push origin HEAD:research/st-ema20-reversal-only-20261122
          fi
