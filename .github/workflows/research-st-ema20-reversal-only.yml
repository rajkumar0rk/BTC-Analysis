name: Backtest BTC 1H EMA20 ST reversal-only exit
on:
  push:
    branches:
      - research/st-ema20-1h-reversal-only-20261122
    paths:
      - scripts/backtest_st_ema20_reversal_only.py
      - .github/workflows/research-st-ema20-reversal-only.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-reversal-only
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Syntax check
        run: python -m py_compile scripts/backtest_st_ema20_reversal_only.py
      - name: Backtest reversal-only exits with real 1m candles
        run: python scripts/backtest_st_ema20_reversal_only.py
      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-ema20-reversal-only
          path: analysis/st_ema20_1h_reversal_only/
          if-no-files-found: warn
      - name: Commit results on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_1h_reversal_only/
          if ! git diff --cached --quiet; then
            git commit -m "research: save reversal-only exit backtest"
            git pull --rebase origin research/st-ema20-1h-reversal-only-20261122
            git push origin HEAD:research/st-ema20-1h-reversal-only-20261122
          fi
