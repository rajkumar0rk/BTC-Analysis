name: Research BTC Stage16 monthly regime switch
on:
  push:
    branches: [main]
    paths:
      - scripts/research_monthly_regime_switch_stage16.py
      - .github/workflows/research-monthly-regime-switch-stage16.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: btc-stage16-regime-switch
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research libraries
        run: python -m pip install numpy pandas numba tabulate
      - name: Download original Stage14 signals and trades
        uses: actions/download-artifact@v4
        with:
          name: btc-stage14-monthly-regime-trades
          run-id: 44118024590
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_stage14
      - name: Run walk-forward regime switching and verify Stage14 baseline
        run: python scripts/research_monthly_regime_switch_stage16.py --original-artifact original_stage14
      - name: Archive detailed trade ledger
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage16-regime-switch-trades
          path: analysis/institutional_discovery_stage16_monthly_regime_switch/trade_ledger.csv.gz
          if-no-files-found: error
          retention-days: 30
      - name: Commit complete findings including negative results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage16_monthly_regime_switch/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage16_monthly_regime_switch/monthly_results.csv
          git add analysis/institutional_discovery_stage16_monthly_regime_switch/strategy_comparison.csv
          git add analysis/institutional_discovery_stage16_monthly_regime_switch/entry_screen_audit.csv
          git add analysis/institutional_discovery_stage16_monthly_regime_switch/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage16 monthly regime switching results"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
