name: BTCUSD 2024 gap recovery alternate windows
on:
  push:
    branches: [research/btcusd-2024-gap-repair-v2-20261124]
    paths:
      - scripts/repair_btcusd_2024_gaps_v2.py
      - .github/workflows/repair-btcusd-2024-gaps-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - name: Retry missing trade data and archive mark and funding
        run: |
          python -m py_compile scripts/repair_btcusd_2024_gaps_v2.py
          python -u scripts/repair_btcusd_2024_gaps_v2.py
      - name: Publish verified raw archive and coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/delta_india/BTCUSD/2024_verified_archive analysis/btcusd_2024_gap_repair_v2
          git commit -m 'Archive 2024 native OHLC funding and remaining missing intervals'
          git push origin HEAD:research/btcusd-2024-gap-repair-v2-20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btcusd-2024-verified-archive
          path: |
            data/delta_india/BTCUSD/2024_verified_archive/
            analysis/btcusd_2024_gap_repair_v2/
