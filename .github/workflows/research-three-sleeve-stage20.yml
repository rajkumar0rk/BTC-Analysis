name: Research BTC Stage20 three sleeve monthly returns
on:
  push:
    branches: [main]
    paths:
      - scripts/research_three_sleeve_stage20.py
      - .github/workflows/research-three-sleeve-stage20.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage20-three-sleeve
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Compare Stage19 independent patterns with frozen Stage18
        run: python scripts/research_three_sleeve_stage20.py
      - name: Save research
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage20_three_sleeve/
          if ! git diff --cached --quiet; then
            git commit -m "research: preserve Stage20 three-sleeve monthly results"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
