name: BTCUSD C05 ADX threshold and relative ATR 2024-2025 only
on:
  push:
    branches: [research/btc15m-c05-adx-vol-grid-20261125]
    paths:
      - scripts/research_btc15m_c05_adx_vol_grid.py
      - .github/workflows/research-btc15m-c05-adx-vol-grid.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/checkout@v4
        with:
          ref: edcf60fa0a229108d09772dc6cbe04eb15476291
          path: _repaired
          sparse-checkout: data/delta_india/BTCUSD/2024_verified_archive
          persist-credentials: false
      - run: python scripts/research_btc15m_c05_adx_vol_grid.py train
      - uses: actions/upload-artifact@v4
        with:
          name: c05-adx-vol-grid-train-shard-${{ matrix.shard }}
          path: analysis/btc15m_c05_adx_vol_grid_20261125/shard_${{ matrix.shard }}/
          if-no-files-found: error
  freeze:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c05-adx-vol-grid-train-shard-*
          path: _shards
      - run: |
          mkdir -p analysis/btc15m_c05_adx_vol_grid_20261125
          for i in {0..5}; do
            cp -r "_shards/c05-adx-vol-grid-train-shard-$i" "analysis/btc15m_c05_adx_vol_grid_20261125/shard_$i"
          done
          python scripts/research_btc15m_c05_adx_vol_grid.py freeze
      - uses: actions/upload-artifact@v4
        with:
          name: c05-adx-vol-grid-frozen-selection
          path: |
            analysis/btc15m_c05_adx_vol_grid_20261125/FROZEN.json
            analysis/btc15m_c05_adx_vol_grid_20261125/training.csv
            analysis/btc15m_c05_adx_vol_grid_20261125/training_ranked.csv
            analysis/btc15m_c05_adx_vol_grid_20261125/training_monthly.csv
            analysis/btc15m_c05_adx_vol_grid_20261125/monthly_comparison.csv
            analysis/btc15m_c05_adx_vol_grid_20261125/REPORT.md
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_c05_adx_vol_grid_20261125/{FROZEN.json,training.csv,training_ranked.csv,training_monthly.csv,monthly_comparison.csv,REPORT.md}
          git commit -m "research: publish independent ADX DMI in-sample results"
          git push origin HEAD:research/btc15m-c05-adx-vol-grid-20261125
