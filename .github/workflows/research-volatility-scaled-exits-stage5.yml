name: Research BTC Stage 5 volatility scaled exits
on:
  push:
    branches: [main]
    paths:
      - scripts/research_volatility_scaled_exits_stage5.py
      - .github/workflows/research-volatility-scaled-exits-stage5.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage5-volatility-exits
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Run volatility-scaled exit experiment
        run: python scripts/research_volatility_scaled_exits_stage5.py
      - name: Save all findings, including negative results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage5
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage 5 volatility scaled exits results"
            git pull --rebase origin main
            git push
          fi
