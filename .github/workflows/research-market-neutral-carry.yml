name: Research market-neutral BTC spot-perpetual funding carry
on:
  push:
    branches: [main]
    paths:
      - scripts/research_market_neutral_carry.py
      - .github/workflows/research-market-neutral-carry.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-market-neutral-carry
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Download original Binance historical spot and test hedged carry
        run: python scripts/research_market_neutral_carry.py
      - name: Commit all non-directional findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_carry_stage1
          if ! git diff --cached --quiet; then
            git commit -m "research: save non-directional BTC funding carry results"
            git pull --rebase origin main
            git push
          fi
