name: Independent liquidity sweep reclaim BTC ETH
on:
  push:
    branches: [research/independent-liquidity-sweep-20261119]
    paths:
      - scripts/research_independent_liquidity_sweep_20261119.py
      - .github/workflows/research-independent-liquidity-sweep-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-liquidity-sweep-20261119
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas numba tabulate
      - name: Replay BTC and ETH independent liquidity sweep research
        run: python -u scripts/research_independent_liquidity_sweep_20261119.py
      - name: Upload all evidence
        uses: actions/upload-artifact@v4
        with:
          name: independent-liquidity-sweep-20261119
          path: analysis/independent_liquidity_sweep_20261119/
          if-no-files-found: error
      - name: Commit compact evidence to isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/independent_liquidity_sweep_20261119/model_comparison.csv
          git add analysis/independent_liquidity_sweep_20261119/qualifying_models.csv
          git add analysis/independent_liquidity_sweep_20261119/promising_exploratory_models.csv
          git add analysis/independent_liquidity_sweep_20261119/candidate_concentration.csv
          git add analysis/independent_liquidity_sweep_20261119/candidate_monthly_pf.csv
          git add analysis/independent_liquidity_sweep_20261119/quality.json
          git add analysis/independent_liquidity_sweep_20261119/RESEARCH_REPORT.md
          if [ -f analysis/independent_liquidity_sweep_20261119/candidate_trade_ledger.csv ]; then
            git add analysis/independent_liquidity_sweep_20261119/candidate_trade_ledger.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "research: record independent liquidity sweep results"
            git push origin HEAD:research/independent-liquidity-sweep-20261119
          fi
