name: BTC 15m Supertrend second green candle confirmation
on:
  push:
    branches:
      - research/supertrend-15m-second-green-20261122
    paths:
      - scripts/research_supertrend_15m_second_green.py
      - .github/workflows/research-supertrend-15m-second-green.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supertrend-15m-second-green-20261122
  cancel-in-progress: false
jobs:
  confirm-green:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Backtest green second candle after touch and bullish flip
        run: python -u scripts/research_supertrend_15m_second_green.py
      - name: Upload results even if test assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrend-second-green-confirmation
          path: analysis/supertrend_15m_second_green_20261122/
          if-no-files-found: warn
      - name: Publish research to dedicated branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_15m_second_green_20261122
          if ! git diff --cached --quiet; then
            git commit -m "research: second GREEN 15m candle entries and verified backtest"
            git push origin HEAD:research/supertrend-15m-second-green-20261122
          fi
