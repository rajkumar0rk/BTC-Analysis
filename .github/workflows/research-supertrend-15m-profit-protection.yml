name: BTC 15m Supertrend touch profit protection grid
on:
  push:
    branches:
      - research/supertrend-15m-profit-protection-20261122
    paths:
      - scripts/research_supertrend_15m_profit_protection.py
      - .github/workflows/research-supertrend-15m-profit-protection.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest-profit-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backtest dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Run all protection modes and validate 200 500 1000 baseline parity
        run: python -u scripts/research_supertrend_15m_profit_protection.py
      - name: Preserve results even if parity fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertrend-15m-profit-protection-1260
          path: analysis/supertrend_15m_profit_protection_20261122/
          if-no-files-found: warn
      - name: Commit complete research reports on isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_15m_profit_protection_20261122
          if ! git diff --cached --quiet; then
            git commit -m "research: record 1260 Supertrend touch profit-protection outcomes"
            git push origin HEAD:research/supertrend-15m-profit-protection-20261122
          fi
