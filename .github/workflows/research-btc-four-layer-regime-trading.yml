name: Research BTC four-layer 1H-4H regime to 15M confirmation and native 1M exits
on:
  push:
    branches: [research/btc-four-layer-regime-trading-20261121]
    paths:
      - scripts/research_btc_four_layer_regime_trading_20261121.py
      - analysis/btc_four_layer_regime_trading_20261121/NOVELTY_CHECK.md
      - .github/workflows/research-btc-four-layer-regime-trading.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-four-layer-regime-trading-20261121
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific packages
        run: python -m pip install numpy pandas tabulate
      - name: Verify no lookahead in 1H/4H, 15M confirmations and native 1M account replays
        run: python scripts/research_btc_four_layer_regime_trading_20261121.py
      - name: Archive full research evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-1h4h-15m-1m-four-layer-multiregime-20261121
          path: analysis/btc_four_layer_regime_trading_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Commit reports and ledgers into isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_four_layer_regime_trading_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish four-layer regime and confirmation trading evidence"
            git push origin HEAD:research/btc-four-layer-regime-trading-20261121
          fi
