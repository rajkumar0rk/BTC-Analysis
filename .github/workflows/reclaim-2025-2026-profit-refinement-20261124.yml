name: Reclaim 2025-2026 constrained profit refinement
on:
  push:
    branches: [research/reclaim-v5-validation-20261124]
    paths: [.github/workflows/reclaim-2025-2026-profit-refinement-20261124.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba scipy
      - name: Run robust optimization on all historical stress cases
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '2'
        run: |
          PYTHONPATH=scripts python -u - <<'PY'
          import json, pathlib, itertools, time
          import numpy as np
          import pandas as pd
          from numba import njit, prange
          from research_st_ema20_initial_sl_grid_20261122 import eng, MONTHS, PATHS
          from research_st_ema20_reclaim_loss_months_20261122 import indicator_features, signal_table
          e=eng();m,h,n=e.load();h=indicator_features(e.features(h))
          entries=e.entry_candidates(m,h,"reclaim");f=signal_table(entries,h)
          # Use only opportunities whose entry precedes the November cutoff.
          use=np.array([m.index[x["entry_j"]].tz_convert("Asia/Kolkata").strftime("%Y-%m")<="2026-10" for x in entries])
          entries=[x for x,keep in zip(entries,use) if keep];f=f.loc[use].reset_index(drop=True)
          N=len(entries);print("DATA",len(m),N,flush=True)
          # Frozen V5 policy from the successfully verified workflow.
          def v4(r):
              v1=r.ema_gap_pct<=1 and r.ema_slope_pct>=-.2 and r.supertrend_gap_pct>=.5
              v2=v1 and (r.adx14<=20 or r.hourly_range_atr<=1 or r.ema_gap_pct>=.15) and r.dir_rsi14<=60
              g3=r.adx14>=35 and r.ema_slope_pct<=.1
              g4=r.adx14>=25 and r.supertrend_gap_pct>=1.5
              if not (v2 or (v1 and g3) or g4): return 0.
              if r.dir_rsi14>=52 and r.hourly_body_atr<=.25:return .26
              if r.adx14>=35 and r.atr_pct<=.75:return .9
              if r.adx14<=30 and r.atr_pct<=.3:return .55
              if g4:return .18
              if g3:return .3
              return -1.
          def v5(r):
              if not np.isfinite(r.volume_ratio):return 0.
              if r.volume_ratio<1.25:
                  if r.volume_ratio<=.45 and r.atr_pct>=.4 and r.atr_expansion<=.85:return 1.
                  if r.volume_ratio>=.8 and .6<=r.atr_pct<=.8:return 2.
                  return 0.
              x=v4(r)
              if x!=0 and r.adx14<=15 and r.ema_slope_pct<=.05:x=.38
              if x!=0 and r.adx14>=25 and r.supertrend_age_hours<=6:x=0.
              if x!=0 and r.volume_ratio>=1.5 and r.adx14>=40:x=1.9
              if r.dir_rsi14>=60 or r.supertrend_gap_pct<=.5:x=.33
              if x!=0 and r.ema_slope_pct<=-.1 and r.atr_expansion<=.8:x=.185
              return x
          def v6(r):
              x=v5(r)
              if x!=0 and r.dir_rsi14>=55 and r.hourly_range_atr>=1.5:x=.3
              if r.atr_pct<=.55 and r.supertrend_gap_pct>=1.:x=.7
              if x==0 and r.atr_pct>=.45 and r.atr_expansion>=1.2:x=.55
              if x!=0 and .55<=r.volume_ratio<=.8:x=1.2
              return x
          cols=["volume_ratio","atr_pct","atr_expansion","adx14","dir_rsi14","ema_gap_pct","supertrend_gap_pct","hourly_body_atr","hourly_range_atr"]
          variants=[f.copy() for _ in range(3)]
          for k,shift in [(1,-.01),(2,.01)]:variants[k][cols]*=1+shift
          levels=np.array(sorted(set([-1.,0.,.14,.16,.18,.185,.2,.23,.26,.28,.3,.33,.35,.38,.4,.45,.5,.55,.6,.65,.7,.75,.8,.9,1.,1.1,1.2,1.3,1.4,1.5,1.6,1.7,1.8,1.9,2.,2.2,2.5,3.])))
          A=len(levels);skip=int(np.flatnonzero(levels==0)[0])
          scenarios=[("base",5,.00059,1.,.02,0,0),("slip10",10,.00059,1.,.02,0,0),("slip15",15,.00059,1.,.02,0,0),("slip25",25,.00059,1.,.02,0,0),("fee20",5,.00059*1.2,1.,.02,0,0),("fee50",5,.00059*1.5,1.,.02,0,0),("tp95",5,.00059,.95,.02,0,0),("tp105",5,.00059,1.05,.02,0,0),("sl18",5,.00059,1.,.018,0,0),("sl22",5,.00059,1.,.022,0,0),("feature99",5,.00059,1.,.02,1,0),("feature101",5,.00059,1.,.02,2,0),("delay1",5,.00059,1.,.02,0,1)]
          scenarios += [("moderate_cost",10,.00059*1.2,1.,.02,0,0),("severe_cost",25,.00059*1.5,1.,.02,0,0),("delay_cost",10,.00059*1.2,1.,.02,0,1),("tp_low_cost",25,.00059*1.5,.95,.018,1,0),("tp_high_cost",25,.00059*1.5,1.05,.022,2,0),("combined_low_delay",25,.00059*1.5,.95,.018,1,1),("combined_high_delay",25,.00059*1.5,1.05,.022,2,1)]
          S=len(scenarios)*2;group=np.array([x[5] for x in scenarios for p in range(2)],np.int64)
          o,hi,lo,c=(m[k].to_numpy(float) for k in ["open","high","low","close"]);hs=h.side.to_numpy()
          month_idx=np.array([MONTHS.index(x) if x in MONTHS else -1 for x in m.index.tz_convert("Asia/Kolkata").strftime("%Y-%m")],np.int64)
          j0=np.array([x["entry_j"] for x in entries],np.int64);sd=np.array([x["side"] for x in entries],np.int64);mid=np.array([x["entry"]-x["side"]*5 for x in entries]);ends=[]
          for j,side in zip(j0,sd):
              z=np.flatnonzero(hs[j//60:]!=side);ends.append(min((j//60+int(z[0])+1)*60,len(m)) if len(z) else len(m))
          ends=np.array(ends,np.int64)
          @njit
          def replay(jstart,end,side,mid,slip,fee,tp,sl,path,delay,o,hi,lo,c):
              jstart+=delay
              if jstart>=end:return -1,0.
              if delay:mid=o[jstart]
              entry=mid+side*slip;stop=entry-side*entry*sl
              target=entry+side*entry*tp/100
              for j in range(jstart,end):
                  first=hi[j] if path==0 else lo[j];second=lo[j] if path==0 else hi[j]
                  nodes=(o[j],first,second,c[j])
                  active=j!=jstart or delay>0 or side*(o[j]-mid)>=-1e-9
                  ex=0.;hit=False
                  if j!=jstart and side*(o[j]-stop)<-1e-9:ex=o[j];hit=True
                  elif active and tp>0 and side*(o[j]-target)>=-1e-9:ex=target;hit=True
                  if not hit:
                      for k in range(3):
                          a,b=nodes[k],nodes[k+1]
                          if not active:
                              if side*(b-a)<=0 or side*(b-mid)<-1e-9:continue
                              a=mid;active=True
                          if side*(b-a)>0:
                              if tp>0 and side*(a-target)<1e-9 and side*(b-target)>=-1e-9:ex=target;hit=True;break
                              for rung in (2.,3.,5.):
                                  z=entry+side*entry*rung/100
                                  if side*(a-z)<-1e-9 and side*(b-z)>=-1e-9 and side*(z-stop)>1e-9:stop=z
                          else:
                              if side*(a-stop)<-1e-9:ex=a;hit=True;break
                              if side*(a-stop)>=-1e-9 and side*(b-stop)<=1e-9:ex=stop;hit=True;break
                  if hit:
                      fill=ex-side*slip
                      return j,.001*side*(fill-entry)-.001*fee*(entry+fill)
              if end<len(o):
                  fill=o[end]-side*slip
                  return end,.001*side*(fill-entry)-.001*fee*(entry+fill)
              return -1,0.
          # Optimistic oracle envelope, NOT a tradable strategy: permits retrospective independent choice
          # of exit action for every trade/scenario/month, while imposing the exact same conservative margin screen.
          # If even this envelope fails, changing the feature gates cannot solve the problem within this grid.
          def load_series(folder,col):
              frames=[]
              for p in sorted(pathlib.Path(folder).glob("20??-??.csv.gz")):
                  x=pd.read_csv(p,usecols=["time",col]);x.index=pd.to_datetime(x.time,unit="s",utc=True);frames.append(x[col])
              return pd.concat(frames).sort_index().loc[lambda x:~x.index.duplicated(keep="last")]
          marklo=load_series("data/delta_india/BTCUSD/institutional/history/mark_1m","low").reindex(m.index).to_numpy(float)
          markhi=load_series("data/delta_india/BTCUSD/institutional/history/mark_1m","high").reindex(m.index).to_numpy(float)
          markopen=load_series("data/delta_india/BTCUSD/institutional/history/mark_1m","open").reindex(m.index).to_numpy(float)
          funding=load_series("data/delta_india/BTCUSD/institutional/history/funding_1h","close")
          rate=funding.reindex(m.index.floor("h")-pd.Timedelta(hours=1)).to_numpy(float)
          pre=m.index<pd.Timestamp("2025-09-08T16:00:00Z")
          weight=np.where(pre,1/480,np.where((m.index.minute==0)&(m.index.hour%8==0),1.,0.))
          flow=np.where(weight==0,0.,rate*markopen*weight*.001/100)
          missing=~np.isfinite(flow)
          debitlong=np.r_[0.,np.cumsum(np.where(missing,0.,np.maximum(flow,0.)))]
          debitshort=np.r_[0.,np.cumsum(np.where(missing,0.,np.maximum(-flow,0.)))]
          invalid=np.r_[0,np.cumsum(missing|~np.isfinite(marklo)|~np.isfinite(markhi))]
          # Native 50x only, fixed one contract, no top-ups. A causal policy selects a TP/SL action.
          # Exact stress mask includes the full entry and exit minute, adverse mark shock,
          # trading cost, liquidation reserve and conservative funding debits.
          starts=np.array([m.index.searchsorted(pd.Timestamp(x+"-01",tz="Asia/Kolkata").tz_convert("UTC")) for x in MONTHS]+[m.index.searchsorted(pd.Timestamp("2026-11-01",tz="Asia/Kolkata").tz_convert("UTC"))],np.int64)
          actions=[(0.,0.)]+[(tp,cap) for cap in [.002,.003,.004,.005,.006,.007,.008,.009,.01,.012,.015,.018,.02] for tp in [.26,.38,.5,.65,.8,.9,1.2,1.5,1.9,2.5,3.,-1.]]
          T=np.array([x[0] for x in actions]);C=np.array([x[1] for x in actions]);B=len(actions)
          @njit(parallel=True)
          def build(slip,fee,scale,sl,delay,j0,ends,sd,mid,T,C,o,hi,lo,c,month_idx,marklo,markhi,debitlong,debitshort,invalid,starts):
              # For each action precompute full monthly contribution, including debit-only funding.
              P=np.zeros((S,N,B,22),np.float64);R=np.zeros((S,N,B),np.uint8);net=np.zeros((S,N,B));required=np.zeros((S,N));maint_need=np.zeros((S,N,B));exits=np.full((S,N,B),-1,np.int64)
              for si in prange(S):
                  for i in range(N):
                      start=j0[i]+delay[si]
                      if start>=ends[i]:continue
                      entry=(mid[i] if delay[si]==0 else o[start])+sd[i]*slip[si]
                      notional=.001*entry;required[si,i]=notional*(1+fee[si]);reserve=.0025+fee[si]+.0025*.5*1.18
                      for a in range(1,B):
                          j,p=replay(j0[i],ends[i],sd[i],mid[i],slip[si],fee[si],T[a]*scale[si],min(sl[si],C[a]*(sl[si]/.02)),si%2,delay[si],o,hi,lo,c)
                          if j<start or invalid[j+1]-invalid[start]>0:
                              R[si,i,a]=1;continue
                          if sd[i]==1:
                              adverse=np.min(marklo[start:j+1])*.995;debit=debitlong
                          else:
                              adverse=np.max(markhi[start:j+1])*1.005;debit=debitshort
                          cost=debit[j+1]-debit[start]
                          buf=notional/50-notional*fee[si]-cost+.001*sd[i]*(adverse-entry)-.001*adverse*reserve
                          maint_need[si,i,a]=notional*fee[si]+cost-.001*sd[i]*(adverse-entry)+.001*adverse*reserve
                          exits[si,i,a]=j;net[si,i,a]=p-cost
                          mo=month_idx[j]
                          if mo>=0:P[si,i,a,mo]=p
                          for mo in range(22):
                              l=max(start,starts[mo]);r=min(j+1,starts[mo+1])
                              if r>l:P[si,i,a,mo]-=debit[r]-debit[l]
              return P,R,net,required,maint_need,exits
          params=[x for x in scenarios for p in range(2)]
          args=[np.array([x[k] for x in params],dtype=np.int64 if k==6 else float) for k in [1,2,3,4,6]]
          P,R,net,required,maint_need,exits=build(*args,j0,ends,sd,mid,T,C,o,hi,lo,c,month_idx,marklo,markhi,debitlong,debitshort,invalid,starts)

          config=json.loads(pathlib.Path("strategy-candidates/btcusd_ema20_reclaim_unified_cross_frozen_20261124.json").read_text())
          chosen=config["rules"].copy()
          pol=np.zeros((3,N),np.int16)
          for rule in chosen:
              a=int(np.argmin(np.abs(T-rule["target"])+100*np.abs(C-rule["stop_cap_pct"]/100)))
              assert abs(T[a]-rule["target"])<1e-10 and abs(C[a]-rule["stop_cap_pct"]/100)<1e-10
              mask=np.ones((3,N),bool)
              for atom in rule["gate"].split(" AND "):
                  k,op,v=atom.split();v=float(v)
                  mask&=np.stack([((x[k]<=v) if op=="<=" else (x[k]>=v) if op==">=" else (x[k]==v)).to_numpy() for x in variants])
              if rule["mode"]=="selected_only":mask&=pol!=0
              if rule["mode"]=="new_only":mask&=pol==0
              pol[mask]=a
          thresholds={"volume_ratio":[.15,.25,.35,.45,.55,.65,.8,1.,1.25,1.5,2.,3.],"atr_pct":[.25,.35,.45,.55,.6,.7,.8,1.,1.25],"atr_expansion":[.65,.75,.85,.95,1.05,1.2],"adx14":[15,20,25,30,35,40],"dir_rsi14":[48,52,55,60,65],"ema_gap_pct":[.05,.1,.2,.4,.7,1.],"supertrend_gap_pct":[.5,.75,1.,1.5,2.],"ema_slope_pct":[-.2,-.1,0,.1,.2],"hourly_body_atr":[.25,.5,.75,1.,1.5],"hourly_range_atr":[.75,1.,1.5,2.],"supertrend_age_hours":[6,12,24,48]}
          atoms=[]
          for k,vs in thresholds.items():
              for v in vs:
                  for op in ("<=",">="):
                      mask=np.stack([((x[k]<=v) if op=="<=" else (x[k]>=v)).to_numpy() for x in variants])
                      if 3<=mask[0].sum()<=N-3:atoms.append((f"{k} {op} {v}",mask))
          for side in [-1,1]:atoms.append((f"side == {side}",np.stack([(x.side==side).to_numpy() for x in variants])))
          # The common pre-trade wallet guard deliberately applies even when nominal leverage exceeds 1x.
          # It guarantees identical fills across leverage settings, not identical raw signals.
          # Additional overlay uses only currently available wallet and completed signal indicators.
          @njit
          def simulate(pol,P,R,net,required,maint_need,exits,group,j0,delay,mask,action,cap,mode):
              monthly=np.zeros((S,22));stats=np.zeros((S,5))
              for si in range(S):
                  cash=100.;active=-1;k=group[si]
                  for i in range(N):
                      a=pol[k,i]
                      if cash<cap and mask[k,i]:
                          if (mode==0 and a==0) or (mode==1 and a!=0) or mode==2:a=action
                      if a==0:continue
                      if R[si,i,a] or exits[si,i,a]<0:stats[si,3]+=1;continue
                      if required[si,i]>cash:
                          stats[si,0]+=1;continue
                      if j0[i]+delay[si]<=active:
                          stats[si,1]+=1;continue
                      if maint_need[si,i,a]>=cash:stats[si,2]+=1
                      active=exits[si,i,a];cash+=net[si,i,a];stats[si,4]+=1
                      monthly[si]+=P[si,i,a]
              return monthly,stats
          delays=args[-1]
          overlay=config["overlay"]
          omask=np.ones((3,N),bool)
          for atom in overlay["gate"].split(" AND "):
              if atom=="ALL":continue
              k,op,v=atom.split();v=float(v)
              omask&=np.stack([((x[k]<=v) if op=="<=" else (x[k]>=v) if op==">=" else (x[k]==v)).to_numpy() for x in variants])
          oa=int(np.argmin(np.abs(T-overlay["target"])+100*np.abs(C-overlay["stop_cap_pct"]/100)))
          ocap=float(overlay["wallet_cap"]);omode=["new_only","selected_only","override"].index(overlay["mode"])
          base,bc=simulate(pol,P,R,net,required,maint_need,exits,group,j0,delays,omask,oa,ocap,omode)
          base_profit=float(min(base[0].sum(),base[1].sum()));base_worst=float(base.sum(axis=1).min());base_month=float(base.min())
          assert (base>=1).all() and bc[:,:4].sum()==0
          assert abs(base_profit-105.50727844684778)<1e-6
          def report(v,ct):
              return dict(cells=int((v>=1).sum()),total=v.size,base_profit=float(min(v[0].sum(),v[1].sum())),worst_profit=float(v.sum(axis=1).min()),worst_month=float(v.min()),skips=int(ct[:,0].max()),overlap=int(ct[:,1].max()),risk=int(ct[:,2].max()),invalid=int(ct[:,3].max()),base_trades=int(ct[1,4]))
          print("REFINE_BASE",json.dumps(report(base,bc)),flush=True)
          # All selection metrics exclusively Jan 2025-Oct 2026. Keep every passing monthly cell.
          # Also keep worst total and baseline return; prefer more return and stronger monthly floor.
          @njit
          def score(v,ct,profit_floor,worst_floor,month_floor):
              if ct[:,:4].sum()>0:return -1e12
              p=min(v[0].sum(),v[1].sum());w=1e9
              for si in range(S):w=min(w,v[si].sum())
              mn=v.min()
              if mn<month_floor-1e-9 or p<profit_floor-1e-9 or w<worst_floor-1e-9:return -1e12
              return p+.5*w+15*mn
          @njit(parallel=True)
          def choose(policy,masks,acts,P,R,net,required,maint_need,exits,group,j0,delays,omask,oa,ocap,omode,pf,wf,mf):
              ans=np.full((len(masks),len(acts),3),-1e12)
              for g in prange(len(masks)):
                  for ai in range(len(acts)):
                      a=acts[ai]
                      for mode in range(3):
                          q=policy.copy()
                          for k in range(3):
                              for i in range(N):
                                  if masks[g,k,i] and (mode==2 or mode==0 and q[k,i]==0 or mode==1 and q[k,i]!=0):q[k,i]=a
                          v,ct=simulate(q,P,R,net,required,maint_need,exits,group,j0,delays,omask,oa,ocap,omode)
                          ans[g,ai,mode]=score(v,ct,pf,wf,mf)
              return ans
          gates=atoms+[("ALL",np.ones((3,N),bool))]
          masks=np.stack([x[1] for x in gates])
          acts=np.arange(B,dtype=np.int64)
          policy=pol.copy();rules=chosen.copy();best=base;stats=bc;newrules=[]
          for step in range(1,9):
              prev=report(best,stats);pf=max(base_profit,prev["base_profit"]);wf=max(base_worst,prev["worst_profit"]);mf=max(base_month,prev["worst_month"])
              prior=score(best,stats,pf,wf,mf)
              scores=choose(policy,masks,acts,P,R,net,required,maint_need,exits,group,j0,delays,omask,oa,ocap,omode,pf,wf,mf)
              useg=gates;usem=masks
              if scores.max()<=prior+1e-9:
                  # Pair two feature gates. Preselect a deterministic diverse subset;
                  # never use date/month or 2024 performance as a feature.
                  pairs=[];seen=set()
                  for i in range(len(atoms)):
                      for j in range(i+1,len(atoms)):
                          if atoms[i][0].split()[0]==atoms[j][0].split()[0]:continue
                          mask=masks[i]&masks[j]
                          if mask[0].sum()<3 or mask[0].sum()>N-3:continue
                          key=np.packbits(mask).tobytes()
                          if key in seen:continue
                          seen.add(key);pairs.append((atoms[i][0]+" AND "+atoms[j][0],mask))
                  # Screen all distinct pairs with a reduced action grid, then use best pairs.
                  if not pairs:break
                  pm=np.stack([x[1] for x in pairs])
                  small=np.array([a for a in range(B) if a==0 or (any(abs(T[a]-v)<1e-9 for v in [.38,.9,1.9,3.,-1.]) and any(abs(C[a]-v)<1e-9 for v in [.004,.008,.015,.02]))],np.int64)
                  ps=choose(policy,pm,small,P,R,net,required,maint_need,exits,group,j0,delays,omask,oa,ocap,omode,pf,wf,mf)
                  ix=np.argsort(ps.max(axis=(1,2)))[-24:]
                  useg=[pairs[i] for i in ix];usem=pm[ix]
                  scores=choose(policy,usem,acts,P,R,net,required,maint_need,exits,group,j0,delays,omask,oa,ocap,omode,pf,wf,mf)
              if scores.max()<=prior+1e-9:
                  print("REFINE_NO_FURTHER_GAIN",step,flush=True);break
              g,ai,mode=np.unravel_index(scores.argmax(),scores.shape);a=acts[ai]
              mask=usem[g].copy()
              if mode==0:mask&=policy==0
              if mode==1:mask&=policy!=0
              policy[mask]=a
              rule=dict(gate=useg[g][0],target=float(T[a]),stop_cap_pct=float(C[a]*100),mode=["new_only","selected_only","override"][mode])
              rules.append(rule);newrules.append(rule)
              best,stats=simulate(policy,P,R,net,required,maint_need,exits,group,j0,delays,omask,oa,ocap,omode)
              print("REFINE_STEP",json.dumps(dict(step=step,rule=rule,**report(best,stats))),flush=True)
          result=report(best,stats)
          assert result["cells"]==880 and stats[:,:4].sum()==0
          assert result["base_profit"]>=base_profit-1e-8 and result["worst_profit"]>=base_worst-1e-8 and result["worst_month"]>=base_month-1e-8
          out=pathlib.Path("analysis/reclaim_2025_2026_profit_refinement");out.mkdir(parents=True,exist_ok=True)
          config["rules"]=rules;config["selection_data"]="2025-01 to 2026-10 ONLY";config["refinement_report"]=result
          (out/"candidate.json").write_text(json.dumps(config,indent=2))
          (out/"rules.json").write_text(json.dumps(rules,indent=2))
          (out/"overlay.json").write_text(json.dumps(dict(overlay=overlay),indent=2))
          pd.DataFrame(best,index=[f"{x[0]}_{p}" for x in scenarios for p in range(2)],columns=MONTHS).to_csv(out/"monthly.csv")
          print("REFINE_COMPLETE",json.dumps(dict(**result,added_rules=newrules,monthly_base=dict(zip(MONTHS,best[1].tolist())))),flush=True)
          PY
