name: BTC Pine ATR Only with fixed and additional point trails OFF 15m entry 1m monitoring
on:
  push:
    branches:
      - research/pine-15m-atr-only-no-point-trailing-20261121
    paths:
      - scripts/backtest_pine_atr_only_no_fixed_no_points_20261121.py
      - .github/workflows/pine-atronly-15m-1m-source-20261121.yml

permissions:
  contents: write

concurrency:
  group: pine-atr-only-15m-source-20261121
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested historical replay requirements
        run: python -m pip install numpy==2.2.3 pandas==2.2.3 numba==0.61.2
      - name: Verify user-corrected ATR-only trailing with both fixed-point switches OFF
        run: |
          python -m py_compile scripts/backtest_pine_atr_only_no_fixed_no_points_20261121.py
          python scripts/backtest_pine_atr_only_no_fixed_no_points_20261121.py
      - name: Upload trade ledgers and monthly / current-week summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-15m-atr-only-no-fixed-or-point-trails-full22
          path: analysis/pine_atr_only_no_fixed_no_points_20261121/
          if-no-files-found: warn
      - name: Commit research reports only; never refreshed historical prices
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/pine_atr_only_no_fixed_no_points_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: 22mo and week 15m 1m Pine ATR Only no native point trailing"
            git push origin HEAD:research/pine-15m-atr-only-no-point-trailing-20261121
          fi
