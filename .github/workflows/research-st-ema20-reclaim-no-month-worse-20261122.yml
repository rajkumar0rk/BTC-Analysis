name: BTC EMA20 Reclaim never worsen any month
on:
  push:
    branches:
      - research/st-ema20-reclaim-preserve-winning-months-20261122-v1
    paths:
      - scripts/research_st_ema20_reclaim_no_month_worse_20261122.py
      - .github/workflows/research-st-ema20-reclaim-no-month-worse-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-reclaim-no-month-worse-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install pandas numpy tabulate
      - name: Syntax check
        run: python -m py_compile scripts/research_st_ema20_reclaim_no_month_worse_20261122.py
      - name: Run every month no-worsening filter grid
        run: python scripts/research_st_ema20_reclaim_no_month_worse_20261122.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-reclaim-no-month-worse-20261122
          path: analysis/st_ema20_reclaim_no_month_worse_20261122/
          if-no-files-found: warn
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+rajkumar0rk@users.noreply.github.com"
          git add analysis/st_ema20_reclaim_no_month_worse_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: save strict Reclaim no-month-worse results"
            git pull --rebase origin research/st-ema20-reclaim-preserve-winning-months-20261122-v1
            git push origin HEAD:research/st-ema20-reclaim-preserve-winning-months-20261122-v1
          fi
