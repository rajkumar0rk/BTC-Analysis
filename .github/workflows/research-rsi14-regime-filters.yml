name: BTC RSI14 two-year robust research
on:
  push:
    branches: ['research/rsi14-two-year-regime-filters']
    paths:
      - 'scripts/research_rsi14_regime_filters.py'
      - '.github/workflows/research-rsi14-regime-filters.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_rsi14_regime_filters.py
      - uses: actions/upload-artifact@v4
        with:
          name: rsi14-regime-filters-full
          path: |
            scratch/rsi14_regime_filters/results.csv
            scratch/rsi14_regime_filters/all_results.json.gz
          if-no-files-found: error
