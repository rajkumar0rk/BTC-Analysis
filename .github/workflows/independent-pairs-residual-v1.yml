name: Independent two-leg BTC ETH residual monthly PF audit
on:
  push:
    branches: [research/independent-pairs-residual-20261118-v1]
    paths: [.github/workflows/independent-pairs-residual-v1.yml, scripts/research_independent_pairs_residual_v1.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pairs_research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-pairs-residual-20261118-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba tabulate
      - name: Verify source manifests and run independent pair backtests
        run: python scripts/research_independent_pairs_residual_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-btc-eth-pairs-residual-v1
          path: analysis/independent_pairs_residual_v1/
          retention-days: 45
      - name: Archive audited research on isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/independent_pairs_residual_v1/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive ETH BTC residual monthly ledgers"
            git pull --rebase origin research/independent-pairs-residual-20261118-v1
            git push origin HEAD:research/independent-pairs-residual-20261118-v1
          fi
