name: BTC ETH 9xATR initial stop grid, week and 22 months
on:
  push:
    branches:
      - research/grid-activation-extra-stop-sl9atr-20261121
    paths:
      - scripts/grid_activation_extra_stop_sl9atr_week22_20261121.py
      - .github/workflows/grid-9atr-activation-extra-stop-20261121.yml

permissions:
  contents: write

concurrency:
  group: research-grid-9atr-activation-extra-stop-20261121
  cancel-in-progress: false

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical research requirements
        run: python -m pip install numpy==2.2.3 pandas==2.2.3 numba==0.61.2
      - name: Run 130 combinations, both assets and price models, 22 months + current IST week
        run: |
          python -m py_compile scripts/grid_activation_extra_stop_sl9atr_week22_20261121.py
          python scripts/grid_activation_extra_stop_sl9atr_week22_20261121.py
      - name: Upload all 520 scenarios and monthly plus daily comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-stop-grid-initial9atr-btc-eth-20261121
          path: analysis/grid_extra_stop_initial9atr_week22_20261121/
          if-no-files-found: warn
      - name: Store research reports only, never re-fetched price archives
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/grid_extra_stop_initial9atr_week22_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: rank 130 extra-stop combos across full22 and current week with 9xATR stop"
            git push origin HEAD:research/grid-activation-extra-stop-sl9atr-20261121
          fi
