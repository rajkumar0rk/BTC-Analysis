name: BTCUSD 15m X180 frozen 2024 validation
on:
  push:
    branches: [research/btc15m-x180-frozen-2024-20261124]
    paths:
      - scripts/research_btc15m_x180_frozen_2024.py
      - .github/workflows/research-btc15m-x180-frozen-2024.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        month: ['2023-12','2024-01','2024-02','2024-03','2024-04','2024-05','2024-06','2024-07','2024-08','2024-09','2024-10','2024-11','2024-12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - run: python scripts/research_btc15m_x180_frozen_2024.py download ${{ matrix.month }}
      - uses: actions/upload-artifact@v4
        with:
          name: x180-2024-data-${{ matrix.month }}
          path: _validation_data/
          if-no-files-found: error
  replay:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: x180-2024-data-*
          path: _validation_data
          merge-multiple: true
      - run: python scripts/research_btc15m_x180_frozen_2024.py validate
      - uses: actions/upload-artifact@v4
        with:
          name: x180-2024-validation
          path: analysis/btc15m_x180_frozen_2024/
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_x180_frozen_2024/
          if ! git diff --cached --quiet; then
            git commit -m "research: report frozen X180 2024 validation and real candle coverage"
            git push origin HEAD:research/btc15m-x180-frozen-2024-20261124
          fi
