name: BTC ETH 1H second touch TP200 before SL100 event test
on:
  push:
    branches: [research/ema20-1h-second-touch-first-200tp-100sl-20261121]
    paths:
      - scripts/research_ema20_1h_second_touch_first_200tp_100sl.py
      - .github/workflows/research-ema20-1h-second-touch-first-200tp-100sl.yml
      - analysis/ema20_1h_second_touch_200tp_100sl_first_hit_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-1h-200tp-100sl-one-epoch-barrier-vs-flip
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install numpy pandas
      - name: Replay BTC ETH Jan 2025 - Oct 2026 with first-hit TP200 vs SL100
        shell: bash
        run: |
          mkdir -p analysis/ema20_1h_second_touch_200tp_100sl_first_hit_20261121/
          set -o pipefail
          python -u scripts/research_ema20_1h_second_touch_first_200tp_100sl.py 2>&1 | tee analysis/ema20_1h_second_touch_200tp_100sl_first_hit_20261121/execution.log
      - name: Save artifacts or error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-first-hit-1h-200tp-before-100sl
          path: analysis/ema20_1h_second_touch_200tp_100sl_first_hit_20261121/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit outputs only on independent research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_1h_second_touch_200tp_100sl_first_hit_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive first TP200 or SL100 BTC ETH 1h event counts"
            git push origin HEAD:research/ema20-1h-second-touch-first-200tp-100sl-20261121
          fi
