name: Independent BTC ETH channel compression monthly PF audit
on:
  push:
    branches: [research/independent-btc-eth-compression-break-v1]
    paths:
      - scripts/research_independent_compression_break_v1.py
      - .github/workflows/independent-compression-break-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-btc-eth-compression-break-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba tabulate
      - name: Replay BTC and ETH 1-minute data with matched signals
        run: python scripts/research_independent_compression_break_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-compression-break-v1-results
          path: analysis/independent_compression_break_v1/
          retention-days: 45
      - name: Archive verified results on research branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/independent_compression_break_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'research: archive independent paired compression breakout monthly ledgers'
            git push origin HEAD:research/independent-btc-eth-compression-break-v1
          fi
