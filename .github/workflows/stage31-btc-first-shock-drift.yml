name: Stage31 BTC-first shock drift paired research
on:
  push:
    branches: [research/btc-first-shock-drift-stage31-20261119]
    paths:
      - scripts/research_paired_shock_drift_stage31.py
      - .github/workflows/stage31-btc-first-shock-drift.yml
permissions:
  contents: write
jobs:
  paired-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: stage31-btc-first-shock-drift
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable source revision
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install numpy pandas numba tabulate
      - name: Run causal paired native 1m backtest
        run: PYTHONPATH=scripts python scripts/research_paired_shock_drift_stage31.py
      - name: Upload original evidence even if subsequent commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage31-paired-ledgers
          path: analysis/paired_shock_drift_stage31/
          if-no-files-found: warn
      - name: Commit reproducible results to isolated branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/paired_shock_drift_stage31/
          git diff --cached --quiet || (git commit -m "Stage31 original paired ledgers and monthly audit" && git push)
