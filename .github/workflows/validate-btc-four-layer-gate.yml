name: Validate and block unproven BTC four-layer multi-regime strategy
on:
  push:
    branches: [research/btc-four-layer-regime-trading-20261121]
    paths:
      - scripts/validate_btc_four_layer_gate_20261121.py
      - .github/workflows/validate-btc-four-layer-gate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-four-layer-gate-20261121
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent audit packages
        run: python -m pip install numpy pandas
      - name: Audit signals, completed 4H and 15M states, exclusive 1M order events and cost reconciliation
        run: python scripts/validate_btc_four_layer_gate_20261121.py
      - name: Preserve release blocking decision
        uses: actions/upload-artifact@v4
        with:
          name: btc-four-layer-regime-validation-no-go
          path: |
            analysis/btc_four_layer_regime_trading_20261121/RELEASE_VALIDATION.json
            analysis/btc_four_layer_regime_trading_20261121/RELEASE_VALIDATION.md
          retention-days: 90
          if-no-files-found: error
      - name: Save independent release gate
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_four_layer_regime_trading_20261121/RELEASE_VALIDATION.*
          if ! git diff --cached --quiet; then
            git commit -m "research: record four-layer regime trading NO-GO evidence gate"
            git push origin HEAD:research/btc-four-layer-regime-trading-20261121
          fi
