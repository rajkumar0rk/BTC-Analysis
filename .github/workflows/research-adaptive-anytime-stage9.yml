name: Research BTC Stage 9 adaptive anytime 200 point entries
on:
  push:
    branches: [main]
    paths:
      - scripts/research_adaptive_anytime_entries_stage9.py
      - .github/workflows/research-adaptive-anytime-stage9.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage9-adaptive-anytime
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research libraries
        run: python -m pip install numpy pandas numba scikit-learn tabulate
      - name: Train and evaluate anytime directional classifier
        run: python scripts/research_adaptive_anytime_entries_stage9.py
      - name: Save full Stage 9 reports, even if negative
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage9_adaptive_direction
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage 9 anytime model results"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
