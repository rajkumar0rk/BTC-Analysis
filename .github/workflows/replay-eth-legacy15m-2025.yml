name: ETH legacy 15m 2025 corrected OHLC vs OLHC zero spread
on:
  push:
    branches: ['research/eth-legacy15m-2025-open-olhc-20261127']
    paths: ['scripts/replay_eth_legacy15m_2025.py','.github/workflows/replay-eth-legacy15m-2025.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - run: python scripts/replay_eth_legacy15m_2025.py --output "$RUNNER_TEMP/eth-2025"
      - uses: actions/upload-artifact@v4
        with:
          name: eth-legacy15m-2025
          path: ${{ runner.temp }}/eth-2025
          if-no-files-found: error
