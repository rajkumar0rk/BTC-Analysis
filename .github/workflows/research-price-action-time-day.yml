name: BTC price action by day and session
on:
  push:
    branches: [main]
    paths:
      - scripts/research_price_action_time_day.py
      - .github/workflows/research-price-action-time-day.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-price-action-time-day
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Test non-indicator price action and weekday-session rules
        run: python scripts/research_price_action_time_day.py
      - name: Commit reproducible research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/price_action_time_day
          if ! git diff --cached --quiet; then
            git commit -m "research: price-action weekday and session results"
            git push
          fi
