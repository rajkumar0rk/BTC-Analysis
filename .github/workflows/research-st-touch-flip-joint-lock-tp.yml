name: BTC ST joint Touch profit lock Flip take profit sweep
on:
  push:
    branches:
      - research/st-touch-flip-exit-protection-20261122
    paths:
      - scripts/research_st_touch_flip_joint_profit_lock_tp.py
      - .github/workflows/research-st-touch-flip-joint-lock-tp.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Replay joint lock and take-profit changes using 1 minute BTC OHLC
        run: python -u scripts/research_st_touch_flip_joint_profit_lock_tp.py
      - name: Archive complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-joint-profit-lock-tp-improvement
          path: analysis/st_touch_flip_joint_profit_lock_tp_20261122/
          if-no-files-found: warn
      - name: Publish final research report to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_touch_flip_joint_profit_lock_tp_20261122/
          if ! git diff --cached --quiet; then
            git commit -m "research: joint BTC ST profit lock and take profit exit cross test"
            git push origin HEAD:research/st-touch-flip-exit-protection-20261122
          fi
