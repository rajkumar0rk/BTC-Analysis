name: V72 causal contraction removal training only
on:
  push:
    branches: [research/v72-no-contraction-20261125]
    paths:
      - scripts/research_v72_no_contraction.py
      - .github/workflows/research-v72-no-contraction.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v72-no-contraction
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load historical training archive only
        run: |
          git fetch --depth=1 origin main research/btcusd-2024-gap-retry-20261124
          git checkout origin/research/btcusd-2024-gap-retry-20261124 -- data/delta_india/BTCUSD/2024_verified_archive
          git checkout origin/main -- 'data/delta_india/BTCUSD/1m/2025-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2025-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2025-*.csv.gz'
          git reset
          python -m pip install 'numpy<2.3' pandas numba tabulate
      - name: Select single setup on 2024 and 2025 chronological folds only
        run: |
          python -m py_compile scripts/research_v72_no_contraction.py
          python -u scripts/research_v72_no_contraction.py
      - name: Commit training results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v72_no_contraction
          if ! git diff --cached --quiet; then
            git commit -m 'Report V72 contraction removal using only 2024 and 2025 training'
            git push origin HEAD:research/v72-no-contraction-20261125
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v72-training
          path: analysis/v72_no_contraction/
          if-no-files-found: error
