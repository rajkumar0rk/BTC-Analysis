name: Independent BTC ETH cross-asset 4H confirmation monthly PF audit
on:
  push:
    branches: [research/independent-crossasset-confirmation-pf-20261118]
    paths:
      - scripts/research_independent_crossasset_confirmation_20261118.py
      - .github/workflows/independent-crossasset-confirmation-pf-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-crossasset-confirmation-20261118
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-crossasset-confirmation-pf-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Run original minute-data BTC ETH cross-asset confirmation
        run: python scripts/research_independent_crossasset_confirmation_20261118.py
      - name: Upload all monthly results and ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-btc-eth-crossasset-pf
          path: analysis/independent_crossasset_confirmation_20261118/
          retention-days: 45
          if-no-files-found: warn
      - name: Commit result files only to isolated branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/independent_crossasset_confirmation_20261118/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive independent BTC ETH monthly PF confirmation"
            git push origin HEAD:research/independent-crossasset-confirmation-pf-20261118
          fi
