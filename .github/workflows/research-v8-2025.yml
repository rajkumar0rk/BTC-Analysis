name: Research BTC V8 2025 big-move behavior
on:
  push:
    branches: [main]
    paths:
      - scripts/research_v8_2025_big_moves.py
      - .github/workflows/research-v8-2025.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-v8-2025-big-moves
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis libraries
        run: python -m pip install pandas numpy
      - name: Catalogue 2025 BTC trends and test pre-move conditions
        run: python scripts/research_v8_2025_big_moves.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: BTC-V8-2025-big-trend-research
          path: analysis/v8_2025_behavior/
          if-no-files-found: error
      - name: Persist study results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/v8_2025_behavior/
          if ! git diff --cached --quiet; then
            git commit -m "research(v8): save 2025 big-move outcome report"
            git pull --rebase origin main
            git push
          fi
