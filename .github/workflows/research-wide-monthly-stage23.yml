name: Research BTC Stage23 expanded five-minute monthly pattern search
on:
  push:
    branches: [main]
    paths:
      - scripts/research_wide_monthly_stage23.py
      - .github/workflows/research-wide-monthly-stage23.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage23-wide-monthly
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical tools
        run: python -m pip install numpy pandas scipy tabulate
      - name: Run 2025-only selection and 2026 checks
        run: python scripts/research_wide_monthly_stage23.py
      - name: Commit all research findings
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage23_broad_5m_monthly/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive Stage23 monthly portfolio screening and 5m entry evidence"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
