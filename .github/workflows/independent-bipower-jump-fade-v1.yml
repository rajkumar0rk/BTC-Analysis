name: Independent BTC ETH bipower jump fade audit
on:
  push:
    branches: [research/independent-bipower-jump-fade-20261118-v1]
    paths:
      - scripts/independent_bipower_jump_fade_v1.py
      - .github/workflows/independent-bipower-jump-fade-v1.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-bipower-jump-fade-v1
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/independent-bipower-jump-fade-20261118-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas numba tabulate
      - name: Replay both markets using 1h bipower jumps and native 1m OHLC
        run: python scripts/independent_bipower_jump_fade_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-bipower-jump-fade-v1
          path: analysis/independent_bipower_jump_fade_v1/
          retention-days: 45
      - name: Commit only independent research results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/independent_bipower_jump_fade_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'research: archive bipower jump fade BTC ETH monthly PF audit'
            git fetch origin research/independent-bipower-jump-fade-20261118-v1
            git rebase origin/research/independent-bipower-jump-fade-20261118-v1
            git push origin HEAD:research/independent-bipower-jump-fade-20261118-v1
          fi
