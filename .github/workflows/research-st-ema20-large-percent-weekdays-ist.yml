name: BTC ST EMA20 large percent locks weekdays IST only
on:
  push:
    branches:
      - research/st-ema20-large-percent-weekdays-ist-20261122
    paths:
      - scripts/backtest_st_ema20_large_percent_weekdays_ist.py
      - .github/workflows/research-st-ema20-large-percent-weekdays-ist.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-large-percent-weekdays-ist
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas numpy
        run: python -m pip install pandas numpy
      - name: Syntax and smoke checks
        run: python -m py_compile scripts/backtest_st_ema20_large_percent_weekdays_ist.py
      - name: Backtest 144 percent locks with new fills Monday-Friday IST
        run: python scripts/backtest_st_ema20_large_percent_weekdays_ist.py
      - name: Upload comparison, entry audit, trade records and monthly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-st-ema20-large-percent-lock-weekday-144
          path: analysis/st_ema20_large_percent_weekdays_ist_1h/
          if-no-files-found: warn
      - name: Commit successful reports to separate research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_large_percent_weekdays_ist_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist IST weekdays-only percent-lock comparison"
            git pull --rebase origin research/st-ema20-large-percent-weekdays-ist-20261122
            git push origin HEAD:research/st-ema20-large-percent-weekdays-ist-20261122
          fi
