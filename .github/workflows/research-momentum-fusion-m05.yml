name: Momentum Fusion M05 BTC2025 baseline
on:
  push:
    branches:
      - research/momentum-vwap-score-20261121
    paths:
      - scripts/research_momentum_fusion_m05.py
      - .github/workflows/research-momentum-fusion-m05.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python scripts/research_momentum_fusion_m05.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-fusion-m05-btc2025
          path: analysis/momentum_vwap_score_20261121/m05_baseline/
          if-no-files-found: warn
