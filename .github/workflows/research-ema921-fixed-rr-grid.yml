name: Backtest EMA9-21 MTF fixed SL-TP parameter grid
on:
  push:
    branches:
      - research/ema921-fixed-rr-grid-20261122
    paths:
      - scripts/research_ema921_fixed_rr_grid.py
      - .github/workflows/research-ema921-fixed-rr-grid.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema921-fixed-exit-grid-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas tabulate
      - name: Verify novelty preregistration and script
        run: |
          test -s analysis/ema921_fixed_rr_grid/NOVELTY_CHECK.md
          python -m py_compile scripts/research_ema921_fixed_rr_grid.py
      - name: Run BTCUSD full 1m sweep
        run: python scripts/research_ema921_fixed_rr_grid.py
      - name: Save reports and individual trades to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema921_fixed_rr_grid/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist EMA9-21 26-pair stop-target sensitivity results"
            git push origin HEAD:research/ema921-fixed-rr-grid-20261122
          fi
