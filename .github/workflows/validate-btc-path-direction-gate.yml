name: Validate and block unproven BTC direction predictor
on:
  push:
    branches:
      - research/btc-path-aware-direction-20261121
    paths:
      - scripts/validate_btc_path_direction_gate_20261121.py
      - .github/workflows/validate-btc-path-direction-gate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-path-direction-gate-20261121
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit packages
        run: python -m pip install numpy pandas
      - name: Check data release chronology, account evidence, and direction confidence
        run: python scripts/validate_btc_path_direction_gate_20261121.py
      - name: Archive fail-closed deployment gate
        uses: actions/upload-artifact@v4
        with:
          name: btc-path-aware-direction-rejection-gate
          path: |
            analysis/btc_path_aware_direction_20261121/DIRECTION_DEPLOYMENT_GATE.json
            analysis/btc_path_aware_direction_20261121/DIRECTION_DEPLOYMENT_GATE.md
          if-no-files-found: error
          retention-days: 90
      - name: Preserve audit decision on research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_path_aware_direction_20261121/DIRECTION_DEPLOYMENT_GATE.*
          if ! git diff --cached --quiet; then
            git commit -m "research: record fail-closed BTC direction deployment decision"
            git push origin HEAD:research/btc-path-aware-direction-20261121
          fi
