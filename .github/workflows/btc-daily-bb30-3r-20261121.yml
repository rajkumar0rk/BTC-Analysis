name: BTC Daily Bollinger30 3R Delta 1m Backtest
on:
  push:
    branches:
      - research/btc-daily-bb30-3r-20261121
    paths:
      - scripts/research_daily_bollinger_30_3r.py
      - scripts/research_daily_bollinger_30_3r_concurrent.py
      - .github/workflows/btc-daily-bb30-3r-20261121.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-daily-bb30-3r-20261121
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install pandas numpy tabulate
      - name: Run historical Delta BTCUSD 1m replay
        run: |
          python scripts/research_daily_bollinger_30_3r.py
          python scripts/research_daily_bollinger_30_3r_concurrent.py
      - name: Commit immutable research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_bollinger_30_3r/
          if ! git diff --cached --quiet; then
            git commit -m "research: daily BB30 3R Delta 1m replay results"
            git push
          fi
