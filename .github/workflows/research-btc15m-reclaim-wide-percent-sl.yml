name: BTCUSD 15M Reclaim Wider Percentage SL and Profit Locks
on:
  push:
    branches: [research/btc15m-reclaim-wide-percent-sl-protection-20261123]
    paths:
      - scripts/research_btc15m_reclaim_wide_percent_sl_20261123.py
      - .github/workflows/research-btc15m-reclaim-wide-percent-sl.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc15m-reclaim-wide-percent-sl
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install numpy pandas tabulate
      - name: BTC 15M Reclaim 1 to 3 percent SL test
        shell: bash
        run: |
          mkdir -p analysis/btc15m_reclaim_wide_percent_sl_20261123
          set -o pipefail
          python -u scripts/research_btc15m_reclaim_wide_percent_sl_20261123.py 2>&1 | tee analysis/btc15m_reclaim_wide_percent_sl_20261123/execution.log
      - name: Upload artifacts and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-reclaim-wide-percent-sl
          path: analysis/btc15m_reclaim_wide_percent_sl_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive research branch results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_reclaim_wide_percent_sl_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive wider fixed percent stops and protection"
            git push origin HEAD:research/btc15m-reclaim-wide-percent-sl-protection-20261123
          fi
