name: Platform walk-forward benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/btc_analysis/service/walkforward*.py','tests/platform/test_walkforward.py','scripts/platform_walkforward_benchmark.py','.github/workflows/platform-walkforward.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSD, ETHUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/platform-linux.lock && python -m pip install --no-deps '.[data,api]' && python -m pip check
      - run: python -m unittest discover -s tests/platform -p test_walkforward.py -v
      - run: python -m btc_analysis.data.cli --symbol ${{ matrix.symbol }} --store "$RUNNER_TEMP/history"
      - run: python scripts/platform_walkforward_benchmark.py "$RUNNER_TEMP/history" ${{ matrix.symbol }} "$RUNNER_TEMP/walkforward.json"
      - uses: actions/upload-artifact@v4
        with:
          name: walkforward-${{ matrix.symbol }}
          path: ${{ runner.temp }}/walkforward.json
          if-no-files-found: error
