name: BTC ETH 15M filtered first-touch 1R2R TP with ATR14 trail 2x3x
on:
  push:
    branches: [research/st-firsttouch-15m-filtered-1r2r-atrtrail2x3-20261123]
    paths:
      - scripts/research_st_firsttouch_15m_filtered_1r2r_atrtrail2x3_20261123.py
      - .github/workflows/research-st-firsttouch-15m-filtered-1r2r-atrtrail2x3.yml
      - analysis/st_firsttouch_15m_filtered_1r2r_atrtrail2x3_20261123/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-eth-15m-firsttouch-1r2r-atrtrail-20261123
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas
      - name: Backtest four TP and trailing configurations for BTC and ETH, 1m replay
        shell: bash
        run: |
          mkdir -p analysis/st_firsttouch_15m_filtered_1r2r_atrtrail2x3_20261123
          set -o pipefail
          python -u scripts/research_st_firsttouch_15m_filtered_1r2r_atrtrail2x3_20261123.py 2>&1 | tee analysis/st_firsttouch_15m_filtered_1r2r_atrtrail2x3_20261123/execution.log
      - name: Save artifacts even if job fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firsttouch-15m-filtered-1r2r-tp-atrtrail2x3
          path: analysis/st_firsttouch_15m_filtered_1r2r_atrtrail2x3_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit evidence to research branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_firsttouch_15m_filtered_1r2r_atrtrail2x3_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 15M filtered 1R/2R TP with 2x/3x ATR14 trailing"
            git push origin HEAD:research/st-firsttouch-15m-filtered-1r2r-atrtrail2x3-20261123
          fi
