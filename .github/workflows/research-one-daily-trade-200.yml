name: One BTC futures trade every day, 200 point objective
on:
  push:
    branches: [main]
    paths:
      - scripts/research_one_trade_every_day_200.py
      - .github/workflows/research-one-daily-trade-200.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-one-daily-200
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Backtest precisely one entry per full NY day
        run: python scripts/research_one_trade_every_day_200.py
      - name: Commit findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/one_daily_trade_200_points
          if ! git diff --cached --quiet; then
            git commit -m "research: one daily BTCUSD trade with 200-point target"
            git push
          fi
