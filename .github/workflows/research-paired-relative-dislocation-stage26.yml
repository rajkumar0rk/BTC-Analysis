name: Independent BTC ETH relative dislocation Stage26
on:
  push:
    branches:
      - research/btc-eth-relative-dislocation-stage26-20261119
    paths:
      - scripts/research_paired_relative_dislocation_stage26.py
      - .github/workflows/research-paired-relative-dislocation-stage26.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-btc-eth-relative-value-stage26
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Causal native BTC ETH ratio study
        run: python scripts/research_paired_relative_dislocation_stage26.py
      - name: Archive full reproducible evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paired-relative-dislocation-stage26-ledgers
          path: analysis/paired_relative_dislocation_stage26/
          retention-days: 60
          if-no-files-found: error
      - name: Commit new isolated evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/paired_relative_dislocation_stage26/
          if ! git diff --cached --quiet; then
            git commit -m 'research: archive paired relative-price original ledgers and monthly equity'
            git push origin HEAD:research/btc-eth-relative-dislocation-stage26-20261119
          fi
