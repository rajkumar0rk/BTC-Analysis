name: Research Stage12 monthly profitability original 2R inside-bar
on:
  push:
    branches: [main]
    paths:
      - scripts/research_stage12_monthly.py
      - .github/workflows/research-stage12-monthly.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: btc-stage12-monthly-consistency
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pandas and table formatter
        run: python -m pip install pandas tabulate
      - name: Retrieve the original Stage12 trade ledger without rerunning backtests
        uses: actions/download-artifact@v4
        with:
          name: btc-stage12-pretrend-trades
          run-id: 44108340139
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: monthly_audit_input
      - name: Verify exact model and calculate every IST calendar month
        run: python scripts/research_stage12_monthly.py --ledger monthly_audit_input/trade_ledger.csv.gz
      - name: Commit monthly audited results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage12_pretrend/monthly_inside_bar_2R_IST.csv
          git add analysis/institutional_discovery_stage12_pretrend/monthly_inside_bar_2R_quality.json
          git add analysis/institutional_discovery_stage12_pretrend/MONTHLY_INSIDE_BAR_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: save verified Stage12 monthly inside-bar PnL"
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
