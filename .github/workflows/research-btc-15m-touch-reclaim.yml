name: BTCUSD 15M ONLY Touch Reclaim Combined
on:
  push:
    branches: [research/btc-only-15m-touch-reclaim-20261123]
    paths:
      - scripts/research_btc_15m_touch_reclaim_20261123.py
      - .github/workflows/research-btc-15m-touch-reclaim.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-15m-only-touch-reclaim
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install numpy pandas tabulate
      - name: Replay BTCUSD ONLY 15M on 1M execution
        shell: bash
        run: |
          mkdir -p analysis/btc_only_15m_touch_reclaim_20261123
          set -o pipefail
          python -u scripts/research_btc_15m_touch_reclaim_20261123.py 2>&1 | tee analysis/btc_only_15m_touch_reclaim_20261123/execution.log
      - name: Upload result artifacts or failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusd-only-15m-touch-reclaim-20261123
          path: analysis/btc_only_15m_touch_reclaim_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive to research branch only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_only_15m_touch_reclaim_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive BTC-only 15m touch reclaim combined"
            git push origin HEAD:research/btc-only-15m-touch-reclaim-20261123
          fi
