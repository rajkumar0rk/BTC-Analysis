name: Independent Daily Volatility Regime Research
on:
  push:
    branches: [research/daily-volatility-shock-fade-20261119-v1]
    paths:
      - scripts/research_daily_volatility_shock_fade_20261119.py
      - .github/workflows/research-daily-volatility-shock-fade-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - name: Execute 2025 and 2026 BTC ETH tests
        run: python -u scripts/research_daily_volatility_shock_fade_20261119.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-volatility-shock-20261119
          path: analysis/daily_volatility_shock_fade_20261119/
          if-no-files-found: error
      - name: Archive result evidence on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_volatility_shock_fade_20261119/summary.csv
          git add analysis/daily_volatility_shock_fade_20261119/selected.csv
          git add analysis/daily_volatility_shock_fade_20261119/selected_monthly.csv
          git add analysis/daily_volatility_shock_fade_20261119/quality.json
          git add analysis/daily_volatility_shock_fade_20261119/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive independent volatility regime results"
            git push origin HEAD:research/daily-volatility-shock-fade-20261119-v1
          fi