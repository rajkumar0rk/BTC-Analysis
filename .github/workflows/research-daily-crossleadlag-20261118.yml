name: Daily BTC ETH Cross-Market Lead Lag Research
on:
  push:
    branches: [research/daily-cross-leadlag-20261118]
    paths:
      - scripts/research_daily_crossleadlag_20261118.py
      - .github/workflows/research-daily-crossleadlag-20261118.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas
      - name: Backtest causal cross-market daily signals on BTC ETH
        run: python -u scripts/research_daily_crossleadlag_20261118.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-crossleadlag-20261118
          path: analysis/daily_crossleadlag_20261118/
          if-no-files-found: error
      - name: Commit evidence only on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_crossleadlag_20261118/summary.csv
          git add analysis/daily_crossleadlag_20261118/selected.csv
          git add analysis/daily_crossleadlag_20261118/selected_monthly.csv
          git add analysis/daily_crossleadlag_20261118/quality.json
          git add analysis/daily_crossleadlag_20261118/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: archive independent daily lead-lag net backtest"
            git push origin HEAD:research/daily-cross-leadlag-20261118
          fi