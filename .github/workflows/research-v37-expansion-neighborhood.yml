name: V37 clean 2024-2025 training and frozen 2026 validation
on:
  push:
    branches: [research/v37-expansion-neighborhood-20261124]
    paths:
      - scripts/research_v37_expansion_neighborhood.py
      - .github/workflows/research-v37-expansion-neighborhood.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v37-expansion-neighborhood
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      training_pass: ${{ steps.gate.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load historical training archive only
        run: |
          git fetch --depth=1 origin main research/btcusd-2024-gap-retry-20261124
          git checkout origin/research/btcusd-2024-gap-retry-20261124 -- data/delta_india/BTCUSD/2024_verified_archive
          git checkout origin/main -- 'data/delta_india/BTCUSD/1m/2025-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2025-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2025-*.csv.gz'
          git reset
          python -m pip install 'numpy<2.3' pandas numba tabulate
      - name: Select single setup on 2024 and 2025 chronological folds only
        run: |
          python -m py_compile scripts/research_v37_expansion_neighborhood.py
          python -u scripts/research_v37_expansion_neighborhood.py train
      - name: Check training promotion gate
        id: gate
        run: |
          python -c 'import json; print("pass="+str(json.load(open("analysis/v37_expansion_neighborhood/frozen.json"))["training_pass"]).lower())' >> "$GITHUB_OUTPUT"
      - name: Commit frozen configuration before validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v37_expansion_neighborhood
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze V37 selection using only 2024 and 2025 training'
            git push origin HEAD:research/v37-expansion-neighborhood-20261124
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v37-frozen-training
          path: analysis/v37_expansion_neighborhood/
          if-no-files-found: error
  validate:
    needs: train
    if: needs.train.outputs.training_pass == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v37-expansion-neighborhood-20261124
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen config then load 2026 validation candles
        run: |
          test -s analysis/v37_expansion_neighborhood/frozen.json
          git fetch --depth=1 origin main
          git checkout origin/main -- 'data/delta_india/BTCUSD/1m/2025-12.csv.gz' 'data/delta_india/BTCUSD/1m/2026-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2025-12.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2026-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2025-12.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2026-*.csv.gz'
          git reset
          python -m pip install 'numpy<2.3' pandas numba tabulate
      - name: Run one frozen 2026 replay without search
        run: python -u scripts/research_v37_expansion_neighborhood.py validate
      - name: Publish validation without changing frozen configuration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code -- analysis/v37_expansion_neighborhood/frozen.json
          git add analysis/v37_expansion_neighborhood/validation*
          if ! git diff --cached --quiet; then
            git commit -m 'Report frozen V37 2026 validation without retuning'
            git push origin HEAD:research/v37-expansion-neighborhood-20261124
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v37-frozen-2026-validation
          path: analysis/v37_expansion_neighborhood/
          if-no-files-found: error
