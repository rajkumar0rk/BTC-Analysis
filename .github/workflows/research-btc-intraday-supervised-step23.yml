name: BTCUSD Step23 - Intraday Supervised Direction, Every Weekday
on:
  push:
    branches:
      - research/btc-daily-intraday-supervised-step23
    paths:
      - scripts/research_btc_daily_intraday_supervised_step23.py
      - .github/workflows/research-btc-intraday-supervised-step23.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and machine learning dependencies
        run: python -m pip install numpy pandas numba scikit-learn tabulate
      - name: Evaluate 54 causal minute-trained BTC directional models on all 477 weekdays
        run: python scripts/research_btc_daily_intraday_supervised_step23.py
      - name: Publish model grid, exact all-weekday trades and monthly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step23-intraday-supervised-477-weekdays
          path: analysis/btc_daily_intraday_supervised_step23/
          if-no-files-found: warn
