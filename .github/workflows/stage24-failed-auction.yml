name: Stage24 Failed Auction Research
on:
  push:
    paths:
      - '.github/workflows/stage24-failed-auction.yml'
      - 'scripts/research_stage24_failed_auction.py'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install numpy pandas numba tabulate
      - name: Execute stage24 and preserve original ledger
        run: python scripts/research_stage24_failed_auction.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage24-failed-auction-audit
          path: analysis/stage24_failed_auction/
          retention-days: 30
