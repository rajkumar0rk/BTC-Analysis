name: BTC 1H EMA20 ST variable profit lock ladders 84 scenarios
on:
  push:
    branches:
      - research/st-ema20-variable-lock-ladders-20261122
    paths:
      - scripts/backtest_st_ema20_variable_profit_ladders.py
      - .github/workflows/research-st-ema20-variable-profit-ladders.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-st-ema20-variable-profit-lock-20261122
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install replay dependencies
        run: python -m pip install numpy pandas
      - name: Validate syntax
        run: python -m py_compile scripts/backtest_st_ema20_variable_profit_ladders.py
      - name: Run 84 causal 1 minute EMA20 Supertrend variable ladder backtests
        run: python scripts/backtest_st_ema20_variable_profit_ladders.py
      - name: Upload auditable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema20-st-variable-profit-ladders-84
          path: analysis/st_ema20_variable_lock_ladders_1h/
          if-no-files-found: warn
      - name: Commit verified reports to separate research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_ema20_variable_lock_ladders_1h/
          if ! git diff --cached --quiet; then
            git commit -m "research: persist variable profit ladder 1m replay"
            git pull --rebase origin research/st-ema20-variable-lock-ladders-20261122
            git push origin HEAD:research/st-ema20-variable-lock-ladders-20261122
          fi
