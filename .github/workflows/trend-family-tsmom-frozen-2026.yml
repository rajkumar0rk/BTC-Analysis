name: Trend family frozen TSMOM BTC2026 Jan-Sep recheck
on:
  push:
    branches: [research/trend-following-family-20261121]
    paths:
      - .github/workflows/trend-family-tsmom-frozen-2026.yml
      - scripts/trend_family_tsmom_frozen_2026.py
      - scripts/trend_family_tsmom_frozen_2026_audit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-btc2026:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.2.6' 'pandas==2.2.3' 'numba==0.61.2' 'tabulate==0.9.0'
      - name: Authentic BTCUSD 1m frozen 2026 Jan-Sep historical replay
        run: python scripts/trend_family_tsmom_frozen_2026.py
      - name: Independent fee realized-PF and account NAV audit
        run: python scripts/trend_family_tsmom_frozen_2026_audit.py
      - name: Preserve historical artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-tsmom-frozen-2026-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: analysis/trend_following_family_20261121/tsmom_frozen_2026_jan_sep/
