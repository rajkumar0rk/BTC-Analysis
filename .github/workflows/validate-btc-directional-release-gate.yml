name: Validate BTC directional model before any release
on:
  push:
    branches: [research/btc-microstructure-directional-20261121]
    paths:
      - scripts/validate_btc_directional_release_gate_20261121.py
      - .github/workflows/validate-btc-directional-release-gate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-directional-release-gate
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metrics
        run: python -m pip install numpy pandas scikit-learn tabulate
      - name: Fail closed if direction skill or trading PnL is unproven
        run: python scripts/validate_btc_directional_release_gate_20261121.py
      - name: Archive model release decision
        uses: actions/upload-artifact@v4
        with:
          name: btc-directional-release-gate-20261121
          path: analysis/btc_directional_release_gate_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Save release report to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_directional_release_gate_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: store fail-closed BTC direction release decision"
            git push origin HEAD:research/btc-microstructure-directional-20261121
          fi
