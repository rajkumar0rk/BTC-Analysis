              mon=np.zeros(12);counts=np.zeros(12);cash=100.;peak=100.;dd=0.;v=np.zeros(10);risk=0;reentries=0;skip_month=np.zeros(12);skip_pnl=np.zeros(12);skip_wins=0;skip_losses=0
