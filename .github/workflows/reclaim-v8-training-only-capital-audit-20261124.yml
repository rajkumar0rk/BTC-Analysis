          @njit
          def batch(o,h,l,c,j,sd,mid,ends,month,fl,fs,fmissing,ml,mh,cycles,stops,targets,path,slip,fee,cash,peak,ladder,protect,max_reentries,cooldown,retry_sl,retry_tp,slscale,atrs,activation,distance,collateral_multiple):
              mon=np.zeros(12);counts=np.zeros(12);wins=0;losses=0;flat=0;dd=0.;skips=0;overlaps=0;boundary=0;missing=0;markmissing=0;funding=0.;fees=0.;marginrisk=0;active=-1;last_cycle=-1;attempts=0;retry_allowed=False;reentries=0;skip_month=np.zeros(12);skip_pnl=np.zeros(12);skip_wins=0;skip_losses=0
              for i in range(len(j)):
                  k=j[i];side=sd[i];entry=mid[i]+side*slip
