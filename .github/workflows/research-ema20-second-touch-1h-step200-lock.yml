name: 1H BTC ETH EMA second touch 200 point step-lock OHLC scenarios
on:
  push:
    branches: [research/ema20-second-touch-1h-step200-lock-20261121]
    paths:
      - scripts/research_ema20_second_touch_1h_step200_lock_paths.py
      - .github/workflows/research-ema20-second-touch-1h-step200-lock.yml
      - analysis/ema20_second_touch_1h_step200_lock_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-1h-step200-profitlock-path-replay
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy pandas
        run: python -m pip install numpy pandas
      - name: Run BTC ETH synthetic tick-path step-lock sensitivity test
        shell: bash
        run: |
          mkdir -p analysis/ema20_second_touch_1h_step200_lock_20261121/
          set -o pipefail
          python -u scripts/research_ema20_second_touch_1h_step200_lock_paths.py 2>&1 | tee analysis/ema20_second_touch_1h_step200_lock_20261121/execution.log
      - name: Upload reports or failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-1h-200-point-step-profit-lock
          path: analysis/ema20_second_touch_1h_step200_lock_20261121/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit results only on research branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_1h_step200_lock_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 200-point stepwise profit-lock 1m sensitivity results"
            git push origin HEAD:research/ema20-second-touch-1h-step200-lock-20261121
          fi
