name: BTC Supertrend EMA9/21 RR ratio sensitivity
on:
  push:
    branches:
      - research/supertrend-ema921-rr-ratios-20261122
    paths:
      - scripts/research_supertrend_ema921_rr_ratios.py
      - .github/workflows/research-supertrend-ema921-rr-ratios.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-supertrend-ema921-ratios-20261122
  cancel-in-progress: false
jobs:
  rr_ratios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backtest requirements
        run: python -m pip install --disable-pip-version-check numpy pandas numba tabulate
      - name: Enforce partial overlap novelty audit
        run: test -s analysis/supertrend_ema921_rr_ratios/NOVELTY_CHECK.md
      - name: Backtest missing RR ratio multiples
        run: python scripts/research_supertrend_ema921_rr_ratios.py
      - name: Save results and complete ledgers in research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/supertrend_ema921_rr_ratios/
          if ! git diff --cached --quiet; then
            git commit -m "research: save Supertrend EMA9/21 RR ratio audit"
            git push origin HEAD:research/supertrend-ema921-rr-ratios-20261122
          fi
