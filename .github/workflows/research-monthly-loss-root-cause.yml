name: BTC monthly loss root cause
on:
  push:
    branches: ['research/monthly-loss-root-cause']
    paths:
      - 'scripts/research_monthly_loss_root_cause.py'
      - '.github/workflows/research-monthly-loss-root-cause.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_monthly_loss_root_cause.py
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-loss-root-cause-full
          path: |
            scratch/monthly_loss_root_cause/results.csv
            scratch/monthly_loss_root_cause/all_results.json.gz
          if-no-files-found: error
