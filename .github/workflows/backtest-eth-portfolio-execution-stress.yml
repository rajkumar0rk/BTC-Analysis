name: ETH Portfolio execution costs slippage funding and margin stress
on:
  push:
    branches: ['research/eth-portfolio-execution-stress-20261120']
    paths:
      - 'scripts/replay_eth_portfolio_execution_stress.py'
      - '.github/workflows/backtest-eth-portfolio-execution-stress.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eth-pm-execution-stress-20261120
  cancel-in-progress: false
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical research dependencies
        run: python -m pip install numpy pandas
      - name: Recalculate 20 full-history ETH portfolio sensitivity scenarios
        run: |
          python -m py_compile scripts/replay_eth_portfolio_execution_stress.py
          python scripts/replay_eth_portfolio_execution_stress.py
      - name: Validate scenario outputs and invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('analysis/eth_portfolio_execution_stress_20261120/summary.json')
          z=json.loads(p.read_text())
          assert z['settings']['portfolio_maintenance_fraction']==0.75
          assert len(z['scenarios'])==20
          for name,s in z['scenarios'].items():
              assert s['completed_months']==22,(name,s['completed_months'])
              assert s['profitable_completed_months']+s['losing_completed_months']+s['flat_completed_months']==22
              assert s['modeled_execution_adverse_price_usd_per_side']>=0
              assert s['largest_initial_margin_usd']<=10.0001
          print("PASSED: all 20 scenarios, 22 completed months, <= $10 margin requirement")
          PY
      - name: Save independent analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: eth-portfolio-execution-stress-20261120
          retention-days: 30
          if-no-files-found: error
          path: |
            analysis/eth_portfolio_execution_stress_20261120/*.csv
            analysis/eth_portfolio_execution_stress_20261120/*.csv.gz
            analysis/eth_portfolio_execution_stress_20261120/*.json
      - name: Commit results on independent research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/eth_portfolio_execution_stress_20261120/
          if ! git diff --cached --quiet; then
            git commit -m "research: save ETH portfolio 75pct margin and execution stress results"
            git push origin HEAD:research/eth-portfolio-execution-stress-20261120
          fi
