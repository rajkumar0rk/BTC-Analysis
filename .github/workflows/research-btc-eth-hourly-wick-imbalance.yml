name: BTC ETH hourly wick imbalance monthly PF audit
on:
  push:
    branches: [research/btc-eth-hourly-wick-imbalance-20261118]
    paths:
      - scripts/research_btc_eth_hourly_wick_imbalance.py
      - .github/workflows/research-btc-eth-hourly-wick-imbalance.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-eth-entropy-20261118
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Run causal native BTC and ETH monthly strategy research
        run: python scripts/research_btc_eth_hourly_wick_imbalance.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-eth-monthly-entropy-ledgers
          path: analysis/btc_eth_hourly_wick_imbalance_20261118/
          retention-days: 30
      - name: Commit isolated reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_eth_hourly_wick_imbalance_20261118/
          git commit -m "research: archive paired monthly directional-entropy results"
          git push origin HEAD:research/btc-eth-hourly-wick-imbalance-20261118
