name: BTC RSI14 frozen three-candidate 2026 validation
on:
  push:
    branches: ['research/rsi14-three-candidates-2026']
    paths:
      - 'scripts/research_rsi14_three_candidates_2026.py'
      - '.github/workflows/research-rsi14-three-candidates-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 numba==0.61.2
      - run: python scripts/research_rsi14_three_candidates_2026.py
      - uses: actions/upload-artifact@v4
        with:
          name: rsi14-three-candidates-2026-full
          path: |
            scratch/rsi14_three_candidates_2026/results.csv
            scratch/rsi14_three_candidates_2026/all_results.json
          if-no-files-found: error
