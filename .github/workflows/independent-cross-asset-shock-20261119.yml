name: Independent cross asset shock propagation 20261119
on:
  push:
    branches:
      - research/cross-asset-shock-propagation-20261119-1020
    paths:
      - '.github/workflows/independent-cross-asset-shock-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python scripts/cross_asset_shock_20261119.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-asset-shock-evidence
          path: analysis/cross_asset_shock_20261119/
