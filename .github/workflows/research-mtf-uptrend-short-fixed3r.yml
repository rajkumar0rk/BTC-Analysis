name: Research BTC 30m UP trend 1m SHORT countertrend fixed 3R
on:
  push:
    branches: [main]
    paths:
      - scripts/research_mtf_uptrend_short_fixed3r.py
      - .github/workflows/research-mtf-uptrend-short-fixed3r.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-uptrend-short-fixed3r
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Test countertrend SHORT in completed 30m UP regime
        run: python scripts/research_mtf_uptrend_short_fixed3r.py
      - name: Save full SHORT-in-UP research outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/mtf_uptrend_short_fixed3r
          if ! git diff --cached --quiet; then
            git commit -m "research: save 30m uptrend 1m countertrend SHORT outcomes"
            git pull --rebase origin main
            git push
          fi
