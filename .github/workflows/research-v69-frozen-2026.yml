name: V69-B frozen 2026 diagnostic
on:
  push:
    branches: [research/v69-frozen-2026-validation-20261125]
    paths:
      - scripts/research_v69_frozen_2026.py
      - .github/workflows/research-v69-frozen-2026.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load existing 2026 archive and December 2025 warmup
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- 'data/delta_india/BTCUSD/1m/2025-12.csv.gz' 'data/delta_india/BTCUSD/1m/2026-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2025-12.csv.gz' 'data/delta_india/BTCUSD/institutional/history/mark_1m/2026-*.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2025-12.csv.gz' 'data/delta_india/BTCUSD/institutional/history/funding_1h/2026-*.csv.gz'
          git reset
          python -m pip install 'numpy<2.3' pandas numba tabulate
      - name: Frozen 2026 diagnostic
        run: |
          python -m py_compile scripts/research_v69_frozen_2026.py
          python -u scripts/research_v69_frozen_2026.py
      - name: Commit validation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v69_frozen_2026
          if ! git diff --cached --quiet; then
            git commit -m 'Report frozen V69-B 2026 diagnostic results'
            git push origin HEAD:research/v69-frozen-2026-validation-20261125
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v69-frozen-2026
          path: analysis/v69_frozen_2026/
          if-no-files-found: error
