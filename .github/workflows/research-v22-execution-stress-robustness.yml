name: V22 execution stress robustness
on:
  push:
    branches: ['research/v22-execution-stress-robustness-20261124']
    paths:
      - 'scripts/research_v22_execution_stress_robustness.py'
      - '.github/workflows/research-v22-execution-stress-robustness.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load immutable OHLC archive and original source engines
        run: |
          git fetch --depth=1 origin main research/st-ema20-reclaim-loss-month-filters-20261122-v1 research/btc-shock-only-donchian-20261121 research/st-ema20-1h-reversal-only-20261122
          git checkout origin/main -- data/delta_india/BTCUSD/1m data/delta_india/BTCUSD/institutional/history data/delta_india/BTCUSD/institutional/history_manifest.json
          git checkout origin/research/st-ema20-reclaim-loss-month-filters-20261122-v1 -- scripts/backtest_st_ema20_large_percent_locks.py scripts/research_st_ema20_reclaim_loss_months_20261122.py scripts/research_st_ema20_initial_sl_grid_20261122.py
          git checkout origin/research/btc-shock-only-donchian-20261121 -- scripts/research_btc_regime_attribution_20261121.py
          git checkout origin/research/st-ema20-1h-reversal-only-20261122 -- scripts/backtest_st_ema20_reversal_only.py
          git reset
          python -m pip install 'numpy<2.3' pandas numba tabulate
      - name: Optimize under actual execution stress
        run: |
          python -m py_compile scripts/research_v22_execution_stress_robustness.py
          python -u scripts/research_v22_execution_stress_robustness.py
      - name: Publish results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/v22_execution_stress_robustness
          git commit -m 'Report V22 execution stress results'
          git push origin HEAD:research/v22-execution-stress-robustness-20261124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-execution-stress-robustness
          path: analysis/v22_execution_stress_robustness/
