name: Research second EMA20 touch fixed TP/SL BTC and ETH
on:
  push:
    branches:
      - research/ema20-second-touch-fixed-tpsl-20261121
    paths:
      - scripts/research_ema20_second_touch_fixed_tpsl.py
      - .github/workflows/research-ema20-second-touch-fixed-tpsl.yml
      - analysis/ema20_second_touch_fixed_tpsl_20261121/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ema20-second-touch-fixed-tpsl
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy pandas
      - name: Run BTC/ETH 15m and 1h fixed exit simulations
        run: python scripts/research_ema20_second_touch_fixed_tpsl.py
      - name: Upload full reproducibility and trade evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-200-100-btc-eth-scaled-second-ema-touch
          path: analysis/ema20_second_touch_fixed_tpsl_20261121/
          retention-days: 30
          if-no-files-found: error
      - name: Commit result on research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema20_second_touch_fixed_tpsl_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save BTC 200/100 and scaled ETH fixed-exit results"
            git push origin HEAD:research/ema20-second-touch-fixed-tpsl-20261121
          fi
