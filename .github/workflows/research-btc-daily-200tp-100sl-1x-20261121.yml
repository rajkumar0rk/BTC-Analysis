name: BTC 1x Daily 200TP 100SL 15M Pullback Backtest
on:
  push:
    branches:
      - research/btc-daily-200tp-100sl-1x-pullback-20261121
    paths:
      - scripts/research_btc_daily_200tp_100sl_1x_20261121.py
      - .github/workflows/research-btc-daily-200tp-100sl-1x-20261121.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal backtest dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Backtest 1x BTCUSD 200 TP 100 SL from 1m historical data
        run: python scripts/research_btc_daily_200tp_100sl_1x_20261121.py
      - name: Save trade and IST daily ledgers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btc-daily-200-100-1x-trades-and-days
          path: |
            analysis/btc_daily_200tp_100sl_1x_20261121/trades.csv
            analysis/btc_daily_200tp_100sl_1x_20261121/daily.csv
          retention-days: 30
      - name: Publish backtest results to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_daily_200tp_100sl_1x_20261121/summary.json
          git add analysis/btc_daily_200tp_100sl_1x_20261121/monthly.csv
          git add analysis/btc_daily_200tp_100sl_1x_20261121/RESEARCH_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "research: save net 1x BTC 200 TP 100 SL monthly and daily audit"
            git push origin HEAD:research/btc-daily-200tp-100sl-1x-pullback-20261121
          fi
