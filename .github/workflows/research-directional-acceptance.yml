name: Research BTC directional acceptance after volatility expansion
on:
  push:
    branches: [main]
    paths:
      - scripts/research_directional_acceptance.py
      - .github/workflows/research-directional-acceptance.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-directional-acceptance
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Test acceptance, rejection and open interest incrementally
        run: python scripts/research_directional_acceptance.py
      - name: Commit all findings, including negative results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage3
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage 3 directional acceptance results"
            git pull --rebase origin main
            git push
          fi
