name: BTC Stage18 independent after-cost third-sleeve hedge search
on:
  push:
    branches:
      - research/stage18-independent-september-hedge-20261121-v1
    paths:
      - scripts/research_stage18_third_hedge_20261121.py
      - .github/workflows/research-stage18-third-hedge-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  find-5minute-complement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandas scipy and research libs
        run: python -m pip install pandas numpy scipy numba tabulate
      - name: Retrieve frozen 70-30 exact verified monthly returns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stage18-70-30
          gh run download 44890734790 -n stage18-btc-70core-30donchian-portfolio-implementation -D /tmp/stage18-70-30 --repo "$GITHUB_REPOSITORY"
          test -s /tmp/stage18-70-30/scenario_monthly_22.csv
          test -s analysis/institutional_discovery_stage19_monthly_10pct/monthly_net_account_returns.csv
          test -s analysis/institutional_discovery_stage20_inverse_direction/monthly_results.csv
      - name: Test fixed allocations selected by 2025 and isolated hindsight bound
        run: |
          python -m py_compile scripts/research_stage18_third_hedge_20261121.py
          PYTHONPATH=scripts python scripts/research_stage18_third_hedge_20261121.py
      - name: Save all candidate comparisons and selection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage18-independent-5m-1h-hedge-search-20261121
          path: analysis/stage18_september_hedge_search_20261121/
          if-no-files-found: warn
          retention-days: 30
