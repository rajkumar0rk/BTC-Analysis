name: Daily prior-day liquidity sweep BTC ETH
on:
  push:
    branches: [research/daily-prior-day-liquidity-sweep-20261119]
    paths:
      - scripts/research_daily_prior_day_sweep_20261119.py
      - .github/workflows/research-daily-prior-day-sweep-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas
      - run: python -u scripts/research_daily_prior_day_sweep_20261119.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-prior-day-sweep
          path: analysis/daily_prior_day_sweep_20261119/
          if-no-files-found: error
      - name: Commit research results on isolated branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/daily_prior_day_sweep_20261119/
          if ! git diff --cached --quiet; then
            git commit -m "research: save daily liquidity sweep backtest"
            git push origin HEAD:research/daily-prior-day-liquidity-sweep-20261119
          fi