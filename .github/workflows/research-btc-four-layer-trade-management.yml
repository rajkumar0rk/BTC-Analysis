name: BTC four-layer breakout stop protection and ATR runner ablation
on:
  push:
    branches: [research/btc-four-layer-trade-management-20261121]
    paths:
      - scripts/research_btc_four_layer_trade_management_20261121.py
      - analysis/btc_four_layer_trade_management_20261121/NOVELTY_CHECK.md
      - .github/workflows/research-btc-four-layer-trade-management.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-four-layer-trade-management-20261121
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Replay fixed 12M and 6M regime-gated BTC 1M trades with exit upgrades
        run: python scripts/research_btc_four_layer_trade_management_20261121.py
      - name: Preserve all experiment and per-trade evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-four-layer-trade-management-20261121
          path: analysis/btc_four_layer_trade_management_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Commit evidence to research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_four_layer_trade_management_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: preserve 1M trailing/stop protection and comparative equity results"
            git push origin HEAD:research/btc-four-layer-trade-management-20261121
          fi
