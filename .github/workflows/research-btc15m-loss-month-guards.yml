name: BTCUSD 15M Reclaim Reduce Losing Months Without Losing Winners
on:
  push:
    branches: [research/btc15m-reclaim-loss-month-reduction-20261123]
    paths:
      - scripts/research_btc15m_loss_month_guards_20261123.py
      - .github/workflows/research-btc15m-loss-month-guards.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc15m-loss-month-guards
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Exact baseline and loss-month controls
        shell: bash
        run: |
          mkdir -p analysis/btc15m_loss_month_guards_20261123
          set -o pipefail
          python -u scripts/research_btc15m_loss_month_guards_20261123.py 2>&1 | tee analysis/btc15m_loss_month_guards_20261123/execution.log
      - name: Upload complete results or error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc15m-loss-month-risk-overlays
          path: analysis/btc15m_loss_month_guards_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Save to dedicated research branch only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc15m_loss_month_guards_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive loss-month guard results with per-month positive-retention scores"
            git pull --rebase origin research/btc15m-reclaim-loss-month-reduction-20261123
            git push origin HEAD:research/btc15m-reclaim-loss-month-reduction-20261123
          fi
