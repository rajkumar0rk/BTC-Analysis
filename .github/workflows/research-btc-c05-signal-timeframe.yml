name: BTCUSD C05 signal timeframe transfer training and frozen validation
on:
  push:
    branches: [research/btc-c05-signal-timeframe-20261125]
    paths:
      - scripts/research_btc_c05_signal_timeframe.py
      - .github/workflows/research-btc-c05-signal-timeframe.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/checkout@v4
        with:
          ref: edcf60fa0a229108d09772dc6cbe04eb15476291
          path: _repaired
          sparse-checkout: data/delta_india/BTCUSD/2024_verified_archive
          persist-credentials: false
      - run: python scripts/research_btc_c05_signal_timeframe.py train
      - uses: actions/upload-artifact@v4
        with:
          name: c05-signal-timeframe-train-shard-${{ matrix.shard }}
          path: analysis/btc_c05_signal_timeframe_20261125/shard_${{ matrix.shard }}/
          if-no-files-found: error
  freeze:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/download-artifact@v4
        with:
          pattern: c05-signal-timeframe-train-shard-*
          path: _shards
      - run: |
          mkdir -p analysis/btc_c05_signal_timeframe_20261125
          for i in {0..5}; do
            cp -r "_shards/c05-signal-timeframe-train-shard-$i" "analysis/btc_c05_signal_timeframe_20261125/shard_$i"
          done
          python scripts/research_btc_c05_signal_timeframe.py freeze
      - uses: actions/upload-artifact@v4
        with:
          name: c05-signal-timeframe-frozen-selection
          path: |
            analysis/btc_c05_signal_timeframe_20261125/FROZEN.json
            analysis/btc_c05_signal_timeframe_20261125/training.csv
            analysis/btc_c05_signal_timeframe_20261125/training_ranked.csv
            analysis/btc_c05_signal_timeframe_20261125/training_monthly.csv
            analysis/btc_c05_signal_timeframe_20261125/chronological_transfer.csv
            analysis/btc_c05_signal_timeframe_20261125/incremental_comparison.csv
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_c05_signal_timeframe_20261125/{FROZEN.json,training.csv,training_ranked.csv,training_monthly.csv,chronological_transfer.csv,incremental_comparison.csv}
          git commit -m "research: freeze core-only training selection before validation"
          git push origin HEAD:research/btc-c05-signal-timeframe-20261125
  validate:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.1.1 numpy==2.5.5 tabulate==0.10.0
      - uses: actions/checkout@v4
        with:
          ref: edcf60fa0a229108d09772dc6cbe04eb15476291
          path: _repaired
          sparse-checkout: data/delta_india/BTCUSD/2024_verified_archive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: c05-signal-timeframe-frozen-selection
          path: analysis/btc_c05_signal_timeframe_20261125/
      - run: python scripts/research_btc_c05_signal_timeframe.py validate
      - uses: actions/upload-artifact@v4
        with:
          name: c05-signal-timeframe-frozen-validation-results
          path: analysis/btc_c05_signal_timeframe_20261125/
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_c05_signal_timeframe_20261125/
          git commit -m "research: report frozen core-only validation"
          git pull --rebase origin research/btc-c05-signal-timeframe-20261125
          git push origin HEAD:research/btc-c05-signal-timeframe-20261125
