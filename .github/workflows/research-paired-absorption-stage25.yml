name: Independent BTC ETH absorption displacement Stage25
on:
  push:
    branches:
      - research/btc-eth-absorption-stage25-20261119
    paths:
      - scripts/research_paired_absorption_stage25.py
      - .github/workflows/research-paired-absorption-stage25.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-btc-eth-absorption-stage25
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical tooling
        run: python -m pip install numpy pandas numba tabulate
      - name: Verify native data and run paired 22 IST month trade replay
        run: python scripts/research_paired_absorption_stage25.py
      - name: Preserve all original ledgers and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paired-absorption-stage25-original-evidence
          path: analysis/paired_absorption_displacement_stage25/
          retention-days: 60
          if-no-files-found: error
      - name: Commit isolated research evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/paired_absorption_displacement_stage25/
          if ! git diff --cached --quiet; then
            git commit -m 'research: preserve stage25 paired monthly PF and original trade ledgers'
            git push origin HEAD:research/btc-eth-absorption-stage25-20261119
          fi
