name: Deep BTCUSD multi-timeframe selective-move research
on:
  push:
    branches: [main]
    paths:
      - scripts/research_selective_big_moves.py
      - .github/workflows/research-selective-big-moves.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-selective-big-move
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Run chronological multi-timeframe research
        run: python scripts/research_selective_big_moves.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/selective_big_move_research
          if ! git diff --cached --quiet; then
            git commit -m "research: selective big move study and chronological validation"
            git push
          fi
