name: Momentum M14 MACD RSI BTC2025 historical screen
on:
  push:
    branches: [research/momentum-vwap-score-20261121]
    paths:
      - scripts/research_momentum_macd_rsi_m14.py
      - .github/workflows/research-momentum-m14.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Replay authentic Delta BTCUSD 1m
        run: python scripts/research_momentum_macd_rsi_m14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-m14-btc2025
          path: analysis/momentum_macd_rsi_m14/replay/
          if-no-files-found: warn
