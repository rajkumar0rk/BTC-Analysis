name: Daily external EMA VWAP armed BTC 2025 zero slip screen
on:
  push:
    branches:
      - research/daily-external-ema-vwap-armed-20261120-v1
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python -m py_compile analysis/daily_external_ema_vwap_armed_20261120_v1/screen.py
      - name: BTC 2025 zero-slip with commission GST
        run: python analysis/daily_external_ema_vwap_armed_20261120_v1/screen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-external-ema-vwap-btc2025-screen
          path: analysis/daily_external_ema_vwap_armed_20261120_v1/BTC2025_*
          if-no-files-found: warn
