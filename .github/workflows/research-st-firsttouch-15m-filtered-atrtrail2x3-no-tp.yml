name: BTC ETH 15M filtered first EMA touch no TP ATR14 trail 2x or 3x
on:
  push:
    branches: [research/st-firsttouch-15m-filtered-atrtrail2x3-no-tp-20261123]
    paths:
      - scripts/research_st_firsttouch_15m_filtered_atrtrail2x3_no_tp_20261123.py
      - .github/workflows/research-st-firsttouch-15m-filtered-atrtrail2x3-no-tp.yml
      - analysis/st_firsttouch_15m_filtered_atrtrail2x3_no_tp_20261123/NOVELTY_CHECK.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-eth-15m-filtered-firsttouch-atrtrail-no-tp-20261123
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas
      - name: Replay BTC and ETH Jan25 to Oct26 with 15M gates on and no TP
        shell: bash
        run: |
          mkdir -p analysis/st_firsttouch_15m_filtered_atrtrail2x3_no_tp_20261123
          set -o pipefail
          python -u scripts/research_st_firsttouch_15m_filtered_atrtrail2x3_no_tp_20261123.py 2>&1 | tee analysis/st_firsttouch_15m_filtered_atrtrail2x3_no_tp_20261123/execution.log
      - name: Upload study artifacts including failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-15m-entry-filters-on-no-tp-atr14-trailing
          path: analysis/st_firsttouch_15m_filtered_atrtrail2x3_no_tp_20261123/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit study output on research branch ONLY
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/st_firsttouch_15m_filtered_atrtrail2x3_no_tp_20261123/
          if ! git diff --cached --quiet; then
            git commit -m "research: archive 15M no-TP 2x vs 3x ATR trailing results"
            git push origin HEAD:research/st-firsttouch-15m-filtered-atrtrail2x3-no-tp-20261123
          fi
