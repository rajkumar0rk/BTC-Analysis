name: Research BTC SHORT 30m/1m fixed 2R
on:
  push:
    branches: [main]
    paths:
      - scripts/research_mtf_swing_range_short_fixed2r.py
      - .github/workflows/research-mtf-swing-range-short-fixed2r.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtf-short-fixed2r
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy tabulate
      - name: Run SHORT risk reward 1 to 2 comparison
        run: python scripts/research_mtf_swing_range_short_fixed2r.py
      - name: Save report and trade ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/mtf_swing_range_short_fixed2r
          if ! git diff --cached --quiet; then
            git commit -m "research: save SHORT fixed 2R session results"
            git pull --rebase origin main
            git push
          fi
