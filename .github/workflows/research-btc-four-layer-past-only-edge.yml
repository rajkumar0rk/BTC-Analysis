name: BTC four-layer past-only regime selection 1M account validation
on:
  push:
    branches: [research/btc-four-layer-past-only-edge-20261121]
    paths:
      - scripts/research_btc_four_layer_past_only_edge_20261121.py
      - analysis/btc_four_layer_past_only_edge_20261121/NOVELTY_CHECK.md
      - .github/workflows/research-btc-four-layer-past-only-edge.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-four-layer-past-only-edge-20261121
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluation dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Validate shadow entry-exit parity and run 6M and 12M past-only eligibility on native 1M
        run: python scripts/research_btc_four_layer_past_only_edge_20261121.py
      - name: Keep all evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btc-four-layer-past-only-regime-edge-20261121
          path: analysis/btc_four_layer_past_only_edge_20261121/
          retention-days: 90
          if-no-files-found: error
      - name: Save auditable reports to isolated research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_four_layer_past_only_edge_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: save causal 6m 12m BTC multi-regime selector evidence"
            git push origin HEAD:research/btc-four-layer-past-only-edge-20261121
          fi
