name: Backtest BTCUSD 100x with fixed $10 isolated margin and $100 portfolio
on:
  push:
    branches: ['research/btc-ema-st-fixed-10-margin-20261119']
    paths:
      - 'scripts/replay_btc_ema_st_fixed_10_margin.py'
      - '.github/workflows/replay-btc-ema-st-fixed-10-margin.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: replay-btc-ema-st-fixed-10-margin-20261119
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas
      - name: Run fixed-$10-margin 100x isolated replay
        run: python scripts/replay_btc_ema_st_fixed_10_margin.py
      - name: Archive complete results
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema-st-fixed-10-margin-100x
          retention-days: 30
          if-no-files-found: error
          path: |
            analysis/btc_ema_st_fixed_10_margin_20261119/summary.json
            analysis/btc_ema_st_fixed_10_margin_20261119/*_trades.csv.gz
            analysis/btc_ema_st_fixed_10_margin_20261119/*_monthly.csv
      - name: Commit results only to dedicated research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/btc_ema_st_fixed_10_margin_20261119
          if ! git diff --cached --quiet; then
            git commit -m "research: report 100 dollar portfolio with fixed 10 dollar 100x margin"
            git push origin HEAD:research/btc-ema-st-fixed-10-margin-20261119
          fi
