name: Platform multi-year replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/btc_analysis/backtest/**','src/btc_analysis/service/longrun.py','src/btc_analysis/service/historical.py','scripts/platform_long_benchmark.py','tests/platform/test_longrun.py','.github/workflows/platform-longrun.yml']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSD, ETHUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/platform-linux.lock && python -m pip install --no-deps '.[data,api]' && python -m pip check
      - run: python -m unittest discover -s tests/platform -p test_longrun.py -v
      - name: Import actual archive
        run: python -m btc_analysis.data.cli --symbol ${{ matrix.symbol }} --store "$RUNNER_TEMP/history"
      - name: Full continuous historical replay
        run: python scripts/platform_long_benchmark.py --history "$RUNNER_TEMP/history" --symbol ${{ matrix.symbol }} --output "$RUNNER_TEMP/longrun"
      - uses: actions/upload-artifact@v4
        with:
          name: longrun-${{ matrix.symbol }}
          path: ${{ runner.temp }}/longrun/
          if-no-files-found: error
