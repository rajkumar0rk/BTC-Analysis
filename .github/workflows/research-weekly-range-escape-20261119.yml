name: Independent weekly opening-range escape BTC ETH
on:
  push:
    branches: [research/weekly-range-escape-20261119]
    paths:
      - scripts/research_weekly_range_escape_20261119.py
      - .github/workflows/research-weekly-range-escape-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-weekly-range-escape-20261119
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas numba tabulate
      - name: Run causal BTC ETH weekly range escape replay
        run: python -u scripts/research_weekly_range_escape_20261119.py
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-range-escape-evidence
          path: analysis/weekly_range_escape_20261119/
          if-no-files-found: error
      - name: Commit reproducible results only to independent research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/weekly_range_escape_20261119/model_comparison.csv
          git add analysis/weekly_range_escape_20261119/qualifying_models.csv
          git add analysis/weekly_range_escape_20261119/promising_exploratory_models.csv
          git add analysis/weekly_range_escape_20261119/candidate_concentration.csv
          git add analysis/weekly_range_escape_20261119/candidate_monthly_pf.csv
          git add analysis/weekly_range_escape_20261119/quality.json
          git add analysis/weekly_range_escape_20261119/RESEARCH_REPORT.md
          if test -f analysis/weekly_range_escape_20261119/candidate_trade_ledger.csv; then
            git add analysis/weekly_range_escape_20261119/candidate_trade_ledger.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "research: save weekly range escape replay summary"
            git push origin HEAD:research/weekly-range-escape-20261119
          fi
