name: Demo-style EMA20 ST 15m signals, 1m MARK execution approximation
on:
  push:
    branches:
      - research/ema-st-demo-mark-1m-20261121
    paths:
      - scripts/replay_ema_st_demo_mark_1m_20261121.py
      - .github/workflows/research-ema-st-demo-mark-1m-20261121.yml
permissions:
  contents: write
concurrency:
  group: research-ema-st-demo-mark-1m-20261121
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==2.2.3 numpy==2.2.3
      - name: Compile and test causal mark-stop logic
        run: |
          python -m py_compile scripts/replay_ema_st_demo_mark_1m_20261121.py
          python -c 'import sys; sys.path.insert(0,"scripts"); from replay_ema_st_demo_mark_1m_20261121 import unit_test; unit_test(); print("mark replay self-tests passed")'
      - name: Replay BTC and ETH marks and sampled trailing for 2025-2026
        run: python scripts/replay_ema_st_demo_mark_1m_20261121.py
      - name: Upload trade ledgers and monthly breakdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-st-demo-mark-1m-approximation-20261121
          path: analysis/ema_st_demo_mark_1m_20261121/
          if-no-files-found: warn
      - name: Commit research output to research branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ema_st_demo_mark_1m_20261121/
          if ! git diff --cached --quiet; then
            git commit -m "research: demo-style mark-price BTC ETH replay results"
            git push origin HEAD:research/ema-st-demo-mark-1m-20261121
          fi
