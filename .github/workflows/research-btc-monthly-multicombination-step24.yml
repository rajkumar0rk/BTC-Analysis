name: BTCUSD Step24 - 816 Direction Stop Exit Monthly Combinations
on:
  push:
    branches:
      - research/btc-monthly-multicombination-step24
    paths:
      - scripts/research_btc_monthly_multicombination_step24.py
      - .github/workflows/research-btc-monthly-multicombination-step24.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical data and tabular report dependencies
        run: python -m pip install numpy pandas numba tabulate
      - name: Verify all 816 monthly-profit BTC multi-axis scenarios at 477 weekdays each
        run: python scripts/research_btc_monthly_multicombination_step24.py
      - name: Upload all 1,634 cost comparisons and complete daily/monthly audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-step24-multi-combinations-477-weekdays
          path: analysis/btc_monthly_multicombination_step24/
          if-no-files-found: warn
