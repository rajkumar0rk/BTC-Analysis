name: Research BTC Stage14 monthly regime consistency
on:
  push:
    branches: [main]
    paths:
      - scripts/research_monthly_regime_stage14.py
      - .github/workflows/research-monthly-regime-stage14.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-stage14-monthly-regimes
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas numpy numba tabulate
      - name: Execute Stage14 monthly regime consistency analysis
        run: python scripts/research_monthly_regime_stage14.py
      - name: Preserve complete evidence in GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-stage14-monthly-regime-trades
          path: |
            analysis/institutional_discovery_stage14_monthly_regimes/trade_ledger.csv.gz
            analysis/institutional_discovery_stage14_monthly_regimes/event_states.csv.gz
          retention-days: 30
          if-no-files-found: error
      - name: Commit compact reports and monthly tables
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/institutional_discovery_stage14_monthly_regimes/RESEARCH_REPORT.md
          git add analysis/institutional_discovery_stage14_monthly_regimes/monthly_results.csv
          git add analysis/institutional_discovery_stage14_monthly_regimes/period_results.csv
          git add analysis/institutional_discovery_stage14_monthly_regimes/monthly_consistency.csv
          git add analysis/institutional_discovery_stage14_monthly_regimes/previous_month_regime_stats.csv
          git add analysis/institutional_discovery_stage14_monthly_regimes/top_2025_candidate_months.csv
          git add analysis/institutional_discovery_stage14_monthly_regimes/quality.json
          if ! git diff --cached --quiet; then
            git commit -m "research: save Stage14 monthly market-regime findings"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
