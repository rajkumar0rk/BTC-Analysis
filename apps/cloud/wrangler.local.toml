# Local emulator only. Never use this dummy id with --remote or deploy.
name = "btc-analysis-cloud-local"
main = "src/worker.mjs"
compatibility_date = "2026-11-10"
workers_dev = false
preview_urls = false
[vars]
ALLOWED_ORIGINS = "https://studio.example.com"
PAPER_ENABLED = "true"
[[d1_databases]]
binding = "DB"
database_name = "btc-analysis-local"
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "PAPER"
class_name = "PaperLane"

[[migrations]]
tag = "paper-v1"
new_sqlite_classes = ["PaperLane"]
